name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create QuestMate project
        run: |
          rm -rf questmate-build

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets

      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

      - name: Create build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create Android resources
        run: |
          cat > questmate-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF

          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#49D17D</item>
                  <item name="android:statusBarColor">#10141C</item>
                  <item name="android:navigationBarColor">#10141C</item>
              </style>
          </resources>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="QuestMate floating overlay" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.net.Uri;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout =
                      new LinearLayout(this);

                  layout.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(30, 30, 30, 30);
                  layout.setBackgroundColor(
                      Color.rgb(16, 20, 28)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QUESTMATE");
                  title.setTextSize(32);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);

                  layout.addView(title);

                  TextView info =
                      new TextView(this);

                  info.setText(
                      "OSRS Quest Companion\n\n" +
                      "Floating overlay with minimise " +
                      "and maximise controls."
                  );

                  info.setTextSize(18);
                  info.setTextColor(Color.WHITE);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(10, 30, 10, 30);

                  layout.addView(info);

                  Button settings =
                      new Button(this);

                  settings.setText(
                      "ALLOW OVERLAY PERMISSION"
                  );

                  settings.setOnClickListener(
                      v -> {

                          Intent intent =
                              new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse(
                                      "package:" +
                                      getPackageName()
                                  )
                              );

                          startActivity(intent);
                      }
                  );

                  layout.addView(settings);

                  Button start =
                      new Button(this);

                  start.setText(
                      "START QUESTMATE OVERLAY"
                  );

                  start.setOnClickListener(
                      v -> startOverlay()
                  );

                  layout.addView(start);

                  setContentView(layout);
              }

              private void startOverlay() {

                  if (!Settings.canDrawOverlays(this)) {

                      Toast.makeText(
                          this,
                          "Please allow overlay permission first.",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  Intent intent =
                      new Intent(
                          this,
                          OverlayService.class
                      );

                  intent.putExtra(
                      "quest",
                      "QuestMate"
                  );

                  intent.putExtra(
                      "step",
                      "Choose an OSRS quest."
                  );

                  if (android.os.Build.VERSION.SDK_INT >= 26) {

                      startForegroundService(intent);

                  } else {

                      startService(intent);
                  }

                  Toast.makeText(
                      this,
                      "QuestMate overlay started.",
                      Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

      - name: Create OverlayService
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/OverlayService.java <<'EOF'
          package com.questmate.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;

          import android.content.Intent;

          import android.graphics.Color;
          import android.graphics.PixelFormat;

          import android.os.Build;
          import android.os.IBinder;

          import android.provider.Settings;

          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager manager;
              private LinearLayout panel;

              private String quest =
                  "QuestMate";

              private String step =
                  "Choose an OSRS quest.";

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotification();

                  Notification notification =
                      new Notification.Builder(
                          this,
                          "questmate"
                      )
                      .setContentTitle(
                          "QuestMate"
                      )
                      .setContentText(
                          "QuestMate overlay is running"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )
                      .setOngoing(true)
                      .build();

                  startForeground(
                      1001,
                      notification
                  );

                  showOverlay();
              }

              private void createNotification() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "questmate",
                              "QuestMate Overlay",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager nm =
                          getSystemService(
                              NotificationManager.class
                          );

                      nm.createNotificationChannel(
                          channel
                      );
                  }
              }

              private Button button(
                  String text) {

                  Button b =
                      new Button(this);

                  b.setText(text);
                  b.setAllCaps(false);

                  return b;
              }

              private TextView text(
                  String value,
                  int size) {

                  TextView t =
                      new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(
                      20,
                      15,
                      20,
                      15
                  );

                  return t;
              }

              private void showOverlay() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  manager =
                      (WindowManager)
                      getSystemService(
                          WINDOW_SERVICE
                      );

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                      10,
                      10,
                      10,
                      10
                  );

                  panel.setBackgroundColor(
                      Color.rgb(27, 35, 48)
                  );

                  buildMaximized();

                  int type;

                  if (Build.VERSION.SDK_INT >= 26) {

                      type =
                          WindowManager.LayoutParams
                              .TYPE_APPLICATION_OVERLAY;

                  } else {

                      type =
                          WindowManager.LayoutParams
                              .TYPE_PHONE;
                  }

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          WindowManager.LayoutParams
                              .WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams
                              .FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity =
                      Gravity.TOP |
                      Gravity.START;

                  params.x = 30;
                  params.y = 200;

                  manager.addView(
                      panel,
                      params
                  );
              }

              private void buildMaximized() {

                  panel.removeAllViews();

                  panel.addView(
                      text(
                          "QUESTMATE",
                          24
                      )
                  );

                  panel.addView(
                      text(
                          quest,
                          18
                      )
                  );

                  panel.addView(
                      text(
                          step,
                          16
                      )
                  );

                  Button next =
                      button("NEXT STEP");

                  next.setOnClickListener(
                      v -> {

                          step =
                              "Continue to the next step.";

                          buildMaximized();
                      }
                  );

                  panel.addView(next);

                  Button minimise =
                      button("MINIMISE");

                  minimise.setOnClickListener(
                      v -> buildMinimized()
                  );

                  panel.addView(minimise);

                  Button close =
                      button("CLOSE OVERLAY");

                  close.setOnClickListener(
                      v -> stopSelf()
                  );

                  panel.addView(close);
              }

              private void buildMinimized() {

                  panel.removeAllViews();

                  Button q =
                      button("Q");

                  q.setTextSize(24);

                  q.setTextColor(Color.BLACK);

                  q.setBackgroundColor(
                      Color.rgb(73, 209, 125)
                  );

                  q.setOnClickListener(
                      v -> buildMaximized()
                  );

                  panel.addView(q);

                  WindowManager.LayoutParams params =
                      (WindowManager.LayoutParams)
                      panel.getLayoutParams();

                  params.width = 150;
                  params.height = 150;

                  manager.updateViewLayout(
                      panel,
                      params
                  );
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId) {

                  if (intent != null) {

                      String incomingQuest =
                          intent.getStringExtra(
                              "quest"
                          );

                      String incomingStep =
                          intent.getStringExtra(
                              "step"
                          );

                      if (incomingQuest != null) {
                          quest = incomingQuest;
                      }

                      if (incomingStep != null) {
                          step = incomingStep;
                      }
                  }

                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {

                  if (panel != null &&
                      manager != null) {

                      try {
                          manager.removeView(panel);
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent) {

                  return null;
              }
          }
          EOF

      - name: Download Gradle 8.9
        run: |
          cd questmate-build

          curl -L \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip

          mv gradle-8.9 gradle

          chmod +x gradle/bin/gradle

      - name: Build APK
        run: |
          cd questmate-build

          ./gradle/bin/gradle \
            clean \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        run: |
          echo "===== APK CHECK ====="

          test -f \
            questmate-build/app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            questmate-build/app/build/outputs/apk/debug/app-debug.apk

          echo "APK EXISTS!"

      - name: Copy APK
        run: |
          mkdir -p dist

          cp \
            questmate-build/app/build/outputs/apk/debug/ap
