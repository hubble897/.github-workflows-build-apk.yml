name: Build QuestMate 5 - OSRS Quest Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create QuestMate project
        run: |
          rm -rf questmate-build

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets

      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName '5.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create Android resources
        run: |
          cat > questmate-build/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="questmate_bg">#10141C</color>
              <color name="questmate_card">#1B2330</color>
              <color name="questmate_accent">#49D17D</color>
              <color name="questmate_text">#FFFFFF</color>
          </resources>
          EOF

          cat > questmate-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
              <string name="overlay_channel">QuestMate Overlay</string>
          </resources>
          EOF

          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">
                      @color/questmate_accent
                  </item>
                  <item name="android:navigationBarColor">
                      @color/questmate_bg
                  </item>
                  <item name="android:statusBarColor">
                      @color/questmate_bg
                  </item>

              </style>

          </resources>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="QuestMate floating quest companion overlay" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create quest database
        run: |
          cat > questmate-build/app/src/main/assets/quests.json <<'EOF'
          [
            {
              "name": "Cook's Assistant",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 1,
              "steps": [
                "Speak with the cook in Lumbridge Castle.",
                "Collect the ingredients requested by the cook.",
                "Return the ingredients to the cook.",
                "Finish the conversation and collect your reward."
              ]
            },
            {
              "name": "The Restless Ghost",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 1,
              "steps": [
                "Speak with Father Aereck in Lumbridge.",
                "Investigate the ghost's problem.",
                "Obtain the equipment needed to communicate with the ghost.",
                "Speak with the ghost and resolve its problem.",
                "Return to Father Aereck and claim your reward."
              ]
            },
            {
              "name": "Romeo & Juliet",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 5,
              "steps": [
                "Speak with Romeo in Varrock.",
                "Find Juliet and discover what has happened.",
                "Complete the tasks needed to help Juliet.",
                "Follow the plan to help the couple.",
                "Return to Romeo and finish the quest."
              ]
            }
          ]
          EOF

      - name: Create MainActivity.java
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private final List<Quest> quests = new ArrayList<>();
              private Quest selectedQuest;

              private static class Quest {
                  String name = "";
                  boolean members;
                  String difficulty = "";
                  String length = "";
                  int questPoints;
                  List<String> steps = new ArrayList<>();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();
                  showHome();
              }

              private TextView text(String value, int size) {
                  TextView view = new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);
                  view.setPadding(20, 14, 20, 14);

                  return view;
              }

              private Button button(String value) {
                  Button button = new Button(this);

                  button.setText(value);
                  button.setAllCaps(false);
                  button.setTextColor(Color.WHITE);

                  return button;
              }

              private void baseScreen() {
                  ScrollView scroll = new ScrollView(this);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16, 16, 16, 16);
                  root.setBackgroundColor(
                      Color.rgb(16, 20, 28)
                  );

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void showHome() {
                  baseScreen();

                  TextView title = text(
                      "QUESTMATE",
                      30
                  );

                  title.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );

                  root.addView(title);

                  root.addView(
                      text(
                          "OSRS Quest Companion",
                          17
                      )
                  );

                  Button overlayButton =
                      button("START OVERLAY");

                  overlayButton.setOnClickListener(
                      v -> startOverlay()
                  );

                  root.addView(overlayButton);

                  EditText search = new EditText(this);

                  search.setHint("Search quests...");
                  search.setHintTextColor(Color.LTGRAY);
                  search.setTextColor(Color.WHITE);

                  root.addView(search);

                  LinearLayout questList =
                      new LinearLayout(this);

                  questList.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.addView(questList);

                  Runnable refresh = () -> {

                      questList.removeAllViews();

                      String query =
                          search.getText()
                              .toString()
                              .toLowerCase();

                      for (Quest quest : quests) {

                          if (!quest.name
                              .toLowerCase()
                              .contains(query)) {
                              continue;
                          }

                          Button questButton =
                              button(
                                  quest.name
                                  + (quest.members
                                      ? " • Members"
                                      : " • F2P")
                              );

                          questButton.setOnClickListener(
                              v -> showQuest(quest)
                          );

                          questList.addView(
                              questButton
                          );
                      }
                  };

                  search.addTextChangedListener(
                      new TextWatcher() {

                          @Override
                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after) {
                          }

                          @Override
                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count) {
                              refresh.run();
                          }

                          @Override
                          public void afterTextChanged(
                              Editable s) {
                          }
                      }
                  );

                  refresh.run();
              }

              private void showQuest(Quest quest) {

                  selectedQuest = quest;

                  baseScreen();

                  Button back =
                      button("← BACK TO QUESTS");

                  back.setOnClickListener(
                      v -> showHome()
                  );

                  root.addView(back);

                  TextView title =
                      text(quest.name, 28);

                  title.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );

                  root.addView(title);

                  root.addView(
                      text(
                          (quest.members
                              ? "Members"
                              : "Free-to-play")
                          + " • "
                          + quest.difficulty
                          + " • "
                          + quest.length
                          + " • "
                          + quest.questPoints
                          + " Quest Points",
                          16
                      )
                  );

                  root.addView(
                      text(
                          "FULL WALKTHROUGH",
                          22
                      )
                  );

                  for (int i = 0;
                       i < quest.steps.size();
                       i++) {

                      CheckBox check =
                          new CheckBox(this);

                      check.setText(
                          (i + 1)
                          + ". "
                          + quest.steps.get(i)
                      );

                      check.setTextColor(
                          Color.WHITE
                      );

                      check.setTextSize(16);

                      String key =
                          "quest_"
                          + quest.name.replaceAll(
                              "[^A-Za-z0-9]",
                              "_"
                          )
                          + "_step_"
                          + i;

                      check.setChecked(
                          getPreferences(0)
                              .getBoolean(
                                  key,
                                  false
                              )
                      );

                      check.setOnCheckedChangeListener(
                          (buttonView, checked) ->
                              getPreferences(0)
                                  .edit()
                                  .putBoolean(
                                      key,
                                      checked
                                  )
                                  .apply()
                      );

                      root.addView(check);
                  }

                  Button startOverlay =
                      button(
                          "START OVERLAY WITH THIS QUEST"
                      );

                  startOverlay.setOnClickListener(
                      v -> startOverlay()
                  );

                  root.addView(startOverlay);
              }

              private void startOverlay() {

                  if (!Settings.canDrawOverlays(this)) {

                      Intent settingsIntent =
                          new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse(
                                  "package:"
                                  + getPackageName()
                              )
                          );

                      startActivity(settingsIntent);

                      Toast.makeText(
                          this,
                          "Allow QuestMate to display over other apps, then return to QuestMate.",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  Intent service =
                      new Intent(
                          this,
                          OverlayService.class
                      );

                  if (selectedQuest != null) {

                      service.putExtra(
                          "quest",
                          selectedQuest.name
                      );

                      service.putExtra(
                          "step",
                          selectedQuest.steps.isEmpty()
                              ? "Start your quest."
                              : selectedQuest.steps.get(0)
                      );

                  } else {

                      service.putExtra(
                          "quest",
                          "QuestMate"
                      );

                      service.putExtra(
                          "step",
                          "Choose a quest."
                      );
                  }

                  if (android.os.Build.VERSION.SDK_INT >= 26) {

                      startForegroundService(service);

                  } else {

                      startService(service);
                  }

                  Toast.makeText(
                      this,
                      "QuestMate overlay started.",
                      Toast.LENGTH_SHORT
                  ).show();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] data =
                          new byte[input.available()];

                      input.read(data);
                      input.close();

                      JSONArray array =
                          new JSONArray(
                              new String(
                                  data,
                                  StandardChars
