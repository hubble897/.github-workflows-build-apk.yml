name: QuestMate - Complete OSRS Quest App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout QuestMate
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ============================================================
      # GRADLE 8.9
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # ============================================================
      # DOWNLOAD QUEST HELPER
      # ============================================================

      - name: Download Quest Helper
        run: |
          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper


      # ============================================================
      # DOWNLOAD RUNELITE
      # ============================================================

      - name: Download RuneLite
        run: |
          git clone --depth 1 \
            https://github.com/runelite/runelite.git \
            runelite


      # ============================================================
      # CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
                  version '8.7.3'
                  apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.questmate.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.questmate.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #6750A4
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # GENERATE QUEST DATABASE
      # ============================================================

      - name: Generate Quest database
        shell: python
        run: |

          cat > generate_quests.py <<'PY'

          import json
          import re
          from pathlib import Path


          ROOT = Path.cwd()

          RUNELITE = ROOT / "runelite"

          QH = ROOT / "quest-helper"


          # ========================================================
          # MINIQUESTS TO EXCLUDE
          # ========================================================

          MINIQUESTS = {
              "ALFRED_GRIMHANDS_BARCRAWL",
              "BARBARIAN_TRAINING",
              "BEAR_YOUR_SOUL",
              "CURSE_OF_THE_EMPTY_LORD",
              "DADDYS_HOME",
              "THE_ENCHANTED_KEY",
              "ENTER_THE_ABYSS",
              "FAMILY_PEST",
              "THE_FROZEN_DOOR",
              "THE_GENERALS_SHADOW",
              "HIS_FAITHFUL_SERVANTS",
              "HOPESPEARS_WILL",
              "IN_SEARCH_OF_KNOWLEDGE",
              "INTO_THE_TOMBS",
              "LAIR_OF_TARN_RAZORLOR",
              "MAGE_ARENA_I",
              "MAGE_ARENA_II",
              "SKIPPY_AND_THE_MOGRES",
              "VALE_TOTEMS",
          }


          # ========================================================
          # F2P QUESTS
          # ========================================================

          F2P = {
              "BLACK_KNIGHTS_FORTRESS",
              "BELOW_ICE_MOUNTAIN",
              "COOKS_ASSISTANT",
              "DEMON_SLAYER",
              "DORICS_QUEST",
              "DRAGON_SLAYER_I",
              "ERNEST_THE_CHICKEN",
              "GOBLIN_DIPLOMACY",
              "THE_CORSAIR_CURSE",
              "THE_IDES_OF_MILK",
              "IMP_CATCHER",
              "LEARNING_THE_ROPES",
              "MISthALIN_MYSTERY",
              "PIRATES_TREASURE",
              "PRINCE_ALI_RESCUE",
              "THE_RESTLESS_GHOST",
              "ROMEO_AND_JULIET",
              "RUNE_MYSTERIES",
              "SHEEP_SHEARER",
              "SHIELD_OF_ARRAV",
              "THE_KNIGHTS_SWORD",
              "VAMPYRE_SLAYER",
              "WITCHS_POTION",
              "X_MARKS_THE_SPOT",
          }

          # Correct spelling normalization.
          F2P.add("MISthALIN_MYSTERY")


          # ========================================================
          # RFD
          # ========================================================

          RFD_CLASSES = [
              "RFDStart",
              "RFDDwarf",
              "RFDGoblins",
              "RFDPiratePete",
              "RFDLumbridgeGuide",
              "RFDEvilDave",
              "RFDSkrachUglogwee",
              "RFDSirAmikVarze",
              "RFDAwowogei",
              "RFDFinal",
          ]


          RFD_NAMES = {
              "Recipe for Disaster - Another Cook's Quest": "RFDStart",
              "Recipe for Disaster - Mountain Dwarf": "RFDDwarf",
              "Recipe for Disaster - Wartface & Bentnoze": "RFDGoblins",
              "Recipe for Disaster - Pirate Pete": "RFDPiratePete",
              "Recipe for Disaster - Lumbridge Guide": "RFDLumbridgeGuide",
              "Recipe for Disaster - Evil Dave": "RFDEvilDave",
              "Recipe for Disaster - Skrach Uglogwee": "RFDSkrachUglogwee",
              "Recipe for Disaster - Sir Amik Varze": "RFDSirAmikVarze",
              "Recipe for Disaster - King Awowogei": "RFDAwowogei",
              "Recipe for Disaster - Culinaromancer": "RFDFinal",
          }


          # ========================================================
          # BASIC HELPERS
          # ========================================================

          def decode_string(value):

              try:
                  return bytes(
                      value,
                      "utf-8"
                  ).decode(
                      "unicode_escape"
                  )

              except Exception:
                  return value


          def clean(value):

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          def humanize(value):

              value = value.replace(
                  "_",
                  " "
              )

              value = re.sub(
                  r"([a-z])([A-Z])",
                  r"\1 \2",
                  value
              )

              return value.title()


          def balanced(text, start):

              depth = 0

              quote = False

              escape = False

              for i in range(
                  start,
                  len(text)
              ):

                  char = text[i]

                  if quote:

                      if escape:

                          escape = False

                      elif char == "\\":

                          escape = True

                      elif char == '"':

                          quote = False

                      continue


                  if char == '"':

                      quote = True

                  elif char == "(":

                      depth += 1

                  elif char == ")":

                      depth -= 1

                      if depth == 0:

                          return text[
                              start + 1:i
                          ]

              return ""


          def strings(text):

              return re.findall(
                  r'"((?:\\.|[^"\\])*)"',
                  text,
                  flags=re.S
              )


          # ========================================================
          # FIND RUNE LITE QUEST ENUM
          # ========================================================

          quest_files = list(
              RUNELITE.rglob("Quest.java")
          )

          if not quest_files:

              raise SystemExit(
                  "Could not find RuneLite Quest.java"
              )

          quest_file = quest_files[0]

          quest_source = quest_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          quest_entries = []


          pattern = re.compile(
              r"^\s*"
              r"([A-Z0-9_]+)"
              r"\(\s*\d+\s*,\s*"
              r'"([^"]+)"',
              re.M
          )


          for match in pattern.finditer(
              quest_source
          ):

              enum_name = match.group(1)

              title = match.group(2)

              if enum_name in MINIQUESTS:

                  continue

              quest_entries.append({
                  "enum": enum_name,
                  "title": title
              })


          print(
              "RuneLite quest entries:",
              len(quest_entries)
          )


          if len(quest_entries) != 192:

              print(
                  "Expected 192 quests."
              )

              for quest in quest_entries:

                  print(
                      quest["enum"],
                      quest["title"]
                  )

              raise SystemExit(
                  "Quest count changed."
              )


          # ========================================================
          # FIND ALL QUEST HELPER JAVA FILES
          # ========================================================

          java_files = list(
              (
                  QH /
                  "src/main/java/com/questhelper/helpers/quests"
              ).rglob("*.java")
          )


          print(
              "Quest Helper Java files:",
              len(java_files)
          )


          # ========================================================
          # MAP QUEST ENUM -> HELPER CLASS
          # ========================================================

          quest_helpers = {}


          for path in java_files:

              try:

                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception:

                  continue


              class_match = re.search(
                  r"\bclass\s+([A-Za-z0-9_]+)",
                  source
              )

              if not class_match:

                  continue


              class_name = class_match.group(1)


              references = re.findall(
                  r"QuestHelperQuest\.([A-Z0-9_]+)",
                  source
              )


              for quest_enum in references:

                  quest_helpers.setdefault(
                      quest_enum,
                      []
                  ).append(
                      class_name
                  )


          # ========================================================
          # FALLBACK: SEARCH Quest.X
          # ========================================================

          for path in java_files:

              try:

                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception:

                  continue


              class_match = re.search(
                  r"\bclass\s+([A-Za-z0-9_]+)",
                  source
              )

              if not class_match:

                  continue


              class_name = class_match.group(1)


              references = re.findall(
                  r"\bQuest\.([A-Z0-9_]+)",
                  source
              )


              for quest_enum in references:

                  if quest_enum in {
                      x["enum"]
                      for x in quest_entries
                  }:

                      quest_helpers.setdefault(
                          quest_enum,
                          []
                      ).append(
                          class_name
                      )


          # Remove duplicates.

          for key in list(
              quest_helpers.keys()
          ):

              quest_helpers[key] = list(
                  dict.fromkeys(
                      quest_helpers[key]
                  )
              )


          # ========================================================
          # FIND HELPER SOURCE
          # ========================================================

          source_by_class = {}


          for path in java_files:

              match = re.search(
                  r"\bclass\s+([A-Za-z0-9_]+)",
                  path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              )

              if match:

                  source_by_class[
                      match.group(1)
                  ] = path


          # ========================================================
          # PARSE QUEST HELPER
          # ========================================================

          def parse_helper(path):

              source = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )


              step_defs = {}

              step_order = []


              # ----------------------------------------------------
              # NORMAL *Step OBJECTS
              # ----------------------------------------------------

              assignment = re.compile(
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*=\s*new\s+"
                  r"([A-Za-z_][A-Za-z0-9_]*Step)"
                  r"\s*\("
              )


              for match in assignment.finditer(
                  source
              ):

                  variable = match.group(1)

                  open_pos = source.find(
                      "(",
                      match.start()
                  )

                  args = balanced(
                      source,
                      open_pos
                  )


                  values = [
                      clean(
                          decode_string(x)
                      )
                      for x in strings(args)
                  ]


                  values = [
                      x
                      for x in values
                      if x
                  ]


                  description = ""

                  if values:

                      description = max(
                          values,
                          key=len
                      )


                  if variable not in step_defs:

                      step_defs[
                          variable
                      ] = description

                      step_order.append(
                          variable
                      )


              # ----------------------------------------------------
              # PANEL DETAILS
              # ----------------------------------------------------

              panels = []


              for match in re.finditer(
                  r"new\s+PanelDetails\s*\(",
                  source
              ):

                  open_pos = source.find(
                      "(",
                      match.start()
                  )

                  args = balanced(
                      source,
                      open_pos
                  )


                  panel_strings = [
                      clean(
                          decode_string(x)
                      )
                      for x in strings(args)
                  ]


                  title = (
                      panel_strings[0]
                      if panel_strings
                      else "Walkthrough"
                  )


                  names = []


                  for list_match in re.finditer(
                      r"(?:Arrays\s*\.\s*asList|List\s*\.\s*of)\s*\(",
                      args
                  ):

                      list_open = args.find(
                          "(",
                          list_match.start()
                      )

                      list_body = balanced(
                          args,
                          list_open
                      )


                      for name in re.findall(
                          r"\b[A-Za-z_][A-Za-z0-9_]*\b",
                          list_body
                      ):

                          if name in step_defs:

                              if name not in names:

                                  names.append(
                                      name
                                  )


                  if names:

                      panels.append({
                          "title": title,
                          "steps": names
                      })


              # ----------------------------------------------------
              # FALLBACK TO STEP ORDER
              # ----------------------------------------------------

              if not panels:

                  if step_order:

                      panels.append({
                          "title": "Walkthrough",
                          "steps": step_order
                      })


              # ----------------------------------------------------
              # BUILD FINAL PANELS
              # ----------------------------------------------------

              final_panels = []

              seen = set()


              for panel in panels:

                  output_steps = []


                  for variable in panel["steps"]:

                      if variable in seen:

                          continue


                      seen.add(
                          variable
                      )


                      text = step_defs.get(
                          variable,
                          ""
                      )


                      if not text:

                          text = humanize(
                              variable
                          )


                      output_steps.append(
                          text
                      )


                  if output_steps:

                      final_panels.append({
                          "section": panel["title"],
                          "steps": output_steps
                      })


              # ----------------------------------------------------
              # ITEMS
              # ----------------------------------------------------

              items = []


              for match in re.finditer(
                  r'new\s+ItemRequirement\s*\(\s*"([^"]+)"',
                  source
              ):

                  item = clean(
                      decode_string(
                          match.group(1)
                      )
                  )

                  if item and item not in items:

                      items.append(item)


              # ----------------------------------------------------
              # COMBAT
              # ----------------------------------------------------

              combat = []


              for match in re.finditer(
                  r'new\s+.*?Requirement\s*\(\s*"([^"]+)"',
                  source
              ):

                  value = clean(
                      decode_string(
                          match.group(1)
                      )
                  )

                  if (
                      value
                      and (
                          "level" in value.lower()
                          or "combat" in value.lower()
                          or "monster" in value.lower()
                      )
                      and value not in combat
                  ):

                      combat.append(
                          value
                      )


              # ----------------------------------------------------
              # SKILL REQUIREMENTS
              # ----------------------------------------------------

              requirements = []


              for match in re.finditer(
                  r"new\s+SkillRequirement\s*\("
                  r"\s*Skill\.([A-Z_]+)"
                  r"\s*,\s*(\d+)",
                  source
              ):

                  requirements.append(
                      f"{humanize(match.group(1))} "
                      f"level {match.group(2)}"
                  )


              # ----------------------------------------------------
              # QUEST REQUIREMENTS
              # ----------------------------------------------------

              for match in re.finditer(
                  r"new\s+QuestRequirement\s*\("
                  r"\s*(?:QuestHelperQuest\.)?"
                  r"([A-Z0-9_]+)",
                  source
              ):

                  requirements.append(
                      "Quest requirement: "
                      + humanize(
                          match.group(1)
                      )
                  )


              # ----------------------------------------------------
              # QUEST POINTS
              # ----------------------------------------------------

              qp = 0


              qp_match = re.search(
                  r"QuestPointReward\s*\(\s*(\d+)",
                  source
              )


              if qp_match:

                  qp = int(
                      qp_match.group(1)
                  )


              # ----------------------------------------------------
              # XP REWARDS
              # ----------------------------------------------------

              rewards = []


              for match in re.finditer(
                  r"ExperienceReward\s*\("
                  r"\s*Skill\.([A-Z_]+)"
                  r"\s*,\s*([\d,]+)",
                  source
              ):

                  rewards.append(
                      f"{humanize(match.group(1))} "
                      f"XP: {match.group(2)}"
                  )


              # ----------------------------------------------------
              # ITEM REWARDS
              # ----------------------------------------------------

              for match in re.finditer(
                  r'ItemReward\s*\(\s*"([^"]+)"',
                  source
              ):

                  value = clean(
                      decode_string(
                          match.group(1)
                      )
                  )

                  if value:

                      rewards.append(
                          value
                      )


              # ----------------------------------------------------
              # START
              # ----------------------------------------------------

              start = ""

              if final_panels:

                  if final_panels[0]["steps"]:

                      start = (
                          final_panels[0]
                          ["steps"][0]
                      )


              # ----------------------------------------------------
              # LENGTH
              # ----------------------------------------------------

              count = sum(
                  len(x["steps"])
                  for x in final_panels
              )


              if count <= 10:

                  length = "Very Short"

              elif count <= 25:

                  length = "Short"

              elif count <= 50:

                  length = "Medium"

              elif count <= 90:

                  length = "Long"

              else:

                  length = "Very Long"


              return {
                  "panels": final_panels,
                  "items": items,
                  "requirements": requirements,
                  "combat": combat,
                  "rewards": rewards,
                  "qp": qp,
                  "start": start,
                  "length": length,
                  "stepCount": count
              }


          # ========================================================
          # MANUAL LEARNING THE ROPES
          # ========================================================

          LEARNING_THE_ROPES = {

              "title": "Learning the Ropes",

              "type": "F2P",

              "difficulty": "Novice",

              "length": "Very Short",

              "qp": 1,

              "start":
                  "Speak to the Quest Guide on Tutorial Island.",

              "items": [],

              "requirements": [],

              "combat": [
                  "Two level 3 giant rats during the tutorial"
              ],

              "rewards": [
                  "1 Quest Point",
                  "Access to mainland Gielinor",
                  "Lumbridge Home Teleport",
                  "Basic tutorial equipment and supplies",
                  "25 coins placed in the bank"
              ],

              "panels": [

                  {
                      "section":
                          "Character customisation",

                      "steps": [
                          "Complete the character creation and appearance setup.",
                          "Choose your preferred appearance and continue."
                      ]
                  },

                  {
                      "section":
                          "Adventure Paths",

                      "steps": [
                          "Choose an Adventure Path when prompted.",
                          "Follow the instructions for the selected path."
                      ]
                  },

                  {
                      "section":
                          "Gielinor Guide",

                      "steps": [
                          "Speak with the Gielinor Guide.",
                          "Continue through the introductory dialogue."
                      ]
                  },

                  {
                      "section":
                          "Survival Expert",

                      "steps": [
                          "Speak with the Survival Expert.",
                          "Open your inventory when instructed.",
                          "Take the supplied basic equipment.",
                          "Follow the instructions for using the tools."
                      ]
                  },

                  {
                      "section":
                          "Master Chef",

                      "steps": [
                          "Speak with the Master Chef.",
                          "Follow the cooking instructions.",
                          "Prepare the required food.",
                          "Eat the food when instructed."
                      ]
                  },

                  {
                      "section":
                          "Quest Guide",

                      "steps": [
                          "Speak with the Quest Guide.",
                          "Open the quest interface.",
                          "Read the tutorial quest information.",
                          "Continue to the next area."
                      ]
                  },

                  {
                      "section":
                          "Mining Instructor",

                      "steps": [
                          "Speak with the Mining Instructor.",
                          "Mine the required rocks.",
                          "Collect the ore.",
                          "Smelt the required bar."
                      ]
                  },

                  {
                      "section":
                          "Combat Instructor",

                      "steps": [
                          "Speak with the Combat Instructor.",
                          "Equip the supplied combat equipment.",
                          "Attack the training target.",
                          "Fight the level 3 giant rat.",
                          "Continue through the combat tutorial."
                      ]
                  },

                  {
                      "section":
                          "Account Guide",

                      "steps": [
                          "Speak with the Account Guide.",
                          "Follow the account and security instructions.",
                          "Continue through the tutorial."
                      ]
                  },

                  {
                      "section":
                          "Brother Brace",

                      "steps": [
                          "Speak with Brother Brace.",
                          "Open the prayer interface.",
                          "Follow the prayer tutorial.",
                          "Continue to the next area."
                      ]
                  },

                  {
                      "section":
                          "Magic Instructor",

                      "steps": [
                          "Speak with the Magic Instructor.",
                          "Open the magic spellbook.",
                          "Cast the required spell.",
                          "Continue through the final tutorial instructions."
                      ]
                  },

                  {
                      "section":
                          "Finish the tutorial",

                      "steps": [
                          "Complete the final tutorial dialogue.",
                          "Use the Lumbridge Home Teleport when instructed.",
                          "Speak with the available tutors if desired.",
                          "Leave Tutorial Island and begin your adventure."
                      ]
                  }
              ]
          }


          # ========================================================
          # QUEST HELPER DATA CACHE
          # ========================================================

          cache = {}


          def get_helper(class_name):

              if class_name in cache:

                  return cache[class_name]


              path = source_by_class.get(
                  class_name
              )


              if not path:

                  cache[class_name] = None

                  return None


              try:

                  data = parse_helper(
                      path
                  )

              except Exception as error:

                  print(
                      "Parser error:",
                      class_name,
                      error
                  )

                  data = None


              cache[class_name] = data

              return data


          # ========================================================
          # BUILD QUEST DATABASE
          # ========================================================

          final = []

          missing = []


          for entry in quest_entries:

              enum_name = entry["enum"]

              title = entry["title"]


              # ----------------------------------------------------
              # LEARNING THE ROPES
              # ----------------------------------------------------

              if enum_name == "LEARNING_THE_ROPES":

                  final.append(
                      LEARNING_THE_ROPES
                  )

                  continue


              # ----------------------------------------------------
              # RFD SUBQUEST
              # ----------------------------------------------------

              if title in RFD_NAMES:

                  class_name = RFD_NAMES[
                      title
                  ]

                  data = get_helper(
                      class_name
                  )


                  if not data or not data["panels"]:

                      missing.append(title)

                      continue


                  final.append({

                      "title": title,

                      "type": "Members",

                      "difficulty": "Intermediate",

                      "length":
                          data["length"],

                      "qp":
                          data["qp"],

                      "start":
                          data["start"],

                      "items":
                          data["items"],

                      "requirements":
                          data["requirements"],

                      "combat":
                          data["combat"],

                      "rewards":
                          data["rewards"],

                      "panels":
                          data["panels"],

                      "stepCount":
                          data["stepCount"]
                  })

                  continue


              # ----------------------------------------------------
              # RFD PARENT
              # ----------------------------------------------------

              if enum_name == "RECIPE_FOR_DISASTER":

                  panels = []

                  items = []

                  requirements = []

                  combat = []

                  rewards = []

                  total = 0

                  start = ""


                  for class_name in RFD_CLASSES:

                      data = get_helper(
                          class_name
                      )

                      if not data:

                          continue


                      panels.extend(
                          data["panels"]
                      )


                      for key in [
                          "items",
                          "requirements",
                          "combat",
                          "rewards"
                      ]:

                          for value in data[key]:

                              if value not in locals()[key]:

                                  locals()[key].append(
                                      value
                                  )


                      total += data[
                          "stepCount"
                      ]


                      if (
                          not start
                          and data["start"]
                      ):

                          start = data[
                              "start"
                          ]


                  if not panels:

                      missing.append(title)

                      continue


                  final.append({

                      "title": title,

                      "type": "Members",

                      "difficulty":
                          "Grandmaster",

                      "length":
                          "Very Long",

                      "qp": 10,

                      "start": start,

                      "items": items,

                      "requirements":
                          requirements,

                      "combat": combat,

                      "rewards": rewards,

                      "panels": panels,

                      "stepCount": total
                  })

                  continue


              # ----------------------------------------------------
              # NORMAL QUEST
              # ----------------------------------------------------

              classes = quest_helpers.get(
                  enum_name,
                  []
              )


              # Keep only classes whose source is
              # actually under the quest helpers tree.

              classes = [
                  x
                  for x in classes
                  if x in source_by_class
              ]


              # Remove duplicates.

              classes = list(
                  dict.fromkeys(
                      classes
                  )
              )


              combined = {

                  "panels": [],

                  "items": [],

                  "requirements": [],

                  "combat": [],

                  "rewards": [],

                  "qp": 0,

                  "start": "",

                  "length": "Unknown",

                  "stepCount": 0
              }


              for class_name in classes:

                  data = get_helper(
                      class_name
                  )


                  if not data:

                      continue


                  combined[
                      "panels"
                  ].extend(
                      data["panels"]
                  )


                  for key in [
                      "items",
                      "requirements",
                      "combat",
                      "rewards"
                  ]:

                      for value in data[key]:

                          if value not in combined[key]:

                              combined[key].append(
                                  value
                              )


                  combined[
                      "qp"
                  ] = max(
                      combined["qp"],
                      data["qp"]
                  )


                  combined[
                      "stepCount"
                  ] += data[
                      "stepCount"
                  ]


                  if (
                      not combined["start"]
                      and data["start"]
                  ):

                      combined[
                          "start"
                      ] = data["start"]


                  if (
                      combined["length"]
                      == "Unknown"
                      and data["length"]
                      != "Unknown"
                  ):

                      combined[
                          "length"
                      ] = data["length"]


              # ----------------------------------------------------
              # TYPE
              # ----------------------------------------------------

              quest_type = (
                  "F2P"
                  if enum_name in F2P
                  else "Members"
              )


              # ----------------------------------------------------
              # DIFFICULTY
              # ----------------------------------------------------

              difficulty = "Unknown"


              difficulty_names = [
                  "Novice",
                  "Intermediate",
                  "Experienced",
                  "Master",
                  "Grandmaster"
              ]


              # Look for difficulty declaration
              # in the helper source.

              source_text = ""


              for class_name in classes:

                  path = source_by_class.get(
                      class_name
                  )

                  if path:

                      source_text += path.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )


              for diff in difficulty_names:

                  if re.search(
                      r"\b"
                      + re.escape(diff)
                      + r"\b",
                      source_text,
                      flags=re.I
                  ):

                      difficulty = diff

                      break


              if difficulty == "Unknown":

                  difficulty = (
                      "Novice"
                      if combined["stepCount"] <= 10
                      else "Intermediate"
                      if combined["stepCount"] <= 25
                      else "Experienced"
                  )


              # ----------------------------------------------------
              # REQUIRE WALKTHROUGH
              # ----------------------------------------------------

              if (
                  not combined["panels"]
                  or combined["stepCount"] == 0
              ):

                  missing.append(title)

                  continue


              final.append({

                  "title": title,

                  "type": quest_type,

                  "difficulty": difficulty,

                  "length":
                      combined["length"],

                  "qp":
                      combined["qp"],

                  "start":
                      combined["start"],

                  "items":
                      combined["items"],

                  "requirements":
                      combined["requirements"],

                  "combat":
                      combined["combat"],

                  "rewards":
                      combined["rewards"],

                  "panels":
                      combined["panels"],

                  "stepCount":
                      combined["stepCount"]
              })


          # ========================================================
          # VALIDATION
          # ========================================================

          print()
          print(
              "=========================================="
          )
          print(
              "QUESTMATE DATABASE BUILD"
          )
          print(
              "=========================================="
          )


          print(
              "Quest entries:",
              len(final)
          )


          if missing:

              print()
              print(
                  "QUESTS WITHOUT WALKTHROUGHS:"
              )

              for title in missing:

                  print(
                      "-",
                      title
                  )


              raise SystemExit(
                  "Walkthrough validation failed."
              )


          if len(final) != 192:

              raise SystemExit(
                  "Expected 192 quests but generated "
                  + str(len(final))
              )


          final.sort(
              key=lambda x:
                  x["title"].lower()
          )


          total_steps = sum(
              x["stepCount"]
              for x in final
          )


          f2p_count = sum(
              1
              for x in final
              if x["type"] == "F2P"
          )


          members_count = sum(
              1
              for x in final
              if x["type"] == "Members"
          )


          print(
              "F2P:",
              f2p_count
          )

          print(
              "Members:",
              members_count
          )

          print(
              "Total walkthrough steps:",
              total_steps
          )


          print(
              "=========================================="
          )


          if f2p_count != 24:

              raise SystemExit(
                  "Expected 24 F2P quests."
              )


          if members_count != 168:

              raise SystemExit(
                  "Expected 168 Members quests."
              )


          # ========================================================
          # WRITE JSON
          # ========================================================

          output = (
              ROOT
              / "app/src/main/assets/quests.json"
          )


          output.write_text(
              json.dumps(
                  final,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          # ========================================================
          # LICENSE
          # ========================================================

          license_text = """

          QuestMate contains walkthrough data derived from
