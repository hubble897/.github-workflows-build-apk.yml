name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout QuestMate
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 4. INSTALL GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          cd "$RUNNER_TEMP"
          curl -L -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version


      # ============================================================
      # 5. DOWNLOAD QUEST HELPER SOURCE
      # ============================================================

      - name: Download Quest Helper source
        run: |
          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper


      # ============================================================
      # 6. DOWNLOAD CURRENT RUNELITE QUEST DATA
      # ============================================================

      - name: Download RuneLite quest source
        run: |
          mkdir -p runelite-source

          curl -L \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o runelite-source/Quest.java

          test -s runelite-source/Quest.java


      # ============================================================
      # 7. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |

          rm -rf app
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "QuestMate"
include(":app")
EOF


          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF


          cat > gradle.properties <<'EOF'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2g
EOF


          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questmate.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.questmate.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

tasks.register("copyQuestMateApk", Copy) {
    dependsOn("assembleDebug")

    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))

    into(layout.projectDirectory.dir("dist"))

    rename {
        "QuestMate.apk"
    }
}
EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:theme="@style/AppTheme"
        android:label="QuestMate"
        android:allowBackup="false"
        android:supportsRtl="true">

        <activity
            android:name=".QuestDetailActivity"
            android:exported="false" />

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>

                <action android:name="android.intent.action.MAIN" />

                <category android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowActionModeOverlay">true</item>
        <item name="android:colorAccent">#6750A4</item>
        <item name="android:navigationBarColor">#000000</item>

    </style>

</resources>
EOF


      # ============================================================
      # 8. GENERATE QUEST DATA
      # ============================================================

      - name: Generate detailed QuestMate quest database
        run: |

          cat > generate_quests.py <<'PYTHON'
import json
import re
import os
from pathlib import Path


# ============================================================
# QUEST LIST
# ============================================================

quest_source = Path("runelite-source/Quest.java").read_text(
    encoding="utf-8",
    errors="ignore"
)

quest_pattern = re.compile(
    r'^\s*([A-Z0-9_]+)\s*\(\s*'
    r'-?\d+\s*,\s*'
    r'"([^"]+)"',
    re.MULTILINE
)

all_quests = []

for enum_name, quest_name in quest_pattern.findall(quest_source):

    all_quests.append({
        "enum": enum_name,
        "name": quest_name
    })


print("RuneLite quests found:", len(all_quests))


# ============================================================
# MINIQUESTS TO EXCLUDE
# ============================================================

miniquests = {
    "Alfred Grimhand's Barcrawl",
