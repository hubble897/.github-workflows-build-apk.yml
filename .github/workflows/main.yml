      # 10. CREATE QUEST DETAIL ACTIVITY
      # ============================================================

      - name: Create Quest detail screen
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
package com.questmate.app;

import android.app.Activity;
import android.os.Bundle;
import android.content.Context;
import android.graphics.Typeface;
import android.view.View;
import android.widget.*;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.InputStream;
import java.nio.charset.StandardCharsets;

public class QuestDetailActivity extends Activity {

    private LinearLayout root;

    private android.content.SharedPreferences progress;

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        progress =
                getSharedPreferences(
                        "quest_progress",
                        Context.MODE_PRIVATE
                );

        build();

        loadQuest();
    }

    private void build() {

        ScrollView scroll =
                new ScrollView(this);

        root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                24,
                24,
                24,
                40
        );

        scroll.addView(root);

        setContentView(scroll);
    }

    private void loadQuest() {

        String requestedName =
                getIntent().getStringExtra(
                        "questName"
                );

        try {

            InputStream input =
                    getAssets().open("quests.json");

            byte[] bytes =
                    new byte[input.available()];

            input.read(bytes);

            input.close();

            JSONArray quests =
                    new JSONArray(
                            new String(
                                    bytes,
                                    StandardCharsets.UTF_8
                            )
                    );

            JSONObject quest = null;

            for (int i = 0; i < quests.length(); i++) {

                JSONObject candidate =
                        quests.getJSONObject(i);

                if (
                        candidate.getString("name")
                                .equals(requestedName)
                ) {

                    quest = candidate;
                    break;
                }
            }

            if (quest == null) {

                showText(
                        "Quest not found."
                );

                return;
            }

            renderQuest(quest);

        } catch (Exception e) {

            showText(
                    "Could not load quest."
            );
        }
    }

    private void renderQuest(
            JSONObject quest
    ) throws Exception {

        showHeading(
                quest.getString("name"),
                28
        );

        boolean members =
                quest.getBoolean("members");

        showText(
                members
                        ? "Members quest"
                        : "Free-to-play quest"
        );

        if (!quest.optString("startLocation")
                .isEmpty()) {

            showHeading(
                    "Starting location",
                    20
            );

            showText(
                    "📍 " +
                    quest.getString(
                            "startLocation"
                    )
            );
        }

        if (!quest.optString("startingNpc")
                .isEmpty()) {

            showHeading(
                    "Starting NPC",
                    20
            );

            showText(
                    "👤 " +
                    quest.getString(
                            "startingNpc"
                    )
            );
        }

        JSONArray items =
                quest.optJSONArray("items");

        if (
                items != null &&
                items.length() > 0
        ) {

            showHeading(
                    "Items",
                    20
            );

            for (int i = 0; i < items.length(); i++) {

                showText(
                        "• " +
                        items.getString(i)
                );
            }
        }

        JSONArray npcs =
                quest.optJSONArray("npcs");

        if (
                npcs != null &&
                npcs.length() > 0
        ) {

            showHeading(
                    "NPCs used in this quest",
                    20
            );

            for (int i = 0; i < npcs.length(); i++) {

                showText(
                        "👤 " +
                        npcs.getString(i)
                );
            }
        }

        JSONArray locations =
                quest.optJSONArray("locations");

        if (
                locations != null &&
                locations.length() > 0
        ) {

            showHeading(
                    "Locations used in this quest",
                    20
            );

            for (int i = 0; i < locations.length(); i++) {

                showText(
                        "📍 " +
                        locations.getString(i)
                );
            }
        }

        showHeading(
                "Walkthrough",
                24
        );

        JSONArray steps =
                quest.optJSONArray("steps");

        if (
                steps == null ||
                steps.length() == 0
        ) {

            showText(
                    "No detailed helper steps were available for this quest."
            );

            return;
        }

        for (int i = 0; i < steps.length(); i++) {

            JSONObject step =
                    steps.getJSONObject(i);

            renderStep(
                    quest.getString("name"),
                    step,
                    i
            );
        }
    }

    private void renderStep(
            String questName,
            JSONObject step,
            int index
    ) throws Exception {

        LinearLayout box =
                new LinearLayout(this);

        box.setOrientation(
                LinearLayout.VERTICAL
        );

        box.setPadding(
                8,
                12,
                8,
                12
        );

        TextView title =
                new TextView(this);

        title.setText(
                "Step " +
                (index + 1) +
                " — " +
                step.optString(
                        "title",
                        "Quest objective"
                )
        );

        title.setTextSize(19);

        title.setTypeface(
                Typeface.DEFAULT_BOLD
        );

        box.addView(title);

        String location =
                step.optString(
                        "location",
                        ""
                );

        if (!location.isEmpty()) {

            TextView locationText =
                    new TextView(this);

            locationText.setText(
                    "📍 Location: " +
                    location
            );

            locationText.setTextSize(16);

            box.addView(
                    locationText
            );
        }

        String npc =
                step.optString(
                        "npc",
                        ""
                );

        if (!npc.isEmpty()) {

            TextView npcText =
                    new TextView(this);

            npcText.setText(
                    "👤 NPC: " +
                    npc
            );

            npcText.setTextSize(16);

            box.addView(
                    npcText
            );
        }

        JSONArray items =
                step.optJSONArray("items");

        if (
                items != null &&
                items.length() > 0
        ) {

            TextView itemText =
                    new TextView(this);

            StringBuilder builder =
                    new StringBuilder();

            builder.append(
                    "🎒 Items: "
            );

            for (int i = 0; i < items.length(); i++) {

                if (i > 0) {
                    builder.append(", ");
                }

                builder.append(
                        items.getString(i)
                );
            }

            itemText.setText(
                    builder.toString()
            );

            itemText.setTextSize(15);

            box.addView(
                    itemText
            );
        }

        TextView instruction =
                new TextView(this);

        instruction.setText(
                step.optString(
                        "instruction",
                        ""
                )
        );

        instruction.setTextSize(16);

        instruction.setPadding(
                0,
                8,
                0,
                8
        );

        box.addView(
                instruction
        );

        CheckBox complete =
                new CheckBox(this);

        complete.setText(
                "Completed"
        );

        String key =
                questName +
                "_step_" +
                index;

        complete.setChecked(
                progress.getBoolean(
                        key,
                        false
                )
        );

        complete.setOnCheckedChangeListener(
                (button, checked) ->
                        progress.edit()
                                .putBoolean(
                                        key,
                                        checked
                                )
                                .apply()
        );

        box.addView(
                complete
        );

        root.addView(
                box
        );
    }

    private void showHeading(
            String text,
            float size
    ) {

        TextView view =
                new TextView(this);

        view.setText(text);

        view.setTextSize(size);

        view.setTypeface(
                Typeface.DEFAULT_BOLD
        );

        view.setPadding(
                0,
                20,
                0,
                8
        );

        root.addView(view);
    }

    private void showText(
            String text
    ) {

        TextView view =
                new TextView(this);

        view.setText(text);

        view.setTextSize(16);

        view.setPadding(
                0,
                4,
                0,
                4
        );

        root.addView(view);
    }
}
