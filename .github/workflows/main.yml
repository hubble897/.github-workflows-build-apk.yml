name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          ./gradle-8.9/bin/gradle --version


      # ============================================================
      # DOWNLOAD CURRENT OSRS QUEST LIST
      # ============================================================

      - name: Download OSRS quest list
        run: |
          mkdir -p build_data

          curl -fL \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o build_data/Quest.java

          echo "Quest.java downloaded successfully."

          echo "Checking Quest.java..."
          head -35 build_data/Quest.java


      # ============================================================
      # CREATE QUEST DATABASE
      # ============================================================

      - name: Generate QuestMate quest database
        run: |

          mkdir -p app/src/main/assets

          cat > build_data/generate_quests.py <<'PYTHON'
          import json
          import os
          import re
          import sys

          SOURCE = "build_data/Quest.java"
          OUTPUT = "app/src/main/assets/quests.json"

          print("")
          print("==========================================")
          print(" QUESTMATE QUEST DATABASE GENERATOR")
          print("==========================================")

          if not os.path.exists(SOURCE):
              print("ERROR: Quest.java does not exist.")
              sys.exit(1)

          with open(SOURCE, "r", encoding="utf-8") as f:
              text = f.read()

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Current RuneLite format is:
          #
          # QUEST_ID(number, "Quest Name")
          #
          # Example:
          #
          # ANIMAL_MAGNETISM(0, "Animal Magnetism")
          #
          # --------------------------------------------------------

          pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*'
              r'-?\d+\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )

          all_quests = []

          for match in pattern.finditer(text):

              quest_id = match.group(1).strip()
              quest_name = match.group(2).strip()

              all_quests.append({
                  "id": quest_id,
                  "name": quest_name
              })

          print("")
          print("RuneLite quest entries found:", len(all_quests))

          if len(all_quests) < 180:
              print("")
              print("ERROR: Quest.java was parsed incorrectly.")
              print("Expected more than 180 entries.")
              print("Found:", len(all_quests))
              sys.exit(1)

          # --------------------------------------------------------
          # NON-MAIN QUESTS
          #
          # These are miniquests and Recipe for Disaster
          # subquests and are NOT counted among the 182 main quests.
          # --------------------------------------------------------

          excluded_names = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",

              "Recipe for Disaster - Another Cook's Quest",
              "Recipe for Disaster - Mountain Dwarf",
              "Recipe for Disaster - Wartface & Bentnoze",
              "Recipe for Disaster - Pirate Pete",
              "Recipe for Disaster - Lumbridge Guide",
              "Recipe for Disaster - Evil Dave",
              "Recipe for Disaster - Skrach Uglogwee",
              "Recipe for Disaster - Sir Amik Varze",
              "Recipe for Disaster - King Awowogei",
              "Recipe for Disaster - Culinaromancer"
          }

          quests = [
              q for q in all_quests
              if q["name"] not in excluded_names
          ]

          print("")
          print("After exclusions:", len(quests))

          # --------------------------------------------------------
          # F2P QUESTS
          # --------------------------------------------------------

          f2p_names = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot"
          }

          # --------------------------------------------------------
          # VALIDATE TOTAL
          # --------------------------------------------------------

          if len(quests) != 182:

              print("")
              print("==========================================")
              print("ERROR")
              print("==========================================")
              print("Expected: 182 main quests")
              print("Found:   ", len(quests))
              print("")
              print("All parsed quests:")

              for q in quests:
                  print(
                      q["id"],
                      "->",
                      q["name"]
                  )

              sys.exit(1)

          # --------------------------------------------------------
          # BUILD APP DATABASE
          # --------------------------------------------------------

          database = []

          for number, quest in enumerate(quests, 1):

              name = quest["name"]

              if name in f2p_names:
                  membership = "F2P"
              else:
                  membership = "Members"

              # Offline built-in walkthrough.
              # No Wiki links are used.
              steps = [
                  "Check the quest requirements before starting.",
                  "Gather the required items and equipment.",
                  "Travel to the quest starting location.",
                  "Speak to the NPC who starts the quest.",
                  "Follow the quest objectives in order.",
                  "Complete the required tasks and objectives.",
                  "Return to the quest NPC when the objectives are complete.",
                  "Finish the quest and claim your rewards."
              ]

              database.append({
                  "id": quest["id"],
                  "name": name,
                  "membership": membership,
                  "difficulty": "OSRS Quest",
                  "length": "Varies",
                  "quest_points": 0,
                  "start_location": "See walkthrough",
                  "requirements": [],
                  "items": [],
                  "rewards": [],
                  "steps": steps
              })

              print(
                  f"[{number}/182] {name}"
              )

          # --------------------------------------------------------
          # SORT ALPHABETICALLY
          # --------------------------------------------------------

          database.sort(
              key=lambda x: x["name"].lower()
          )

          # --------------------------------------------------------
          # FINAL COUNTS
          # --------------------------------------------------------

          total = len(database)

          f2p_count = sum(
              1
              for q in database
              if q["membership"] == "F2P"
          )

          members_count = sum(
              1
              for q in database
              if q["membership"] == "Members"
          )

          print("")
          print("==========================================")
          print("FINAL QUEST DATABASE")
          print("==========================================")
          print("Total:", total)
          print("F2P:", f2p_count)
          print("Members:", members_count)
          print("==========================================")

          if total != 182:
              sys.exit("ERROR: Total quests must equal 182.")

          if f2p_count != 24:
              sys.exit("ERROR: F2P quests must equal 24.")

          if members_count != 158:
              sys.exit("ERROR: Members quests must equal 158.")

          # --------------------------------------------------------
          # WRITE JSON
          # --------------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("Quest database created successfully.")
          print("Output:", OUTPUT)
          print(
              "Size:",
              os.path.getsize(OUTPUT),
              "bytes"
          )

          PYTHON

          echo "Checking generator..."

          python3 -m py_compile \
            build_data/generate_quests.py

          echo "Generator syntax OK."

          echo ""
          echo "Running generator..."

          python3 \
            build_data/generate_quests.py

          echo ""
          echo "QUEST DATABASE CREATED:"
          ls -lh app/src/main/assets/quests.json


      # ============================================================
      # CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {

              namespace "com.questmate.app"

              compileSdk 35

              defaultConfig {

                  applicationId "com.questmate.app"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }
          }
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #4CAF50
                  </item>

                  <item name="android:statusBarColor">
                      #111111
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Create MainActivity
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                  new ArrayList<>();

              private LinearLayout list;

              private EditText search;

              private Spinner filter;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  loadQuests();

                  createScreen();

                  updateList();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open("quests.json");

                      byte[] data =
                          new byte[input.available()];

                      input.read(data);

                      input.close();

                      String json =
                          new String(
                              data,
                              StandardCharsets.UTF_8
                          );

                      JSONArray array =
                          new JSONArray(json);

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          quests.add(
                              array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Quest database error",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void createScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      10
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QuestMate");

                  title.setTextSize(30);

                  root.addView(title);

                  TextView subtitle =
                      new TextView(this);

                  subtitle.setText(
                      "OSRS Quest Guide"
                  );

                  subtitle.setTextSize(16);

                  root.addView(subtitle);

                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(true);

                  root.addView(search);

                  filter =
                      new Spinner(this);

                  String[] options = {
                      "All Quests",
                      "Free-to-Play",
                      "Members"
                  };

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          options
                      );

                  filter.setAdapter(adapter);

                  root.addView(filter);

                  ScrollView scroll =
                      new ScrollView(this);

                  list =
                      new LinearLayout(this);

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(list);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  search.addTextChangedListener(
                      new TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after) {}

                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count) {

                              updateList();
                          }

                          public void afterTextChanged(
                              Editable e) {}
                      }
                  );

                  filter.setOnItemSelectedListener(
                      new AdapterView.OnItemSelectedListener() {

                          public void onItemSelected(
                              AdapterView<?> parent,
                              View view,
                              int position,
                              long id) {

                              updateList();
                          }

                          public void onNothingSelected(
                              AdapterView<?> parent) {}
                      }
                  );
              }

              private void updateList() {

                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  String query =
                      search.getText()
                          .toString()
                          .toLowerCase();

                  int selected =
                      filter.getSelectedItemPosition();

                  for (final JSONObject quest : quests) {

                      try {

                          String name =
                              quest.getString("name");

                          String membership =
                              quest.getString(
                                  "membership"
                              );

                          boolean searchMatch =
                              query.isEmpty()
                              || name.toLowerCase()
                                  .contains(query);

                          boolean filterMatch =
                              selected == 0
                              || (
                                  selected == 1
                                  && membership.equals("F2P")
                              )
                              || (
                                  selected == 2
                                  && membership.equals("Members")
                              );

                          if (!searchMatch ||
                              !filterMatch) {

                              continue;
                          }

                          Button button =
                              new Button(this);

                          button.setText(
                              name
                              + " • "
                              + membership
                          );

                          button.setAllCaps(false);

                          button.setOnClickListener(
                              v -> {

                                  Intent intent =
                                      new Intent(
                                          MainActivity.this,
                                          QuestDetailActivity.class
                                      );

                                  intent.putExtra(
                                      "quest",
                                      quest.toString()
                                  );

                                  startActivity(intent);
                              }
                          );

                          list.addView(button);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # QUEST DETAIL ACTIVITY
      # ============================================================

      - name: Create QuestDetailActivity
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;

              private LinearLayout content;

              private SharedPreferences progress;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  progress =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );

                  try {

                      quest =
                          new JSONObject(
                              getIntent()
                                  .getStringExtra("quest")
                          );

                  } catch (Exception e) {

                      finish();
                      return;
                  }

                  buildScreen();
              }

              private TextView heading(
                  String text,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(size);

                  view.setPadding(
                      0,
                      10,
                      0,
                      10
                  );

                  return view;
              }

              private void addText(
                  String text
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(15);

                  view.setPadding(
                      0,
                      4,
                      0,
                      4
                  );

                  content.addView(view);
              }

              private void addArray(
                  String title,
                  JSONArray array
              ) {

                  if (array == null ||
                      array.length() == 0) {

                      return;
                  }

                  content.addView(
                      heading(title, 20)
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      try {

                          addText(
                              "• "
                              + array.getString(i)
                          );

                      } catch (Exception ignored) {}
                  }
              }

              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      20
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  content =
                      new LinearLayout(this);

                  content.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(content);

                  try {

                      TextView title =
                          heading(
                              quest.getString("name"),
                              28
                          );

                      title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      );

                      content.addView(title);

                      addText(
                          quest.getString(
                              "membership"
                          )
                      );

                      content.addView(
                          heading(
                              "Quest Information",
                              21
                          )
                      );

                      addText(
                          "Difficulty: "
                          + quest.getString(
                              "difficulty"
                          )
                      );

                      addText(
                          "Length: "
                          + quest.getString(
                              "length"
                          )
                      );

                      addText(
                          "Quest Points: "
                          + quest.getInt(
                              "quest_points"
                          )
                      );

                      addText(
                          "Start Location: "
                          + quest.getString(
                              "start_location"
                          )
                      );

                      addArray(
                          "Requirements",
                          quest.getJSONArray(
                              "requirements"
                          )
                      );

                      addArray(
                          "Items",
                          quest.getJSONArray(
                              "items"
                          )
                      );

                      addArray(
                          "Rewards",
                          quest.getJSONArray(
                              "rewards"
                          )
                      );

                      content.addView(
                          heading(
                              "Walkthrough",
                              23
                          )
                      );

                      addText(
                          "Tick each step as you complete it."
                      );

                      JSONArray steps =
                          quest.getJSONArray(
                              "steps"
                          );

                      String questId =
                          quest.getString("id");

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          final String key =
                              questId
                              + "_step_"
                              + i;

                          CheckBox check =
                              new CheckBox(this);

                          check.setText(
                              (i + 1)
                              + ". "
                              + steps.getString(i)
                          );

                          check.setTextSize(16);

                          check.setChecked(
                              progress.getBoolean(
                                  key,
                                  false
                              )
                          );

                          check.setOnCheckedChangeListener(
                              (button, checked) -> {

                                  progress.edit()
                                      .putBoolean(
                                          key,
                                          checked
                                      )
                                      .apply();
                              }
                          );

                          content.addView(check);
                      }

                  } catch (Exception ignored) {}

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);
              }
          }
          EOF


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build QuestMate APK
        run: |

          echo ""
          echo "=========================================="
          echo "BUILDING QUESTMATE APK"
          echo "=========================================="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD COMPLETED."


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |

          echo ""
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            ! -path "./dist/*" \
            | head -n 1)

          if [ -z "$APK" ]; then

              echo ""
              echo "ERROR: No APK was produced."
              exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p dist

          cp "$APK" \
            dist/QuestMate.apk

          echo ""
          echo "FINAL APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm Artifact Upload
        run: |

          echo ""
          echo "=========================================="
          echo "      QUESTMATE BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo ""
          echo "=========================================="
          echo "       ARTIFACT UPLOAD CONFIRMED"
          echo "=========================================="

          test -n "${{ steps.upload.outputs.artifact-id }}"
