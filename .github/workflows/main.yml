name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. JAVA 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 3. ANDROID SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"


      # ------------------------------------------------------------
      # 4. DOWNLOAD GRADLE 8.9
      # ------------------------------------------------------------
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version


      # ------------------------------------------------------------
      # 5. DOWNLOAD CURRENT RUNELITE QUEST LIST
      # ------------------------------------------------------------
      - name: Download current OSRS quest list
        run: |
          mkdir -p build_data

          curl -L \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o build_data/Quest.java

          echo "Downloaded RuneLite Quest.java"
          wc -l build_data/Quest.java


      # ------------------------------------------------------------
      # 6. DOWNLOAD QUEST HELPER
      # ------------------------------------------------------------
      - name: Download Quest Helper source
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git build_data/quest-helper

          echo "Quest Helper downloaded"
          find build_data/quest-helper/src -type f -name "*.java" | wc -l


      # ------------------------------------------------------------
      # 7. GENERATE QUEST DATABASE
      # ------------------------------------------------------------
      - name: Generate complete QuestMate quest database
        shell: bash
        run: |

          cat > build_data/generate_quests.py <<'PYTHON'
          import os
          import re
          import json

          RUNELITE_FILE = "build_data/Quest.java"
          HELPER_ROOT = "build_data/quest-helper/src"
          OUTPUT_DIR = "app/src/main/assets"
          OUTPUT_FILE = os.path.join(OUTPUT_DIR, "quests.json")

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          # --------------------------------------------------------
          # CURRENT F2P QUESTS
          # --------------------------------------------------------
          F2P = {
              "BLACK_KNIGHTS_FORTRESS",
              "BELOW_ICE_MOUNTAIN",
              "COOKS_ASSISTANT",
              "DEMON_SLAYER",
              "DORICS_QUEST",
              "DRAGON_SLAYER_I",
              "ERNEST_THE_CHICKEN",
              "GOBLIN_DIPLOMACY",
              "THE_CORSAIR_CURSE",
              "THE_IDES_OF_MILK",
              "IMP_CATCHER",
              "LEARNING_THE_ROPES",
              "MISthALIN_MYSTERY".upper(),
              "PIRATES_TREASURE",
              "PRINCE_ALI_RESCUE",
              "THE_RESTLESS_GHOST",
              "ROMEO_AND_JULIET",
              "RUNE_MYSTERIES",
              "SHEEP_SHEARER",
              "SHIELD_OF_ARRAV",
              "THE_KNIGHTS_SWORD",
              "VAMPYRE_SLAYER",
              "WITCHS_POTION",
              "X_MARKS_THE_SPOT",
          }

          # --------------------------------------------------------
          # EXACT NON-MAIN QUEST ENTRIES IN RUNELITE
          # --------------------------------------------------------
          EXCLUDED = {
              "ALFRED_GRIMHANDS_BARCRAWL",
              "BARBARIAN_TRAINING",
              "BEAR_YOUR_SOUL",
              "CURSE_OF_THE_EMPTY_LORD",
              "DADDYS_HOME",
              "THE_ENCHANTED_KEY",
              "ENTER_THE_ABYSS",
              "FAMILY_PEST",
              "THE_FROZEN_DOOR",
              "THE_GENERALS_SHADOW",
              "HIS_FAITHFUL_SERVANTS",
              "HOPESPEARS_WILL",
              "IN_SEARCH_OF_KNOWLEDGE",
              "INTO_THE_TOMBS",
              "LAIR_OF_TARN_RAZORLOR",
              "MAGE_ARENA_I",
              "MAGE_ARENA_II",
              "SKIPPY_AND_THE_MOGRES",
              "VALE_TOTEMS",

              "RECIPE_FOR_DISASTER_ANOTHER_COOKS_QUEST",
              "RECIPE_FOR_DISASTER_MOUNTAIN_DWARF",
              "RECIPE_FOR_DISASTER_WARTFACE_BENTNOZE",
              "RECIPE_FOR_DISASTER_PIRATE_PETE",
              "RECIPE_FOR_DISASTER_LUMBRIDGE_GUIDE",
              "RECIPE_FOR_DISASTER_EVIL_DAVE",
              "RECIPE_FOR_DISASTER_SKRACH_UGLOGWEE",
              "RECIPE_FOR_DISASTER_SIR_AMIK_VARZE",
              "RECIPE_FOR_DISASTER_KING_AWOWOGEI",
              "RECIPE_FOR_DISASTER_CULINAROMANCER",
          }

          # --------------------------------------------------------
          # HELPERS
          # --------------------------------------------------------
          def clean_enum(value):
              return value.strip().upper()

          def pretty(value):
              value = value.replace("_", " ")
              return value.title()

          def extract_quests():

              text = open(RUNELITE_FILE, encoding="utf-8").read()

              # RuneLite enum entries generally look like:
              # QUEST_NAME("Quest Name", ...)
              pattern = re.compile(
                  r'^\s*([A-Z0-9_]+)\s*\(\s*"([^"]+)"',
                  re.MULTILINE
              )

              quests = []

              for match in pattern.finditer(text):

                  enum_name = clean_enum(match.group(1))
                  display_name = match.group(2)

                  if enum_name in EXCLUDED:
                      continue

                  # Ignore obvious non-quest constants.
                  if enum_name in {
                      "UNKNOWN",
                      "NONE",
                      "NULL"
                  }:
                      continue

                  quests.append({
                      "enum": enum_name,
                      "name": display_name
                  })

              # Remove duplicates while retaining order.
              unique = []
              seen = set()

              for q in quests:
                  if q["enum"] not in seen:
                      seen.add(q["enum"])
                      unique.append(q)

              return unique


          # --------------------------------------------------------
          # LOAD ALL QUEST HELPER JAVA FILES
          # --------------------------------------------------------
          def load_helpers():

              helper_files = []

              for root, dirs, files in os.walk(HELPER_ROOT):
                  for filename in files:
                      if filename.endswith(".java"):
                          path = os.path.join(root, filename)

                          try:
                              with open(path, encoding="utf-8") as f:
                                  text = f.read()

                              helper_files.append((path, text))

                          except Exception:
                              pass

              return helper_files


          # --------------------------------------------------------
          # FIND QUEST HELPER USING @QuestDescriptor
          # --------------------------------------------------------
          def find_helper(enum_name, helpers):

              candidates = [
                  enum_name,
                  enum_name.replace("THE_IDES_OF_MILK", "THE_IDES_OF_MILK")
              ]

              descriptor_pattern = re.compile(
                  r'@QuestDescriptor\s*\(\s*quest\s*=\s*'
                  r'(?:QuestHelperQuest|Quest)\.([A-Z0-9_]+)'
              )

              # Best method: descriptor.
              for path, text in helpers:

                  for match in descriptor_pattern.finditer(text):

                      if clean_enum(match.group(1)) == enum_name:
                          return path, text

              # Fallback: search for enum name anywhere.
              token = enum_name

              for path, text in helpers:

                  if token in text:
                      return path, text

              return None, None


          # --------------------------------------------------------
          # EXTRACT TEXT FROM JAVA STRING LITERALS
          # --------------------------------------------------------
          def java_strings(text):

              values = []

              pattern = re.compile(
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):

                  value = match.group(1)

                  value = value.replace('\\"', '"')
                  value = value.replace("\\n", " ")
                  value = value.replace("\\t", " ")

                  value = re.sub(r'\s+', ' ', value).strip()

                  if len(value) >= 4:
                      values.append(value)

              return values


          # --------------------------------------------------------
          # EXTRACT QUEST STEPS
          # --------------------------------------------------------
          def extract_steps(helper_text, quest_name):

              steps = []

              # ----------------------------------------------------
              # 1. Look for explicit QuestStep variable definitions.
              # ----------------------------------------------------
              variable_pattern = re.compile(
                  r'(?:private|protected|public)?\s*'
                  r'(?:final\s+)?'
                  r'(?:QuestStep|DetailedQuestStep|ConditionalStep|'
                  r'NpcStep|ObjectStep|ItemStep|WidgetStep|'
                  r'WorldPointStep|NpcStep|TileStep)'
                  r'\s+([A-Za-z0-9_]+)\s*='
              )

              variables = variable_pattern.findall(helper_text)

              # Get constructor text associated with each variable.
              for variable in variables:

                  pattern = re.compile(
                      r'\b' + re.escape(variable) +
                      r'\s*=\s*new\s+([A-Za-z0-9_]+)'
                      r'(?:Step|QuestStep)?\s*\((.*?)\);',
                      re.DOTALL
                  )

                  match = pattern.search(helper_text)

                  if not match:
                      continue

                  constructor = match.group(2)

                  strings = java_strings(constructor)

                  # Choose the longest useful string.
                  if strings:

                      useful = sorted(
                          strings,
                          key=lambda x: len(x),
                          reverse=True
                      )[0]

                      if useful not in steps:
                          steps.append(useful)

              # ----------------------------------------------------
              # 2. Look for PanelDetails titles and text.
              # ----------------------------------------------------
              panel_pattern = re.compile(
                  r'new\s+PanelDetails\s*\((.*?)\)',
                  re.DOTALL
              )

              for match in panel_pattern.finditer(helper_text):

                  content = match.group(1)
                  strings = java_strings(content)

                  if strings:

                      title = strings[0]

                      if title not in steps and len(title) >= 4:
                          steps.append(title)

              # ----------------------------------------------------
              # 3. Look for detailed quest-step descriptions.
              # ----------------------------------------------------
              detailed_pattern = re.compile(
                  r'new\s+DetailedQuestStep\s*\((.*?)\)',
                  re.DOTALL
              )

              for match in detailed_pattern.finditer(helper_text):

                  strings = java_strings(match.group(1))

                  for value in strings:

                      if len(value) >= 8 and value not in steps:
                          steps.append(value)

              # ----------------------------------------------------
              # Clean obviously irrelevant strings.
              # ----------------------------------------------------
              cleaned = []

              bad = {
                  "Quest",
                  "QuestHelper",
                  "true",
                  "false",
                  "null"
              }

              for value in steps:

                  value = value.strip()

                  if value in bad:
                      continue

                  if value.startswith("new "):
                      continue

                  if len(value) < 5:
                      continue

                  if value not in cleaned:
                      cleaned.append(value)

              return cleaned


          # --------------------------------------------------------
          # EXTRACT REQUIREMENTS
          # --------------------------------------------------------
          def extract_requirements(text):

              requirements = []

              patterns = [
                  r'new\s+QuestRequirement\s*\([^)]*?Quest(?:HelperQuest)?\.([A-Z0-9_]+)',
                  r'new\s+SkillRequirement\s*\([^;]+',
                  r'new\s+CombatLevelRequirement\s*\([^;]+'
              ]

              for pattern in patterns:

                  for match in re.finditer(pattern, text, re.DOTALL):

                      value = match.group(0)

                      value = re.sub(r'\s+', ' ', value).strip()

                      if len(value) > 10 and value not in requirements:
                          requirements.append(value[:180])

              return requirements[:30]


          # --------------------------------------------------------
          # EXTRACT ITEM REQUIREMENTS
          # --------------------------------------------------------
          def extract_items(text):

              items = []

              patterns = [
                  r'new\s+ItemRequirement\s*\((.*?)\)',
                  r'new\s+KeyringRequirement\s*\((.*?)\)'
              ]

              for pattern in patterns:

                  for match in re.finditer(pattern, text, re.DOTALL):

                      value = re.sub(
                          r'\s+',
                          ' ',
                          match.group(1)
                      ).strip()

                      if value and value not in items:
                          items.append(value[:180])

              return items[:50]


          # --------------------------------------------------------
          # EXTRACT REWARDS
          # --------------------------------------------------------
          def extract_rewards(text):

              rewards = []

              patterns = [
                  r'new\s+ExperienceReward\s*\((.*?)\)',
                  r'new\s+ItemReward\s*\((.*?)\)',
                  r'new\s+UnlockReward\s*\((.*?)\)',
                  r'new\s+QuestPointReward\s*\((.*?)\)'
              ]

              for pattern in patterns:

                  for match in re.finditer(pattern, text, re.DOTALL):

                      value = re.sub(
                          r'\s+',
                          ' ',
                          match.group(1)
                      ).strip()

                      if value and value not in rewards:
                          rewards.append(value[:180])

              return rewards[:50]


          # --------------------------------------------------------
          # GENERATE DATABASE
          # --------------------------------------------------------
          quests = extract_quests()
          helpers = load_helpers()

          print("RuneLite quest enum entries found:", len(
              extract_quests()
          ))

          print("Quest Helper Java files loaded:", len(helpers))

          database = []

          for number, quest in enumerate(quests, 1):

              enum_name = quest["enum"]
              name = quest["name"]

              print(
                  f"[{number}/{len(quests)}] {name}"
              )

              helper_path, helper_text = find_helper(
                  enum_name,
                  helpers
              )

              if helper_text:

                  steps = extract_steps(
                      helper_text,
                      name
                  )

                  requirements = extract_requirements(
                      helper_text
                  )

                  items = extract_items(
                      helper_text
                  )

                  rewards = extract_rewards(
                      helper_text
                  )

              else:

                  steps = []
                  requirements = []
                  items = []
                  rewards = []

              # ----------------------------------------------------
              # Guarantee every quest has usable built-in guide data.
              # This prevents one unusual helper from breaking the
              # entire APK build.
              # ----------------------------------------------------
              if not steps:

                  steps = [
                      f"Start the quest: {name}.",
                      "Follow the objectives shown in this walkthrough.",
                      "Complete the required objectives and return to the quest NPC.",
                      f"Finish {name} and claim your rewards."
                  ]

              database.append({
                  "id": enum_name,
                  "name": name,
                  "membership": "F2P" if enum_name in F2P else "Members",
                  "difficulty": "See quest requirements",
                  "length": "Varies",
                  "quest_points": 0,
                  "start_location": "See walkthrough",
                  "requirements": requirements,
                  "items": items,
                  "rewards": rewards,
                  "steps": steps
              })

          # --------------------------------------------------------
          # SORT ALPHABETICALLY
          # --------------------------------------------------------
          database.sort(
              key=lambda x: x["name"].lower()
          )

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------
          f2p_count = sum(
              1 for q in database
              if q["membership"] == "F2P"
          )

          members_count = sum(
              1 for q in database
              if q["membership"] == "Members"
          )

          print()
          print("======================================")
          print("QUEST DATABASE VALIDATION")
          print("======================================")
          print("Total quests:", len(database))
          print("F2P quests:", f2p_count)
          print("Members quests:", members_count)
          print("======================================")

          if len(database) != 182:
              raise SystemExit(
                  f"ERROR: Expected 182 quests, found {len(database)}"
              )

          if f2p_count != 24:
              raise SystemExit(
                  f"ERROR: Expected 24 F2P quests, found {f2p_count}"
              )

          if members_count != 158:
              raise SystemExit(
                  f"ERROR: Expected 158 Members quests, found {members_count}"
              )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print()
          print("Quest database generated:")
          print(OUTPUT_FILE)

          print()
          print("Database size:")
          print(
              os.path.getsize(OUTPUT_FILE),
              "bytes"
          )
          PYTHON

          python3 build_data/generate_quests.py

          echo
          echo "Generated quest database:"
          ls -lh app/src/main/assets/quests.json


      # ------------------------------------------------------------
      # 8. CREATE ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp build_data/quest-helper/LICENSE \
            app/src/main/assets/QUEST_HELPER_LICENSE.txt || true

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:colorAccent">#4CAF50</item>

              </style>

          </resources>
          EOF


      # ------------------------------------------------------------
      # 9. MAIN ACTIVITY
      # ------------------------------------------------------------
      - name: Create MainActivity
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests = new ArrayList<>();
              private final List<JSONObject> filtered = new ArrayList<>();

              private LinearLayout listLayout;
              private EditText searchBox;
              private Spinner filterSpinner;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();
                  buildScreen();
                  filterQuests();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open("quests.json");

                      byte[] data = new byte[input.available()];
                      input.read(data);
                      input.close();

                      String json =
                          new String(data, StandardCharsets.UTF_8);

                      JSONArray array =
                          new JSONArray(json);

                      for (int i = 0; i < array.length(); i++) {
                          quests.add(array.getJSONObject(i));
                      }

                  } catch (Exception e) {
                      Toast.makeText(
                          this,
                          "Could not load quest database",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      24, 24, 24, 16
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QuestMate");
                  title.setTextSize(30);
                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(title);

                  TextView subtitle =
                      new TextView(this);

                  subtitle.setText(
                      "OSRS Quest Guide • 182 Quests"
                  );

                  subtitle.setTextSize(15);

                  root.addView(
                      subtitle,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  searchBox =
                      new EditText(this);

                  searchBox.setHint(
                      "Search quests..."
                  );

                  searchBox.setSingleLine(true);

                  root.addView(
                      searchBox,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  filterSpinner =
                      new Spinner(this);

                  String[] filters = {
                      "All Quests",
                      "Free-to-Play",
                      "Members"
                  };

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          filters
                      );

                  filterSpinner.setAdapter(adapter);

                  root.addView(
                      filterSpinner,
                      new LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  listLayout =
                      new LinearLayout(this);

                  listLayout.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(listLayout);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  searchBox.addTextChangedListener(
                      new TextWatcher() {

                          @Override
                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after) {}

                          @Override
                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count) {

                              filterQuests();
                          }

                          @Override
                          public void afterTextChanged(
                              Editable s) {}
                      }
                  );

                  filterSpinner.setOnItemSelectedListener(
                      new AdapterView.OnItemSelectedListener() {

                          @Override
                          public void onItemSelected(
                              AdapterView<?> parent,
                              View view,
                              int position,
                              long id) {

                              filterQuests();
                          }

                          @Override
                          public void onNothingSelected(
                              AdapterView<?> parent) {}
                      }
                  );
              }

              private void filterQuests() {

                  if (listLayout == null) {
                      return;
                  }

                  filtered.clear();

                  String query =
                      searchBox == null
                          ? ""
                          : searchBox.getText()
                              .toString()
                              .toLowerCase();

                  int filter =
                      filterSpinner == null
                          ? 0
                          : filterSpinner.getSelectedItemPosition();

                  for (JSONObject quest : quests) {

                      try {

                          String name =
                              quest.getString("name");

                          String membership =
                              quest.getString("membership");

                          boolean matchesSearch =
                              query.isEmpty()
                              || name.toLowerCase()
                                  .contains(query);

                          boolean matchesFilter =
                              filter == 0
                              || (filter == 1
                                  && membership.equals("F2P"))
                              || (filter == 2
                                  && membership.equals("Members"));

                          if (matchesSearch &&
                              matchesFilter) {

                              filtered.add(quest);
                          }

                      } catch (Exception ignored) {}
                  }

                  displayQuests();
              }

              private void displayQuests() {

                  listLayout.removeAllViews();

                  for (final JSONObject quest : filtered) {

                      try {

                          LinearLayout card =
                              new LinearLayout(this);

                          card.setOrientation(
                              LinearLayout.VERTICAL
                          );

                          card.setPadding(
                              20, 18, 20, 18
                          );

                          TextView name =
                              new TextView(this);

                          name.setText(
                              quest.getString("name")
                          );

                          name.setTextSize(19);

                          name.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                          );

                          card.addView(name);

                          TextView info =
                              new TextView(this);

                          info.setText(
                              quest.getString("membership")
                          );

                          info.setTextSize(14);

                          card.addView(info);

                          card.setOnClickListener(
                              v -> {

                                  Intent intent =
                                      new Intent(
                                          MainActivity.this,
                                          QuestDetailActivity.class
                                      );

                                  intent.putExtra(
                                      "quest",
                                      quest.toString()
                                  );

                                  startActivity(intent);
                              }
                          );

                          listLayout.addView(
                              card,
                              new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                              )
                          );

                      } catch (Exception ignored) {}
                  }
              }
          }
