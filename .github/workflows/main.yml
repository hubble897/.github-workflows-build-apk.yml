      # =========================================================
      # MAIN SCREEN
      # =========================================================
      - name: Create QuestMate main screen
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                      new ArrayList<>();

              private LinearLayout list;

              private EditText search;

              private String filter = "ALL";


              private int dp(int value) {
                  return (int) (
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );
              }


              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {
                  super.onCreate(
                      savedInstanceState
                  );

                  loadQuests();

                  buildScreen();

                  refresh();
              }


              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] bytes =
                          new byte[
                              input.available()
                          ];

                      input.read(bytes);
                      input.close();

                      JSONArray array =
                          new JSONArray(
                              new String(
                                  bytes,
                                  StandardCharsets.UTF_8
                              )
                          );

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {

                          quests.add(
                              array.getJSONObject(i)
                          );
                      }

                      Collections.sort(
                          quests,
                          new Comparator<JSONObject>() {

                              @Override
                              public int compare(
                                  JSONObject a,
                                  JSONObject b
                              ) {

                                  return a
                                      .optString("name")
                                      .compareToIgnoreCase(
                                          b.optString("name")
                                      );
                              }
                          }
                      );

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }


              private TextView text(
                  String value,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(value);

                  view.setTextSize(size);

                  view.setTextColor(
                      Color.WHITE
                  );

                  view.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(10)
                  );

                  return view;
              }


              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                      Color.rgb(
                          18,
                          18,
                          18
                      )
                  );


                  TextView title =
                      text(
                          "QuestMate",
                          28
                      );

                  title.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(title);


                  TextView subtitle =
                      text(
                          "OSRS Quest Walkthroughs",
                          15
                      );

                  subtitle.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(subtitle);


                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(
                      true
                  );

                  search.setTextColor(
                      Color.WHITE
                  );

                  search.setHintTextColor(
                      Color.GRAY
                  );

                  root.addView(
                      search
                  );


                  LinearLayout filters =
                      new LinearLayout(
                          this
                      );


                  Button all =
                      new Button(this);

                  all.setText("ALL");


                  Button f2p =
                      new Button(this);

                  f2p.setText("F2P");


                  Button members =
                      new Button(this);

                  members.setText(
                      "MEMBERS"
                  );


                  filters.addView(
                      all,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );

                  filters.addView(
                      f2p,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );

                  filters.addView(
                      members,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );


                  root.addView(
                      filters
                  );


                  all.setOnClickListener(
                      v -> {
                          filter = "ALL";
                          refresh();
                      }
                  );


                  f2p.setOnClickListener(
                      v -> {
                          filter = "F2P";
                          refresh();
                      }
                  );


                  members.setOnClickListener(
                      v -> {
                          filter = "MEMBERS";
                          refresh();
                      }
                  );


                  ScrollView scroll =
                      new ScrollView(this);


                  list =
                      new LinearLayout(
                          this
                      );

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );


                  scroll.addView(
                      list
                  );


                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );


                  search.addTextChangedListener(
                      new android.text.TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after
                          ) {}

                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count
                          ) {
                              refresh();
                          }

                          public void afterTextChanged(
                              android.text.Editable s
                          ) {}
                      }
                  );


                  setContentView(root);
              }


              private void refresh() {

                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  String query =
                      search
                          .getText()
                          .toString()
                          .toLowerCase()
                          .trim();


                  for (
                      JSONObject quest :
                      quests
                  ) {

                      boolean member =
                          quest.optBoolean(
                              "members",
                              false
                          );


                      if (
                          filter.equals("F2P")
                          && member
                      ) {
                          continue;
                      }


                      if (
                          filter.equals("MEMBERS")
                          && !member
                      ) {
                          continue;
                      }


                      String name =
                          quest.optString(
                              "name"
                          );


                      if (
                          !query.isEmpty()
                          &&
                          !name
                              .toLowerCase()
                              .contains(query)
                      ) {
                          continue;
                      }


                      Button button =
                          new Button(
                              this
                          );

                      button.setText(
                          name
                      );


                      button.setOnClickListener(
                          v -> {

                              Intent intent =
                                  new Intent(
                                      MainActivity.this,
                                      QuestDetailActivity.class
                                  );

                              intent.putExtra(
                                  "questName",
                                  name
                              );

                              startActivity(
                                  intent
                              );
                          }
                      );


                      list.addView(
                          button
                      );
                  }
              }
          }
          EOF


      # =========================================================
      # QUEST DETAIL SCREEN
      # =========================================================
      - name: Create QuestMate walkthrough screen
        run: |
          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class QuestDetailActivity
              extends Activity {

              private JSONObject quest;

              private SharedPreferences progress;


              private int dp(int value) {
                  return (int) (
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );
              }


              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );

                  progress =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );


                  String name =
                      getIntent()
                          .getStringExtra(
                              "questName"
                          );


                  loadQuest(name);

                  buildScreen();
              }


              private void loadQuest(
                  String name
              ) {

                  try {

                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] bytes =
                          new byte[
                              input.available()
                          ];

                      input.read(bytes);
                      input.close();


                      JSONArray quests =
                          new JSONArray(
                              new String(
                                  bytes,
                                  StandardCharsets.UTF_8
                              )
                          );


                      for (
                          int i = 0;
                          i < quests.length();
                          i++
                      ) {

                          JSONObject candidate =
                              quests.getJSONObject(
                                  i
                              );


                          if (
                              candidate
                                  .optString("name")
                                  .equals(name)
                          ) {

                              quest =
                                  candidate;

                              return;
                          }
                      }

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }


              private TextView text(
                  String value,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(
                      value
                  );

                  view.setTextSize(
                      size
                  );

                  view.setTextColor(
                      Color.WHITE
                  );

                  view.setPadding(
                      dp(12),
                      dp(7),
                      dp(12),
                      dp(7)
                  );

                  return view;
              }


              private void heading(
                  LinearLayout root,
                  String value
              ) {

                  TextView view =
                      text(
                          value,
                          21
                      );

                  view.setTextColor(
                      Color.rgb(
                          139,
                          195,
                          74
                      )
                  );

                  root.addView(
                      view
                  );
              }


              private void field(
                  LinearLayout root,
                  String title,
                  String value
              ) {

                  if (
                      value == null
                      ||
                      value.trim().isEmpty()
                  ) {
                      return;
                  }


                  root.addView(
                      text(
                          title +
                          ": " +
                          value,
                          15
                      )
                  );
              }


              private void buildScreen() {

                  ScrollView scroll =
                      new ScrollView(this);


                  LinearLayout root =
                      new LinearLayout(
                          this
                      );

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                      Color.rgb(
                          18,
                          18,
                          18
                      )
                  );


                  scroll.addView(
                      root
                  );


                  if (quest == null) {

                      root.addView(
                          text(
                              "Quest could not be loaded.",
                              20
                          )
                      );

                      setContentView(
                          scroll
                      );

                      return;
                  }


                  root.addView(
                      text(
                          quest.optString(
                              "name"
                          ),
                          27
                      )
                  );


                  root.addView(
                      text(
                          quest.optBoolean(
                              "members",
                              false
                          )
                              ? "Members"
                              : "Free-to-play",
                          15
                      )
                  );


                  field(
                      root,
                      "Starting Location",
                      quest.optString(
                          "startLocation",
                          ""
                      )
                  );


                  field(
                      root,
                      "Starting NPC",
                      quest.optString(
                          "startingNpc",
                          ""
                      )
                  );


                  addArray(
                      root,
                      "Requirements",
                      quest.optJSONArray(
                          "requirements"
                      )
                  );


                  addArray(
                      root,
                      "Items",
                      quest.optJSONArray(
                          "items"
                      )
                  );


                  addArray(
                      root,
                      "Rewards",
                      quest.optJSONArray(
                          "rewards"
                      )
                  );


                  heading(
                      root,
                      "Walkthrough"
                  );


                  addWalkthrough(
                      root
                  );


                  setContentView(
                      scroll
                  );
              }


              private void addArray(
                  LinearLayout root,
                  String title,
                  JSONArray array
              ) {

                  if (
                      array == null
                      ||
                      array.length() == 0
                  ) {
                      return;
                  }


                  heading(
                      root,
                      title
                  );


                  for (
                      int i = 0;
                      i < array.length();
                      i++
                  ) {

                      root.addView(
                          text(
                              "• " +
                              array.optString(i),
                              15
                          )
                      );
                  }
              }


              private void addWalkthrough(
                  LinearLayout root
              ) {

                  JSONArray sections =
                      quest.optJSONArray(
                          "sections"
                      );


                  if (sections == null) {
                      return;
                  }


                  for (
                      int s = 0;
                      s < sections.length();
                      s++
                  ) {

                      JSONObject section =
                          sections.getJSONObject(
                              s
                          );


                      TextView sectionTitle =
                          text(
                              section.optString(
                                  "name",
                                  "Steps"
                              ),
                              19
                          );

                      sectionTitle.setTextColor(
                          Color.LTGRAY
                      );


                      root.addView(
                          sectionTitle
                      );


                      JSONArray steps =
                          section.optJSONArray(
                              "steps"
                          );


                      if (steps == null) {
                          continue;
                      }


                      for (
                          int i = 0;
                          i < steps.length();
                          i++
                      ) {

                          JSONObject step =
                              steps.getJSONObject(
                                  i
                              );


                          addStep(
                              root,
                              s,
                              i,
                              step
                          );
                      }
                  }
              }


              private void addStep(
                  LinearLayout root,
                  int section,
                  int index,
                  JSONObject step
              ) {

                  String id =
                      quest.optString(
                          "id"
                      );


                  String key =
                      id +
                      "_" +
                      section +
                      "_" +
                      index;


                  CheckBox box =
                      new CheckBox(this);


                  box.setText(
                      (index + 1) +
                      ". " +
                      step.optString(
                          "description"
                      )
                  );


                  box.setTextSize(
                      16
                  );


                  box.setTextColor(
                      Color.WHITE
                  );


                  box.setChecked(
                      progress.getBoolean(
                          key,
                          false
                      )
                  );


                  box.setOnCheckedChangeListener(
                      (button, checked) ->
                          progress
                              .edit()
                              .putBoolean(
                                  key,
                                  checked
                              )
                              .apply()
                  );


                  root.addView(
                      box
                  );


                  addDetails(
                      root,
                      "NPC",
                      step.optJSONArray(
                          "npcs"
                      )
                  );


                  addDetails(
                      root,
                      "Items",
                      step.optJSONArray(
                          "items"
                      )
                  );


                  addDetails(
                      root,
                      "Object",
                      step.optJSONArray(
                          "objects"
                      )
                  );


                  JSONArray points =
                      step.optJSONArray(
                          "worldpoints"
                      );


                  if (
                      points != null
                      &&
                      points.length() > 0
                  ) {

                      JSONObject point =
                          points.optJSONObject(
                              0
                          );


                      if (point != null) {

                          root.addView(
                              text(
                                  "Location: " +
                                  point.optInt("x") +
                                  ", " +
                                  point.optInt("y") +
                                  ", plane " +
                                  point.optInt("plane"),
                                  12
                              )
                          );
                      }
                  }
              }


              private void addDetails(
                  LinearLayout root,
                  String label,
                  JSONArray values
              ) {

                  if (
                      values == null
                      ||
                      values.length() == 0
                  ) {
                      return;
                  }


                  StringBuilder result =
                      new StringBuilder();


                  for (
                      int i = 0;
                      i < values.length();
                      i++
                  ) {

                      if (i > 0) {
                          result.append(
                              ", "
                          );
                      }

                      result.append(
                          values.optString(i)
                      );
                  }


                  root.addView(
                      text(
                          label +
                          ": " +
                          result,
                          12
                      )
                  );
              }
          }
          EOF


      # =========================================================
      # BUILD
      # =========================================================
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # PREPARE APK
      # =========================================================
      - name: Prepare QuestMate APK
        run: |
          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/QuestMate.apk

          test -f dist/QuestMate.apk

          echo "APK successfully created."

          ls -lh dist/QuestMate.apk


      # =========================================================
      # VERIFY APK
      # =========================================================
      - name: Verify QuestMate APK
        run: |
          echo "Checking QuestMate APK..."

          test -d dist

          test -f dist/QuestMate.apk

          echo "APK:"
          ls -lh dist/QuestMate.apk

          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # =========================================================
      # CONFIRM ARTIFACT
      # =========================================================
      - name: Confirm Artifact Upload
        run: |
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          test -n \
            "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "======================================"
          echo "QUESTMATE APK ARTIFACT UPLOAD PASSED"
          echo "======================================"
