name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # =====================================================
      # CREATE PROJECT
      # =====================================================

      - name: Create QuestMate project
        shell: bash
        run: |

          set -e

          rm -rf questmate-build
          rm -rf artifact

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p artifact

          cd questmate-build

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private LinearLayout questList;
              private EditText searchBox;

              private final List<Quest> quests = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createQuestData();
                  createInterface();
              }

              private void createQuestData() {

                  quests.add(new Quest(
                          "Cook's Assistant",
                          "F2P",
                          "Novice",
                          "Short",
                          "Lumbridge Castle",
                          "None"
                  ));

                  quests.add(new Quest(
                          "Demon Slayer",
                          "F2P",
                          "Novice",
                          "Medium",
                          "Varrock",
                          "None"
                  ));

                  quests.add(new Quest(
                          "Dragon Slayer I",
                          "F2P",
                          "Experienced",
                          "Long",
                          "Champions' Guild",
                          "32 Quest Points"
                  ));

                  quests.add(new Quest(
                          "Romeo & Juliet",
                          "F2P",
                          "Novice",
                          "Short",
                          "Varrock",
                          "None"
                  ));

                  quests.add(new Quest(
                          "The Restless Ghost",
                          "F2P",
                          "Novice",
                          "Short",
                          "Lumbridge",
                          "None"
                  ));
              }

              private void createInterface() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(18, 18, 18));

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(24, 20, 16, 20);
                  header.setBackgroundColor(Color.rgb(30, 30, 30));

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  Button minimize = new Button(this);
                  minimize.setText("MINIMIZE");

                  minimize.setOnClickListener(
                          v -> moveTaskToBack(true)
                  );

                  header.addView(minimize);
                  root.addView(header);

                  searchBox = new EditText(this);
                  searchBox.setHint("Search quests...");
                  searchBox.setHintTextColor(Color.GRAY);
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setSingleLine(true);

                  root.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  LinearLayout filters = new LinearLayout(this);
                  filters.setOrientation(LinearLayout.HORIZONTAL);

                  Button allButton = new Button(this);
                  allButton.setText("ALL");

                  Button f2pButton = new Button(this);
                  f2pButton.setText("F2P");

                  Button membersButton = new Button(this);
                  membersButton.setText("MEMBERS");

                  filters.addView(
                          allButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  filters.addView(
                          f2pButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  filters.addView(
                          membersButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  root.addView(filters);

                  ScrollView scroll = new ScrollView(this);

                  questList = new LinearLayout(this);
                  questList.setOrientation(LinearLayout.VERTICAL);
                  questList.setPadding(16, 16, 16, 30);

                  scroll.addView(questList);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1
                          )
                  );

                  setContentView(root);

                  displayQuests("");

                  searchBox.addTextChangedListener(
                          new android.text.TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {
                              }

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {
                                  displayQuests(s.toString());
                              }

                              @Override
                              public void afterTextChanged(
                                      android.text.Editable s) {
                              }
                          }
                  );

                  allButton.setOnClickListener(
                          v -> displayQuests("")
                  );

                  f2pButton.setOnClickListener(
                          v -> displayFilter("F2P")
                  );

                  membersButton.setOnClickListener(
                          v -> displayFilter("Members")
                  );
              }

              private void displayFilter(String filter) {

                  questList.removeAllViews();

                  for (Quest quest : quests) {

                      if (filter.equals("F2P")
                              && !quest.type.equals("F2P")) {
                          continue;
                      }

                      if (filter.equals("Members")
                              && !quest.type.equals("Members")) {
                          continue;
                      }

                      addQuestCard(quest);
                  }
              }

              private void displayQuests(String search) {

                  questList.removeAllViews();

                  String text = search.toLowerCase().trim();

                  for (Quest quest : quests) {

                      if (text.isEmpty()
                              || quest.name.toLowerCase().contains(text)) {
                          addQuestCard(quest);
                      }
                  }
              }

              private void addQuestCard(Quest quest) {

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(20, 18, 20, 18);
                  card.setBackgroundColor(Color.rgb(35, 35, 35));

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  params.setMargins(0, 0, 0, 16);
                  card.setLayoutParams(params);

                  TextView name = new TextView(this);
                  name.setText(quest.name);
                  name.setTextColor(Color.WHITE);
                  name.setTextSize(21);
                  name.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  card.addView(name);

                  TextView details = new TextView(this);

                  details.setText(
                          quest.type
                                  + " • "
                                  + quest.difficulty
                                  + " • "
                                  + quest.length
                                  + "\nStart: "
                                  + quest.start
                                  + "\nRequirements: "
                                  + quest.requirements
                  );

                  details.setTextColor(Color.LTGRAY);
                  details.setTextSize(15);

                  card.addView(details);

                  Button open = new Button(this);
                  open.setText("OPEN QUEST");

                  open.setOnClickListener(
                          v -> showQuestGuide(quest)
                  );

                  card.addView(open);

                  questList.addView(card);
              }

              private void showQuestGuide(Quest quest) {

                  questList.removeAllViews();

                  TextView heading = new TextView(this);
                  heading.setText(quest.name);
                  heading.setTextColor(Color.WHITE);
                  heading.setTextSize(25);
                  heading.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  questList.addView(heading);

                  TextView guide = new TextView(this);

                  guide.setText(
                          "QUEST GUIDE\n\n"
                                  + "Start: "
                                  + quest.start
                                  + "\n\n"
                                  + "Difficulty: "
                                  + quest.difficulty
                                  + "\n"
                                  + "Length: "
                                  + quest.length
                                  + "\n"
                                  + "Requirements: "
                                  + quest.requirements
                                  + "\n\n"
                                  + "STEP 1\n"
                                  + "Travel to the quest starting location.\n\n"
                                  + "STEP 2\n"
                                  + "Speak to the required NPC and begin the quest.\n\n"
                                  + "STEP 3\n"
                                  + "Follow the quest objectives.\n\n"
                                  + "STEP 4\n"
                                  + "Complete the final objective and claim your reward."
                  );

                  guide.setTextColor(Color.WHITE);
                  guide.setTextSize(17);

                  questList.addView(guide);

                  Button back = new Button(this);
                  back.setText("BACK TO QUESTS");

                  back.setOnClickListener(
                          v -> displayQuests("")
                  );

                  questList.addView(back);
              }

              private static class Quest {

                  String name;
                  String type;
                  String difficulty;
                  String length;
                  String start;
                  String requirements;

                  Quest(
                          String name,
                          String type,
                          String difficulty,
                          String length,
                          String start,
                          String requirements) {

                      this.name = name;
                      this.type = type;
                      this.difficulty = difficulty;
                      this.length = length;
                      this.start = start;
                      this.requirements = requirements;
                  }
              }
          }
          EOF

      # =====================================================
      # GRADLE
      # =====================================================

      - name: Install Gradle 8.9
        run: |
          cd questmate-build

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          mv gradle-8.9 gradle

          ./gradle/bin/gradle --version

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build APK
        run: |
          cd questmate-build

          ./gradle/bin/gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      # =====================================================
      # PREPARE APK
      # =====================================================

      - name: Prepare APK
        run: |

          set -e

          echo "Searching for APK..."

          find "$GITHUB_WORKSPACE/questmate-build" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$GITHUB_WORKSPACE/questmate-build" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" \
             "$GITHUB_WORKSPACE/artifact/QuestMate.apk"

          echo ""
          echo "APK READY:"
          ls -lh "$GITHUB_WORKSPACE/artifact/QuestMate.apk"

      # =====================================================
      # VERIFY
     
