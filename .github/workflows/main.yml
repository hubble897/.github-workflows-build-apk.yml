      # =========================================================
      # MAIN SCREEN
      # =========================================================

      - name: Create QuestMate main screen
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                      new ArrayList<>();

              private LinearLayout list;
              private EditText search;
              private String filter = "ALL";


              private int dp(int value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );
              }


              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );

                  loadQuests();
                  buildScreen();
                  refresh();
              }


              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] bytes =
                          new byte[
                              input.available()
                          ];

                      input.read(bytes);
                      input.close();

                      JSONArray array =
                          new JSONArray(
                              new String(
                                  bytes,
                                  StandardCharsets.UTF_8
                              )
                          );

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {

                          quests.add(
                              array.getJSONObject(i)
                          );
                      }

                      quests.sort(
                          Comparator.comparing(
                              q -> q.optString(
                                  "name"
                              ),
                              String.CASE_INSENSITIVE_ORDER
                          )
                      );

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }


              private TextView text(
                  String value,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);

                  view.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(10)
                  );

                  return view;
              }


              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                      Color.rgb(
                          18,
                          18,
                          18
                      )
                  );


                  TextView title =
                      text(
                          "QuestMate",
                          28
                      );

                  title.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(title);


                  TextView subtitle =
                      text(
                          "OSRS Quest Walkthroughs",
                          15
                      );

                  subtitle.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(
                      subtitle
                  );


                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(true);

                  search.setTextColor(
                      Color.WHITE
                  );

                  search.setHintTextColor(
                      Color.GRAY
                  );

                  root.addView(
                      search
                  );


                  LinearLayout filters =
                      new LinearLayout(
                          this
                      );


                  Button all =
                      new Button(this);

                  all.setText("ALL");


                  Button f2p =
                      new Button(this);

                  f2p.setText("F2P");


                  Button members =
                      new Button(this);

                  members.setText(
                      "MEMBERS"
                  );


                  filters.addView(
                      all,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );

                  filters.addView(
                      f2p,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );

                  filters.addView(
                      members,
                      new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1
                      )
                  );


                  root.addView(
                      filters
                  );


                  all.setOnClickListener(
                      v -> {
                          filter = "ALL";
                          refresh();
                      }
                  );


                  f2p.setOnClickListener(
                      v -> {
                          filter = "F2P";
                          refresh();
                      }
                  );


                  members.setOnClickListener(
                      v -> {
                          filter = "MEMBERS";
                          refresh();
                      }
                  );


                  ScrollView scroll =
                      new ScrollView(this);


                  list =
                      new LinearLayout(
                          this
                      );

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );


                  scroll.addView(
                      list
                  );


                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );


                  search.addTextChangedListener(
                      new android.text.TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after
                          ) {}

                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count
                          ) {
                              refresh();
                          }

                          public void afterTextChanged(
                              android.text.Editable s
                          ) {}
                      }
                  );


                  setContentView(root);
              }


              private void refresh() {

                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  String query =
                      search.getText()
                          .toString()
                          .toLowerCase()
                          .trim();


                  for (
                      JSONObject quest :
                      quests
                  ) {

                      boolean member =
                          quest.optBoolean(
                              "members",
                              false
                          );


                      if (
                          filter.equals("F2P")
                          && member
                      ) {
                          continue;
                      }


                      if (
                          filter.equals("MEMBERS")
                          && !member
                      ) {
                          continue;
                      }


                      String name =
                          quest.optString(
                              "name"
                          );


                      if (
                          !query.isEmpty()
                          &&
                          !name
                              .toLowerCase()
                              .contains(query)
                      ) {
                          continue;
                      }


                      Button button =
                          new Button(this);

                      button.setText(
                          name
                      );


                      button.setOnClickListener(
                          v -> {

                              Intent intent =
                                  new Intent(
                                      MainActivity.this,
                                      QuestDetailActivity.class
                                  );

                              intent.putExtra(
                                  "questName",
                                  name
                              );

                              startActivity(
                                  intent
                              );
                          }
                      );


                      list.addView(
                          button
                      );
                  }
              }
          }
