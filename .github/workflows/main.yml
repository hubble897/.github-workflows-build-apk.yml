      - name: Create QuestMate main screen
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> allQuests = new ArrayList<>();
              private final List<JSONObject> shownQuests = new ArrayList<>();

              private LinearLayout list;
              private EditText search;
              private String filter = "ALL";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();
                  buildScreen();
                  refreshList();
              }

              private void loadQuests() {
                  try {
                      InputStream input =
                              getAssets().open("quests.json");

                      byte[] bytes =
                              new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      String json =
                              new String(
                                      bytes,
                                      StandardCharsets.UTF_8
                              );

                      JSONArray array =
                              new JSONArray(json);

                      for (int i = 0; i < array.length(); i++) {
                          allQuests.add(
                                  array.getJSONObject(i)
                          );
                      }

                      Collections.sort(
                              allQuests,
                              new Comparator<JSONObject>() {
                                  @Override
                                  public int compare(
                                          JSONObject a,
                                          JSONObject b
                                  ) {
                                      return a.optString("name")
                                              .compareToIgnoreCase(
                                                      b.optString("name")
                                              );
                                  }
                              }
                      );

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              private TextView label(
                      String text,
                      int size
              ) {
                  TextView view =
                          new TextView(this);

                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);
                  view.setPadding(
                          dp(16),
                          dp(12),
                          dp(16),
                          dp(12)
                  );

                  return view;
              }

              private void buildScreen() {
                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(18, 18, 18)
                  );

                  TextView title =
                          label(
                                  "QuestMate",
                                  28
                          );

                  title.setGravity(
                          Gravity.CENTER_HORIZONTAL
                  );

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );

                  TextView subtitle =
                          label(
                                  "OSRS Quest Walkthroughs",
                                  15
                          );

                  subtitle.setGravity(
                          Gravity.CENTER_HORIZONTAL
                  );

                  root.addView(subtitle);

                  search =
                          new EditText(this);

                  search.setHint(
                          "Search quests..."
                  );

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );

                  search.setSingleLine(true);

                  search.setPadding(
                          dp(16),
                          dp(10),
                          dp(16),
                          dp(10)
                  );

                  root.addView(search);

                  LinearLayout filters =
                          new LinearLayout(this);

                  filters.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4)
                  );

                  Button all =
                          filterButton("ALL");

                  Button f2p =
                          filterButton("F2P");

                  Button members =
                          filterButton("MEMBERS");

                  filters.addView(
                          all,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  filters.addView(
                          f2p,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  filters.addView(
                          members,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  root.addView(filters);

                  all.setOnClickListener(
                          v -> {
                              filter = "ALL";
                              refreshList();
                          }
                  );

                  f2p.setOnClickListener(
                          v -> {
                              filter = "F2P";
                              refreshList();
                          }
                  );

                  members.setOnClickListener(
                          v -> {
                              filter = "MEMBERS";
                              refreshList();
                          }
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  scroll.addView(list);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  search.addTextChangedListener(
                          new TextWatcher() {
                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {
                                  refreshList();
                              }

                              @Override
                              public void afterTextChanged(
                                      Editable s
                              ) {}
                          }
                  );

                  setContentView(root);
              }

              private Button filterButton(
                      String text
              ) {
                  Button button =
                          new Button(this);

                  button.setText(text);
                  return button;
              }

              private void refreshList() {
                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  String query =
                          search == null
                                  ? ""
                                  : search.getText()
                                          .toString()
                                          .trim()
                                          .toLowerCase();

                  shownQuests.clear();

                  for (JSONObject quest :
                          allQuests) {

                      boolean member =
                              quest.optBoolean(
                                      "members",
                                      false
                              );

                      if (filter.equals("F2P")
                              && member) {
                          continue;
                      }

                      if (filter.equals("MEMBERS")
                              && !member) {
                          continue;
                      }

                      String name =
                              quest.optString("name");

                      if (!query.isEmpty()
                              && !name
                              .toLowerCase()
                              .contains(query)) {
                          continue;
                      }

                      shownQuests.add(quest);

                      Button button =
                              new Button(this);

                      button.setText(name);

                      button.setTextSize(16);

                      button.setOnClickListener(
                              v -> {
                                  Intent intent =
                                          new Intent(
                                                  MainActivity.this,
                                                  QuestDetailActivity.class
                                          );

                                  intent.putExtra(
                                          "questName",
                                          name
                                  );

                                  startActivity(intent);
                              }
                      );

                      list.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      -2
                              )
                      );
                  }
              }
          }
          EOF


