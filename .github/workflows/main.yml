name: QuestMate APK Artifact Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create test Android project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="QuestMate">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView text = new TextView(this);
                  text.setText("QuestMate APK Test");
                  text.setTextSize(30);

                  setContentView(text);
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          chmod +x gradle-8.9/bin/gradle

      - name: Build APK
        run: |
          ./gradle-8.9/bin/gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          echo "=== APK SEARCH ==="
          find . -type f -name "*.apk" -print

          echo "=== APK DETAILS ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          file app/build/outputs/apk/debug/app-debug.apk

          sha256sum app/build/outputs/apk/debug/app-debug.apk

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK
        run: |
          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/QuestMate.apk

          echo "=== DIST ==="
          ls -lah dist

          test -s dist/QuestMate.apk

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Confirm Artifact Upload
        run: |
          echo "================================"
          echo "ARTIFACT UPLOAD SUCCESSFUL"
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"
          echo "================================"

          test -n "${{ steps.upload.outputs.artifact-id }}"
