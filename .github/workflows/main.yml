name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout QuestMate
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ------------------------------------------------------------
      # DOWNLOAD CURRENT RUNELITE QUEST LIST
      # ------------------------------------------------------------
      - name: Download current quest list
        run: |
          mkdir -p source
          curl -fsSL \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o source/Quest.java

      # ------------------------------------------------------------
      # DOWNLOAD QUEST HELPER
      # ------------------------------------------------------------
      - name: Download Quest Helper source
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git quest-helper

      # ------------------------------------------------------------
      # GENERATE QUEST DATABASE
      # ------------------------------------------------------------
      - name: Generate QuestMate quest database
        shell: bash
        run: |
          cat > generate_quests.py <<'PYTHON'
          import json
          import re
          from pathlib import Path

          QUEST_FILE = Path("source/Quest.java")
          HELPER_ROOT = Path("quest-helper/src/main/java/com/questhelper/helpers/quests")
          OUTPUT = Path("generated/quests.json")

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          # Current OSRS free-to-play quests.
          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot"
          }

          # Entries in RuneLite's Quest enum which are not normal
          # main quests for the QuestMate quest list.
          EXCLUDED = {
              "Bear Your Soul",
              "Daddy's Home",
              "Curse of the Empty Lord",
              "The Enchanted Key",
              "Enter the Abyss",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "The Frozen Door",
              "Hopespear's Will",
              "His Faithful Servants",
              "Barbarian Training",
              "Vale Totems
