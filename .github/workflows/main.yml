name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK components
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Extract the QuestMate project
      - name: Extract QuestMate project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o QuestMate-Android-Prototype.zip -d project

      # 6. Locate the Android project
      - name: Locate Android project
        run: |
          echo "Looking for Gradle project..."

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo ""
            echo "Files found:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Configure Gradle properties
      - name: Configure Gradle properties
        run: |
          cd "$PROJECT_DIR"

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      # 8. Install Gradle 8.9
      - name: Install Gradle 8.9
        run: |
          cd "$PROJECT_DIR"

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          rm -rf gradle

          mv gradle-8.9 gradle

          echo "Gradle version:"
          ./gradle/bin/gradle --version

      # 9. Build the APK
      - name: Build QuestMate APK
        run: |
          cd "$PROJECT_DIR"

          ./gradle/bin/gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      # 10. Find the generated APK
      - name: Find APK
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching entire project:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            echo ""
            echo "Build output directories:"
            find "$PROJECT_DIR" -type d -name "outputs" -print || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" "$GITHUB_WORKSPACE/artifact/QuestMate.apk"

          echo ""
          echo "Copied APK:"
          ls -lh "$GITHUB_WORKSPACE/artifact/QuestMate.apk"

      # 11. Verify the APK
      - name: Verify APK
        run: |
          APK="$GITHUB_WORKSPACE/artifact/QuestMate.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: QuestMate.apk does not exist."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK")

          echo "APK size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "APK verification successful."
          file "$APK"

      # 12. Upload APK as GitHub Actions artifact
      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: ${{ github.workspace }}/artifact/QuestMate.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Final confirmation
      - name: Confirm APK
        run: |
          echo ""
          echo "=========================================="
          echo "       QUESTMATE BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE/artifact/QuestMate.apk"
          echo ""
          echo "The QuestMate-APK artifact should now"
          echo "appear at the bottom of this GitHub Actions run."
