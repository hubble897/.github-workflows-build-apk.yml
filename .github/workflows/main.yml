name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      #
      # IMPORTANT:
      # No "cache: gradle" here.
      # This prevents setup-java from looking for a missing
      # Gradle wrapper.
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 4. INSTALL ANDROID SDK
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================================
      # 5. INSTALL GRADLE 8.9
      # ==========================================================
      - name: Install Gradle 8.9
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # ==========================================================
      # 6. DOWNLOAD QUEST HELPER
      # ==========================================================
      - name: Download Quest Helper
        run: |
          rm -rf quest-helper

          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          echo "Quest Helper downloaded."

          test -d quest-helper/src/main/java

          echo "Quest Helper Java files:"
          find quest-helper/src/main/java \
            -type f \
            -name "*.java" \
            | wc -l


      # ==========================================================
      # 7. CREATE ANDROID PROJECT DIRECTORIES
      # ==========================================================
      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values


      # ==========================================================
      # 8. SETTINGS
      # ==========================================================
      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


      # ==========================================================
      # 9. ROOT BUILD
      # ==========================================================
      - name: Create build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================================
      # 10. GRADLE PROPERTIES
      # ==========================================================
      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          org.gradle.daemon=false
          EOF


      # ==========================================================
      # 11. APP BUILD
      # ==========================================================
      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


      # ==========================================================
      # 12. ANDROID MANIFEST
      # ==========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================================
      # 13. APP THEME
      # ==========================================================
      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #6A4CFF
                  </item>

                  <item name="android:navigationBarColor">
                      #111111
                  </item>

                  <item name="android:statusBarColor">
                      #111111
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 14. GENERATE QUEST DATABASE
      #
      # 182 normal quests
      # + 10 RFD subquests
      #
      # = 192 entries
      #
      # Miniquests are excluded.
      # ==========================================================
      - name: Generate QuestMate quest database
        run: |

          cat > generate_quests.py <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path


          RUNE_LITE_URL = (
              "https://raw.githubusercontent.com/"
              "runelite/runelite/master/"
              "runelite-api/src/main/java/net/runelite/api/Quest.java"
          )


          print("Downloading current RuneLite Quest.java...")

          request = urllib.request.Request(
              RUNE_LITE_URL,
              headers={
                  "User-Agent": "QuestMate-Build/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              source = response.read().decode("utf-8")


          # Current RuneLite format:
          #
          # QUEST_ENUM(123, "Quest Name"),
          #
          pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*'
              r'-?\d+\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )


          quests = pattern.findall(source)

          print(
              "RuneLite quest enum entries found:",
              len(quests)
          )


          # ========================================================
          # MINIQUESTS
          # ========================================================

          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }


          # ========================================================
          # CURRENT F2P QUESTS
          # ========================================================

          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }


          filtered = []

          for enum_name, display_name in quests:

              if display_name in MINIQUESTS:
                  continue

              filtered.append(
                  (enum_name, display_name)
              )


          print(
              "Quest entries after miniquest exclusions:",
              len(filtered)
          )


          # ========================================================
          # QUEST HELPER SOURCE
          # ========================================================

          helper_root = Path(
              "quest-helper/src/main/java"
          )

          java_files = list(
              helper_root.rglob("*.java")
          )

          print(
              "Quest Helper Java files:",
              len(java_files)
          )


          # Map QuestHelperQuest enum to Java source.
          helper_map = {}


          descriptor_pattern = re.compile(
              r'@QuestDescriptor\s*\('
              r'\s*quest\s*=\s*'
              r'QuestHelperQuest\.([A-Z0-9_]+)'
          )


          for file in java_files:

              try:
                  text = file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              matches = descriptor_pattern.findall(text)

              for enum_name in matches:
                  helper_map[enum_name] = file


          print(
              "Quest Helper descriptors found:",
              len(helper_map)
          )


          # ========================================================
          # SOURCE CLEANING
          # ========================================================

          def clean_java(text):

              text = re.sub(
                  r'/\*.*?\*/',
                  ' ',
                  text,
                  flags=re.S
              )

              text = re.sub(
                  r'//.*',
                  ' ',
                  text
              )

              return text


          def java_strings(text):

              return re.findall(
                  r'"([^"\\]*(?:\\.[^"\\]*)*)"',
                  text
              )


          # ========================================================
          # EXTRACT HELPER INFORMATION
          # ========================================================

          def extract_helper(enum_name):

              result = {
                  "found": False,
                  "file": "",
                  "steps": []
              }

              file = helper_map.get(enum_name)

              if not file:
                  return result

              result["found"] = True
              result["file"] = str(file)

              raw = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              text = clean_java(raw)

              steps = []


              # Panel text
              for match in re.finditer(
                  r'PanelDetails\s*\([^;]*',
                  text
              ):

                  block = match.group(0)

                  for value in java_strings(block):

                      value = value.strip()

                      if len(value) < 5:
                          continue

                      if value not in steps:
                          steps.append(value)


              # Common Quest Helper descriptive strings.
              patterns = [

                  r'\.addText\(\s*"([^"]+)"',

                  r'\.setText\(\s*"([^"]+)"',

                  r'\.setDescription\(\s*"([^"]+)"',

                  r'new\s+\w+Step\s*\([^;]*?"([^"]+)"',

              ]


              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text
                  ):

                      value = match.group(1).strip()

                      if len(value) < 8:
                          continue

                      if value not in steps:
                          steps.append(value)


              result["steps"] = steps[:100]

              return result


          # ========================================================
          # FALLBACK WALKTHROUGH
          # ========================================================

          def fallback_steps(name):

              return [

                  (
                      "Prepare",
                      f"Check the requirements for {name} "
                      "and prepare the required equipment."
                  ),

                  (
                      "Gather items",
                      "Collect the required quest items "
                      "before travelling."
                  ),

                  (
                      "Start the quest",
                      "Travel to the quest starting location "
                      "and speak to the starting NPC."
                  ),

                  (
                      "Follow the objectives",
                      "Complete the quest objectives in the "
                      "order described by the quest guide."
                  ),

                  (
                      "Complete tasks",
                      "Complete the required dialogue, "
                      "item, puzzle and exploration objectives."
                  ),

                  (
                      "Combat",
                      "Complete any required combat encounter "
                      "using suitable equipment and supplies."
                  ),

                  (
                      "Finish",
                      "Return to the required NPC or final "
                      "objective and complete the quest."
                  ),

                  (
                      "Rewards",
                      "Claim the quest rewards and confirm "
                      "that the quest has been completed."
                  ),

              ]


          # ========================================================
          # BUILD DATABASE
          # ========================================================

          output = []


          for index, (enum_name, name) in enumerate(
              filtered,
              start=1
          ):

              helper = extract_helper(enum_name)

              steps = []


              for i, text in enumerate(
                  helper["steps"],
                  start=1
              ):

                  steps.append({

                      "title": f"Guide step {i}",

                      "text": text

                  })


              # Reliable fallback for helpers whose source structure
              # cannot be extracted automatically.
              if len(steps) < 3:

                  steps = []

                  for i, pair in enumerate(
                      fallback_steps(name),
                      start=1
                  ):

                      title, text = pair

                      steps.append({

                          "title": title,

                          "text": text

                      })


              entry = {

                  "id": index,

                  "enum": enum_name,

                  "name": name,

                  "members": name not in F2P,

                  "type": (
                      "Recipe for Disaster"
                      if name.startswith(
                          "Recipe for Disaster"
                      )
                      else "Quest"
                  ),

                  "questPoints": 0,

                  "difficulty": "See guide",

                  "length": "See guide",

                  "startLocation": "See walkthrough",

                  "requirements": [],

                  "items": [],

                  "rewards": [],

                  "steps": steps,

                  "questHelperSource": (
                      helper["file"]
                      if helper["found"]
                      else ""
                  )

              }

              output.append(entry)


          # ========================================================
          # VALIDATION
          # ========================================================

          total = len(output)

          f2p_count = sum(
              not q["members"]
              for q in output
          )

          members_count = sum(
              q["members"]
              for q in output
          )

          rfd_count = sum(
              q["type"] == "Recipe for Disaster"
              for q in output
          )


          print("")
          print("========================================")
          print("QUESTMATE DATABASE")
          print("========================================")
          print("Total:", total)
          print("F2P:", f2p_count)
          print("Members:", members_count)
          print("RFD entries:", rfd_count)
          print("========================================")


          if total != 192:

              raise SystemExit(
                  "ERROR: Expected 192 quests, "
                  f"found {total}"
              )


          if f2p_count != 24:

              raise SystemExit(
                  "ERROR: Expected 24 F2P quests, "
                  f"found {f2p_count}"
              )


          if members_count != 168:

              raise SystemExit(
                  "ERROR: Expected 168 Members quests, "
                  f"found {members_count}"
              )


          if rfd_count != 11:

              raise SystemExit(
                  "ERROR: Expected 11 Recipe for Disaster "
                  f"entries, found {rfd_count}"
              )


          os.makedirs(
              "app/src/main/assets",
              exist_ok=True
          )


          with open(
              "app/src/main/assets/quests.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  {
                      "version": 1,

                      "total": total,

                      "f2p": f2p_count,

                      "members": members_count,

                      "recipeForDisaster": rfd_count,

                      "quests": output
                  },

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          print("")
          print(
              "Created app/src/main/assets/quests.json"
          )

          print("Quest database generated successfully.")
          PY

          python3 generate_quests.py


      # ==========================================================
      # 15. SHOW DATABASE SUMMARY
      # ==========================================================
      - name: Verify Quest Database
        run: |
          python3 - <<'PY'
          import json

          with open(
              "app/src/main/assets/quests.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("QuestMate database verified.")
          print("Total:", data["total"])
          print("F2P:", data["f2p"])
          print("Members:", data["members"])
          print(
              "Recipe for Disaster:",
              data["recipeForDisaster"]
          )

          print("")
          print("RFD entries:")

          for quest in data["quests"]:

              if quest["type"] == "Recipe for Disaster":

                  print(
                      "-",
                      quest["name"]
                  )
          PY


      # ==========================================================
      # 16. MAIN ACTIVITY
      # ==========================================================
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                      new ArrayList<>();

              private LinearLayout list;

              private EditText search;

              private String filter = "ALL";


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  loadQuests();

                  buildUi();

                  refresh();
              }


              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open(
                                      "quests.json"
                              );

                      byte[] bytes =
                              new byte[input.available()];

                      input.read(bytes);

                      input.close();

                      String json =
                              new String(bytes, "UTF-8");

                      JSONObject root =
                              new JSONObject(json);

                      JSONArray array =
                              root.getJSONArray("quests");

                      for (
                              int i = 0;
                              i < array.length();
                              i++
                      ) {

                          quests.add(
                                  array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }


              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          24,
                          24,
                          24,
                          24
                  );


                  TextView title =
                          new TextView(this);

                  title.setText("QuestMate");

                  title.setTextSize(30);

                  title.setTextColor(
                          Color.BLACK
                  );

                  root.addView(title);


                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "OSRS Quest Guide"
                  );

                  subtitle.setTextSize(16);

                  root.addView(subtitle);


                  search =
                          new EditText(this);

                  search.setHint(
                          "Search quests..."
                  );

                  root.addView(search);


                  LinearLayout filters =
                          new LinearLayout(this);

                  filters.setOrientation(
                          LinearLayout.HORIZONTAL
                  );


                  String[] names = {
                          "ALL",
                          "F2P",
                          "MEMBERS"
                  };


                  for (String name : names) {

                      Button button =
                              new Button(this);

                      button.setText(name);

                      button.setOnClickListener(
                              v -> {

                                  filter = name;

                                  refresh();
                              }
                      );

                      filters.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      0,
                                      -2,
                                      1
                              )
                      );
                  }


                  root.addView(filters);


                  list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  android.widget.ScrollView scroll =
                          new android.widget.ScrollView(
                                  this
                          );

                  scroll.addView(list);


                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {

                                  refresh();
                              }

                              public void afterTextChanged(
                                      android.text.Editable e) {}
                          }
                  );


                  setContentView(root);
              }


              private void refresh() {

                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();


                  String query =
                          search == null
                                  ? ""
                                  : search.getText()
                                      .toString()
                                      .toLowerCase();


                  for (JSONObject quest : quests) {

                      try {

                          String name =
                                  quest.getString(
                                          "name"
                                  );

                          boolean members =
                                  quest.getBoolean(
                                          "members"
                                  );


                          if (
                              !query.isEmpty()
                              &&
                              !name.toLowerCase()
                                  .contains(query)
                          ) {
                              continue;
                          }


                          if (
                              filter.equals("F2P")
                              && members
                          ) {
                              continue;
                          }


                          if (
                              filter.equals("MEMBERS")
                              && !members
                          ) {
                              continue;
                          }


                          Button button =
                                  new Button(this);

                          button.setText(name);

                          button.setGravity(
                                  Gravity.START
                                  |
                                  Gravity.CENTER_VERTICAL
                          );


                          button.setOnClickListener(
                                  v -> {

                                      Intent intent =
                                              new Intent(
                                                  MainActivity.this,
                                                  QuestDetailActivity.class
                                              );

                                      intent.putExtra(
                                          "quest",
                                          quest.toString()
                                      );

                                      startActivity(intent);
                                  }
                          );


                          list.addView(button);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ==========================================================
      # 17. QUEST DETAIL ACTIVITY
      # ==========================================================
      - name: Create QuestDetailActivity
        run: |
          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;


          public class QuestDetailActivity
                  extends Activity {


              private JSONObject quest;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );


                  try {

                      quest =
                          new JSONObject(
                              getIntent()
                                  .getStringExtra(
                                      "quest"
                                  )
                          );

                  } catch (Exception e) {

                      finish();

                      return;
                  }


                  buildUi();
              }


              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          24,
                          24,
                          24,
                          24
                  );


                  TextView title =
                          new TextView(this);


                  try {

                      title.setText(
                          quest.getString(
                              "name"
                          )
                      );

                  } catch (Exception ignored) {}


                  title.setTextSize(28);

                  title.setTextColor(
                          Color.BLACK
                  );

                  root.addView(title);


                  try {

                      boolean members =
                              quest.getBoolean(
                                  "members"
                              );


                      TextView type =
                              new TextView(this);

                      type.setText(
                          members
                              ? "Members quest"
                              : "Free-to-play quest"
                      );

                      type.setTextSize(16);

                      root.addView(type);


                      TextView difficulty =
                              new TextView(this);

                      difficulty.setText(
                          "Difficulty: "
                          +
                          quest.getString(
                              "difficulty"
                          )
                      );

                      root.addView(
                              difficulty
                      );


                      TextView length =
                              new TextView(this);

                      length.setText(
                          "Length: "
                          +
                          quest.getString(
                              "length"
                          )
                      );

                      root.addView(length);


                      TextView location =
                              new TextView(this);

                      location.setText(
                          "Start: "
                          +
                          quest.getString(
                              "startLocation"
                          )
                      );

                      root.addView(location);


                      TextView heading =
                              new TextView(this);

                      heading.setText(
                              "\nWalkthrough"
                      );

                      heading.setTextSize(22);

                      root.addView(heading);


                      JSONArray steps =
                              quest.getJSONArray(
                                  "steps"
                              );


                      String key =
                              "quest_"
                              +
                              quest.getInt("id");


                      android.content.SharedPreferences prefs =
                              getSharedPreferences(
                                  "progress",
                                  MODE_PRIVATE
                              );


                      for (
                          int i = 0;
                          i < steps.length();
                          i++
                      ) {

                          JSONObject step =
                                  steps.getJSONObject(i);


                          CheckBox check =
                                  new CheckBox(this);


                          check.setText(
                              (i + 1)
                              + ". "
                              +
                              step.getString(
                                  "title"
                              )
                              +
                              "\n"
                              +
                              step.getString(
                                  "text"
                              )
                          );


                          check.setTextSize(16);


                          boolean saved =
                              prefs.getBoolean(
                                  key + "_" + i,
                                  false
                              );


                          check.setChecked(
                                  saved
                          );


                          final int stepNumber = i;


                          check.setOnCheckedChangeListener(
                              (buttonView, isChecked) -> {

                                  prefs.edit()
                                      .putBoolean(
                                          key + "_"
                                          + stepNumber,
                                          isChecked
                                      )
                                      .apply();
                              }
                          );


                          root.addView(check);
                      }


                  } catch (Exception e) {

                      e.printStackTrace();
                  }


                  android.widget.ScrollView scroll =
                          new android.widget.ScrollView(
                                  this
                          );


                  scroll.addView(root);


                  setContentView(scroll);
              }
          }
          EOF


      # ==========================================================
      # 18. BUILD APK
      # ==========================================================
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 19. VERIFY APK
      # ==========================================================
      - name: Verify APK
        run: |

          echo "Searching for APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


          APK=$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )


          if [ -z "$APK" ]; then

              echo "ERROR: APK was not created."

              exit 1

          fi


          mkdir -p dist


          cp "$APK" \
             dist/QuestMate.apk


          echo ""
          echo "APK created successfully."

          ls -lh dist/QuestMate.apk


          echo ""
          echo "APK SHA256:"

          sha256sum \
              dist/QuestMate.apk


      # ==========================================================
      # 20. UPLOAD APK
      # ==========================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2

        with:

          name: QuestMate-APK

          path: dist/QuestMate.apk

          if-no-files-found: error

          retention-days: 30

          overwrite: true


      # ==========================================================
      # 21. FINAL CONFIRMATION
      # ==========================================================
      - name: Confirm Artifact Upload
        run: |

          echo "======================================"

          echo "QUESTMATE BUILD COMPLETE"

          echo "======================================"

          echo ""

          echo "Artifact ID:"

          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""

          echo "Artifact URL:"

          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""

          echo "Artifact SHA256:"

          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo ""

          test -n \
            "${{ steps.upload.outputs.artifact-id }}"

          echo "QuestMate APK successfully uploaded."
