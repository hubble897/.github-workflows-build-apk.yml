name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      - name: Create QuestMate folders
        run: |
          rm -rf questmate-build
          rm -f QuestMate.apk

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets


      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


      - name: Create root build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF


      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.questmate.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF


      - name: Create AndroidManifest.xml
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      - name: Create app theme
        run: |
          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #00C853
                  </item>

                  <item name="android:statusBarColor">
                      #101010
                  </item>

                  <item name="android:navigationBarColor">
                      #101010
                  </item>

              </style>

          </resources>
          EOF


      - name: Create quest database
        run: |
          python3 - <<'PY'
          import json

          quests = [
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "Imp Catcher",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampire Slayer",
              "The Corsair Curse",
              "X Marks the Spot"
          ]

          data = []

          for name in quests:
              data.append({
                  "name": name,
                  "members": False,
                  "difficulty": "Quest guide",
                  "length": "Varies",
                  "questPoints": 0,
                  "start": "See QuestMate guide",
                  "guide": [
                      "Check your requirements.",
                      "Prepare your required items.",
                      "Travel to the quest starting area.",
                      "Speak to the required NPC.",
                      "Follow the QuestMate instructions.",
                      "Complete the required objectives.",
                      "Finish the quest.",
                      "Mark the quest complete."
                  ]
              })

          with open(
              "questmate-build/app/src/main/assets/quests.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Quest database created.")
          print("Quest count:", len(data))
          PY


      - name: Create MainActivity
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private LinearLayout questList;

              private final List<Quest> quests =
                      new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  loadQuests();

                  showHome();
              }


              private void showHome() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          16,
                          16,
                          16,
                          16
                  );

                  root.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL
                  );


                  TextView title =
                          new TextView(this);

                  title.setText(
                          "QUESTMATE"
                  );

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setTextSize(
                          26
                  );


                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  70,
                                  1
                          )
                  );


                  Button minimize =
                          new Button(this);

                  minimize.setText(
                          "MINIMIZE"
                  );

                  minimize.setOnClickListener(
                          v -> moveTaskToBack(true)
                  );


                  header.addView(
                          minimize
                  );

                  root.addView(
                          header
                  );


                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "OSRS Quest Guide"
                  );

                  subtitle.setTextColor(
                          Color.LTGRAY
                  );

                  subtitle.setTextSize(
                          16
                  );

                  root.addView(
                          subtitle
                  );


                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search quests..."
                  );

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );

                  root.addView(
                          search
                  );


                  ScrollView scroll =
                          new ScrollView(this);


                  questList =
                          new LinearLayout(this);

                  questList.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  scroll.addView(
                          questList
                  );


                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {
                              }

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {

                                  refresh(
                                          s.toString()
                                  );
                              }

                              public void afterTextChanged(
                                      android.text.Editable e) {
                              }
                          }
                  );


                  setContentView(root);

                  refresh("");
              }


              private void refresh(
                      String searchText
              ) {

                  questList.removeAllViews();

                  String search =
                          searchText
                          .toLowerCase()
                          .trim();


                  for (Quest quest : quests) {

                      if (
                          !search.isEmpty()
                          &&
                          !quest.name
                              .toLowerCase()
                              .contains(search)
                      ) {
                          continue;
                      }


                      Button button =
                              new Button(this);

                      button.setText(
                              quest.name
                              + "\nF2P"
                      );


                      button.setOnClickListener(
                              v -> showQuest(quest)
                      );


                      questList.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      82
                              )
                      );
                  }
              }


              private void showQuest(
                      Quest quest
              ) {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          16,
                          16,
                          16,
                          16
                  );

                  root.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  LinearLayout top =
                          new LinearLayout(this);


                  Button back =
                          new Button(this);

                  back.setText(
                          "BACK"
                  );

                  back.setOnClickListener(
                          v -> showHome()
                  );


                  top.addView(
                          back
                  );


                  Button minimize =
                          new Button(this);

                  minimize.setText(
                          "MINIMIZE"
                  );

                  minimize.setOnClickListener(
                          v -> moveTaskToBack(true)
                  );


                  top.addView(
                          minimize
                  );


                  root.addView(
                          top
                  );


                  TextView title =
                          new TextView(this);

                  title.setText(
                          quest.name
                  );

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setTextSize(
                          25
                  );


                  root.addView(
                          title
                  );


                  TextView details =
                          new TextView(this);

                  details.setTextColor(
                          Color.LTGRAY
                  );

                  details.setTextSize(
                          16
                  );

                  details.setText(
                          "\nDifficulty: "
                          + quest.difficulty
                          + "\n\nLength: "
                          + quest.length
                          + "\n\nQuest points: "
                          + quest.questPoints
                          + "\n\nStart: "
                          + quest.start
                  );


                  root.addView(
                          details
                  );


                  TextView guideTitle =
                          new TextView(this);

                  guideTitle.setText(
                          "\nQUESTMATE GUIDE"
                  );

                  guideTitle.setTextColor(
                          Color.WHITE
                  );

                  guideTitle.setTextSize(
                          21
                  );


                  root.addView(
                          guideTitle
                  );


                  ScrollView guideScroll =
                          new ScrollView(this);


                  LinearLayout guide =
                          new LinearLayout(this);

                  guide.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  for (
                          int i = 0;
                          i < quest.guide.size();
                          i++
                  ) {

                      CheckBox check =
                              new CheckBox(this);

                      check.setText(
                              (i + 1)
                              + ". "
                              + quest.guide.get(i)
                      );

                      check.setTextColor(
                              Color.WHITE
                      );


                      String key =
                              "quest_"
                              + quest.name
                              + "_"
                              + i;


                      check.setChecked(
                              getPreferences(
                                      MODE_PRIVATE
                              ).getBoolean(
                                      key,
                                      false
                              )
                      );


                      check.setOnCheckedChangeListener(
                              (button, checked) -> {

                                  getPreferences(
                                      MODE_PRIVATE
                                  )
                                  .edit()
                                  .putBoolean(
                                      key,
                                      checked
                                  )
                                  .apply();
                              }
                      );


                      guide.addView(
                              check
                      );
                  }


                  guideScroll.addView(
                          guide
                  );


                  root.addView(
                          guideScroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


