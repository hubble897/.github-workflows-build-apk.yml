      # =========================================================
      # VALIDATE JSON
      # =========================================================
      - name: Validate quest database
        run: |
          python3 - <<'PY'
          import json

          path = "app/src/main/assets/quests.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              quests = json.load(f)

          print(
              "Quest count:",
              len(quests)
          )

          if len(quests) != 192:
              raise SystemExit(
                  "ERROR: Expected 192 quests."
              )

          total_steps = 0

          for quest in quests:

              sections = quest.get(
                  "sections",
                  []
              )

              count = sum(
                  len(
                      section.get(
                          "steps",
                          []
                      )
                  )
                  for section in sections
              )

              if count == 0:

                  raise SystemExit(
                      "ERROR: Quest has no "
                      "walkthrough: " +
                      quest.get(
                          "name",
                          "Unknown"
                      )
                  )

              total_steps += count

          print(
              "Total walkthrough steps:",
              total_steps
          )

          print(
              "Walkthrough validation PASSED."
          )
