name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # =========================================================
      # QUEST HELPER
      # =========================================================

      - name: Download Quest Helper
        run: |
          rm -rf quest-helper

          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          test -d quest-helper/src/main/java

          echo "Quest Helper downloaded."


      # =========================================================
      # RUNELITE QUEST LIST
      # =========================================================

      - name: Download RuneLite Quest definitions
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o Quest.java

          test -s Quest.java

          echo "RuneLite Quest.java downloaded."


      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================

      - name: Create Android project
        run: |
          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8BC34A</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # GENERATE QUEST DATABASE
      # =========================================================

      - name: Generate QuestMate quest database
        run: |

          cat > generate_quests.py <<'PY'
          import json
          import re
          from pathlib import Path
          from difflib import SequenceMatcher


          # =====================================================
          # QUEST LIST
          # =====================================================

          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }


          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }


          # =====================================================
          # NORMALIZATION
          # =====================================================

          def normalize(value):
              value = value.lower()
              value = value.replace("&", "and")
              value = value.replace("’", "")
              value = value.replace("'", "")
              return re.sub(r"[^a-z0-9]", "", value)


          def normalize_no_and(value):
              value = normalize(value)
              value = value.replace("and", "")
              return value


          def humanize(value):
              value = value.replace("_", " ")
              value = re.sub(r"\s+", " ", value).strip()

              words = []

              for word in value.split():

                  if word.lower() in {
                      "the",
                      "of",
                      "and",
                      "for",
                      "in",
                      "to",
                      "a"
                  }:
                      words.append(word.lower())
                  else:
                      words.append(word.capitalize())

              return " ".join(words)


          def unescape_java(value):
              try:
                  return bytes(
                      value,
                      "utf-8"
                  ).decode(
                      "unicode_escape"
                  )
              except Exception:
                  return value


          # =====================================================
          # PARENTHESIS PARSER
          # =====================================================

          def extract_balanced(text, opening):

              if opening < 0:
                  return "", opening

              depth = 0
              quote = None
              escaped = False

              for i in range(
                  opening,
                  len(text)
              ):

                  c = text[i]

                  if quote:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == quote:
                          quote = None

                      continue

                  if c == '"':
                      quote = '"'
                      continue

                  if c == "(":
                      depth += 1

                  elif c == ")":

                      depth -= 1

                      if depth == 0:
                          return (
                              text[
                                  opening + 1:i
                              ],
                              i
                          )

              return (
                  text[opening + 1:],
                  len(text)
              )


          # =====================================================
          # QUOTED JAVA STRINGS
          # =====================================================

          def quoted_strings(text):

              result = []

              for match in re.finditer(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              ):

                  value = unescape_java(
                      match.group(1)
                  )

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if value:
                      result.append(value)

              return result


          # =====================================================
          # ACTION DESCRIPTION
          # =====================================================

          ACTION_WORDS = (
              "talk",
              "speak",
              "use",
              "search",
              "open",
              "close",
              "go",
              "walk",
              "travel",
              "climb",
              "enter",
              "leave",
              "pick",
              "take",
              "get",
              "kill",
              "attack",
              "give",
              "bring",
              "wear",
              "equip",
              "dig",
              "mine",
              "cut",
              "cook",
              "smith",
              "light",
              "read",
              "pull",
              "push",
              "click",
              "bank",
              "buy",
              "sell",
              "trade",
              "drop",
              "bury",
              "drink",
              "eat",
              "cast",
              "teleport",
              "return",
              "find",
              "collect",
              "complete",
              "finish",
              "grab",
              "repair",
              "fill",
              "operate",
              "inspect",
              "defeat",
              "fight",
              "kill",
              "solve"
          )


          def action_description(strings):

              if not strings:
                  return ""

              candidates = []

              for value in strings:

                  if len(value) < 4:
                      continue

                  lower = value.lower()

                  if any(
                      word in lower
                      for word in ACTION_WORDS
                  ):
                      candidates.append(value)

              if candidates:
                  return max(
                      candidates,
                      key=len
                  )

              return max(
                  strings,
                  key=len
              )


          # =====================================================
          # IDS
          # =====================================================

          def extract_ids(text):

              result = {
                  "npcs": [],
                  "items": [],
                  "objects": []
              }

              patterns = {
                  "NpcID": "npcs",
                  "ItemID": "items",
                  "ObjectID": "objects"
              }

              for prefix, output in patterns.items():

                  for match in re.finditer(
                      rf"\b{prefix}\.([A-Z0-9_]+)",
                      text
                  ):

                      value = humanize(
                          match.group(1)
                      )

                      if value not in result[output]:
                          result[output].append(value)

              return result


          # =====================================================
          # WORLD POINTS
          # =====================================================

          def extract_points(text):

              result = []

              pattern = re.compile(
                  r"WorldPoint\s*\(\s*"
                  r"(-?\d+)\s*,\s*"
                  r"(-?\d+)\s*,\s*"
                  r"(-?\d+)\s*\)"
              )

              for match in pattern.finditer(text):

                  point = {
                      "x": int(match.group(1)),
                      "y": int(match.group(2)),
                      "plane": int(match.group(3))
                  }

                  if point not in result:
                      result.append(point)

              return result


          # =====================================================
          # STEP TYPES
          # =====================================================

          STEP_TYPES = {
              "NpcStep",
              "ObjectStep",
              "DetailedQuestStep",
              "ItemStep",
              "DigStep",
              "EmoteStep",
              "TileStep",
              "WidgetStep",
              "NpcTalkStep",
              "ConditionalStep",
              "QuestStep"
          }


          # =====================================================
          # STEP DECLARATIONS
          # =====================================================

          def parse_steps(source):

              steps = {}

              pattern = re.compile(
                  r"(?m)"
                  r"^\s*"
                  r"(?:final\s+)?"
                  r"(?:[A-Za-z_][A-Za-z0-9_<>, ?\[\]]*\s+)?"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*=\s*"
                  r"new\s+"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*\("
              )

              for match in pattern.finditer(source):

                  variable = match.group(1)
                  step_type = match.group(2)

                  if step_type not in STEP_TYPES:
                      continue

                  body, end = extract_balanced(
                      source,
                      match.end() - 1
                  )

                  strings = quoted_strings(body)

                  ids = extract_ids(body)

                  points = extract_points(body)

                  description = action_description(
                      strings
                  )

                  steps[variable] = {
                      "variable": variable,
                      "type": step_type,
                      "description": description,
                      "npcs": ids["npcs"],
                      "items": ids["items"],
                      "objects": ids["objects"],
                      "worldpoints": points
                  }

              return steps


          # =====================================================
          # PANELS
          # =====================================================

          def get_panels_body(source):

              match = re.search(
                  r"\bgetPanels\s*\(\s*\)",
                  source
              )

              if not match:
                  return ""

              opening = source.find(
                  "{",
                  match.end()
              )

              if opening < 0:
                  return ""

              depth = 0
              quote = None
              escaped = False

              for i in range(
                  opening,
                  len(source)
              ):

                  c = source[i]

                  if quote:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == quote:
                          quote = None

                      continue

                  if c == '"':
                      quote = '"'
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":

                      depth -= 1

                      if depth == 0:

                          return source[
                              opening + 1:i
                          ]

              return source[
                  opening + 1:
              ]


          def parse_panels(
              source,
              step_map
          ):

              body = get_panels_body(
                  source
              )

              if not body:
                  return []

              panels = []

              cursor = 0

              while True:

                  match = re.search(
                      r"new\s+PanelDetails\s*\(",
                      body[cursor:]
                  )

                  if not match:
                      break

                  absolute = (
                      cursor +
                      match.start()
                  )

                  opening = body.find(
                      "(",
                      absolute
                  )

                  args, end = extract_balanced(
                      body,
                      opening
                  )

                  strings = quoted_strings(
                      args
                  )

                  if strings:
                      section_name = strings[0]
                  else:
                      section_name = "Walkthrough"

                  identifiers = re.findall(
                      r"\b[A-Za-z_][A-Za-z0-9_]*\b",
                      args
                  )

                  ordered_steps = []

                  for identifier in identifiers:

                      if identifier in step_map:

                          if identifier not in ordered_steps:

                              ordered_steps.append(
                                  identifier
                              )

                  if ordered_steps:

                      panels.append({
                          "name": section_name,
                          "steps": ordered_steps
                      })

                  cursor = end + 1

              return panels


          # =====================================================
          # REQUIREMENTS
          # =====================================================

          def parse_requirements(source):

              result = []

              # Item requirements
              for match in re.finditer(
                  r'new\s+ItemRequirement\s*\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value and value not in result:
                      result.append(value)


              # Skill requirements
              for match in re.finditer(
                  r"new\s+SkillRequirement\s*\(\s*"
                  r"Skill\.([A-Z_]+)\s*,\s*"
                  r"(\d+)",
                  source
              ):

                  value = (
                      humanize(
                          match.group(1)
                      )
                      +
                      " level "
                      +
                      match.group(2)
                  )

                  if value not in result:
                      result.append(value)


              # Quest requirements
              for match in re.finditer(
                  r"new\s+QuestRequirement\s*\(\s*"
                  r"QuestHelperQuest\.([A-Z0-9_]+)",
                  source
              ):

                  value = (
                      humanize(
                          match.group(1)
                      )
                      +
                      " completed"
                  )

                  if value not in result:
                      result.append(value)


              # Quest point requirements
              for match in re.finditer(
                  r"new\s+QuestPointRequirement"
                  r"\s*\(\s*(\d+)",
                  source
              ):

                  value = (
                      "Quest points: "
                      +
                      match.group(1)
                  )

                  if value not in result:
                      result.append(value)


              # Combat requirements
              for match in re.finditer(
                  r'new\s+CombatLevelRequirement'
                  r'\s*\(\s*(\d+)',
                  source
              ):

                  value = (
                      "Combat level "
                      +
                      match.group(1)
                  )

                  if value not in result:
                      result.append(value)


              return result


          # =====================================================
          # REWARDS
          # =====================================================

          def parse_rewards(source):

              rewards = []

              # Unlock rewards
              for match in re.finditer(
                  r'new\s+UnlockReward\s*'
                  r'\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value not in rewards:
                      rewards.append(value)


              # Item rewards
              for match in re.finditer(
                  r'new\s+ItemReward\s*'
                  r'\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value not in rewards:
                      rewards.append(value)


              # Experience rewards
              for match in re.finditer(
                  r"new\s+ExperienceReward\s*"
                  r"\(\s*Skill\.([A-Z_]+)\s*,\s*"
                  r"([0-9]+)",
                  source
              ):

                  value = (
                      humanize(
                          match.group(1)
                      )
                      +
                      ": "
                      +
                      match.group(2)
                      +
                      " XP"
                  )

                  if value not in rewards:
                      rewards.append(value)


              # Quest points
              for match in re.finditer(
                  r"new\s+QuestPointReward"
                  r"\s*\(\s*(\d+)",
                  source
              ):

                  value = (
                      "Quest points: "
                      +
                      match.group(1)
                  )

                  if value not in rewards:
                      rewards.append(value)


              return rewards


          # =====================================================
          # QUEST POINTS
          # =====================================================

          def parse_quest_points(source):

              match = re.search(
                  r"new\s+QuestPointReward"
                  r"\s*\(\s*(\d+)",
                  source
              )

              if match:
                  return int(match.group(1))

              return 0


          # =====================================================
          # COMBAT REQUIREMENTS
          # =====================================================

          def parse_combat_requirements(source):

              result = []

              method = re.search(
                  r"getCombatRequirements\s*\(\s*\)",
                  source
              )

              if not method:
                  return result

              start = source.find(
                  "{",
                  method.end()
              )

              if start < 0:
                  return result

              body, _ = extract_balanced(
                  source,
                  source.rfind(
                      "(",
                      0,
                      start
                  )
              )

              strings = quoted_strings(
                  source[start:start + 5000]
              )

              for value in strings:

                  if (
                      "level" in value.lower()
                      or
                      "kill" in value.lower()
                      or
                      "combat" in value.lower()
                  ):

                      if value not in result:
                          result.append(value)

              return result


          # =====================================================
          # LOCATION
          # =====================================================

          def find_location(sections):

              patterns = [
                  r"\b(?:in|at|near|from|to|inside|outside)\s+"
                  r"([A-Z][A-Za-z0-9'’\-]*"
                  r"(?:\s+[A-Z][A-Za-z0-9'’\-]*){0,5})"
              ]

              for section in sections:

                  for step in section["steps"]:

                      text = step["description"]

                      for pattern in patterns:

                          match = re.search(
                              pattern,
                              text
                          )

                          if match:

                              value = (
                                  match.group(1)
                                  .strip(
                                      " .,;:()"
                                  )
                              )

                              if len(value) > 2:
                                  return value

              return ""


          # =====================================================
          # FIND HELPER FILES
          # =====================================================

          quest_root = Path(
              "quest-helper/src/main/java/"
              "com/questhelper/helpers/quests"
          )

          helper_files = list(
              quest_root.rglob("*.java")
          )

          print(
              "Quest Helper Java files:",
              len(helper_files)
          )


          # =====================================================
          # BUILD HELPER CANDIDATES
          # =====================================================

          candidates = []

          for path in helper_files:

              try:

                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception:

                  continue

              class_match = re.search(
                  r"\bclass\s+([A-Za-z0-9_]+)",
                  source
              )

              if not class_match:
                  continue

              class_name = class_match.group(1)

              if "getPanels" not in source:
                  continue

              if "setupSteps" not in source:
                  continue

              candidates.append({
                  "class": class_name,
                  "folder":
                      path.parent.name,
                  "path": path,
                  "source": source
              })


          print(
              "Quest Helper walkthrough classes:",
              len(candidates)
          )


          # =====================================================
          # SPECIAL MAPPINGS
          # =====================================================

          SPECIAL = {

              "Black Knights' Fortress":
                  ["BlackKnightsFortress"],

              "Desert Treasure I":
                  ["DesertTreasure"],

              "Dragon Slayer I":
                  ["DragonSlayer"],

              "Fairytale I - Growing Pains":
                  ["FairytaleI"],

              "Fairytale II - Cure a Queen":
                  ["FairytaleII"],

              "Romeo & Juliet":
                  ["RomeoAndJuliet"],

              "Shield of Arrav":
                  ["ShieldOfArrav"],

              "Recipe for Disaster - Another Cook's Quest":
                  ["RFDStart"],

              "Recipe for Disaster - Mountain Dwarf":
                  ["RFDDwarf"],

              "Recipe for Disaster - Wartface & Bentnoze":
                  ["RFDGoblins"],

              "Recipe for Disaster - Pirate Pete":
                  ["RFDPiratePete"],

              "Recipe for Disaster - Lumbridge Guide":
                  ["RFDLumbridgeGuide"],

              "Recipe for Disaster - Evil Dave":
                  ["RFDEvilDave"],

              "Recipe for Disaster - Skrach Uglogwee":
                  ["RFDSkrachUglogwee"],

              "Recipe for Disaster - Sir Amik Varze":
                  ["RFDSirAmikVarze"],

              "Recipe for Disaster - King Awowogei":
                  ["RFDAwowogei"],

              "Recipe for Disaster - Culinaromancer":
                  ["RFDFinal"],
          }


          RFD_PARENT = [
              "RFDStart",
              "RFDDwarf",
              "RFDGoblins",
              "RFDPiratePete",
              "RFDLumbridgeGuide",
              "RFDEvilDave",
              "RFDSkrachUglogwee",
              "RFDSirAmikVarze",
              "RFDAwowogei",
              "RFDFinal"
          ]


          # =====================================================
          # FIND CLASS
          # =====================================================

          def find_by_class(name):

              target = normalize(name)

              for candidate in candidates:

                  if normalize(
                      candidate["class"]
                  ) == target:

                      return candidate

              return None


          def score_candidate(
              quest_name,
              candidate
          ):

              q = normalize(
                  quest_name
              )

              class_name = normalize(
                  candidate["class"]
              )

              folder_name = normalize(
                  candidate["folder"]
              )

              q_no_and = normalize_no_and(
                  quest_name
              )

              class_no_and = normalize_no_and(
                  candidate["class"]
              )

              folder_no_and = normalize_no_and(
                  candidate["folder"]
              )

              score = 0.0

              if q == class_name:
                  score = max(
                      score,
                      1.00
                  )

              if q == folder_name:
                  score = max(
                      score,
                      1.00
                  )

              if q_no_and == class_no_and:
                  score = max(
                      score,
                      0.99
                  )

              if q_no_and == folder_no_and:
                  score = max(
                      score,
                      0.99
                  )


              # Strip common Roman numeral suffixes.
              for suffix in (
                  "i",
                  "ii"
              ):

                  if q.endswith(suffix):

                      shortened = q[
                          :-len(suffix)
                      ]

                      if (
                          shortened ==
                          folder_name
                      ):

                          score = max(
                              score,
                              0.97
                          )

                      if (
                          shortened ==
                          class_name
                      ):

                          score = max(
                              score,
                              0.97
                          )


              # Known apostrophe/plural differences.
              q2 = q.replace(
                  "knights",
                  "knight"
              )

              if q2 == folder_name:
                  score = max(
                      score,
                      0.96
                  )

              if q2 == class_name:
                  score = max(
                      score,
                      0.96
                  )


              sequence_folder = (
                  SequenceMatcher(
                      None,
                      q,
                      folder_name
                  ).ratio()
              )

              sequence_class = (
                  SequenceMatcher(
                      None,
                      q,
                      class_name
                  ).ratio()
              )

              score = max(
                  score,
                  sequence_folder * 0.90,
                  sequence_class * 0.90
              )

              return score


          def find_helper(
              quest_name,
              enum_name
          ):

              # Explicit mapping.
              if quest_name in SPECIAL:

                  for class_name in SPECIAL[
                      quest_name
                  ]:

                      candidate = find_by_class(
                          class_name
                      )

                      if candidate:
                          return [
                              candidate
                          ]


              # Recipe for Disaster parent.
              if quest_name == "Recipe for Disaster":

                  result = []

                  for class_name in RFD_PARENT:

                      candidate = find_by_class(
                          class_name
                      )

                      if candidate:
                          result.append(
                              candidate
                          )

                  if result:
                      return result


              # Exact / fuzzy normal matching.
              ranked = []

              for candidate in candidates:

                  score = max(
                      score_candidate(
                          quest_name,
                          candidate
                      ),
                      score_candidate(
                          enum_name,
                          candidate
                      )
                  )

                  ranked.append(
                      (
                          score,
                          candidate
                      )
                  )


              ranked.sort(
                  key=lambda x: x[0],
                  reverse=True
              )


              if ranked:

                  score, candidate = (
                      ranked[0]
                  )

                  if score >= 0.72:

                      return [
                          candidate
                      ]


              return []


          # =====================================================
          # READ RUNELITE QUEST LIST
          # =====================================================

          quest_source = Path(
              "Quest.java"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          )


          quest_pattern = re.compile(
              r'^\s*'
              r'([A-Z0-9_]+)'
              r'\s*\(\s*'
              r'-?\d+'
              r'\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )


          quests = []

          for match in quest_pattern.finditer(
              quest_source
          ):

              enum_name = match.group(1)
              name = match.group(2)

              if name in MINIQUESTS:
                  continue

              quests.append(
                  (
                      enum_name,
                      name
                  )
              )


          unique = []
          seen = set()

          for enum_name, name in quests:

              if name in seen:
                  continue

              seen.add(name)

              unique.append(
                  (
                      enum_name,
                      name
                  )
              )


          quests = unique


          print(
              "Quest entries found:",
              len(quests)
          )


          if len(quests) != 192:

              raise SystemExit(
                  "ERROR: Expected exactly 192 quests."
              )


          # =====================================================
          # BUILD DATABASE
          # =====================================================

          database = []

          missing_helpers = []

          missing_walkthroughs = []

          total_steps = 0

          matched_report = []


          for enum_name, quest_name in quests:

              helper_list = find_helper(
                  quest_name,
                  enum_name
              )


              if not helper_list:

                  missing_helpers.append(
                      quest_name
                  )

                  continue


              sections = []

              all_requirements = []

              all_rewards = []

              all_items = []

              all_combat = []

              starting_npc = ""

              start_location = ""

              quest_points = 0


              for helper in helper_list:

                  source = helper[
                      "source"
                  ]


                  step_map = parse_steps(
                      source
                  )


                  panels = parse_panels(
                      source,
                      step_map
                  )


                  for panel in panels:

                      section_steps = []


                      for variable in panel[
                          "steps"
                      ]:

                          step = step_map.get(
                              variable
                          )


                          if not step:
                              continue


                          if (
                              not step[
                                  "description"
                              ]
                          ):
                              continue


                          clean_step = {

                              "type":
                                  step["type"],

                              "description":
                                  step["description"],

                              "npcs":
                                  step["npcs"],

                              "items":
                                  step["items"],

                              "objects":
                                  step["objects"],

                              "worldpoints":
                                  step["worldpoints"]
                          }


                          section_steps.append(
                              clean_step
                          )


                          for item in step[
                              "items"
                          ]:

                              if item not in all_items:

                                  all_items.append(
                                      item
                                  )


                          if (
                              not starting_npc
                              and
                              step["npcs"]
                          ):

                              starting_npc = (
                                  step["npcs"][0]
                              )


                      if section_steps:

                          sections.append({

                              "name":
                                  panel["name"],

                              "steps":
                                  section_steps

                          })


                  for value in parse_requirements(
                      source
                  ):

                      if value not in all_requirements:

                          all_requirements.append(
                              value
                          )


                  for value in parse_rewards(
                      source
                  ):

                      if value not in all_rewards:

                          all_rewards.append(
                              value
                          )


                  for value in parse_combat_requirements(
                      source
                  ):

                      if value not in all_combat:

                          all_combat.append(
                              value
                          )


                  quest_points = max(
                      quest_points,
                      parse_quest_points(
                          source
                      )
                  )


                  if not start_location:

                      start_location = (
                          find_location(
                              sections
                          )
                      )


              step_count = sum(
                  len(
                      section["steps"]
                  )
                  for section in sections
              )


              total_steps += step_count


              quest = {

                  "id":
                      enum_name,

                  "name":
                      quest_name,

                  "members":
                      quest_name not in F2P,

                  "sections":
                      sections,

                  "requirements":
                      all_requirements,

                  "rewards":
                      all_rewards
              }


              if all_items:

                  quest["items"] = (
                      all_items
                  )


              if all_combat:

                  quest[
                      "combatRequirements"
                  ] = all_combat


              if starting_npc:

                  quest[
                      "startingNpc"
                  ] = starting_npc


              if start_location:

                  quest[
                      "startLocation"
                  ] = start_location


              if quest_points:

                  quest[
                      "questPoints"
                  ] = quest_points


              database.append(
                  quest
              )


              matched_report.append({

                  "quest":
                      quest_name,

                  "helpers":
                      [
                          x["class"]
                          for x in helper_list
                      ],

                  "steps":
                      step_count
              })


              if step_count == 0:

                  missing_walkthroughs.append(
                      quest_name
                  )


          # =====================================================
          # REPORT
          # =====================================================

          print("")
          print(
              "======================================"
          )
          print(
              "QUESTMATE QUEST DATABASE REPORT"
          )
          print(
              "======================================"
          )

          print(
              "Quest entries found:",
              len(quests)
          )

          print(
              "Helpers matched:",
              len(database)
          )

          print(
              "Missing helpers:",
              len(missing_helpers)
          )

          print(
              "Quests with no walkthrough:",
              len(missing_walkthroughs)
          )

          print(
              "Total walkthrough steps:",
              total_steps
          )


          if missing_helpers:

              print("")
              print(
                  "MISSING HELPERS:"
              )

              for name in missing_helpers:

                  print(
                      " -",
                      name
                  )

              raise SystemExit(
                  "ERROR: Quest Helper matching failed."
              )


          if len(database) != 192:

              raise SystemExit(
                  "ERROR: Expected 192 database entries."
              )


          if missing_walkthroughs:

              print("")
              print(
                  "MISSING WALKTHROUGHS:"
              )

              for name in missing_walkthroughs:

                  print(
                      " -",
                      name
                  )

              raise SystemExit(
                  "ERROR: One or more quests have no walkthrough."
              )


          # =====================================================
          # WRITE DATABASE
          # =====================================================

          output = Path(
              "app/src/main/assets/quests.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          output.write_text(
              json.dumps(
                  database,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # =====================================================
          # COPY QUEST HELPER LICENSE
          # =====================================================

          license_file = Path(
              "quest-helper/LICENSE"
          )


          if license_file.exists():

              Path(
                  "app/src/main/assets/"
                  "quest_helper_license.txt"
              ).write_text(
                  license_file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ),
                  encoding="utf-8"
              )


          print("")
          print(
              "======================================"
          )
          print(
              "QUEST DATABASE GENERATED SUCCESSFULLY"
          )
          print(
              "Quests:",
              len(database)
          )
          print(
              "Walkthrough steps:",
              total_steps
          )
          print(
              "======================================"
          )

