name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout QuestMate
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # DOWNLOAD CURRENT RUNELITE QUEST LIST
      # ============================================================
      - name: Download current quest list
        run: |
          mkdir -p source

          curl -fsSL \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o source/Quest.java

          test -s source/Quest.java

          echo "Downloaded RuneLite Quest.java"
          wc -l source/Quest.java

      # ============================================================
      # DOWNLOAD CURRENT QUEST HELPER
      # ============================================================
      - name: Download current Quest Helper
        run: |
          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          test -d quest-helper/src/main/java/com/questhelper/helpers/quests

          echo "Quest Helper downloaded."

      # ============================================================
      # GENERATE COMPLETE QUEST DATABASE
      # ============================================================
      - name: Generate complete QuestMate quest database
        shell: bash
        run: |

          cat > generate_quests.py <<'PYTHON'
          import json
          import re
          import sys
          from pathlib import Path

          QUEST_FILE = Path("source/Quest.java")
          HELPER_ROOT = Path(
              "quest-helper/src/main/java/com/questhelper/helpers/quests"
          )
          OUTPUT = Path("generated/quests.json")

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          # ========================================================
          # OSRS MINIQUESTS
          #
          # These are present in RuneLite's Quest enum but are not
          # part of the 182 main OSRS quests.
          # ========================================================

          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }

          # ========================================================
          # RECIPE FOR DISASTER SUB-QUESTS
          #
          # RuneLite exposes these separately, but OSRS counts
          # Recipe for Disaster as one quest.
          # ========================================================

          RFD_SUBQUESTS = {
              "Recipe for Disaster - Another Cook's Quest",
              "Recipe for Disaster - Mountain Dwarf",
              "Recipe for Disaster - Wartface & Bentnoze",
              "Recipe for Disaster - Pirate Pete",
              "Recipe for Disaster - Lumbridge Guide",
              "Recipe for Disaster - Evil Dave",
              "Recipe for Disaster - Skrach Uglogwee",
              "Recipe for Disaster - Sir Amik Varze",
              "Recipe for Disaster - King Awowogei",
              "Recipe for Disaster - Culinaromancer",
          }

          EXCLUDED = MINIQUESTS | RFD_SUBQUESTS

          # ========================================================
          # CURRENT F2P QUESTS
          # ========================================================

          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }

          # ========================================================
          # READ RUNE LITE QUEST ENUM
          # ========================================================

          quest_text = QUEST_FILE.read_text(encoding="utf-8")

          enum_pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\(\s*(\d+)\s*,\s*"((?:\\.|[^"\\])*)"\s*\)\s*,?\s*$',
              re.MULTILINE
          )

          quests = []

          def decode_java_string(value):
              value = value.replace('\\"', '"')
              value = value.replace("\\'", "'")
              value = value.replace("\\n", " ")
              value = value.replace("\\r", " ")
              value = value.replace("\\t", " ")
              value = value.replace("\\\\", "\\")
              return value

          for match in enum_pattern.finditer(quest_text):
              enum_name = match.group(1)
              quest_id = int(match.group(2))
              name = decode_java_string(match.group(3))

              if name in EXCLUDED:
                  continue

              quests.append({
                  "enum": enum_name,
                  "questId": quest_id,
                  "name": name
              })

          quests_by_enum = {
              q["enum"]: q
              for q in quests
          }

          quests_by_name = {
              q["name"]: q
              for q in quests
          }

          print(f"RuneLite quest enum entries found: {len(list(enum_pattern.finditer(quest_text)))}")
          print(f"Main OSRS quests after exclusions: {len(quests)}")

          # The current OSRS quest count is 182.
          if len(quests) != 182:
              print("ERROR: Expected 182 main quests.")
              print("Actual:", len(quests))
              print()
              print("Excluded:", sorted(EXCLUDED))
              sys.exit(1)

          # ========================================================
          # LOAD ALL QUEST HELPER JAVA SOURCE
          # ========================================================

          source_cache = []

          for java_file in HELPER_ROOT.rglob("*.java"):
              try:
                  text = java_file.read_text(encoding="utf-8")
                  source_cache.append((java_file, text))
              except Exception as exc:
                  print("Could not read", java_file, exc)

          print(f"Quest Helper Java files loaded: {len(source_cache)}")

          # ========================================================
          # JAVA PARSING HELPERS
          # ========================================================

          def find_matching(text, start, opening="{", closing="}"):
              depth = 0
              in_string = False
              escaped = False
              i = start

              while i < len(text):
                  ch = text[i]

                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == opening:
                          depth += 1
                      elif ch == closing:
                          depth -= 1

                          if depth == 0:
                              return i

                  i += 1

              return -1

          def find_method_body(text, method_name):
              pattern = re.compile(
                  r'\b' +
                  re.escape(method_name) +
                  r'\s*\([^)]*\)\s*\{'
              )

              match = pattern.search(text)

              if not match:
                  return ""

              brace_start = text.find("{", match.start())
              brace_end = find_matching(
                  text,
                  brace_start,
                  "{",
                  "}"
              )

              if brace_end == -1:
                  return ""

              return text[brace_start + 1:brace_end]

          def extract_string_literals(text):
              values = []

              pattern = re.compile(
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):
                  value = decode_java_string(match.group(1))
                  value = re.sub(r"\s+", " ", value).strip()

                  if value:
                      values.append(value)

              return values

          # ========================================================
          # FIND THE CORRECT QUEST HELPER CLASS
          # ========================================================

          def normalise_name(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  value.lower()
              )

          def find_helper(enum_name):
              token = "Quest." + enum_name

              candidates = []

              for file_path, text in source_cache:
                  if token not in text:
                      continue

                  class_match = re.search(
                      r'\bclass\s+([A-Za-z0-9_]+)\s+extends\s+',
                      text
                  )

                  class_name = (
                      class_match.group(1)
                      if class_match
                      else ""
                  )

                  score = 0

                  if normalise_name(class_name) == normalise_name(enum_name):
                      score += 100

                  if normalise_name(file_path.stem) == normalise_name(enum_name):
                      score += 80

                  if "/quests/" in str(file_path):
                      score += 10

                  candidates.append(
                      (
                          score,
                          file_path,
                          text
                      )
                  )

              if not candidates:
                  return None, None

              candidates.sort(
                  key=lambda item: item[0],
                  reverse=True
              )

              return candidates[0][1], candidates[0][2]

          # ========================================================
          # EXTRACT STEP ASSIGNMENTS
          #
          # Example:
          #
          # getEgg = new ItemStep(
          #     ...,
          #     "Grab an egg from the farm north of Lumbridge.",
          #     ...
          # );
          # ========================================================

          def extract_step_assignments(text):
              setup_steps = find_method_body(
                  text,
                  "setupSteps"
              )

              if not setup_steps:
                  return {}

              results = {}

              pattern = re.compile(
                  r'\b([A-Za-z_][A-Za-z0-9_]*)'
                  r'\s*=\s*new\s+'
                  r'([A-Za-z_][A-Za-z0-9_]*)'
                  r'\s*\('
              )

              for match in pattern.finditer(setup_steps):

                  variable = match.group(1)
                  step_class = match.group(2)

                  if not step_class.endswith("Step"):
                      continue

                  open_paren = setup_steps.find(
                      "(",
                      match.start()
                  )

                  close_paren = find_matching(
                      setup_steps,
                      open_paren,
                      "(",
                      ")"
                  )

                  if close_paren == -1:
                      continue

                  arguments = setup_steps[
                      open_paren + 1:close_paren
                  ]

                  strings = extract_string_literals(
                      arguments
                  )

                  # Pick the most useful human-readable string.
                  description = None

                  for value in strings:
                      lower = value.lower()

                      if value.startswith("http://"):
                          continue

                      if value.startswith("https://"):
                          continue

                      if len(value) < 3:
                          continue

                      if (
                          "itemid." in lower
                          or "npcid." in lower
                          or "objectid." in lower
                          or "varbitid." in lower
                      ):
                          continue

                      description = value

                      # Quest step descriptions are usually longer
                      # than dialogue fragments.
                      if len(value) >= 20:
                          break

                  if description:
                      results[variable] = {
                          "description": description,
                          "type": step_class
                      }

              return results

          # ========================================================
          # EXTRACT ORDERED PANEL STEPS
          #
          # Quest Helper organises the guide into PanelDetails.
          # We use those panels to preserve the intended order.
          # ========================================================

          def extract_panel_steps(text, step_map):
              panels_body = find_method_body(
                  text,
                  "getPanels"
              )

              if not panels_body:
                  return []

              ordered = []

              search_pos = 0

              while True:
                  match = re.search(
                      r'new\s+PanelDetails\s*\(',
                      panels_body[search_pos:]
                  )

                  if not match:
                      break

                  absolute_start = (
                      search_pos +
                      match.start()
                  )

                  open_paren = panels_body.find(
                      "(",
                      absolute_start
                  )

                  close_paren = find_matching(
                      panels_body,
                      open_paren,
                      "(",
                      ")"
                  )

                  if close_paren == -1:
                      break

                  panel_text = panels_body[
                      open_paren + 1:close_paren
                  ]

                  # Preserve the step-variable order used by
                  # List.of(...).
                  for variable in step_map:
                      if re.search(
                          r'\b' +
                          re.escape(variable) +
                          r'\b',
                          panel_text
                      ):
                          description = step_map[
                              variable
                          ]["description"]

                          if description not in ordered:
                              ordered.append(description)

                  search_pos = close_paren + 1

              return ordered

          # ========================================================
          # FALLBACK STEP ORDER
          # ========================================================

          def fallback_step_order(step_map):
              return [
                  data["description"]
                  for data in step_map.values()
              ]

          # ========================================================
          # ITEMS
          # ========================================================

          def extract_items(text):
              items = []

              pattern = re.compile(
                  r'new\s+ItemRequirement\s*\(\s*'
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):
                  value = decode_java_string(
                      match.group(1)
                  )

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if value and value not in items:
                      items.append(value)

              return items

          # ========================================================
          # SKILL REQUIREMENTS
          # ========================================================

          def extract_skill_requirements(text):
              requirements = []

              pattern = re.compile(
                  r'new\s+SkillRequirement\s*\(\s*'
                  r'Skill\.([A-Z0-9_]+)\s*,\s*(\d+)'
              )

              for match in pattern.finditer(text):
                  skill = match.group(1)
                  level = match.group(2)

                  skill = skill.replace(
                      "_",
                      " "
                  ).title()

                  value = f"{skill} {level}"

                  if value not in requirements:
                      requirements.append(value)

              # Combat level requirements
              combat_pattern = re.compile(
                  r'new\s+CombatLevelRequirement\s*\(\s*(\d+)'
              )

              for match in combat_pattern.finditer(text):
                  value = (
                      "Combat level " +
                      match.group(1)
                  )

                  if value not in requirements:
                      requirements.append(value)

              return requirements

          # ========================================================
          # QUEST REQUIREMENTS
          # ========================================================

          def extract_quest_requirements(text):
              requirements = []

              pattern = re.compile(
                  r'new\s+QuestRequirement\s*\(\s*'
                  r'Quest\.([A-Z0-9_]+)'
              )

              for match in pattern.finditer(text):
                  enum_name = match.group(1)

                  quest = quests_by_enum.get(
                      enum_name
                  )

                  if quest:
                      name = quest["name"]

                      if name not in requirements:
                          requirements.append(name)

              return requirements

          # ========================================================
          # QUEST POINT REWARD
          # ========================================================

          def extract_quest_points(text):
              match = re.search(
                  r'new\s+QuestPointReward\s*\(\s*(\d+)\s*\)',
                  text
              )

              if match:
                  return int(match.group(1))

              return 0

          # ========================================================
          # EXPERIENCE REWARDS
          # ========================================================

          def extract_xp_rewards(text):
              rewards = []

              pattern = re.compile(
                  r'new\s+ExperienceReward\s*\(\s*'
                  r'Skill\.([A-Z0-9_]+)\s*,\s*(\d+)'
              )

              for match in pattern.finditer(text):
                  skill = match.group(1).replace(
                      "_",
                      " "
                  ).title()

                  xp = match.group(2)

                  value = (
                      f"{skill}: {xp} XP"
                  )

                  if value not in rewards:
                      rewards.append(value)

              return rewards

          # ========================================================
          # UNLOCK REWARDS
          # ========================================================

          def extract_unlock_rewards(text):
              rewards = []

              pattern = re.compile(
                  r'new\s+UnlockReward\s*\(\s*'
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):
                  value = decode_java_string(
                      match.group(1)
                  )

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if value and value not in rewards:
                      rewards.append(value)

              return rewards

          # ========================================================
          # ITEM REWARDS
          # ========================================================

          def extract_item_rewards(text):
              rewards = []

              pattern = re.compile(
                  r'new\s+ItemReward\s*\(\s*'
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):
                  value = decode_java_string(
                      match.group(1)
                  )

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if value and value not in rewards:
                      rewards.append(value)

              return rewards

          # ========================================================
          # GENERAL RECOMMENDATIONS
          # ========================================================

          def extract_general_recommendations(text):
              recommendations = []

              body = find_method_body(
                  text,
                  "getGeneralRecommended"
              )

              if not body:
                  return recommendations

              for value in extract_string_literals(body):
                  if value not in recommendations:
                      recommendations.append(value)

              # Combat recommendation
              pattern = re.compile(
                  r'CombatLevelRequirement\s*\(\s*(\d+)'
              )

              for match in pattern.finditer(body):
                  value = (
                      "Combat level " +
                      match.group(1)
                  )

                  if value not in recommendations:
                      recommendations.append(value)

              return recommendations

          # ========================================================
          # BUILD EVERY QUEST
          # ========================================================

          output = []
          missing_helpers = []
          weak_guides = []

          for index, quest in enumerate(quests, start=1):

              enum_name = quest["enum"]
              name = quest["name"]

              print(
                  f"[{index}/{len(quests)}] {name}"
              )

              helper_file, helper_text = find_helper(
                  enum_name
              )

              if helper_text is None:
                  missing_helpers.append(name)

                  # Do not invent a fake walkthrough.
                  # The build will fail below if this happens.
                  continue

              step_map = extract_step_assignments(
                  helper_text
              )

              steps = extract_panel_steps(
                  helper_text,
                  step_map
              )

              if not steps:
                  steps = fallback_step_order(
                      step_map
                  )

              # Remove duplicate steps while preserving order.
              cleaned_steps = []
              seen_steps = set()

              for step in steps:
                  key = step.strip().lower()

                  if not key:
                      continue

                  if key in seen_steps:
                      continue

                  seen_steps.add(key)
                  cleaned_steps.append(step.strip())

              steps = cleaned_steps

              if len(steps) < 2:
                  weak_guides.append(name)

              items = extract_items(
                  helper_text
              )

              skills = extract_skill_requirements(
                  helper_text
              )

              quest_requirements = (
                  extract_quest_requirements(
                      helper_text
                  )
              )

              all_requirements = []

              for value in skills + quest_requirements:
                  if value not in all_requirements:
                      all_requirements.append(value)

              quest_points = extract_quest_points(
                  helper_text
              )

              rewards = []

              for value in extract_xp_rewards(
                  helper_text
              ):
                  if value not in rewards:
                      rewards.append(value)

              for value in extract_unlock_rewards(
                  helper_text
              ):
                  if value not in rewards:
                      rewards.append(value)

              for value in extract_item_rewards(
                  helper_text
              ):
                  if value not in rewards:
                      rewards.append(value)

              recommendations = (
                  extract_general_recommendations(
                      helper_text
                  )
              )

              helper_relative = str(
                  helper_file.relative_to(
                      Path("quest-helper")
                  )
              )

              # The first guide step is also useful as a
              # self-contained starting instruction.
              starting_instruction = (
                  steps[0]
                  if steps
                  else "Start the quest and follow the walkthrough."
              )

              output.append({
                  "id": enum_name,
                  "questId": quest["questId"],
                  "name": name,
                  "members": name not in F2P,
                  "questPoints": quest_points,
                  "difficulty": "See guide",
                  "length": "See guide",
                  "start": starting_instruction,
                  "requirements": all_requirements,
                  "items": items,
                  "recommended": recommendations,
                  "rewards": rewards,
                  "steps": steps,
                  "source": "Quest Helper",
                  "sourceFile": helper_relative
              })

          # ========================================================
          # VALIDATION
          # ========================================================

          if missing_helpers:
              print()
              print("ERROR: Quest Helper files were not found for:")
              for name in missing_helpers:
                  print(" -", name)

              sys.exit(1)

          if len(output) != 182:
              print()
              print(
                  "ERROR: Generated quest count is",
                  len(output),
                  "instead of 182."
              )

              sys.exit(1)

          # We expect almost every helper to have multiple
          # human-readable steps.
          if len(weak_guides) > 10:
              print()
              print(
                  "ERROR: Too many quests have weak walkthroughs."
              )

              for name in weak_guides:
                  print(" -", name)

              sys.exit(1)

          output.sort(
              key=lambda q: q["name"].lower()
          )

          OUTPUT.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ========================================================
          # DATABASE SUMMARY
          # ========================================================

          f2p_count = sum(
              1
              for q in output
              if not q["members"]
          )

          members_count = sum(
              1
              for q in output
              if q["members"]
          )

          step_count = sum(
              len(q["steps"])
              for q in output
          )

          print()
          print("==========================================")
          print("QUESTMATE DATABASE COMPLETE")
          print("==========================================")
          print("Total quests:", len(output))
          print("F2P quests:", f2p_count)
          print("Members quests:", members_count)
          print("Total walkthrough steps:", step_count)
          print("Output:", OUTPUT)
          print("==========================================")

          if f2p_count != 24:
              raise SystemExit(
                  f"Expected 24 F2P quests, got {f2p_count}"
              )

          if members_count != 158:
              raise SystemExit(
                  f"Expected 158 Members quests, got {members_count}"
              )

          if step_count < 1000:
              raise SystemExit(
                  "Generated walkthrough database is suspiciously small."
              )
          PYTHON

          python3 generate_quests.py

          echo ""
          echo "Quest database file:"
          ls -lh generated/quests.json

          echo ""
          echo "Quest count:"
          python3 - <<'PY'
          import json

          with open(
              "generated/quests.json",
              encoding="utf-8"
          ) as f:
              quests = json.load(f)

          print("Total:", len(quests))
          print(
              "F2P:",
              sum(1 for q in quests if not q["members"])
          )
          print(
              "Members:",
              sum(1 for q in quests if q["members"])
          )
          print(
              "Steps:",
              sum(len(q["steps"]) for q in quests)
          )
          PY

      # ============================================================
      # CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          mkdir -p dist

      # ============================================================
      # SETTINGS
      # ============================================================
      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF

      # ============================================================
      # ROOT BUILD
      # ============================================================
      - name: Create build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
