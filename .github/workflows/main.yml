      # ============================================================
      # QUEST LIST ACTIVITY
      # ============================================================
      - name: Create QuestActivity.java
        run: |
          cat > app/src/main/java/com/questmate/app/QuestActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;

          public class QuestActivity extends Activity {

              private final ArrayList<JSONObject> allQuests =
                  new ArrayList<>();

              private final ArrayList<JSONObject> visibleQuests =
                  new ArrayList<>();

              private final ArrayList<String> names =
                  new ArrayList<>();

              private ArrayAdapter<String> adapter;

              private EditText search;

              private String filter = "ALL";

              private int dp(float value) {
                  return (int) (
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(12),
                      dp(12),
                      dp(12),
                      0
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "OSRS Quests"
                  );

                  title.setTextSize(27);

                  title.setPadding(
                      0,
                      0,
                      0,
                      dp(10)
                  );

                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(true);

                  LinearLayout filters =
                      new LinearLayout(this);

                  filters.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  Button all =
                      new Button(this);

                  Button f2p =
                      new Button(this);

                  Button members =
                      new Button(this);

                  all.setText("ALL");
                  f2p.setText("F2P");
                  members.setText("MEMBERS");

                  filters.addView(
                      all,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(50),
                          1
                      )
                  );

                  filters.addView(
                      f2p,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(50),
                          1
                      )
                  );

                  filters.addView(
                      members,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(50),
                          1
                      )
                  );

                  ListView list =
                      new ListView(this);

                  adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_list_item_1,
                          names
                      );

                  list.setAdapter(adapter);

                  all.setOnClickListener(v -> {
                      filter = "ALL";
                      refresh();
                  });

                  f2p.setOnClickListener(v -> {
                      filter = "F2P";
                      refresh();
                  });

                  members.setOnClickListener(v -> {
                      filter = "MEMBERS";
                      refresh();
                  });

                  search.addTextChangedListener(
                      new TextWatcher() {

                          @Override
                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after
                          ) {
                          }

                          @Override
                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count
                          ) {
                              refresh();
                          }

                          @Override
                          public void afterTextChanged(
                              Editable s
                          ) {
                          }
                      }
                  );

                  list.setOnItemClickListener(
                      (parent, view, position, id) -> {

                          JSONObject quest =
                              visibleQuests.get(position);

                          android.content.Intent intent =
                              new android.content.Intent(
                                  QuestActivity.this,
                                  QuestDetailActivity.class
                              );

                          intent.putExtra(
                              "quest",
                              quest.toString()
                          );

                          startActivity(intent);
                      }
                  );

                  root.addView(title);

                  root.addView(search);

                  root.addView(filters);

                  root.addView(
                      list,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  refresh();
              }

              private void loadQuests() {
                  try {
                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] data =
                          new byte[input.available()];

                      int total = 0;

                      while (
                          total < data.length
                      ) {
                          int read =
                              input.read(
                                  data,
                                  total,
                                  data.length - total
                              );

                          if (read == -1) {
                              break;
                          }

                          total += read;
                      }

                      input.close();

                      String json =
                          new String(
                              data,
                              StandardCharsets.UTF_8
                          );

                      JSONArray array =
                          new JSONArray(json);

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {
                          allQuests.add(
                              array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void refresh() {
                  visibleQuests.clear();
                  names.clear();

                  String query =
                      search == null
                          ? ""
                          : search
                              .getText()
                              .toString()
                              .trim()
                              .toLowerCase();

                  for (
                      JSONObject quest :
                      allQuests
                  ) {
                      try {

                          boolean membersQuest =
                              quest.optBoolean(
                                  "members"
                              );

                          if (
                              filter.equals("F2P") &&
                              membersQuest
                          ) {
                              continue;
                          }

                          if (
                              filter.equals("MEMBERS") &&
                              !membersQuest
                          ) {
                              continue;
                          }

                          String name =
                              quest.optString(
                                  "name"
                              );

                          if (
                              !query.isEmpty() &&
                              !name
                                  .toLowerCase()
                                  .contains(query)
                          ) {
                              continue;
                          }

                          visibleQuests.add(
                              quest
                          );

                          names.add(
                              name
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  if (adapter != null) {
                      adapter.notifyDataSetChanged();
                  }
              }
          }
          EOF

      # ============================================================
      # QUEST DETAIL ACTIVITY
      # ============================================================
      - name: Create QuestDetailActivity.java
        run: |
          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.ScrollView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;

              private android.content.SharedPreferences prefs;

              private int dp(float value) {
                  return (int) (
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      String questJson =
                          getIntent().getStringExtra(
                              "quest"
                          );

                      quest =
                          new JSONObject(
                              questJson
                          );

                  } catch (Exception e) {
                      finish();
                      return;
                  }

                  prefs =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(16),
                      dp(16),
                      dp(16),
                      dp(24)
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      quest.optString(
                          "name"
                      )
                  );

                  title.setTextSize(27);

                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  title.setPadding(
                      0,
                      0,
                      0,
                      dp(12)
                  );

                  root.addView(title);

                  boolean members =
                      quest.optBoolean(
                          "members"
                      );

                  String type =
                      members
                          ? "Members quest"
                          : "Free-to-play quest";

                  TextView summary =
                      new TextView(this);

                  summary.setText(
                      type +
                      "\nQuest Points: " +
                      quest.optInt(
                          "questPoints"
                      )
                  );

                  summary.setTextSize(17);

                  summary.setPadding(
                      0,
                      0,
                      0,
                      dp(12)
                  );

                  root.addView(summary);

                  addSection(
                      root,
                      "Requirements",
                      quest.optJSONArray(
                          "requirements"
                      )
                  );

                  addSection(
                      root,
                      "Items",
                      quest.optJSONArray(
                          "items"
                      )
                  );

                  addSection(
                      root,
                      "Recommended",
                      quest.optJSONArray(
                          "recommended"
                      )
                  );

                  addSection(
                      root,
                      "Rewards",
                      quest.optJSONArray(
                          "rewards"
                      )
                  );

                  TextView startHeading =
                      heading(
                          "Starting guide"
                      );

                  root.addView(
                      startHeading
                  );

                  TextView start =
                      new TextView(this);

                  start.setText(
                      quest.optString(
                          "start"
                      )
                  );

                  start.setTextSize(16);

                  start.setPadding(
                      0,
                      0,
                      0,
                      dp(16)
                  );

                  root.addView(start);

                  TextView walkthrough =
                      heading(
                          "Step-by-step walkthrough"
                      );

                  root.addView(
                      walkthrough
                  );

                  JSONArray steps =
                      quest.optJSONArray(
                          "steps"
                      );

                  if (steps != null) {

                      for (
                          int i = 0;
                          i < steps.length();
                          i++
                      ) {

                          CheckBox box =
                              new CheckBox(
                                  this
                              );

                          box.setText(
                              "Step " +
                              (i + 1) +
                              "\n" +
                              steps.optString(i)
                          );

                          box.setTextSize(16);

                          box.setPadding(
                              0,
                              dp(5),
                              0,
                              dp(5)
                          );

                          String key =
                              quest.optString(
                                  "id"
                              ) +
                              "_step_" +
                              i;

                          box.setChecked(
                              prefs.getBoolean(
                                  key,
                                  false
                              )
                          );

                          box.setOnCheckedChangeListener(
                              (buttonView, checked) ->
                                  prefs.edit()
                                      .putBoolean(
                                          key,
                                          checked
                                      )
                                      .apply()
                          );

                          root.addView(box);
                      }
                  }

                  TextView attribution =
                      new TextView(this);

                  attribution.setText(
                      "\nQuest walkthrough data is derived " +
                      "from the open-source Quest Helper project."
                  );

                  attribution.setTextSize(12);

                  attribution.setPadding(
                      0,
                      dp(24),
                      0,
                      0
                  );

                  root.addView(
                      attribution
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private TextView heading(
                  String text
              ) {
                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(21);

                  view.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  view.setPadding(
                      0,
                      dp(12),
                      0,
                      dp(7)
                  );

                  return view;
              }

              private void addSection(
                  LinearLayout root,
                  String title,
                  JSONArray values
              ) {

                  if (
                      values == null ||
                      values.length() == 0
                  ) {
                      return;
                  }

                  root.addView(
                      heading(title)
                  );

                  for (
                      int i = 0;
                      i < values.length();
                      i++
                  ) {

                      TextView item =
                          new TextView(this);

                      item.setText(
                          "• " +
                          values.optString(i)
                      );

                      item.setTextSize(16);

                      item.setPadding(
                          dp(4),
                          dp(3),
                          0,
                          dp(3)
                      );

                      root.addView(item);
                  }
              }
          }
          EOF

      # ============================================================
      # QUEST HELPER LICENSE / ATTRIBUTION
      # ============================================================
      - name: Verify Quest Helper attribution files
        run: |
          test -f \
            app/src/main/assets/QUEST_HELPER_LICENSE.txt

          echo "Quest Helper BSD license included."

      # ============================================================
      # INSTALL GRADLE 8.9
      # ============================================================
      - name: Install Gradle 8.9
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully built."

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # PREPARE APK
      # ============================================================
      - name: Prepare APK
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/QuestMate.apk

          test -f dist/QuestMate.apk

          echo "QuestMate APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/QuestMate.apk

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      # ============================================================
      # FINAL ARTIFACT CHECK
      # ============================================================
      - name: Confirm Artifact Upload
        run: |
          echo "=========================================="
          echo "QUESTMATE BUILD COMPLETE"
          echo "=========================================="

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          test -n \
            "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "QuestMate APK artifact uploaded successfully."
          echo "=========================================="
