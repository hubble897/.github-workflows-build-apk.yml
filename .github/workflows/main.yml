name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # ANDROID
      # --------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # --------------------------------------------------
      # CREATE PROJECT FOLDERS
      # --------------------------------------------------

      - name: Create QuestMate project
        run: |
          rm -rf questmate-build

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets


      # --------------------------------------------------
      # SETTINGS.GRADLE
      # --------------------------------------------------

      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


      # --------------------------------------------------
      # ROOT BUILD.GRADLE
      # --------------------------------------------------

      - name: Create root build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # --------------------------------------------------
      # GRADLE PROPERTIES
      # --------------------------------------------------

      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # --------------------------------------------------
      # APP BUILD.GRADLE
      # --------------------------------------------------

      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


      # --------------------------------------------------
      # STRINGS
      # --------------------------------------------------

      - name: Create strings.xml
        run: |
          cat > questmate-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF


      # --------------------------------------------------
      # STYLES
      # --------------------------------------------------

      - name: Create styles.xml
        run: |
          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #49D17D
                  </item>

                  <item name="android:statusBarColor">
                      #10141C
                  </item>

                  <item name="android:navigationBarColor">
                      #10141C
                  </item>

              </style>

          </resources>
          EOF


      # --------------------------------------------------
      # ANDROID MANIFEST
      # --------------------------------------------------

      - name: Create AndroidManifest.xml
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet for future OSRS features -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <!-- Floating overlay permission -->
              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <!-- Foreground service -->
              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <!-- Android 14+ special-use foreground service -->
              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <!-- Main QuestMate screen -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <!-- Floating overlay service -->
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="QuestMate floating OSRS quest overlay" />

                  </service>

              </application>

          </manifest>
          EOF


      # --------------------------------------------------
      # MAIN ACTIVITY
      # --------------------------------------------------

      - name: Create MainActivity.java
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android
