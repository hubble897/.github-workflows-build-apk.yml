                          0,
                          dp(50)
                      );


                      content.addView(
                          complete
                      );


                      // ------------------------------------------------
                      // SHOW SCREEN
                      // ------------------------------------------------

                      setContentView(
                          root
                      );


                      detailScroll.post(
                          () ->
                              detailScroll.fullScroll(
                                  View.FOCUS_UP
                              )
                      );


                  } catch (
                      Exception e
                  ) {

                      TextView error =
                          new TextView(
                              this
                          );


                      error.setText(
                          "Could not open this quest.\n\n"
                          + e.getMessage()
                      );


                      error.setTextSize(
                          18
                      );


                      error.setPadding(
                          dp(20),
                          dp(20),
                          dp(20),
                          dp(20)
                      );


                      setContentView(
                          error
                      );
                  }
              }


              // ====================================================
              // ARRAY SECTION
              // ====================================================

              private void addArraySection(
                  LinearLayout page,
                  String heading,
                  JSONArray array
              ) {

                  if (
                      array == null
                      ||
                      array.length() == 0
                  ) {

                      return;
                  }


                  TextView title =
                      new TextView(
                          this
                      );


                  title.setText(
                      heading
                  );


                  title.setTextSize(
                      20
                  );


                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );


                  title.setPadding(
                      0,
                      dp(15),
                      0,
                      dp(5)
                  );


                  page.addView(
                      title
                  );


                  for (
                      int i = 0;
                      i < array.length();
                      i++
                  ) {

                      TextView item =
                          new TextView(
                              this
                          );


                      item.setText(
                          "• "
                          + array.optString(
                              i
                          )
                      );


                      item.setTextSize(
                          16
                      );


                      item.setPadding(
                          0,
                          dp(3),
                          0,
                          dp(3)
                      );


                      page.addView(
                          item
                      );
                  }
              }
          }

          EOF


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build QuestMate APK
        run: |

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # PREPARE APK
      # ============================================================

      - name: Prepare APK
        run: |

          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/QuestMate.apk


          test -s \
            dist/QuestMate.apk


          echo "APK:"
          ls -lh \
            dist/QuestMate.apk


          echo
          echo "SHA256:"
          sha256sum \
            dist/QuestMate.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:

          name: QuestMate-APK

          path: dist/QuestMate.apk

          if-no-files-found: error

          retention-days: 30

          overwrite: true


      # ============================================================
      # CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm QuestMate Artifact
        run: |

          echo
          echo "=========================================="
          echo "QUESTMATE BUILD COMPLETE"
          echo "=========================================="

          echo
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo

          test -n \
            "${{ steps.upload.outputs.artifact-id }}"

          echo "QuestMate APK successfully uploaded."
