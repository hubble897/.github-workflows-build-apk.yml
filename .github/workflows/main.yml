name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create project folders
        run: |
          rm -rf questmate-build
          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets

      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '6.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create Android resources
        run: |
          cat > questmate-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF

          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#49D17D</item>
                  <item name="android:navigationBarColor">#10141C</item>
                  <item name="android:statusBarColor">#10141C</item>
              </style>
          </resources>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="QuestMate floating quest companion overlay" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private LinearLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(20, 15, 20, 15);
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setAllCaps(false);
                  return b;
              }

              private void showHome() {

                  ScrollView scroll = new ScrollView(this);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16, 16, 16, 16);
                  root.setBackgroundColor(
                      Color.rgb(16, 20, 28)
                  );

                  scroll.addView(root);
                  setContentView(scroll);

                  TextView title =
                      text("QUESTMATE", 30);

                  title.setTypeface(
                      Typeface.DEFAULT_BOLD
                  );

                  root.addView(title);

                  root.addView(
                      text(
                          "OSRS Quest Companion",
                          18
                      )
                  );

                  root.addView(
                      text(
                          "Quest walkthroughs and floating overlay",
                          16
                      )
                  );

                  Button overlay =
                      button("START QUESTMATE OVERLAY");

                  overlay.setOnClickListener(
                      v -> startOverlay()
                  );

                  root.addView(overlay);

                  Button permission =
                      button(
                          "OVERLAY PERMISSION SETTINGS"
                      );

                  permission.setOnClickListener(
                      v -> openOverlaySettings()
                  );

                  root.addView(permission);

                  root.addView(
                      text(
                          "Overlay features:",
                          20
                      )
                  );

                  root.addView(
                      text(
                          "• Floating QuestMate window\n" +
                          "• Works over other apps\n" +
                          "• Minimise to a small Q button\n" +
                          "• Tap Q to maximise\n" +
                          "• Move the overlay around the screen\n" +
                          "• Close the overlay when finished",
                          16
                      )
                  );
              }

              private void openOverlaySettings() {

                  Intent intent =
                      new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse(
                              "package:" + getPackageName()
                          )
                      );

                  startActivity(intent);
              }

              private void startOverlay() {

                  if (!Settings.canDrawOverlays(this)) {

                      openOverlaySettings();

                      Toast.makeText(
                          this,
                          "Allow QuestMate to display over other apps.",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  Intent service =
                      new Intent(
                          this,
                          OverlayService.class
                      );

                  service.putExtra(
                      "quest",
                      "QuestMate"
                  );

                  service.putExtra(
                      "step",
                      "Choose an OSRS quest to begin."
                  );

                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  Toast.makeText(
                      this,
                      "QuestMate overlay started.",
                      Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

      - name: Create OverlayService.java
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/OverlayService.java <<'EOF'
          package com.questmate.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;

          import android.content.Intent;

          import android.graphics.Color;
          import android.graphics.PixelFormat;

          import android.os.Build;
          import android.os.IBinder;

          import android.provider.Settings;

          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager windowManager;
              private LinearLayout panel;

              private String questName =
                  "QuestMate";

              private String currentStep =
                  "Choose an OSRS quest to begin.";

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  Notification notification =
                      new Notification.Builder(
                          this,
                          "questmate_overlay"
                      )
                      .setContentTitle("QuestMate")
                      .setContentText(
                          "QuestMate overlay is running"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )
                      .setOngoing(true)
                      .build();

                  startForeground(
                      1001,
                      notification
                  );

                  showOverlay();
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "questmate_overlay",
                              "QuestMate Overlay",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      manager.createNotificationChannel(
                          channel
                      );
                  }
              }

              private Button makeButton(String value) {

                  Button b = new Button(this);
                  b.setText(value);
                  b.setAllCaps(false);
                  return b;
              }

              private TextView makeText(
                  String value,
                  int size) {

                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(
                      16,
                      12,
                      16,
                      12
                  );

                  return t;
              }

              private WindowManager.LayoutParams
              getParams() {

                  int type;

                  if (Build.VERSION.SDK_INT >= 26) {
                      type =
                          WindowManager.LayoutParams
                              .TYPE_APPLICATION_OVERLAY;
                  } else {
                      type =
                          WindowManager.LayoutParams
                              .TYPE_PHONE;
                  }

                  return new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams
                          .FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
              }

              private void showOverlay() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                      (WindowManager)
                          getSystemService(
                              WINDOW_SERVICE
                          );

                  panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                      10,
                      10,
                      10,
                      10
                  );

                  panel.setBackgroundColor(
                      Color.rgb(27, 35, 48)
                  );

                  buildMaximized();

                  WindowManager.LayoutParams params =
                      getParams();

                  params.gravity =
                      Gravity.TOP | Gravity.START;

                  params.x = 30;
                  params.y = 180;

                  windowManager.addView(
                      panel,
                      params
                  );
              }

              private void buildMaximized() {

                  panel.removeAllViews();

                  panel.addView(
                      makeText(
                          "QUESTMATE",
                          22
                      )
                  );

                  panel.addView(
                      makeText(
                          questName,
                          18
                      )
                  );

                  panel.addView(
                      makeText(
                          currentStep,
                          16
                      )
                  );

                  Button next =
                      makeButton("NEXT STEP");

                  next.setOnClickListener(
                      v -> {

                          currentStep =
                              "Continue with your quest.";

                          buildMaximized();
                      }
                  );

                  panel.addView(next);

                  Button minimise =
                      makeButton("MINIMISE");

                  minimise.setOnClickListener(
                      v -> buildMinimized()
                  );

                  panel.addView(minimise);

                  Button close =
                      makeButton("CLOSE OVERLAY");

                  close.setOnClickListener(
                      v -> stopSelf()
                  );

                  panel.addView(close);
              }

              private void buildMinimized() {

                  panel.removeAllViews();

                  Button q =
                      makeButton("Q");

                  q.setTextSize(24);

                  q.setTextColor(Color.BLACK);

                  q.setBackgroundColor(
                      Color.rgb(73, 209, 125)
                  );

                  q.setOnClickListener(
                      v -> buildMaximized()
                  );

                  panel.addView(q);

                  WindowManager.LayoutParams params =
                      (WindowManager.LayoutParams)
                          panel.getLayoutParams();

                  params.width = 150;
                  params.height = 150;

                  windowManager.updateViewLayout(
                      panel,
                      params
                  );
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId) {

                  if (intent != null) {

                      String q =
                          intent.getStringExtra(
                              "quest"
                          );

                      String s =
                          intent.getStringExtra(
                              "step"
                          );

                      if (q != null) {
                          questName = q;
                      }

                      if (s != null) {
                          currentStep = s;
                      }
                  }

                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {

                  if (panel != null &&
                      windowManager != null) {

                      try {
                          windowManager.removeView(
                              panel
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  s
