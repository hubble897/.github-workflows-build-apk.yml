          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;
              private SharedPreferences progress;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  progress =
                          getSharedPreferences(
                                  "quest_progress",
                                  MODE_PRIVATE
                          );

                  String name =
                          getIntent().getStringExtra(
                                  "questName"
                          );

                  loadQuest(name);
                  buildScreen();
              }

              private void loadQuest(
                      String name
              ) {
                  try {
                      InputStream input =
                              getAssets().open("quests.json");

                      byte[] bytes =
                              new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      String json =
                              new String(
                                      bytes,
                                      StandardCharsets.UTF_8
                              );

                      JSONArray array =
                              new JSONArray(json);

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          JSONObject candidate =
                                  array.getJSONObject(i);

                          if (candidate
                                  .optString("name")
                                  .equals(name)) {

                              quest = candidate;
                              return;
                          }
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              private TextView text(
                      String value,
                      float size
              ) {
                  TextView view =
                          new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);

                  view.setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8)
                  );

                  return view;
              }

              private void addField(
                      LinearLayout parent,
                      String title,
                      String value
              ) {
                  if (value == null
                          || value.trim().isEmpty()) {
                      return;
                  }

                  parent.addView(
                          text(
                                  title + ": " + value,
                                  15
                          )
                  );
              }

              private void buildScreen() {
                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(18, 18, 18)
                  );

                  scroll.addView(root);

                  if (quest == null) {
                      root.addView(
                              text(
                                      "Quest could not be loaded.",
                                      20
                              )
                      );

                      setContentView(scroll);
                      return;
                  }

                  root.addView(
                          text(
                                  quest.optString("name"),
                                  26
                          )
                  );

                  root.addView(
                          text(
                                  quest.optBoolean(
                                          "members",
                                          false
                                  )
                                          ? "Members"
                                          : "Free-to-play",
                                  16
                          )
                  );

                  addField(
                          root,
                          "Difficulty",
                          quest.optString(
                                  "difficulty",
                                  ""
                          )
                  );

                  addField(
                          root,
                          "Length",
                          quest.optString(
                                  "length",
                                  ""
                          )
                  );

                  addField(
                          root,
                          "Quest Points",
                          quest.optString(
                                  "questPoints",
                                  ""
                          )
                  );

                  addField(
                          root,
                          "Starting Location",
                          quest.optString(
                                  "startLocation",
                                  ""
                          )
                  );

                  addField(
                          root,
                          "Starting NPC",
                          quest.optString(
                                  "startingNpc",
                                  ""
                          )
                  );

                  addRequirements(root);
                  addItems(root);
                  addRewards(root);
                  addWalkthrough(root);

                  setContentView(scroll);
              }

              private void addHeading(
                      LinearLayout parent,
                      String heading
              ) {
                  TextView view =
                          text(
                                  heading,
                                  21
                          );

                  view.setTextColor(
                          Color.rgb(
                                  139,
                                  195,
                                  74
                          )
                  );

                  parent.addView(view);
              }

              private void addRequirements(
                      LinearLayout parent
              ) {
                  JSONArray array =
                          quest.optJSONArray(
                                  "requirements"
                          );

                  if (array == null
                          || array.length() == 0) {
                      return;
                  }

                  addHeading(
                          parent,
                          "Requirements"
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      parent.addView(
                              text(
                                      "• " +
                                      array.optString(i),
                                      15
                              )
                      );
                  }
              }

              private void addItems(
                      LinearLayout parent
              ) {
                  JSONArray array =
                          quest.optJSONArray(
                                  "items"
                          );

                  if (array == null
                          || array.length() == 0) {
                      return;
                  }

                  addHeading(
                          parent,
                          "Items"
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      parent.addView(
                              text(
                                      "• " +
                                      array.optString(i),
                                      15
                              )
                      );
                  }
              }

              private void addRewards(
                      LinearLayout parent
              ) {
                  JSONArray array =
                          quest.optJSONArray(
                                  "rewards"
                          );

                  if (array == null
                          || array.length() == 0) {
                      return;
                  }

                  addHeading(
                          parent,
                          "Rewards"
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      parent.addView(
                              text(
                                      "• " +
                                      array.optString(i),
                                      15
                              )
                      );
                  }
              }

              private void addWalkthrough(
                      LinearLayout parent
              ) {
                  addHeading(
                          parent,
                          "Walkthrough"
                  );

                  JSONArray sections =
                          quest.optJSONArray(
                                  "sections"
                          );

                  if (sections == null) {
                      return;
                  }

                  for (int s = 0;
                       s < sections.length();
                       s++) {

                      JSONObject section =
                              sections.getJSONObject(s);

                      TextView sectionTitle =
                              text(
                                      section.optString(
                                              "name",
                                              "Steps"
                                      ),
                                      19
                              );

                      sectionTitle.setTextColor(
                              Color.LTGRAY
                      );

                      parent.addView(
                              sectionTitle
                      );

                      JSONArray steps =
                              section.optJSONArray(
                                      "steps"
                              );

                      if (steps == null) {
                          continue;
                      }

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          JSONObject step =
                                  steps.getJSONObject(i);

                          addStep(
                                  parent,
                                  s,
                                  i,
                                  step
                          );
                      }
                  }
              }

              private void addStep(
                      LinearLayout parent,
                      int section,
                      int index,
                      JSONObject step
              ) {
                  String questId =
                          quest.optString("id");

                  String key =
                          questId +
                          "_" +
                          section +
                          "_" +
                          index;

                  CheckBox check =
                          new CheckBox(this);

                  String description =
                          step.optString(
                                  "description",
                                  ""
                          );

                  check.setText(
                          (index + 1) +
                          ". " +
                          description
                  );

                  check.setTextSize(16);
                  check.setTextColor(
                          Color.WHITE
                  );

                  check.setPadding(
                          dp(8),
                          dp(6),
                          dp(8),
                          dp(6)
                  );

                  check.setChecked(
                          progress.getBoolean(
                                  key,
                                  false
                          )
                  );

                  check.setOnCheckedChangeListener(
                          (buttonView, isChecked) ->
                                  progress.edit()
                                          .putBoolean(
                                                  key,
                                                  isChecked
                                          )
                                          .apply()
                  );

                  parent.addView(check);

                  addStepDetails(
                          parent,
                          step
                  );
              }

              private void addStepDetails(
                      LinearLayout parent,
                      JSONObject step
              ) {
                  JSONArray npcs =
                          step.optJSONArray("npcs");

                  JSONArray items =
                          step.optJSONArray("items");

                  JSONArray objects =
                          step.optJSONArray("objects");

                  JSONArray points =
                          step.optJSONArray(
                                  "worldpoints"
                          );

                  if (npcs != null
                          && npcs.length() > 0) {

                      parent.addView(
                              text(
                                      "NPC: " +
                                      join(npcs),
                                      13
                              )
                      );
                  }

                  if (items != null
                          && items.length() > 0) {

                      parent.addView(
                              text(
                                      "Items: " +
                                      join(items),
                                      13
                              )
                      );
                  }

                  if (objects != null
                          && objects.length() > 0) {

                      parent.addView(
                              text(
                                      "Object: " +
                                      join(objects),
                                      13
                              )
                      );
                  }

                  if (points != null
                          && points.length() > 0) {

                      JSONObject point =
                              points.optJSONObject(0);

                      if (point != null) {
                          parent.addView(
                                  text(
                                          "Location: " +
                                          point.optInt("x") +
                                          ", " +
                                          point.optInt("y") +
                                          ", plane " +
                                          point.optInt("plane"),
                                          12
                                  )
                          );
                      }
                  }
              }

              private String join(
                      JSONArray array
              ) {
                  StringBuilder result =
                          new StringBuilder();

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      if (i > 0) {
                          result.append(", ");
                      }

                      result.append(
                              array.optString(i)
                      );
                  }

                  return result.toString();
              }
          }
          EOF


      # ---------------------------------------------------------
      # 11. VALIDATE GENERATED DATABASE
      # ---------------------------------------------------------
      - name: Validate quest database
        run: |
          python3 - <<'PY'
          import json

          path = "app/src/main/assets/quests.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              quests = json.load(f)

          print("Quest count:", len(quests))

          if len(quests) != 192:
              raise SystemExit(
                  "ERROR: Quest database must contain 192 quests."
              )

          missing = []

          total_steps = 0

          for quest in quests:
              sections = quest.get(
                  "sections",
                  []
              )

              steps = sum(
                  len(section.get("steps", []))
                  for section in sections
              )

              total_steps += steps

              if steps == 0:
                  missing.append(
                      quest.get("name")
                  )

          print(
              "Total walkthrough steps:",
              total_steps
          )

          if missing:
              print(
                  "Quests without walkthroughs:"
              )

              for name in missing:
                  print(" -", name)

              raise SystemExit(
                  "ERROR: Every quest must have "
                  "at least one walkthrough step."
              )

          print(
              "Walkthrough validation PASSED."
          )
          PY


