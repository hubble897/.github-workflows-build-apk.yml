                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );


                  setContentView(
                      root
                  );


                  // ------------------------------------------------
                  // REFRESH
                  // ------------------------------------------------

                  Runnable refresh =
                      () -> {

                          list.removeAllViews();


                          String query =
                              search.getText()
                                  .toString()
                                  .trim()
                                  .toLowerCase(
                                      Locale.ROOT
                                  );


                          String selected =
                              filter
                                  .getSelectedItem()
                                  .toString();


                          for (
                              int i = 0;
                              i < quests.length();
                              i++
                          ) {

                              try {

                                  JSONObject q =
                                      quests
                                          .getJSONObject(
                                              i
                                          );


                                  String name =
                                      q.getString(
                                          "title"
                                      );


                                  String type =
                                      q.getString(
                                          "type"
                                      );


                                  if (
                                      !name
                                          .toLowerCase(
                                              Locale.ROOT
                                          )
                                          .contains(
                                              query
                                          )
                                  ) {

                                      continue;
                                  }


                                  if (
                                      selected.equals(
                                          "Free-to-play"
                                      )
                                      &&
                                      !type.equals(
                                          "F2P"
                                      )
                                  ) {

                                      continue;
                                  }


                                  if (
                                      selected.equals(
                                          "Members"
                                      )
                                      &&
                                      !type.equals(
                                          "Members"
                                      )
                                  ) {

                                      continue;
                                  }


                                  Button button =
                                      new Button(
