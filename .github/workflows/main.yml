      # ============================================================
      # 9. MAIN ACTIVITY
      # ============================================================

      - name: Create QuestMate MainActivity
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private EditText search;
              private String filter = "ALL";

              private final List<JSONObject> quests =
                      new ArrayList<>();

              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(
                          "questmate_progress",
                          MODE_PRIVATE
                  );

                  loadQuests();
                  showQuestList();
              }

              private void loadQuests() {
                  try {
                      InputStream input =
                              getAssets().open("quests.json");

                      byte[] data =
                              new byte[input.available()];

                      input.read(data);
                      input.close();

                      String json =
                              new String(
                                      data,
                                      StandardCharsets.UTF_8
                              );

                      JSONArray array =
                              new JSONArray(json);

                      for (int i = 0; i < array.length(); i++) {
                          quests.add(
                                  array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private TextView text(
                      String value,
                      float size
              ) {
                  TextView view =
                          new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.BLACK);
                  view.setPadding(
                          16,
                          12,
                          16,
                          12
                  );

                  return view;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  return b;
              }

              private void baseLayout() {
                  root = new LinearLayout(this);
                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          12,
                          12,
                          12,
                          12
                  );

                  setContentView(root);
              }

              private void showQuestList() {
                  baseLayout();

                  TextView title =
                          text(
                                  "QuestMate",
                                  28
                          );

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  root.addView(title);

                  root.addView(
                          text(
                                  "OSRS Quest Walkthroughs",
                                  17
                          )
                  );

                  search = new EditText(this);
                  search.setHint(
                          "Search quests..."
                  );

                  root.addView(search);

                  LinearLayout filters =
                          new LinearLayout(this);

                  filters.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  Button all =
                          button("ALL");

                  Button f2p =
                          button("F2P");

                  Button members =
                          button("MEMBERS");

                  filters.addView(all);
                  filters.addView(f2p);
                  filters.addView(members);

                  root.addView(filters);

                  LinearLayout list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(list);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  Runnable refresh =
                          () -> refreshQuestList(list);

                  all.setOnClickListener(v -> {
                      filter = "ALL";
                      refresh.run();
                  });

                  f2p.setOnClickListener(v -> {
                      filter = "F2P";
                      refresh.run();
                  });

                  members.setOnClickListener(v -> {
                      filter = "Members";
                      refresh.run();
                  });

                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {
                                  refresh.run();
                              }

                              public void afterTextChanged(
                                      android.text.Editable s
                              ) {}
                          }
                  );

                  refresh.run();
              }

              private void refreshQuestList(
                      LinearLayout list
              ) {
                  list.removeAllViews();

                  String query =
                          search == null
                                  ? ""
                                  : search.getText()
                                  .toString()
                                  .toLowerCase();

                  for (JSONObject quest : quests) {
                      try {
                          String name =
                                  quest.getString("name");

                          String membership =
                                  quest.getString(
                                          "membership"
                                  );

                          if (!filter.equals("ALL")
                                  && !membership.equals(filter)) {
                              continue;
                          }

                          if (!query.isEmpty()
                                  && !name.toLowerCase()
                                  .contains(query)) {
                              continue;
                          }

                          Button item =
                                  button(name);

                          item.setGravity(
                                  Gravity.LEFT |
                                  Gravity.CENTER_VERTICAL
                          );

                          item.setOnClickListener(
                                  v -> showQuest(quest)
                          );

                          list.addView(item);
                      } catch (Exception ignored) {}
                  }
              }

              private void showQuest(
                      JSONObject quest
              ) {
                  baseLayout();

                  Button back =
                          button("← Back to quests");

                  root.addView(back);

                  back.setOnClickListener(
                          v -> showQuestList()
                  );

                  try {
                      String name =
                              quest.getString("name");

                      TextView title =
                              text(
                                      name,
                                      25
                              );

                      title.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                      );

                      root.addView(title);

                      StringBuilder info =
                              new StringBuilder();

                      info.append(
                              "Type: "
                      ).append(
                              quest.getString(
                                      "membership"
                              )
                      ).append("\n");

                      info.append(
                              "Difficulty: "
                      ).append(
                              quest.getString(
                                      "difficulty"
                              )
                      ).append("\n");

                      info.append(
                              "Length: "
                      ).append(
                              quest.getString(
                                      "length"
                              )
                      ).append("\n");

                      info.append(
                              "Quest Points: "
                      ).append(
                              quest.getInt(
                                      "questPoints"
                              )
                      ).append("\n");

                      info.append(
                              "Start: "
                      ).append(
                              quest.getString(
                                      "startLocation"
                              )
                      );

                      root.addView(
                              text(
                                      info.toString(),
                                      16
                              )
                      );

                      addArraySection(
                              "Requirements",
                              quest.optJSONArray(
                                      "requirements"
                              )
                      );

                      addArraySection(
                              "Rewards",
                              quest.optJSONArray(
                                      "rewards"
                              )
                      );

                      TextView progress =
                              text(
                                      "Walkthrough",
                                      21
                              );

                      progress.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                      );

                      root.addView(progress);

                      ScrollView scroll =
                              new ScrollView(this);

                      LinearLayout steps =
                              new LinearLayout(this);

                      steps.setOrientation(
                              LinearLayout.VERTICAL
                      );

                      JSONArray panels =
                              quest.getJSONArray(
                                      "walkthrough"
                              );

                      for (int p = 0;
                           p < panels.length();
                           p++) {

                          JSONObject panel =
                                  panels.getJSONObject(p);

                          TextView section =
                                  text(
                                          panel.getString(
                                                  "title"
                                          ),
                                          19
                                  );

                          section.setTypeface(
                                  Typeface.DEFAULT,
                                  Typeface.BOLD
                          );

                          steps.addView(section);

                          JSONArray stepArray =
                                  panel.getJSONArray(
                                          "steps"
                                  );

                          for (int s = 0;
                               s < stepArray.length();
                               s++) {

                              JSONObject step =
                                      stepArray
                                              .getJSONObject(s);

                              String key =
                                      name +
                                      "_" +
                                      p +
                                      "_" +
                                      s;

                              CheckBox check =
                                      new CheckBox(
                                              this
                                      );

                              check.setText(
                                      (s + 1) +
                                      ". " +
                                      step.getString(
                                              "text"
                                      )
                              );

                              check.setTextSize(
                                      16
                              );

                              check.setChecked(
                                      prefs.getBoolean(
                                              key,
                                              false
                                      )
                              );

                              check.setOnCheckedChangeListener(
                                      (buttonView,
                                       isChecked) ->
                                              prefs.edit()
                                                      .putBoolean(
                                                              key,
                                                              isChecked
                                                      )
                                                      .apply()
                              );

                              steps.addView(check);
                          }
                      }

                      scroll.addView(steps);

                      root.addView(
                              scroll,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      0,
                                      1
                              )
                      );

                  } catch (Exception e) {
                      root.addView(
                              text(
                                      "Unable to open quest.",
                                      18
                              )
                      );
                  }
              }

              private void addArraySection(
                      String title,
                      JSONArray array
              ) {
                  if (array == null
                          || array.length() == 0) {
                      return;
                  }

                  TextView heading =
                          text(
                                  title,
                                  19
                          );

                  heading.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  root.addView(heading);

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      try {
                          root.addView(
                                  text(
                                          "• " +
                                          array.getString(i),
                                          15
                                  )
                          );
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # 10. BUILD APK
      # ============================================================

      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 11. COPY APK TO DIST
      # ============================================================

      - name: Prepare APK
        run: |
          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/QuestMate.apk

          ls -lh dist/QuestMate.apk

          test -f dist/QuestMate.apk


      # ============================================================
      # 12. VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |
          echo "APK information:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "APK SHA256:"
          sha256sum dist/QuestMate.apk

          echo ""
          echo "APK file type:"
          file dist/QuestMate.apk

          test -s dist/QuestMate.apk


      # ============================================================
      # 13. UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # 14. CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm Artifact Upload
        run: |
          echo "======================================"
          echo "QUESTMATE APK ARTIFACT"
          echo "======================================"

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo ""
          echo "APK:"
          ls -lh dist/QuestMate.apk

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "======================================"
          echo "QUESTMATE BUILD COMPLETE"
          echo "======================================"
