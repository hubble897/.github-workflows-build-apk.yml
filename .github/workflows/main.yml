name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. JAVA
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ---------------------------------------------------------
      # 3. ANDROID SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ---------------------------------------------------------
      # 4. INSTALL GRADLE
      # ---------------------------------------------------------
      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # ---------------------------------------------------------
      # 5. DOWNLOAD QUEST HELPER SOURCE
      # ---------------------------------------------------------
      - name: Download Quest Helper source
        run: |
          rm -rf quest-helper

          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          test -d quest-helper/src/main/java

          echo "Quest Helper source downloaded."

          find quest-helper/src/main/java/com/questhelper/helpers/quests \
            -name "*.java" | wc -l


      # ---------------------------------------------------------
      # 6. DOWNLOAD RUNELITE QUEST DEFINITIONS
      # ---------------------------------------------------------
      - name: Download RuneLite quest definitions
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o Quest.java

          test -s Quest.java

          echo "RuneLite Quest.java downloaded."


      # ---------------------------------------------------------
      # 7. CREATE ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Create Android project
        run: |
          rm -rf app src build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8BC34A</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF


      # ---------------------------------------------------------
      # 8. GENERATE QUEST DATABASE
      # ---------------------------------------------------------
      - name: Generate complete QuestMate quest database
        run: |
          cat > generate_quests.py <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path


          # -----------------------------------------------------
          # MINIQUESTS TO EXCLUDE
          # -----------------------------------------------------

          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }


          # -----------------------------------------------------
          # F2P QUESTS
          # -----------------------------------------------------

          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }


          # -----------------------------------------------------
          # HELPERS
          # -----------------------------------------------------

          def humanize(value):
              value = value.replace("_", " ")
              value = re.sub(r"\s+", " ", value).strip()

              replacements = {
                  " Sir Amik Varze": " Sir Amik Varze",
                  "King Awowogei": "King Awowogei",
                  "Recipe For Disaster": "Recipe for Disaster",
                  "Rfd": "Recipe for Disaster",
              }

              for a, b in replacements.items():
                  value = value.replace(a, b)

              words = []
              for word in value.split():
                  if word.lower() in {
                      "the", "of", "and", "for", "from", "in"
                  }:
                      words.append(word.lower())
                  else:
                      words.append(word.capitalize())

              return " ".join(words)


          def java_unescape(s):
              try:
                  return bytes(s, "utf-8").decode("unicode_escape")
              except Exception:
                  return s


          def extract_balanced(text, open_pos):
              if open_pos >= len(text) or text[open_pos] != "(":
                  return "", open_pos

              depth = 0
              quote = None
              escaped = False
              i = open_pos

              while i < len(text):
                  c = text[i]

                  if quote:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None
                  else:
                      if c in ('"', "'"):
                          quote = c
                      elif c == "(":
                          depth += 1
                      elif c == ")":
                          depth -= 1
                          if depth == 0:
                              return text[open_pos + 1:i], i

                  i += 1

              return text[open_pos + 1:], len(text)


          def quoted_strings(text):
              result = []

              for m in re.finditer(r'"((?:\\.|[^"\\])*)"', text):
                  value = java_unescape(m.group(1))
                  value = re.sub(r"\s+", " ", value).strip()

                  if value:
                      result.append(value)

              return result


          def meaningful_description(strings):
              if not strings:
                  return ""

              action_words = (
                  "talk", "speak", "use", "search", "open", "close",
                  "go", "walk", "travel", "climb", "enter", "leave",
                  "pick", "take", "get", "kill", "attack", "give",
                  "bring", "wear", "equip", "dig", "mine", "cut",
                  "cook", "smith", "light", "read", "pull", "push",
                  "click", "bank", "buy", "sell", "trade", "drop",
                  "bury", "drink", "eat", "cast", "teleport", "head",
                  "return", "find", "collect", "complete", "finish"
              )

              candidates = []

              for s in strings:
                  low = s.lower()

                  if len(s) < 5:
                      continue

                  if any(word in low for word in action_words):
                      candidates.append(s)

              if candidates:
                  return max(candidates, key=len)

              return max(strings, key=len)


          def extract_ids(text):
              result = {
                  "npcs": [],
                  "items": [],
                  "objects": []
              }

              patterns = {
                  "NpcID": "npcs",
                  "ItemID": "items",
                  "ObjectID": "objects",
              }

              for prefix, key in patterns.items():
                  for m in re.finditer(
                      rf"\b{prefix}\.([A-Z0-9_]+)",
                      text
                  ):
                      value = humanize(m.group(1))

                      if value not in result[key]:
                          result[key].append(value)

              return result


          def extract_worldpoints(text):
              result = []

              for m in re.finditer(
                  r"WorldPoint\s*\(\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*\)",
                  text
              ):
                  point = {
                      "x": int(m.group(1)),
                      "y": int(m.group(2)),
                      "plane": int(m.group(3))
                  }

                  if point not in result:
                      result.append(point)

              return result


          def parse_step_declarations(source):
              steps = {}

              pattern = re.compile(
                  r"(?m)^\s*"
                  r"(?:final\s+)?"
                  r"(?:[A-Za-z_][A-Za-z0-9_<>, ?\[\]]*\s+)?"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*=\s*new\s+"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*\("
              )

              for m in pattern.finditer(source):
                  variable = m.group(1)
                  step_type = m.group(2)

                  if step_type not in {
                      "NpcStep",
                      "ObjectStep",
                      "DetailedQuestStep",
                      "ItemStep",
                      "DigStep",
                      "EmoteStep",
                      "TileStep",
                      "ConditionalStep",
                      "WidgetStep",
                      "NpcTalkStep",
                      "QuestStep"
                  }:
                      continue

                  body, end = extract_balanced(source, m.end() - 1)

                  ids = extract_ids(body)
                  points = extract_worldpoints(body)
                  strings = quoted_strings(body)

                  description = meaningful_description(strings)

                  steps[variable] = {
                      "variable": variable,
                      "type": step_type,
                      "description": description,
                      "npcs": ids["npcs"],
                      "items": ids["items"],
                      "objects": ids["objects"],
                      "worldpoints": points
                  }

              return steps


          def get_panels_body(source):
              match = re.search(
                  r"\bgetPanels\s*\(\s*\)",
                  source
              )

              if not match:
                  return ""

              brace = source.find("{", match.end())

              if brace < 0:
                  return ""

              depth = 0
              quote = None
              escaped = False

              for i in range(brace, len(source)):
                  c = source[i]

                  if quote:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None
                      continue

                  if c == '"':
                      quote = '"'
                      continue

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return source[brace + 1:i]

              return source[brace + 1:]


          def parse_panels(source, step_map):
              body = get_panels_body(source)

              if not body:
                  return []

              panels = []

              search_start = 0

              while True:
                  match = re.search(
                      r"new\s+PanelDetails\s*\(",
                      body[search_start:]
                  )

                  if not match:
                      break

                  absolute = search_start + match.start()
                  open_pos = body.find(
                      "(",
                      absolute
                  )

                  args, end = extract_balanced(body, open_pos)

                  strings = quoted_strings(args)

                  section_name = (
                      strings[0]
                      if strings
                      else "Walkthrough"
                  )

                  identifiers = re.findall(
                      r"\b[A-Za-z_][A-Za-z0-9_]*\b",
                      args
                  )

                  ordered = []

                  for identifier in identifiers:
                      if identifier in step_map:
                          if identifier not in ordered:
                              ordered.append(identifier)

                  if ordered:
                      panels.append({
                          "name": section_name,
                          "steps": ordered
                      })

                  search_start = end + 1

              return panels


          def expand_conditional_steps(step_name, step_map, source, seen=None):
              if seen is None:
                  seen = set()

              if step_name in seen:
                  return []

              seen.add(step_name)

              step = step_map.get(step_name)

              if not step:
                  return []

              if step["type"] != "ConditionalStep":
                  return [step_name]

              source_pattern = re.compile(
                  rf"\b{re.escape(step_name)}\s*"
                  rf"(?:\.\w+\([^;]*?\)|\s*=\s*[^;]+;)*",
                  re.DOTALL
              )

              # Look for explicit addStep(variable) calls nearby.
              expanded = []

              for m in re.finditer(
                  r"\.addStep\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)",
                  source
              ):
                  candidate = m.group(1)

                  if candidate in step_map:
                      expanded.extend(
                          expand_conditional_steps(
                              candidate,
                              step_map,
                              source,
                              seen
                          )
                      )

              return expanded


          def build_walkthrough(source):
              step_map = parse_step_declarations(source)

              panels = parse_panels(
                  source,
                  step_map
              )

              result = []

              if panels:
                  for panel in panels:
                      section_steps = []

                      for variable in panel["steps"]:
                          expanded = expand_conditional_steps(
                              variable,
                              step_map,
                              source
                          )

                          if not expanded:
                              expanded = [variable]

                          for actual in expanded:
                              if actual not in step_map:
                                  continue

                              step = dict(step_map[actual])

                              if not step["description"]:
                                  step["description"] = (
                                      humanize(actual)
                                  )

                              section_steps.append(step)

                      if section_steps:
                          result.append({
                              "name": panel["name"],
                              "steps": section_steps
                          })

              # Fallback: if panels couldn't be parsed, use all
              # actual step declarations in source order.
              if not result and step_map:
                  fallback = []

                  for step in step_map.values():
                      if step["type"] == "ConditionalStep":
                          continue

                      if not step["description"]:
                          continue

                      fallback.append(step)

                  if fallback:
                      result.append({
                          "name": "Walkthrough",
                          "steps": fallback
                      })

              # Clean duplicates within each section.
              for section in result:
                  seen = set()
                  cleaned = []

                  for step in section["steps"]:
                      key = (
                          step["type"],
                          step["description"],
                          tuple(step["worldpoints"]),
                          tuple(step["npcs"]),
                          tuple(step["items"]),
                          tuple(step["objects"])
                      )

                      if key in seen:
                          continue

                      seen.add(key)
                      cleaned.append(step)

                  section["steps"] = cleaned

              return result


          def parse_requirements(source):
              requirements = []

              patterns = [
                  r'new\s+ItemRequirement\s*\(\s*"([^"]+)"',
                  r'new\s+SkillRequirement\s*\([^,]+,\s*[^,]+,\s*"([^"]+)"',
                  r'new\s+QuestRequirement\s*\([^,]+,\s*"([^"]+)"',
              ]

              for pattern in patterns:
                  for m in re.finditer(
                      pattern,
                      source,
                      re.DOTALL
                  ):
                      value = m.group(1).strip()

                      if value and value not in requirements:
                          requirements.append(value)

              # Capture common skill requirement constants.
              for m in re.finditer(
                  r"Skill\.(\w+)",
                  source
              ):
                  value = humanize(m.group(1))

                  if value not in requirements:
                      requirements.append(value)

              return requirements


          def parse_rewards(source):
              rewards = []

              reward_types = (
                  "ExperienceReward",
                  "ItemReward",
                  "UnlockReward",
                  "QuestPointReward"
              )

              for reward_type in reward_types:
                  for m in re.finditer(
                      rf"new\s+{reward_type}\s*\(",
                      source
                  ):
                      body, _ = extract_balanced(
                          source,
                          m.end() - 1
                      )

                      strings = quoted_strings(body)
                      ids = extract_ids(body)

                      description = (
                          meaningful_description(strings)
                      )

                      if description:
                          rewards.append(description)
                          continue

                      if ids["items"]:
                          for item in ids["items"]:
                              rewards.append(item)
                          continue

                      if reward_type == "QuestPointReward":
                          rewards.append("Quest points")

                      elif reward_type == "ExperienceReward":
                          numbers = re.findall(
                              r"\b\d+(?:\.\d+)?\b",
                              body
                          )

                          if numbers:
                              rewards.append(
                                  "Experience reward: " +
                                  numbers[-1] +
                                  " XP"
                              )

                          else:
                              rewards.append(
                                  "Experience reward"
                              )

                      elif reward_type == "UnlockReward":
                          rewards.append("Unlock reward")

              cleaned = []

              for reward in rewards:
                  if reward not in cleaned:
                      cleaned.append(reward)

              return cleaned


          def find_helper_files():
              root = Path(
                  "quest-helper/src/main/java/com/questhelper/helpers/quests"
              )

              return list(root.rglob("*.java"))


          def load_helpers():
              helpers = {}

              descriptor = re.compile(
                  r"@QuestDescriptor\s*\(\s*"
                  r"quest\s*=\s*QuestHelperQuest\.([A-Z0-9_]+)",
                  re.DOTALL
              )

              for path in find_helper_files():
                  try:
                      source = path.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
                  except Exception:
                      continue

                  match = descriptor.search(source)

                  if not match:
                      continue

                  enum_name = match.group(1)

                  helpers[enum_name] = {
                      "file": str(path),
                      "source": source
                  }

              return helpers


          # -----------------------------------------------------
          # RUNE LITE QUEST LIST
          # -----------------------------------------------------

          quest_source = Path("Quest.java").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          quest_pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*'
              r'-?\d+\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )

          all_quests = []

          for match in quest_pattern.finditer(
              quest_source
          ):
              enum_name = match.group(1)
              quest_name = match.group(2)

              if quest_name in MINIQUESTS:
                  continue

              all_quests.append(
                  (enum_name, quest_name)
              )


          # Remove accidental duplicate enum entries.
          unique = []
          seen_names = set()

          for enum_name, quest_name in all_quests:
              if quest_name in seen_names:
                  continue

              seen_names.add(quest_name)
              unique.append(
                  (enum_name, quest_name)
              )

          all_quests = unique


          print(
              "Quest entries found:",
              len(all_quests)
          )

          if len(all_quests) != 192:
              raise SystemExit(
                  "ERROR: Expected exactly 192 quests "
                  "after excluding miniquests."
              )


          # -----------------------------------------------------
          # QUEST HELPER
          # -----------------------------------------------------

          helpers = load_helpers()

          print(
              "Quest Helper descriptors found:",
              len(helpers)
          )


          def enum_candidates(enum_name):
              candidates = [
                  enum_name,
                  enum_name.replace(
                      "RECIPE_FOR_DISASTER_",
                      "RECIPE_FOR_DISASTER_"
                  )
              ]

              return list(dict.fromkeys(candidates))


          # -----------------------------------------------------
          # WIKI STRUCTURED METADATA
          #
          # Only structured infobox values are read.
          # No Wiki links or Wiki prose are placed in the APK.
          # -----------------------------------------------------

          def wiki_batch(titles):
              try:
                  title_string = "|".join(titles)

                  params = {
                      "action": "query",
                      "format": "json",
                      "prop": "revisions",
                      "rvprop": "content",
                      "rvslots": "main",
                      "titles": title_string,
                      "formatversion": "2"
                  }

                  url = (
                      "https://oldschool.runescape.wiki/api.php?"
                      + urllib.parse.urlencode(params)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "QuestMateBuild/1.0 "
                              "(offline quest database build)"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  result = {}

                  for page in data.get("query", {}).get(
                      "pages", []
                  ):
                      title = page.get("title")

                      revisions = page.get(
                          "revisions",
                          []
                      )

                      if not revisions:
                          continue

                      slots = revisions[0].get(
                          "slots",
                          {}
                      )

                      main = slots.get(
                          "main",
                          {}
                      )

                      content = main.get(
                          "content",
                          ""
                      )

                      result[title] = content

                  return result

              except Exception as exc:
                  print(
                      "Wiki metadata unavailable:",
                      exc
                  )

                  return {}


          def parse_infobox(text):
              result = {}

              keys = {
                  "difficulty": "difficulty",
                  "length": "length",
                  "quest points": "questPoints",
                  "quest points": "questPoints",
                  "start point": "startLocation",
                  "start point": "startLocation",
                  "start": "startLocation",
              }

              for line in text.splitlines():
                  m = re.match(
                      r"\s*\|\s*([^=]+?)\s*=\s*(.*?)\s*$",
                      line
                  )

                  if not m:
                      continue

                  key = re.sub(
                      r"\s+",
                      " ",
                      m.group(1).strip().lower()
                  )

                  value = m.group(2).strip()

                  if key not in keys:
                      continue

                  # Remove common wiki markup while retaining text.
                  value = re.sub(
                      r"\{\{[^{}]*\}\}",
                      "",
                      value
                  )

                  value = re.sub(
                      r"\[\[([^|\]]+)(?:\|[^\]]+)?\]\]",
                      r"\1",
                      value
                  )

                  value = re.sub(
                      r"<[^>]+>",
                      "",
                      value
                  )

                  value = value.strip()

                  if value:
                      result[keys[key]] = value

              return result


          # Fetch metadata in batches.
          wiki_metadata = {}

          for start in range(
              0,
              len(all_quests),
              40
          ):
              batch = all_quests[
                  start:start + 40
              ]

              titles = [
                  name
                  for _, name in batch
              ]

              pages = wiki_batch(titles)

              for title, content in pages.items():
                  wiki_metadata[title] = parse_infobox(
                      content
                  )


          # -----------------------------------------------------
          # BUILD DATABASE
          # -----------------------------------------------------

          database = []

          missing_helpers = []
          missing_walkthroughs = []

          for enum_name, quest_name in all_quests:
              helper = None

              for candidate in enum_candidates(
                  enum_name
              ):
                  if candidate in helpers:
                      helper = helpers[candidate]
                      break

              source = (
                  helper["source"]
                  if helper
                  else ""
              )

              walkthrough = build_walkthrough(
                  source
              ) if source else []

              requirements = parse_requirements(
                  source
              ) if source else []

              rewards = parse_rewards(
                  source
              ) if source else []

              first_npc = ""

              for section in walkthrough:
                  for step in section["steps"]:
                      if step["npcs"]:
                          first_npc = step["npcs"][0]
                          break

                  if first_npc:
                      break

              metadata = wiki_metadata.get(
                  quest_name,
                  {}
              )

              quest = {
                  "id": enum_name,
                  "name": quest_name,
                  "members": quest_name not in F2P,
                  "sections": walkthrough,
                  "requirements": requirements,
                  "rewards": rewards
              }

              if first_npc:
                  quest["startingNpc"] = first_npc

              for key in (
                  "difficulty",
                  "length",
                  "questPoints",
                  "startLocation"
              ):
                  if key in metadata:
                      quest[key] = metadata[key]

              # Add item information collected from walkthroughs.
              items = []

              for section in walkthrough:
                  for step in section["steps"]:
                      for item in step["items"]:
                          if item not in items:
                              items.append(item)

              if items:
                  quest["items"] = items

              if not helper:
                  missing_helpers.append(
                      quest_name
                  )

              step_count = sum(
                  len(section["steps"])
                  for section in walkthrough
              )

              if step_count == 0:
                  missing_walkthroughs.append(
                      quest_name
                  )

              database.append(quest)


          print(
              "Quest database entries:",
              len(database)
          )

          print(
              "Quests with walkthroughs:",
              sum(
                  1
                  for q in database
                  if q["sections"]
              )
          )

          print(
              "Missing helpers:",
              len(missing_helpers)
          )

          print(
              "Missing walkthroughs:",
              len(missing_walkthroughs)
          )


          if missing_helpers:
              print(
                  "QUESTS WITHOUT QUEST HELPER DESCRIPTOR:"
              )

              for name in missing_helpers:
                  print(
                      " -",
                      name
                  )


          if missing_walkthroughs:
              print(
                  "QUESTS WITHOUT WALKTHROUGH:"
              )

              for name in missing_walkthroughs:
                  print(
                      " -",
                      name
                  )

              raise SystemExit(
                  "ERROR: One or more quests have no "
                  "walkthrough steps."
              )


          if len(database) != 192:
              raise SystemExit(
                  "ERROR: Database does not contain "
                  "192 quests."
              )


          # -----------------------------------------------------
          # WRITE DATABASE
          # -----------------------------------------------------

          output = Path(
              "app/src/main/assets/quests.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  database,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # -----------------------------------------------------
          # LICENSE / ATTRIBUTION
          # -----------------------------------------------------

          license_source = Path(
              "quest-helper/LICENSE"
          )

          if license_source.exists():
              Path(
                  "app/src/main/assets/quest_helper_license.txt"
              ).write_text(
                  license_source.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ),
                  encoding="utf-8"
              )


          print(
              "Quest database successfully written to:",
              output
          )

          print(
              "Database size:",
              output.stat().st_size,
              "bytes"
          )
          PY


