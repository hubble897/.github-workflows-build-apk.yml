      # ============================================================
      # 11. BUILD APK
      # ============================================================

      - name: Build QuestMate APK
        run: |
          gradle clean copyQuestMateApk --no-daemon --stacktrace


      # ============================================================
      # 12. VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |

          echo "Checking APK..."

          ls -lah dist/

          test -f dist/QuestMate.apk

          APK_SIZE=$(stat -c%s dist/QuestMate.apk)

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          echo "APK verification successful."


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # 14. CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm Artifact Upload
        run: |

          echo "======================================"
          echo "QUESTMATE ARTIFACT"
          echo "======================================"

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "QuestMate APK uploaded successfully."
