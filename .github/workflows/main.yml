name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 4. DOWNLOAD GRADLE
      # ============================================================
      - name: Download Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 5. DOWNLOAD CURRENT QUEST HELPER
      # ============================================================
      - name: Download Quest Helper source
        run: |
          rm -rf quest-helper
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git quest-helper

          echo "Quest Helper downloaded."

          test -d quest-helper/src/main/java

          find quest-helper/src/main/java \
            -type f \
            -name "*.java" \
            | wc -l


      # ============================================================
      # 6. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values


      # ============================================================
      # 7. CREATE SETTINGS
      # ============================================================
      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


      # ============================================================
      # 8. CREATE ROOT BUILD
      # ============================================================
      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ============================================================
      # 9. CREATE GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF


      # ============================================================
      # 10. CREATE APP BUILD FILE
      # ============================================================
      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


      # ============================================================
      # 11. CREATE ANDROID MANIFEST
      # ============================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 12. APP THEME
      # ============================================================
      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6A4CFF</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 13. GENERATE QUEST DATABASE
      #
      # Includes:
      #   182 main quests
      #   10 Recipe for Disaster subquests
      #
      # = 192 QuestMate entries
      #
      # Miniquests remain excluded.
      # ============================================================
      - name: Generate QuestMate quest database
        run: |
          cat > generate_quests.py <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          RUNE_LITE_URL = (
              "https://raw.githubusercontent.com/runelite/runelite/"
              "master/runelite-api/src/main/java/net/runelite/api/Quest.java"
          )

          import urllib.request

          print("Downloading current RuneLite quest list...")
          source = urllib.request.urlopen(RUNE_LITE_URL, timeout=60).read().decode("utf-8")

          pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*'
              r'-?\d+\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )

          quests = pattern.findall(source)

          print("RuneLite quest enum entries found:", len(quests))

          # --------------------------------------------------------
          # Miniquests that are NOT normal quests.
          # --------------------------------------------------------
          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }

          # --------------------------------------------------------
          # We INCLUDE Recipe for Disaster and all ten subquests.
          # --------------------------------------------------------
          filtered = []

          for enum_name, display_name in quests:

              if display_name in MINIQUESTS:
                  continue

              filtered.append((enum_name, display_name))

          print("Quest entries after miniquest exclusions:", len(filtered))

          # --------------------------------------------------------
          # F2P quests.
          # Current F2P list.
          # --------------------------------------------------------
          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }

          # --------------------------------------------------------
          # Quest Helper source files.
          # --------------------------------------------------------
          helper_root = Path("quest-helper/src/main/java")

          java_files = list(helper_root.rglob("*.java"))

          print("Quest Helper Java files:", len(java_files))

          # --------------------------------------------------------
          # Map Quest Helper descriptor enums to source files.
          # --------------------------------------------------------
          helper_map = {}

          descriptor_re = re.compile(
              r'@QuestDescriptor\s*\(\s*quest\s*=\s*'
              r'QuestHelperQuest\.([A-Z0-9_]+)'
          )

          for file in java_files:

              try:
                  text = file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              matches = descriptor_re.findall(text)

              for enum_name in matches:
                  helper_map[enum_name] = file

          print("Quest Helper descriptors found:", len(helper_map))

          # --------------------------------------------------------
          # Extract useful information from Quest Helper source.
          #
          # This intentionally does NOT copy OSRS Wiki prose.
          # It extracts structural quest-helper information such as:
          # panels, steps, NPC/object targets and item names.
          # --------------------------------------------------------

          def clean_java(text):
              text = re.sub(r'/\*.*?\*/', ' ', text, flags=re.S)
              text = re.sub(r'//.*', ' ', text)
              return text

          def extract_strings(text):
              return re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"', text)

          def get_helper_data(enum_name):

              result = {
                  "helperFound": False,
                  "helperFile": "",
                  "steps": []
              }

              file = helper_map.get(enum_name)

              if not file:
                  return result

              result["helperFound"] = True
              result["helperFile"] = str(file)

              raw = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              text = clean_java(raw)

              steps = []

              # ----------------------------------------------------
              # Look for common PanelDetails / step declarations.
              # ----------------------------------------------------
              for match in re.finditer(
                  r'PanelDetails\s*\([^;]*',
                  text
              ):
                  block = match.group(0)

                  strings = extract_strings(block)

                  for s in strings:
                      s = s.strip()

                      if len(s) < 3:
                          continue

                      if s in {
                          "Step",
                          "Steps",
                          "Requirements",
                          "Items",
                          "Rewards"
                      }:
                          continue

                      if s not in steps:
                          steps.append(s)

              # ----------------------------------------------------
              # Look for common descriptive text attached to steps.
              # ----------------------------------------------------
              patterns = [
                  r'\.addText\(\s*"([^"]+)"',
                  r'\.setText\(\s*"([^"]+)"',
                  r'\.setDescription\(\s*"([^"]+)"',
                  r'new\s+\w+Step\s*\([^;]*?"([^"]+)"',
              ]

              for pattern in patterns:

                  for m in re.finditer(pattern, text):

                      value = m.group(1).strip()

                      if len(value) >= 8 and value not in steps:
                          steps.append(value)

              # Keep database manageable.
              steps = steps[:80]

              result["steps"] = steps

              return result

          # --------------------------------------------------------
          # Fallback guide.
          #
          # This is deliberately useful rather than pretending to be
          # a complete dynamic RuneLite helper.
          # --------------------------------------------------------
          def fallback_steps(name):

              return [
                  f"Read the quest requirements for {name} before starting.",
                  "Gather the required items and recommended equipment.",
                  "Travel to the quest starting location.",
                  "Speak to the required quest NPC and start the quest.",
                  "Follow the quest objectives in order.",
                  "Complete any required dialogue, item or puzzle objectives.",
                  "Complete any required combat encounter.",
                  "Return to the required NPC or final objective.",
                  "Finish the quest and claim the rewards."
              ]

          # --------------------------------------------------------
          # Create final QuestMate entries.
          # --------------------------------------------------------
          output = []

          for index, (enum_name, name) in enumerate(filtered, start=1):

              helper = get_helper_data(enum_name)

              steps = []

              # Use extracted Quest Helper structure where possible.
              for s in helper["steps"]:

                  # Turn source fragments into QuestMate instructions.
                  if len(s) >= 8:
                      steps.append({
                          "title": f"Quest objective {len(steps) + 1}",
                          "text": s
                      })

              if len(steps) < 3:
                  steps = [
                      {
                          "title": f"Step {i + 1}",
                          "text": text
                      }
                      for i, text in enumerate(fallback_steps(name))
                  ]

              entry = {
                  "id": index,
                  "enum": enum_name,
                  "name": name,
                  "members": name not in F2P,
                  "type": (
                      "Recipe for Disaster"
                      if name.startswith("Recipe for Disaster")
                      else "Quest"
                  ),
                  "questPoints": 0,
                  "difficulty": "See guide",
                  "length": "See guide",
                  "startLocation": "See walkthrough",
                  "requirements": [],
                  "items": [],
                  "rewards": [],
                  "steps": steps,
                  "questHelperSource": helper["helperFile"]
                      if helper["helperFound"] else ""
              }

              output.append(entry)

          # --------------------------------------------------------
          # Validation.
          # --------------------------------------------------------
          total = len(output)
          f2p_count = sum(not q["members"] for q in output)
          members_count = sum(q["members"] for q in output)
          rfd_count = sum(
              q["type"] == "Recipe for Disaster"
              for q in output
          )

          print("")
          print("========================================")
          print("QuestMate database validation")
          print("========================================")
          print("Total quests:", total)
          print("F2P:", f2p_count)
          print("Members:", members_count)
          print("Recipe for Disaster entries:", rfd_count)
          print("========================================")

          # 182 main quests + 10 RFD subquests.
          expected_total = 192

          if total != expected_total:
              raise SystemExit(
                  f"ERROR: Expected {expected_total} quest entries, "
                  f"found {total}"
              )

          if f2p_count != 24:
              raise SystemExit(
                  f"ERROR: Expected 24 F2P quests, found {f2p_count}"
              )

          if members_count != 168:
              raise SystemExit(
                  f"ERROR: Expected 168 Members quests, found {members_count}"
              )

          if rfd_count < 10:
              raise SystemExit(
                  f"ERROR: Expected all 10 RFD subquests. "
                  f"Found {rfd_count}"
              )

          os.makedirs("app/src/main/assets", exist_ok=True)

          with open(
              "app/src/main/assets/quests.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "version": 1,
                      "total": total,
                      "f2p": f2p_count,
                      "members": members_count,
                      "recipeForDisaster": rfd_count,
                      "quests": output
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("Created:")
          print("app/src/main/assets/quests.json")
          print("Quest database generation successful.")
          PY

          python3 generate_quests.py


      # ============================================================
      # 14. QUEST DATABASE SUMMARY
      # ============================================================
      - name: Show quest database
        run: |
          python3 - <<'PY'
          import json

          with open("app/src/main/assets/quests.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Quest database:")
          print("Total:", data["total"])
          print("F2P:", data["f2p"])
          print("Members:", data["members"])
          print("Recipe for Disaster:", data["recipeForDisaster"])

          print("")
          print("First quests:")

          for q in data["quests"][:10]:
              print("-", q["name"])

          print("")
          print("Recipe for Disaster entries:")

          for q in data["quests"]:
              if q["type"] == "Recipe for Disaster":
                  print("-", q["name"])
          PY


      # ============================================================
      # 15. MAIN ACTIVITY
      # ============================================================
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests = new ArrayList<>();

              private LinearLayout list;
              private EditText search;

              private String filter = "ALL";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();
                  buildUi();
                  refresh();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open("quests.json");

                      byte[] bytes =
                              new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      String json =
                              new String(bytes, "UTF-8");

                      JSONObject root =
                              new JSONObject(json);

                      JSONArray array =
                              root.getJSONArray("quests");

                      for (int i = 0; i < array.length(); i++) {
                          quests.add(array.getJSONObject(i));
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(24, 24, 24, 24);

                  TextView title =
                          new TextView(this);

                  title.setText("QuestMate");
                  title.setTextSize(30);
                  title.setTextColor(Color.BLACK);

                  root.addView(title);

                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "OSRS Quest Guide");

                  subtitle.setTextSize(16);

                  root.addView(subtitle);

                  search =
                          new EditText(this);

                  search.setHint(
                          "Search quests...");

                  root.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );

                  LinearLayout filters =
                          new LinearLayout(this);

                  filters.setOrientation(
                          LinearLayout.HORIZONTAL);

                  String[] names = {
                          "ALL",
                          "F2P",
                          "MEMBERS"
                  };

                  for (String name : names) {

                      Button button =
                              new Button(this);

                      button.setText(name);

                      button.setOnClickListener(
                              v -> {
                                  filter = name;
                                  refresh();
                              });

                      filters.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      0,
                                      -2,
                                      1
                              )
                      );
                  }

                  root.addView(filters);

                  list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL);

                  root.addView(
                          list,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {
                                  refresh();
                              }

                              public void afterTextChanged(
                                      android.text.Editable e) {}
                          }
                  );

                  setContentView(root);
              }

              private void refresh() {

                  if (list == null) return;

                  list.removeAllViews();

                  String query =
                          search == null
                                  ? ""
                                  : search.getText()
                                      .toString()
                                      .toLowerCase();

                  for (JSONObject quest : quests) {

                      try {

                          String name =
                                  quest.getString("name");

                          boolean members =
                                  quest.getBoolean("members");

                          if (!query.isEmpty()
                                  && !name
                                  .toLowerCase()
                                  .contains(query)) {
                              continue;
                          }

                          if (filter.equals("F2P")
                                  && members) {
                              continue;
                          }

                          if (filter.equals("MEMBERS")
                                  && !members) {
                              continue;
                          }

                          Button button =
                                  new Button(this);

                          button.setText(name);
                          button.setGravity(
                                  Gravity.START |
                                  Gravity.CENTER_VERTICAL);

                          button.setOnClickListener(v -> {

                              Intent intent =
                                      new Intent(
                                              MainActivity.this,
                                              QuestDetailActivity.class
                                      );

                              intent.putExtra(
                                      "quest",
                                      quest.toString());

                              startActivity(intent);
                          });

                          list.addView(button);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # 16. QUEST DETAIL ACTIVITY
      # ============================================================
      - name: Create QuestDetailActivity
        run: |
          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      quest = new JSONObject(
                              getIntent()
                                  .getStringExtra("quest")
                      );
                  } catch (Exception e) {
                      finish();
                      return;
                  }

                  buildUi();
              }

              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          24, 24, 24, 24);

                  TextView title =
                          new TextView(this);

                  try {
                      title.setText(
                              quest.getString("name"));
                  } catch (Exception ignored) {}

                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);

                  root.addView(title);

                  try {

                      boolean members =
                              quest.getBoolean("members");

                      TextView type =
                              new TextView(this);

                      type.setText(
                              members
                                      ? "Members quest"
                                      : "Free-to-play quest");

                      type.setTextSize(16);

                      root.addView(type);

                      TextView difficulty =
                              new TextView(this);

                      difficulty.setText(
                              "Difficulty: "
                              + quest.getString("difficulty"));

                      root.addView(difficulty);

                      TextView length =
                              new TextView(this);

                      length.setText(
                              "Length: "
                              + quest.getString("length"));

                      root.addView(length);

                      TextView location =
                              new TextView(this);

                      location.setText(
                              "Start: "
                              + quest.getString("startLocation"));

                      root.addView(location);

                      if (quest.getString("type")
                              .equals("Recipe for Disaster")) {

                          TextView rfd =
                                  new TextView(this);

                          rfd.setText(
                                  "Recipe for Disaster");

                          rfd.setTextSize(18);
                          rfd.setGravity(
                                  Gravity.CENTER);

                          root.addView(rfd);
                      }

                      TextView heading =
                              new TextView(this);

                      heading.setText(
                              "\nWalkthrough");

                      heading.setTextSize(22);

                      root.addView(heading);

                      JSONArray steps =
                              quest.getJSONArray("steps");

                      String key =
                              "quest_"
                              + quest.getInt("id");

                      android.content.SharedPreferences prefs =
                              getSharedPreferences(
                                      "progress",
                                      MODE_PRIVATE);

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          JSONObject step =
                                  steps.getJSONObject(i);

                          CheckBox check =
                                  new CheckBox(this);

                          check.setText(
                                  (i + 1)
                                  + ". "
                                  + step.getString("title")
                                  + "\n"
                                  + step.getString("text"));

                          check.setTextSize(16);

                          boolean saved =
                                  prefs.getBoolean(
                                      key + "_" + i,
                                      false);

                          check.setChecked(saved);

                          final int stepNumber = i;

                          check.setOnCheckedChangeListener(
                                  (buttonView, isChecked) -> {

                                      prefs.edit()
                                              .putBoolean(
                                                  key + "_"
                                                  + stepNumber,
                                                  isChecked)
                                              .apply();
                                  });

                          root.addView(check);
                      }

                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  android.widget.ScrollView scroll =
                          new android.widget.ScrollView(this);

                  scroll.addView(root);

                  setContentView(scroll);
              }
          }
          EOF


      # ============================================================
      # 17. BUILD
      # ============================================================
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 18. FIND APK
      # ============================================================
      - name: Verify APK
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p dist

          cp "$APK" dist/QuestMate.apk

          echo "APK:"
          ls -lh dist/QuestMate.apk

          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # ============================================================
      # 19. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # 20. CONFIRM ARTIFACT
      # ============================================================
      - name: Confirm Artifact Upload
        run: |
          echo "======================================"
          echo "QUESTMATE BUILD COMPLETE"
          echo "======================================"

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "QuestMate APK successfully uploaded."
