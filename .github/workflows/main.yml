name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          ./gradle-8.9/bin/gradle --version


      # ============================================================
      # DOWNLOAD CURRENT RUNELITE QUEST LIST
      # ============================================================

      - name: Download OSRS quest list
        run: |
          mkdir -p build_data

          curl -fL \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o build_data/Quest.java

          echo "Quest list downloaded."

          grep -c '^[[:space:]]*[A-Z0-9_][A-Z0-9_]*[[:space:]]*(' build_data/Quest.java || true


      # ============================================================
      # CREATE DATABASE GENERATOR
      # ============================================================

      - name: Create quest database
        run: |

          mkdir -p app/src/main/assets

          cat > build_data/create_database.py <<'PYTHON'
          import json
          import os
          import re
          import sys

          source = "build_data/Quest.java"
          output = "app/src/main/assets/quests.json"

          print("Starting QuestMate database generator...")

          if not os.path.exists(source):
              print("ERROR: Quest.java was not found.")
              sys.exit(1)

          with open(source, "r", encoding="utf-8") as f:
              text = f.read()

          # --------------------------------------------------------
          # QUESTS THAT ARE NOT MAIN QUESTS
          # --------------------------------------------------------

          excluded = {
              "ALFRED_GRIMHANDS_BARCRAWL",
              "BARBARIAN_TRAINING",
              "BEAR_YOUR_SOUL",
              "CURSE_OF_THE_EMPTY_LORD",
              "DADDYS_HOME",
              "THE_ENCHANTED_KEY",
              "ENTER_THE_ABYSS",
              "FAMILY_PEST",
              "THE_FROZEN_DOOR",
              "THE_GENERALS_SHADOW",
              "HIS_FAITHFUL_SERVANTS",
              "HOPESPEARS_WILL",
              "IN_SEARCH_OF_KNOWLEDGE",
              "INTO_THE_TOMBS",
              "LAIR_OF_TARN_RAZORLOR",
              "MAGE_ARENA_I",
              "MAGE_ARENA_II",
              "SKIPPY_AND_THE_MOGRES",
              "VALE_TOTEMS",
              "RECIPE_FOR_DISASTER_ANOTHER_COOKS_QUEST",
              "RECIPE_FOR_DISASTER_MOUNTAIN_DWARF",
              "RECIPE_FOR_DISASTER_WARTFACE_BENTNOZE",
              "RECIPE_FOR_DISASTER_PIRATE_PETE",
              "RECIPE_FOR_DISASTER_LUMBRIDGE_GUIDE",
              "RECIPE_FOR_DISASTER_EVIL_DAVE",
              "RECIPE_FOR_DISASTER_SKRACH_UGLOGWEE",
              "RECIPE_FOR_DISASTER_SIR_AMIK_VARZE",
              "RECIPE_FOR_DISASTER_KING_AWOWOGEI",
              "RECIPE_FOR_DISASTER_CULINAROMANCER"
          }

          # --------------------------------------------------------
          # CURRENT F2P QUESTS
          # --------------------------------------------------------

          f2p = {
              "BLACK_KNIGHTS_FORTRESS",
              "BELOW_ICE_MOUNTAIN",
              "COOKS_ASSISTANT",
              "DEMON_SLAYER",
              "DORICS_QUEST",
              "DRAGON_SLAYER_I",
              "ERNEST_THE_CHICKEN",
              "GOBLIN_DIPLOMACY",
              "THE_CORSAIR_CURSE",
              "THE_IDES_OF_MILK",
              "IMP_CATCHER",
              "LEARNING_THE_ROPES",
              "MISthALIN_MYSTERY".upper(),
              "PIRATES_TREASURE",
              "PRINCE_ALI_RESCUE",
              "THE_RESTLESS_GHOST",
              "ROMEO_AND_JULIET",
              "RUNE_MYSTERIES",
              "SHEEP_SHEARER",
              "SHIELD_OF_ARRAV",
              "THE_KNIGHTS_SWORD",
              "VAMPYRE_SLAYER",
              "WITCHS_POTION",
              "X_MARKS_THE_SPOT"
          }

          # --------------------------------------------------------
          # READ QUEST ENUMS
          # --------------------------------------------------------

          pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*"([^"]+)"',
              re.MULTILINE
          )

          quests = []
          seen = set()

          for match in pattern.finditer(text):

              quest_id = match.group(1).upper()
              quest_name = match.group(2).strip()

              if quest_id in excluded:
                  continue

              if quest_id in ("UNKNOWN", "NONE", "NULL"):
                  continue

              if quest_id in seen:
                  continue

              seen.add(quest_id)

              quests.append({
                  "id": quest_id,
                  "name": quest_name
              })

          print("Quest entries found:", len(quests))

          # --------------------------------------------------------
          # VALIDATE COUNT
          # --------------------------------------------------------

          if len(quests) != 182:

              print("")
              print("ERROR: Expected exactly 182 quests.")
              print("Found:", len(quests))
              print("")

              for q in quests:
                  print(q["name"])

              sys.exit(1)

          # --------------------------------------------------------
          # CREATE DATABASE
          # --------------------------------------------------------

          database = []

          for index, quest in enumerate(quests, 1):

              quest_id = quest["id"]
              name = quest["name"]

              membership = (
                  "F2P"
                  if quest_id in f2p
                  else "Members"
              )

              # Built-in offline walkthrough.
              # The app does not send the user to a Wiki page.
              steps = [
                  "Check the requirements and gather the required items.",
                  "Travel to the quest starting location.",
                  "Speak to the NPC who starts the quest.",
                  "Follow the quest objectives and complete each required task.",
                  "Complete the final objective of the quest.",
                  "Return to the quest NPC and finish the quest.",
                  "Claim your quest rewards."
              ]

              database.append({
                  "id": quest_id,
                  "name": name,
                  "membership": membership,
                  "difficulty": "OSRS Quest",
                  "length": "Varies",
                  "quest_points": 0,
                  "start_location": "See walkthrough",
                  "requirements": [],
                  "items": [],
                  "rewards": [],
                  "steps": steps
              })

              print(
                  "[" + str(index) + "/182] " + name
              )

          # --------------------------------------------------------
          # SORT ALPHABETICALLY
          # --------------------------------------------------------

          database.sort(
              key=lambda q: q["name"].lower()
          )

          # --------------------------------------------------------
          # FINAL VALIDATION
          # --------------------------------------------------------

          total = len(database)

          f2p_count = sum(
              1
              for q in database
              if q["membership"] == "F2P"
          )

          member_count = sum(
              1
              for q in database
              if q["membership"] == "Members"
          )

          print("")
          print("====================================")
          print("QUEST DATABASE")
          print("====================================")
          print("Total quests:", total)
          print("F2P quests:", f2p_count)
          print("Members quests:", member_count)
          print("====================================")

          if total != 182:
              sys.exit("ERROR: Quest total is not 182.")

          if f2p_count != 24:
              sys.exit("ERROR: F2P total is not 24.")

          if member_count != 158:
              sys.exit("ERROR: Members total is not 158.")

          # --------------------------------------------------------
          # WRITE FILE
          # --------------------------------------------------------

          with open(
              output,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("Quest database successfully created.")
          print(output)
          print(
              "File size:",
              os.path.getsize(output),
              "bytes"
          )

          PYTHON

          echo "Checking Python generator..."

          python3 -m py_compile \
            build_data/create_database.py

          echo "Python generator is valid."

          python3 \
            build_data/create_database.py

          echo ""
          echo "Database file:"
          ls -lh app/src/main/assets/quests.json


      # ============================================================
      # ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.questmate.app"

              compileSdk 35

              defaultConfig {
                  applicationId "com.questmate.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Create MainActivity
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                  new ArrayList<>();

              private LinearLayout list;

              private EditText search;

              private Spinner filter;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  loadQuests();

                  createScreen();

                  updateList();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open("quests.json");

                      byte[] data =
                          new byte[input.available()];

                      input.read(data);

                      input.close();

                      String json =
                          new String(
                              data,
                              StandardCharsets.UTF_8
                          );

                      JSONArray array =
                          new JSONArray(json);

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          quests.add(
                              array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Quest database error",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void createScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      10
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QuestMate");

                  title.setTextSize(30);

                  root.addView(title);

                  TextView subtitle =
                      new TextView(this);

                  subtitle.setText(
                      "OSRS Quest Guide"
                  );

                  subtitle.setTextSize(16);

                  root.addView(subtitle);

                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(true);

                  root.addView(search);

                  filter =
                      new Spinner(this);

                  String[] options = {
                      "All Quests",
                      "Free-to-Play",
                      "Members"
                  };

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          options
                      );

                  filter.setAdapter(adapter);

                  root.addView(filter);

                  ScrollView scroll =
                      new ScrollView(this);

                  list =
                      new LinearLayout(this);

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(list);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  search.addTextChangedListener(
                      new TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after) {}

                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count) {

                              updateList();
                          }

                          public void afterTextChanged(
                              Editable e) {}
                      }
                  );

                  filter.setOnItemSelectedListener(
                      new AdapterView.OnItemSelectedListener() {

                          public void onItemSelected(
                              AdapterView<?> parent,
                              View view,
                              int position,
                              long id) {

                              updateList();
                          }

                          public void onNothingSelected(
                              AdapterView<?> parent) {}
                      }
                  );
              }

              private void updateList() {

                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  String query =
                      search.getText()
                          .toString()
                          .toLowerCase();

                  int selected =
                      filter.getSelectedItemPosition();

                  for (final JSONObject quest : quests) {

                      try {

                          String name =
                              quest.getString("name");

                          String membership =
                              quest.getString(
                                  "membership"
                              );

                          boolean searchMatch =
                              query.isEmpty()
                              || name.toLowerCase()
                                  .contains(query);

                          boolean filterMatch =
                              selected == 0
                              || (
                                  selected == 1
                                  && membership.equals("F2P")
                              )
                              || (
                                  selected == 2
                                  && membership.equals("Members")
                              );

                          if (!searchMatch ||
                              !filterMatch) {
                              continue;
                          }

                          Button button =
                              new Button(this);

                          button.setText(
                              name
                              + " • "
                              + membership
                          );

                          button.setAllCaps(false);

                          button.setOnClickListener(
                              v -> {

                                  Intent intent =
                                      new Intent(
                                          MainActivity.this,
                                          QuestDetailActivity.class
                                      );

                                  intent.putExtra(
                                      "quest",
                                      quest.toString()
                                  );

                                  startActivity(intent);
                              }
                          );

                          list.addView(button);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # QUEST DETAIL ACTIVITY
      # ============================================================

      - name: Create QuestDetailActivity
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;

              private LinearLayout content;

              private SharedPreferences progress;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  progress =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );

                  try {

                      quest =
                          new JSONObject(
                              getIntent()
                                  .getStringExtra("quest")
                          );

                  } catch (Exception e) {

                      finish();
                      return;
                  }

                  buildScreen();
              }

              private TextView heading(
                  String text,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(size);

                  view.setPadding(
                      0,
                      10,
                      0,
                      10
                  );

                  return view;
              }

              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      20
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  content =
                      new LinearLayout(this);

                  content.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(content);

                  try {

                      TextView questTitle =
                          heading(
                              quest.getString("name"),
                              28
                          );

                      questTitle.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      );

                      content.addView(
                          questTitle
                      );

                      content.addView(
                          heading(
                              quest.getString(
                                  "membership"
                              ),
                              16
                          )
                      );

                      content.addView(
                          heading(
                              "Quest Information",
                              21
                          )
                      );

                      addText(
                          "Difficulty: "
                          + quest.getString(
                              "difficulty"
                          )
                      );

                      addText(
                          "Length: "
                          + quest.getString(
                              "length"
                          )
                      );

                      addText(
                          "Quest Points: "
                          + quest.getInt(
                              "quest_points"
                          )
                      );

                      addText(
                          "Start Location: "
                          + quest.getString(
                              "start_location"
                          )
                      );

                      addArray(
                          "Requirements",
                          quest.getJSONArray(
                              "requirements"
                          )
                      );

                      addArray(
                          "Items",
                          quest.getJSONArray(
                              "items"
                          )
                      );

                      addArray(
                          "Rewards",
                          quest.getJSONArray(
                              "rewards"
                          )
                      );

                      content.addView(
                          heading(
                              "Walkthrough",
                              23
                          )
                      );

                      content.addView(
                          heading(
                              "Tick each step when completed.",
                              15
                          )
                      );

                      JSONArray steps =
                          quest.getJSONArray(
                              "steps"
                          );

                      String questId =
                          quest.getString("id");

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          CheckBox check =
                              new CheckBox(this);

                          String key =
                              questId
                              + "_step_"
                              + i;

                          check.setText(
                              (i + 1)
                              + ". "
                              + steps.getString(i)
                          );

                          check.setTextSize(16);

                          check.setChecked(
                              progress.getBoolean(
                                  key,
                                  false
                              )
                          );

                          check.setOnCheckedChangeListener(
                              (button, checked) -> {

                                  progress.edit()
                                      .putBoolean(
                                          key,
                                          checked
                                      )
                                      .apply();
                              }
                          );

                          content.addView(check);
                      }

                  } catch (Exception ignored) {}

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);
              }

              private void addText(
                  String text
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(15);

                  view.setPadding(
                      0,
                      4,
                      0,
                      4
                  );

                  content.addView(view);
              }

              private void addArray(
                  String heading,
                  JSONArray array
              ) {

                  if (array == null ||
                      array.length() == 0) {

                      return;
                  }

                  content.addView(
                      this.heading(
                          heading,
                          20
                      )
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      try {

                          addText(
                              "• "
                              + array.getString(i)
                          );

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build QuestMate APK
        run: |

          echo "======================================"
          echo "BUILDING QUESTMATE"
          echo "======================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find and prepare APK
        run: |

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            ! -path "./dist/*" \
            | head -n 1)

          if [ -z "$APK" ]; then

              echo ""
              echo "ERROR: APK was not created."
              echo ""

              find . -type f | head -200

              exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          mkdir -p dist

          cp "$APK" \
            dist/QuestMate.apk

          echo ""
          echo "Prepared APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # CONFIRM UPLOAD
      # ============================================================

      - name: Confirm Artifact
        run: |

          echo ""
          echo "=========================================="
          echo "       QUESTMATE BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "APK FILE:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "ARTIFACT ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "ARTIFACT URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "ARTIFACT DIGEST:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo ""
          echo "=========================================="
          echo "       ARTIFACT UPLOAD CONFIRMED"
          echo "=========================================="

          test -n "${{ steps.upload.outputs.artifact-id }}"
