name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build QuestMate
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # ANDROID
      # ==========================================

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ==========================================
      # CREATE PROJECT
      # ==========================================

      - name: Create project
        run: |
          rm -rf questmate-build
          rm -f QuestMate.apk

          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/values
          mkdir -p questmate-build/app/src/main/assets


      # ==========================================
      # SETTINGS
      # ==========================================

      - name: Create settings.gradle
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


      # ==========================================
      # ROOT GRADLE
      # ==========================================

      - name: Create build.gradle
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF


      # ==========================================
      # GRADLE PROPERTIES
      # ==========================================

      - name: Create gradle.properties
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # ==========================================
      # APP GRADLE
      # ==========================================

      - name: Create app build.gradle
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.questmate.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF


      # ==========================================
      # MANIFEST
      # NO OVERLAY
      # ==========================================

      - name: Create AndroidManifest.xml
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================
      # THEME
      # ==========================================

      - name: Create theme
        run: |
          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #00C853
                  </item>

                  <item name="android:navigationBarColor">
                      #101010
                  </item>

                  <item name="android:statusBarColor">
                      #101010
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================
      # QUEST DATABASE
      # ==========================================

      - name: Create quest database
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          API = "https://oldschool.runescape.wiki/api.php"

          quests = []
          seen = set()
          token = None

          while True:

              params = {
                  "action": "query",
                  "list": "categorymembers",
                  "cmtitle": "Category:Quests",
                  "cmnamespace": "0",
                  "cmlimit": "500",
                  "format": "json"
              }

              if token:
                  params["cmcontinue"] = token

              url = API + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "QuestMate/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  data = json.load(response)

              for item in data.get(
                  "query",
                  {}
              ).get(
                  "categorymembers",
                  []
              ):

                  name = item.get(
                      "title",
                      ""
                  ).strip()

                  if name and name not in seen:

                      seen.add(name)

                      quests.append({
                          "name": name,
                          "members": True,
                          "difficulty": "Not listed",
                          "length": "Not listed",
                          "questPoints": 0,
                          "start": "Not listed",
                          "guide": [
                              "Prepare for this quest.",
                              "Check your requirements.",
                              "Gather the required items.",
                              "Begin the quest.",
                              "Follow the QuestMate checklist.",
                              "Complete the final objective.",
                              "Finish the quest."
                          ]
                      })

              if "continue" not in data:
                  break

              token = data[
                  "continue"
              ]["cmcontinue"]

          f2p = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "Imp Catcher",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampire Slayer",
              "The Corsair Curse",
              "X Marks the Spot"
          }

          for quest in quests:

              if quest["name"] in f2p:
                  quest["members"] = False

          quests.sort(
              key=lambda x: x["name"].lower()
          )

          output = (
              "questmate-build/"
              "app/src/main/assets/quests.json"
          )

          with open(
              output,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  quests,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "QUESTS FOUND:",
              len(quests)
          )

          print(
              "DATABASE CREATED:"
          )

          print(output)
          PY


      # ==========================================
      # MAIN ACTIVITY
      # ==========================================

      - name: Create MainActivity
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private LinearLayout questList;

              private final List<Quest> quests =
                      new ArrayList<>();

              private String filter = "ALL";

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  loadQuests();

                  showHome();
              }


              private void showHome() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          16,16,16,16
                  );

                  root.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL
                  );


                  TextView title =
                          new TextView(this);

                  title.setText(
                          "QUESTMATE"
                  );

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setTextSize(
                          26
                  );


                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  70,
                                  1
                          )
                  );


                  Button minimize =
                          new Button(this);

                  minimize.setText(
                          "MINIMIZE"
                  );

                  minimize.setOnClickListener(
                          v -> moveTaskToBack(true)
                  );

                  header.addView(
                          minimize
                  );

                  root.addView(header);


                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search quests..."
                  );

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );

                  root.addView(
                          search
                  );


                  LinearLayout filters =
                          new LinearLayout(this);


                  String[] filtersList = {
                          "ALL",
                          "F2P",
                          "MEMBERS"
                  };


                  for (
                          String name :
                          filtersList
                  ) {

                      Button button =
                              new Button(this);

                      button.setText(name);

                      button.setOnClickListener(
                              v -> {

                                  filter = name;

                                  refresh(
                                      search
                                      .getText()
                                      .toString()
                                  );
                              }
                      );

                      filters.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      0,
                                      60,
                                      1
                              )
                      );
                  }


                  root.addView(filters);


                  ScrollView scroll =
                          new ScrollView(this);


                  questList =
                          new LinearLayout(this);

                  questList.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  scroll.addView(
                          questList
                  );


                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {

                                  refresh(
                                      s.toString()
                                  );
                              }

                              public void afterTextChanged(
                                      android.text.Editable e
                              ) {}
                          }
                  );


                  setContentView(root);

                  refresh("");
              }


              private void refresh(
                      String searchText
              ) {

                  questList.removeAllViews();

                  String search =
                          searchText
                          .toLowerCase()
                          .trim();


                  for (Quest quest : quests) {

                      boolean correctFilter =

                              filter.equals("ALL")

                              ||

                              (
                                  filter.equals("F2P")
                                  && !quest.members
                              )

                              ||

                              (
                                  filter.equals("MEMBERS")
                                  && quest.members
                              );


                      if (!correctFilter)
                          continue;


                      if (
                          !search.isEmpty()
                          &&
                          !quest.name
                              .toLowerCase()
                              .contains(search)
                      )
                          continue;


                      Button button =
                              new Button(this);

                      button.setText(
                              quest.name
                              +
                              "\n"
                              +
                              (
                                  quest.members
                                  ? "MEMBERS"
                                  : "F2P"
                              )
                      );


                      button.setOnClickListener(
                              v -> showQuest(quest)
                      );


                      questList.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      82
                              )
                      );
                  }
              }


              private void showQuest(
                      Quest quest
              ) {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          16,16,16,16
                  );

                  root.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  LinearLayout top =
                          new LinearLayout(this);


                  Button back =
   
