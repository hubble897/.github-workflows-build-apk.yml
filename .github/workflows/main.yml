name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout QuestMate
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          cd "$RUNNER_TEMP"
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version


      # ============================================================
      # QUEST HELPER
      # ============================================================

      - name: Download Quest Helper
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git quest-helper


      # ============================================================
      # CURRENT RUNELITE QUEST LIST
      # ============================================================

      - name: Download current RuneLite quest data
        run: |
          mkdir -p runelite-source

          curl -L \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o runelite-source/Quest.java

          test -s runelite-source/Quest.java

          echo "RuneLite quest source downloaded."


      # ============================================================
      # CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |

          rm -rf app

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          tasks.register("copyQuestMateApk", Copy) {
              dependsOn("assembleDebug")

              from(
                  layout.buildDirectory.file(
                      "outputs/apk/debug/app-debug.apk"
                  )
              )

              into(
                  layout.projectDirectory.dir("dist")
              )

              rename {
                  "QuestMate.apk"
              }
          }
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="QuestMate"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # GENERATE QUEST DATABASE
      # ============================================================

      - name: Generate QuestMate quest database
        run: |

          cat > generate_quests.py <<'PYTHON'
          import json
          import re
          from pathlib import Path


          # --------------------------------------------------------
          # READ CURRENT RUNELITE QUEST LIST
          # --------------------------------------------------------

          quest_file = Path(
              "runelite-source/Quest.java"
          )

          quest_source = quest_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          quest_pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*'
              r'-?\d+\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )


          all_quests = []

          for enum_name, quest_name in quest_pattern.findall(
              quest_source
          ):
              all_quests.append({
                  "enum": enum_name,
                  "name": quest_name
              })


          print(
              "Current RuneLite quest entries:",
              len(all_quests)
          )


          # --------------------------------------------------------
          # MINIQUESTS
          # --------------------------------------------------------

          miniquests = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems"
          }


          # --------------------------------------------------------
          # F2P
          # --------------------------------------------------------

          f2p = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot"
          }


          # --------------------------------------------------------
          # RFD SUBQUESTS
          # --------------------------------------------------------

          rfd = {
              "Recipe for Disaster - Another Cook's Quest",
              "Recipe for Disaster - Mountain Dwarf",
              "Recipe for Disaster - Wartface & Bentnoze",
              "Recipe for Disaster - Pirate Pete",
              "Recipe for Disaster - Lumbridge Guide",
              "Recipe for Disaster - Evil Dave",
              "Recipe for Disaster - Skrach Uglogwee",
              "Recipe for Disaster - Sir Amik Varze",
              "Recipe for Disaster - King Awowogei",
              "Recipe for Disaster - Culinaromancer"
          }


          quests = [
              q
              for q in all_quests
              if q["name"] not in miniquests
          ]


          # --------------------------------------------------------
          # QUEST HELPER SOURCE
          # --------------------------------------------------------

          helper_root = Path(
              "quest-helper/src/main/java"
          )

          java_files = list(
              helper_root.rglob("*.java")
          )

          print(
              "Quest Helper Java files:",
              len(java_files)
          )


          # --------------------------------------------------------
          # NAME CONVERSION
          # --------------------------------------------------------

          def pretty(value):

              value = value.strip()

              value = re.sub(
                  r'^(NpcID|ItemID|ObjectID)\.',
                  '',
                  value
              )

              value = re.sub(
                  r'([a-z0-9])([A-Z])',
                  r'\1 \2',
                  value
              )

              value = value.replace(
                  "_",
                  " "
              )

              replacements = {
                  "COOK": "Cook",
                  "OSMAN": "Osman",
                  "PRINCE ALI": "Prince Ali",
                  "LUMBRIDGE GUIDE": "Lumbridge Guide",
                  "SIR AMIK VARZE": "Sir Amik Varze",
                  "KING A WOWOGEI": "King Awowogei",
                  "KING AWOWOGEI": "King Awowogei",
                  "EVIL DAVE": "Evil Dave",
                  "MOUNTAIN DWARF": "Mountain Dwarf",
                  "SKRACH UGLOGWEE": "Skrach Uglogwee",
                  "DAIRY COW": "Dairy Cow",
                  "CHICKEN": "Chicken",
                  "LUMBRIDGE CASTLE": "Lumbridge Castle",
                  "LUMBRIDGE": "Lumbridge",
                  "VARROCK": "Varrock",
                  "FALADOR": "Falador",
                  "DRAYNOR VILLAGE": "Draynor Village",
                  "PORT SARIM": "Port Sarim",
                  "AL KHARID": "Al Kharid",
                  "EDGEVILLE": "Edgeville",
                  "KARAMJA": "Karamja",
                  "RIMMINGTON": "Rimmington",
                  "BARBARIAN VILLAGE": "Barbarian Village",
                  "WIZARDS TOWER": "Wizards' Tower",
                  "TREE GNOME VILLAGE": "Tree Gnome Village",
                  "FALADOR CASTLE": "Falador Castle",
                  "WHITE KNIGHTS CASTLE": "White Knights' Castle"
              }

              upper = value.upper()

              if upper in replacements:
                  return replacements[upper]

              return value.replace(
                  "  ",
                  " "
              ).strip()


          # --------------------------------------------------------
          # STRING EXTRACTION
          # --------------------------------------------------------

          def strings(text):

              output = []

              for match in re.finditer(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              ):

                  value = match.group(1)

                  value = value.replace(
                      '\\"',
                      '"'
                  )

                  value = value.replace(
                      "\\n",
                      " "
                  )

                  value = value.replace(
                      "\\t",
                      " "
                  )

                  value = re.sub(
                      r'<[^>]+>',
                      '',
                      value
                  )

                  value = re.sub(
                      r'\s+',
                      ' ',
                      value
                  ).strip()

                  if len(value) >= 3:
                      output.append(value)

              return output


          # --------------------------------------------------------
          # NPCS / ITEMS / OBJECTS
          # --------------------------------------------------------

          def extract_entities(text):

              npcs = []
              items = []
              objects = []

              for value in re.findall(
                  r'\bNpcID\.([A-Z0-9_]+)',
                  text
              ):

                  name = pretty(value)

                  if name not in npcs:
                      npcs.append(name)


              for value in re.findall(
                  r'\bItemID\.([A-Z0-9_]+)',
                  text
              ):

                  name = pretty(value)

                  if name not in items:
                      items.append(name)


              for value in re.findall(
                  r'\bObjectID\.([A-Z0-9_]+)',
                  text
              ):

                  name = pretty(value)

                  if name not in objects:
                      objects.append(name)


              return npcs, items, objects


          # --------------------------------------------------------
          # LOCATIONS
          # --------------------------------------------------------

          def extract_locations(text):

              locations = []

              location_terms = [
                  "lumbridge",
                  "varrock",
                  "falador",
                  "draynor",
                  "port sarim",
                  "karamja",
                  "al kharid",
                  "edgeville",
                  "rimmington",
                  "castle",
                  "village",
                  "town",
                  "city",
                  "island",
                  "desert",
                  "temple",
                  "cave",
                  "dungeon",
                  "tower",
                  "camp",
                  "mine",
                  "farm",
                  "guild",
                  "palace",
                  "fortress",
                  "keep",
                  "ship",
                  "port",
                  "market",
                  "bank",
                  "shop",
                  "house",
                  "church",
                  "monastery",
                  "cemetery",
                  "graveyard",
                  "forest",
                  "woods",
                  "mountain",
                  "bridge"
              ]

              for value in strings(text):

                  low = value.lower()

                  if any(
                      term in low
                      for term in location_terms
                  ):

                      if (
                          len(value) <= 100
                          and value not in locations
                      ):

                          locations.append(value)


              return locations[:20]


          # --------------------------------------------------------
          # REQUIREMENTS
          # --------------------------------------------------------

          def extract_requirements(text):

              requirements = []

              patterns = [

                  r'new\s+SkillRequirement\s*\((.*?)\)',

                  r'new\s+QuestRequirement\s*\((.*?)\)',

                  r'new\s+CombatLevelRequirement\s*\((.*?)\)',

                  r'new\s+ItemRequirement\s*\((.*?)\)'
              ]


              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      re.DOTALL
                  ):

                      block = match.group(1)

                      values = strings(block)

                      for value in values:

                          if value not in requirements:
                              requirements.append(value)


              return requirements[:30]


          # --------------------------------------------------------
          # REWARDS
          # --------------------------------------------------------

          def extract_rewards(text):

              rewards = []

              patterns = [

                  r'new\s+ExperienceReward\s*\((.*?)\)',

                  r'new\s+ItemReward\s*\((.*?)\)',

                  r'new\s+QuestPointReward\s*\((.*?)\)',

                  r'new\s+UnlockReward\s*\((.*?)\)'
              ]


              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      re.DOTALL
                  ):

                      block = match.group(1)

                      values = strings(block)

                      for value in values:

                          if value not in rewards:
                              rewards.append(value)


              return rewards[:30]


          # --------------------------------------------------------
          # FIND QUEST HELPER
          # --------------------------------------------------------

          def find_helper(enum_name, quest_name):

              enum_pattern = re.compile(
                  r'QuestHelperQuest\.'
                  + re.escape(enum_name)
                  + r'\b'
              )


              for path in java_files:

                  try:

                      text = path.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )

                  except Exception:

                      continue


                  if enum_pattern.search(text):

                      return path, text


              normalized = re.sub(
                  r'[^a-z0-9]',
                  '',
                  quest_name.lower()
              )


              for path in java_files:

                  name = re.sub(
                      r'[^a-z0-9]',
                      '',
                      path.stem.lower()
                  )

                  if (
                      normalized
                      and normalized in name
                  ):

                      try:

                          return (
                              path,
                              path.read_text(
                                  encoding="utf-8",
                                  errors="ignore"
                              )
                          )

                      except Exception:

                          pass


              return None


          # --------------------------------------------------------
          # EXTRACT STEP TEXT
          # --------------------------------------------------------

          def extract_steps(text):

              steps = []

              patterns = [

                  r'\.setText\(\s*"((?:\\.|[^"\\])*)"\s*\)',

                  r'\.setDescription\(\s*"((?:\\.|[^"\\])*)"\s*\)',

                  r'\.addText\(\s*"((?:\\.|[^"\\])*)"\s*\)',

                  r'new\s+PanelDetails\(\s*"((?:\\.|[^"\\])*)"\s*\)'
              ]


              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text
                  ):

                      value = match.group(1)

                      value = value.replace(
                          "\\n",
                          " "
                      )

                      value = re.sub(
                          r'<[^>]+>',
                          '',
                          value
                      )

                      value = re.sub(
                          r'\s+',
                          ' ',
                          value
                      ).strip()


                      if (
                          len(value) >= 5
                          and value not in steps
                      ):

                          steps.append(value)


              return steps


          # --------------------------------------------------------
          # REMOVE PLACEHOLDER WORDING
          # --------------------------------------------------------

          forbidden = [
              "relevant npc",
              "relevant location",
              "required npc",
              "required item",
              "required location",
              "appropriate npc",
              "appropriate location",
              "the relevant npc",
              "the relevant location",
              "the required item",
              "the required npc"
          ]


          def contains_placeholder(text):

              low = text.lower()

              return any(
                  phrase in low
                  for phrase in forbidden
              )


          # --------------------------------------------------------
          # MAKE QUEST-SPECIFIC INSTRUCTIONS
          # --------------------------------------------------------

          def make_instruction(
              quest_name,
              raw,
              location,
              npc,
              items,
              objects
          ):

              raw = re.sub(
                  r'\s+',
                  ' ',
                  raw
              ).strip()


              if (
                  raw
                  and not contains_placeholder(raw)
                  and len(raw) >= 15
              ):

                  return raw


              parts = []


              if npc:

                  parts.append(
                      "Speak with "
                      + npc
                      + " and continue the conversation "
                      "until this objective advances."
                  )


              if objects:

                  parts.append(
                      "Interact with "
                      + ", ".join(objects[:3])
                      + " to progress this objective."
                  )


              if items:

                  parts.append(
                      "Have "
                      + ", ".join(items[:5])
                      + " available when completing this objective."
                  )


              if location:

                  parts.append(
                      "Complete this objective at "
                      + location
                      + "."
                  )


              if not parts:

                  return ""


              return " ".join(parts)


          # --------------------------------------------------------
          # BUILD WALKTHROUGH
          # --------------------------------------------------------

          def build_steps(
              quest_name,
              helper_text
          ):

              npcs, items, objects = extract_entities(
                  helper_text
              )

              locations = extract_locations(
                  helper_text
              )

              raw_steps = extract_steps(
                  helper_text
              )

              output = []


              for index, raw in enumerate(
                  raw_steps
              ):

                  location = ""

                  npc = ""


                  if locations:

                      location = locations[
                          min(
                              index,
                              len(locations) - 1
                          )
                      ]


                  if npcs:

                      npc = npcs[
                          min(
                              index,
                              len(npcs) - 1
                          )
                      ]


                  instruction = make_instruction(
                      quest_name,
                      raw,
                      location,
                      npc,
                      items,
                      objects
                  )


                  if not instruction:
                      continue


                  output.append({

                      "number":
                          len(output) + 1,

                      "title":
                          raw[:70]
                          if len(raw) <= 70
                          else raw[:67] + "...",

                      "instruction":
                          instruction,

                      "location":
                          location,

                      "npc":
                          npc,

                      "items":
                          items[:12],

                      "objects":
                          objects[:8]
                  })


              # Remove duplicates.

              final = []

              seen = set()


              for step in output:

                  key = (
                      step["title"],
                      step["instruction"],
                      step["location"],
                      step["npc"]
                  )


                  if key in seen:
                      continue


                  seen.add(key)

                  step["number"] = (
                      len(final) + 1
                  )

                  final.append(step)


              return final


          # --------------------------------------------------------
          # BUILD DATABASE
          # --------------------------------------------------------

          database = []

          matched = 0


          for quest in quests:

              helper = find_helper(
                  quest["enum"],
                  quest["name"]
              )


              helper_text = ""
              helper_path = ""


              if helper:

                  matched += 1

                  helper_path = str(
                      helper[0]
                  )

                  helper_text = helper[1]


              npcs, items, objects = (
                  extract_entities(
                      helper_text
                  )
              )


              locations = extract_locations(
                  helper_text
              )


              requirements = (
                  extract_requirements(
                      helper_text
                  )
              )


              rewards = (
                  extract_rewards(
                      helper_text
                  )
              )


              steps = build_steps(
                  quest["name"],
                  helper_text
              )


              database.append({

                  "name":
                      quest["name"],

                  "enum":
                      quest["enum"],

                  "members":
                      quest["name"] not in f2p,

                  "category":
                      "Recipe for Disaster"
                      if quest["name"] in rfd
                      else "Quest",

                  "difficulty":
                      "",

                  "length":
                      "",

                  "questPoints":
                      0,

                  "startLocation":
                      locations[0]
                      if locations
                      else "",

                  "startingNpc":
                      npcs[0]
                      if npcs
                      else "",

                  "requirements":
                      requirements,

                  "items":
                      items[:30],

                  "npcs":
                      npcs[:30],

                  "objects":
                      objects[:30],

                  "locations":
                      locations[:20],

                  "rewards":
                      rewards,

                  "steps":
                      steps,

                  "helperSource":
                      helper_path
              })


          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          print()
          print("======================================")
          print("QUESTMATE DATABASE VALIDATION")
          print("======================================")

          print(
              "Total quests:",
              len(database)
          )


          if len(database) != 192:

              print(
                  "ERROR: Expected 192 quests."
              )

              raise SystemExit(1)


          f2p_count = sum(
              1
              for q in database
              if not q["members"]
          )


          members_count = sum(
              1
              for q in database
              if q["members"]
          )


          rfd_count = sum(
              1
              for q in database
              if q["category"] ==
              "Recipe for Disaster"
          )


          print(
              "F2P:",
              f2p_count
          )

          print(
              "Members:",
              members_count
          )

          print(
              "RFD:",
              rfd_count
          )

          print(
              "Quest Helpers matched:",
              matched,
              "/",
              len(database)
          )


          if f2p_count != 24:
              raise SystemExit(
                  "ERROR: F2P count is not 24."
              )


          if members_count != 168:
              raise SystemExit(
                  "ERROR: Members count is not 168."
              )


          if rfd_count != 10:
              raise SystemExit(
                  "ERROR: RFD count is not 10."
              )


          # --------------------------------------------------------
          # PLACEHOLDER CHECK
          # --------------------------------------------------------

          placeholder_hits = []


          for quest in database:

              text = json.dumps(
                  quest
              ).lower()


              for phrase in forbidden:

                  if phrase in text:

                      placeholder_hits.append(
                          (
                              quest["name"],
                              phrase
                          )
                      )


          if placeholder_hits:

              print(
                  "ERROR: Placeholder text detected:"
              )


              for name, phrase in (
                  placeholder_hits[:50]
              ):

                  print(
                      "-",
                      name,
                      ":",
                      phrase
                  )


              raise SystemExit(
                  "Placeholder validation failed."
              )


          # --------------------------------------------------------
          # SAVE DATABASE
          # --------------------------------------------------------

          output = Path(
              "app/src/main/assets/quests.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          output.write_text(
              json.dumps(
                  database,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # --------------------------------------------------------
          # LICENSE / ATTRIBUTION
          # --------------------------------------------------------

          license_text = """
          QuestMate uses quest structure derived from the
          open-source RuneLite Quest Helper project.

          Quest Helper is distributed under the BSD 2-Clause License.

          Original project:
          https://github.com/Zoinkwiz/quest-helper

          QuestMate does not display Wiki links inside the app.
          """

          Path(
              "app/src/main/assets/quest_helper_license.txt"
          ).write_text(
              license_text.strip(),
              encoding="utf-8"
          )


          print()
          print(
              "QuestMate quest database created."
          )
          PYTHON


          python3 generate_quests.py


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Create QuestMate main screen
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                      new ArrayList<>();

              private LinearLayout questList;

              private String filter = "ALL";


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );

                  buildInterface();

                  loadQuests();
              }


              private void buildInterface() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          24,
                          24,
                          24,
                          24
                  );


                  TextView title =
                          new TextView(this);

                  title.setText(
                          "QuestMate"
                  );

                  title.setTextSize(
                          30
                  );

                  title.setTypeface(
                          Typeface.DEFAULT_BOLD
                  );

                  root.addView(title);


                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "OSRS Quest Walkthroughs"
                  );

                  subtitle.setTextSize(
                          16
                  );

                  root.addView(
                          subtitle
                  );


                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search quests..."
                  );

                  root.addView(
                          search
                  );


                  LinearLayout filters =
                          new LinearLayout(this);

                  filters.setOrientation(
                          LinearLayout.HORIZONTAL
                  );


                  String[] filterNames = {
                          "ALL",
                          "F2P",
                          "MEMBERS"
                  };


                  for (
                          String name :
                          filterNames
                  ) {

                      Button button =
                              new Button(this);

                      button.setText(
                              name
                      );


                      button.setOnClickListener(
                              view -> {

                                  filter = name;

                                  refresh(
                                      search.getText()
                                          .toString()
                                  );
                              }
                      );


                      filters.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      0,
                                      LinearLayout.LayoutParams.WRAP_CONTENT,
                                      1
                              )
                      );
                  }


                  root.addView(
                          filters
                  );


                  ScrollView scroll =
                          new ScrollView(this);


                  questList =
                          new LinearLayout(this);

                  questList.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  scroll.addView(
                          questList
                  );


                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1
                          )
                  );


                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {

                                  refresh(
                                      s.toString()
                                  );
                              }

                              public void afterTextChanged(
                                      android.text.Editable s
                              ) {}
                          }
                  );


                  setContentView(root);
              }


              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open(
                                      "quests.json"
                              );


                      byte[] bytes =
                              new byte[
                                      input.available()
                              ];


                      input.read(bytes);

                      input.close();


                      JSONArray array =
                              new JSONArray(
                                      new String(
                                              bytes,
                                              StandardCharsets.UTF_8
                                      )
                              );


                      for (
                              int i = 0;
                              i < array.length();
                              i++
                      ) {

                          quests.add(
                                  array.getJSONObject(i)
                          );
                      }


                      refresh("");

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Unable to load quest database.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }


              private void refresh(
                      String search
              ) {

                  questList.removeAllViews();

                  String query =
                          search == null
                                  ? ""
                                  : search.toLowerCase();


                  for (
                          JSONObject quest :
                          quests
                  ) {

                      try {

                          String name =
                                  quest.getString(
                                          "name"
                                  );


                          boolean members =
                                  quest.getBoolean(
                                          "members"
                                  );


                          boolean searchMatch =
                                  query.isEmpty()
                                  ||
                                  name.toLowerCase()
                                      .contains(query);


                          boolean filterMatch =
                                  filter.equals("ALL")
                                  ||
                                  (
                                      filter.equals("F2P")
                                      && !members
                                  )
                                  ||
                                  (
                                      filter.equals("MEMBERS")
                                      && members
                                  );


                          if (
                                  !searchMatch
                                  ||
                                  !filterMatch
                          ) {

                              continue;
                          }


                          Button button =
                                  new Button(this);


                          button.setText(
                                  name
                                  +
                                  "\n"
                                  +
                                  (
                                      members
                                      ? "Members"
                                      : "Free-to-play"
                                  )
                          );


                          button.setGravity(
                                  Gravity.START
                                  |
                                  Gravity.CENTER_VERTICAL
                          );


                          button.setOnClickListener(
                                  view -> {

                                      Intent intent =
                                              new Intent(
                                                  MainActivity.this,
                                                  QuestDetailActivity.class
                                              );


                                      intent.putExtra(
                                              "questName",
                                              name
                                      );


                                      startActivity(
                                              intent
                                      );
                                  }
                          );


                          questList.addView(
                                  button,
                                  new LinearLayout.LayoutParams(
                                          LinearLayout.LayoutParams.MATCH_PARENT,
                                          LinearLayout.LayoutParams.WRAP_CONTENT
                                  )
                          );

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # QUEST DETAIL ACTIVITY
      # ============================================================

      - name: Create detailed quest screen
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.graphics.Typeface;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class QuestDetailActivity extends Activity {

              private LinearLayout root;

              private android.content.SharedPreferences progress;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );


                  progress =
                          getSharedPreferences(
                                  "quest_progress",
                                  Context.MODE_PRIVATE
                          );


                  root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          24,
                          24,
                          24,
                          40
                  );


                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(root);

                  setContentView(
                          scroll
                  );


                  loadQuest();
              }


              private void loadQuest() {

                  String wanted =
                          getIntent().getStringExtra(
                                  "questName"
                          );


                  try {

                      InputStream input =
                              getAssets().open(
                                      "quests.json"
                              );


                      byte[] bytes =
                              new byte[
                                      input.available()
                              ];


                      input.read(bytes);

                      input.close();


                      JSONArray quests =
                              new JSONArray(
                                  new String(
                                      bytes,
                                      StandardCharsets.UTF_8
                                  )
                              );


                      JSONObject quest =
                              null;


                      for (
                              int i = 0;
                              i < quests.length();
                              i++
                      ) {

                          JSONObject candidate =
                                  quests.getJSONObject(i);


                          if (
                              candidate.getString(
                                  "name"
                              ).equals(wanted)
                          ) {

                              quest =
                                  candidate;

                              break;
                          }
                      }


                      if (quest == null) {

                          addText(
                              "Quest not found."
                          );

                          return;
                      }


                      renderQuest(
                              quest
                      );


                  } catch (Exception e) {

                      addText(
                              "Unable to load quest."
                      );
                  }
              }


              private void renderQuest(
                      JSONObject quest
              ) throws Exception {


                  addHeading(
                          quest.getString(
                                  "name"
                          ),
                          28
                  );


                  addText(
                          quest.getBoolean("members")
                          ? "Members quest"
                          : "Free-to-play quest"
                  );


                  String startLocation =
                          quest.optString(
                                  "startLocation"
                          );


                  if (
                          !startLocation.isEmpty()
                  ) {

                      addHeading(
                              "Starting Location",
                              20
                      );

                      addText(
                              "📍 "
                              + startLocation
                      );
                  }


                  String startingNpc =
                          quest.optString(
                                  "startingNpc"
                          );


                  if (
                          !startingNpc.isEmpty()
                  ) {

                      addHeading(
                              "Starting NPC",
                              20
                      );

                      addText(
                              "👤 "
                              + startingNpc
                      );
                  }


                  renderArray(
                          quest.optJSONArray(
                                  "requirements"
                          ),
                          "Requirements",
                          "✓ "
                  );


                  renderArray(
                          quest.optJSONArray(
                                  "items"
                          ),
                          "Items",
                          "🎒 "
                  );


                  renderArray(
                          quest.optJSONArray(
                                  "rewards"
                          ),
                          "Rewards",
                          "🏆 "
                  );


                  addHeading(
                          "Walkthrough",
                          24
                  );


                  JSONArray steps =
                          quest.optJSONArray(
                                  "steps"
                          );


                  if (
                          steps == null
                          ||
                          steps.length() == 0
                  ) {

                      addText(
                              "No structured walkthrough steps were available from the quest helper source."
                      );

                      return;
                  }


                  for (
                          int i = 0;
                          i < steps.length();
                          i++
                  ) {

                      renderStep(
                              quest.getString("name"),
                              steps.getJSONObject(i),
                              i
                      );
                  }
              }


              private void renderArray(
                      JSONArray array,
                      String heading,
                      String prefix
              ) throws Exception {


                  if (
                          array == null
                          ||
                          array.length() == 0
                  ) {

                      return;
                  }


                  addHeading(
                          heading,
                          20
                  );


                  for (
                          int i = 0;
                          i < array.length();
                          i++
                  ) {

                      addText(
                              prefix
                              +
                              array.getString(i)
                      );
                  }
              }


              private void renderStep(
                      String questName,
                      JSONObject step,
                      int index
              ) throws Exception {


                  addHeading(
                          "Step "
                          +
                          (index + 1)
                          +
                          " — "
                          +
                          step.optString(
                                  "title",
                                  "Quest objective"
                          ),
                          19
                  );


                  String location =
                          step.optString(
                                  "location"
                          );


                  if (
                          !location.isEmpty()
                  ) {

                      addText(
                              "📍 Location: "
                              + location
                      );
                  }


                  String npc =
                          step.optString(
                                  "npc"
                          );


                  if (
                          !npc.isEmpty()
                  ) {

                      addText(
                              "👤 NPC: "
                              + npc
                      );
                  }


                  JSONArray items =
                          step.optJSONArray(
                                  "items"
                          );


                  if (
                          items != null
                          &&
                          items.length() > 0
                  ) {

                      StringBuilder text =
                              new StringBuilder(
                                      "🎒 Items: "
                              );


                      for (
                              int i = 0;
                              i < items.length();
                              i++
                      ) {

                          if (i > 0) {
                              text.append(", ");
                          }


                          text.append(
                                  items.getString(i)
                          );
                      }


                      addText(
                              text.toString()
                      );
                  }


                  JSONArray objects =
                          step.optJSONArray(
                                  "objects"
                          );


                  if (
                          objects != null
                          &&
                          objects.length() > 0
                  ) {

                      StringBuilder text =
                              new StringBuilder(
                                      "🔧 Objects: "
                              );


                      for (
                              int i = 0;
                              i < objects.length();
                              i++
                      ) {

                          if (i > 0) {
                              text.append(", ");
                          }


                          text.append(
                                  objects.getString(i)
                          );
                      }


                      addText(
                              text.toString()
                      );
                  }


                  addText(
                          step.optString(
                                  "instruction",
                                  ""
                          )
                  );


                  CheckBox complete =
                          new CheckBox(this);


                  complete.setText(
                          "Completed"
                  );


                  String key =
                          questName
                          +
                          "_step_"
                          +
                          index;


                  complete.setChecked(
                          progress.getBoolean(
                                  key,
                                  false
                          )
                  );


                  complete.setOnCheckedChangeListener(
                          (
                              button,
                              checked
                          ) ->
                              progress.edit()
                                  .putBoolean(
                                      key,
                                      checked
                                  )
                                  .apply()
                  );


                  root.addView(
                          complete
                  );
              }


              private void addHeading(
                      String text,
                      float size
              ) {

                  TextView view =
                          new TextView(this);

                  view.setText(
                          text
                  );

                  view.setTextSize(
                          size
                  );

                  view.setTypeface(
                          Typeface.DEFAULT_BOLD
                  );

                  view.setPadding(
                          0,
                          18,
                          0,
                          8
                  );

                  root.addView(
                          view
                  );
              }


              private void addText(
                      String text
              ) {

                  if (
                          text == null
                          ||
                          text.trim().isEmpty()
                  ) {

                      return;
                  }


                  TextView view =
                          new TextView(this);

                  view.setText(
                          text
                  );

                  view.setTextSize(
                          16
                  );

                  view.setPadding(
                          0,
                          4,
                          0,
                          4
                  );

                  root.addView(
                          view
                  );
              }
          }
          EOF


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build QuestMate APK
        run: |
          gradle clean copyQuestMateApk --no-daemon --stacktrace


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify QuestMate APK
        run: |

          echo "Checking QuestMate APK..."

          ls -lah dist/

          test -f dist/QuestMate.apk

          SIZE=$(stat -c%s dist/QuestMate.apk)

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
              echo "ERROR: APK is too small."
              exit 1
          fi

          echo "APK verification successful."


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # CONFIRM ARTIFACT
      # ============================================================

      - name: Confirm Artifact Upload
        run: |

          echo "======================================"
          echo "QUESTMATE APK"
          echo "======================================"

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "QuestMate APK uploaded successfully."
