          QuestMate also uses quest names from RuneLite.

          RuneLite is licensed under the BSD 2-Clause License.

          This attribution is included with QuestMate's
          bundled quest data.
          """


          (
              ROOT
              / "app/src/main/assets/QUEST_HELPER_LICENSE.txt"
          ).write_text(
              license_text,
              encoding="utf-8"
          )


          print()
          print(
              "Quest database successfully generated."
          )

