name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Create Android project folder
      # --------------------------------------------------
      - name: Create build folder
        shell: bash
        run: |
          rm -rf questmate-build
          mkdir -p questmate-build

      # --------------------------------------------------
      # 4. Create Gradle settings
      # --------------------------------------------------
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > questmate-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

      # --------------------------------------------------
      # 5. Create root Gradle file
      # --------------------------------------------------
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > questmate-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      # --------------------------------------------------
      # 6. Create Gradle properties
      # --------------------------------------------------
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > questmate-build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      # --------------------------------------------------
      # 7. Create app folders
      # --------------------------------------------------
      - name: Create app folders
        shell: bash
        run: |
          mkdir -p questmate-build/app/src/main/java/com/questmate/app
          mkdir -p questmate-build/app/src/main/res/layout
          mkdir -p questmate-build/app/src/main/res/drawable
          mkdir -p questmate-build/app/src/main/res/mipmap-hdpi
          mkdir -p questmate-build/app/src/main/assets

      # --------------------------------------------------
      # 8. Create AndroidManifest
      # --------------------------------------------------
      - name: Create AndroidManifest
        shell: bash
        run: |
          cat > questmate-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

      # --------------------------------------------------
      # 9. Create app Gradle file
      # --------------------------------------------------
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > questmate-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      # --------------------------------------------------
      # 10. Create styles
      # --------------------------------------------------
      - name: Create styles
        shell: bash
        run: |
          mkdir -p questmate-build/app/src/main/res/values

          cat > questmate-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101820</item>
                  <item name="android:navigationBarColor">#101820</item>

              </style>

          </resources>
          EOF

      # --------------------------------------------------
      # 11. Create MainActivity
      # --------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 40, 30, 30);

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextSize(30);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText(
                      "OSRS Quest Companion\n\n" +
                      "Quest walkthroughs\n" +
                      "Quest progress tracking\n" +
                      "OSRS item price checker\n" +
                      "Floating overlay mode"
                  );
                  subtitle.setTextSize(18);
                  subtitle.setPadding(0, 30, 0, 30);
                  layout.addView(subtitle);

                  Button overlayButton = new Button(this);
                  overlayButton.setText("START OVERLAY");
                  layout.addView(overlayButton);

                  Button stopButton = new Button(this);
                  stopButton.setText("STOP OVERLAY");
                  layout.addView(stopButton);

                  overlayButton.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                          return;
                      }

                      Intent serviceIntent =
                          new Intent(this, OverlayService.class);

                      startService(serviceIntent);
                  });

                  stopButton.setOnClickListener(v -> {
                      Intent serviceIntent =
                          new Intent(this, OverlayService.class);

                      stopService(serviceIntent);
                  });

                  setContentView(layout);
              }
          }
          EOF

      # --------------------------------------------------
      # 12. Create OverlayService
      # --------------------------------------------------
      - name: Create OverlayService
        shell: bash
        run: |
          cat > questmate-build/app/src/main/java/com/questmate/app/OverlayService.java <<'EOF'
          package com.questmate.app;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager windowManager;
              private View overlayView;

              @Override
              public void onCreate() {
                  super.onCreate();

                  windowManager =
                      (WindowManager) getSystemService(WINDOW_SERVICE);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(20, 15, 20, 15);
                  box.setBackgroundColor(Color.rgb(25, 25, 30));

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(18);

                  box.addView(title);

                  Button minimise = new Button(this);
                  minimise.setText("MINIMISE");
                  box.addView(minimise);

                  Button maximise = new Button(this);
                  maximise.setText("MAXIMISE");
                  box.addView(maximise);

                  Button close = new Button(this);
                  close.setText("CLOSE");
                  box.addView(close);

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 20;
                  params.y = 120;

                  overlayView = box;

                  windowManager.addView(overlayView, params);

                  minimise.setOnClickListener(v -> {
                      box.setVisibility(View.GONE);
                  });

                  maximise.setOnClickListener(v -> {
                      box.setVisibility(View.VISIBLE);
                  });

                  close.setOnClickListener(v -> {
                      stopSelf();
                  });
              }

              @Override
              public void onDestroy() {

                  if (overlayView != null) {
                      windowManager.removeView(overlayView);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      # --------------------------------------------------
      # 13. Download Gradle
      # --------------------------------------------------
      - name: Download Gradle 8.9
        shell: bash
        run: |
          cd questmate-build

          curl -L \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip

          mv gradle-8.9 gradle

          chmod +x gradle/bin/gradle

      # --------------------------------------------------
      # 14. Build APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          cd questmate-build

          ./gradle/bin/gradle \
            clean \
            assembleDebug \
            --stacktrace

      # --------------------------------------------------
      # 15. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find questmate-build \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # 16. Prepare APK
      # --------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p dist

          APK_PATH=$(find questmate-build/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found."
            echo "Full APK directory:"
            find questmate-build/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK_PATH"

          cp "$APK_PATH" dist/QuestMate.apk

      # --------------------------------------------------
      # 17. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "dist/QuestMate.apk" ]; then
            echo "ERROR: dist/QuestMate.apk does not exist."
            exit 1
          fi

          echo "APK successfully prepared."

          ls -lh dist/QuestMate.apk

          file dist/QuestMate.apk

      # --------------------------------------------------
      # 18. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
