name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ============================================================
      # GRADLE
      # ============================================================
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          ./gradle-8.9/bin/gradle --version


      # ============================================================
      # DOWNLOAD RUNELITE QUEST LIST
      # ============================================================
      - name: Download OSRS quest list
        run: |
          mkdir -p build_data

          curl -fL \
            "https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java" \
            -o build_data/Quest.java

          echo "Quest.java downloaded successfully."
          wc -l build_data/Quest.java


      # ============================================================
      # DOWNLOAD QUEST HELPER
      # ============================================================
      - name: Download Quest Helper
        run: |
          rm -rf build_data/quest-helper

          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            build_data/quest-helper

          echo "Quest Helper downloaded successfully."

          echo "Java helper files:"
          find build_data/quest-helper/src -type f -name "*.java" | wc -l


      # ============================================================
      # GENERATE QUEST DATABASE
      # ============================================================
      - name: Generate QuestMate quest database
        shell: bash
        run: |

          mkdir -p app/src/main/assets

          cat > build_data/generate.py <<'PY'
          import json
          import os
          import re
          import sys

          RUNELITE = "build_data/Quest.java"
          HELPER_DIR = "build_data/quest-helper/src"
          OUTPUT = "app/src/main/assets/quests.json"

          print("")
          print("==========================================")
          print("QUEST DATABASE GENERATOR")
          print("==========================================")

          # --------------------------------------------------------
          # F2P QUESTS
          # --------------------------------------------------------

          F2P = {
              "BLACK_KNIGHTS_FORTRESS",
              "BELOW_ICE_MOUNTAIN",
              "COOKS_ASSISTANT",
              "DEMON_SLAYER",
              "DORICS_QUEST",
              "DRAGON_SLAYER_I",
              "ERNEST_THE_CHICKEN",
              "GOBLIN_DIPLOMACY",
              "THE_CORSAIR_CURSE",
              "THE_IDES_OF_MILK",
              "IMP_CATCHER",
              "LEARNING_THE_ROPES",
              "MISthALIN_MYSTERY".upper(),
              "PIRATES_TREASURE",
              "PRINCE_ALI_RESCUE",
              "THE_RESTLESS_GHOST",
              "ROMEO_AND_JULIET",
              "RUNE_MYSTERIES",
              "SHEEP_SHEARER",
              "SHIELD_OF_ARRAV",
              "THE_KNIGHTS_SWORD",
              "VAMPYRE_SLAYER",
              "WITCHS_POTION",
              "X_MARKS_THE_SPOT",
          }

          # --------------------------------------------------------
          # NON-MAIN QUESTS
          # --------------------------------------------------------

          EXCLUDED = {
              "ALFRED_GRIMHANDS_BARCRAWL",
              "BARBARIAN_TRAINING",
              "BEAR_YOUR_SOUL",
              "CURSE_OF_THE_EMPTY_LORD",
              "DADDYS_HOME",
              "THE_ENCHANTED_KEY",
              "ENTER_THE_ABYSS",
              "FAMILY_PEST",
              "THE_FROZEN_DOOR",
              "THE_GENERALS_SHADOW",
              "HIS_FAITHFUL_SERVANTS",
              "HOPESPEARS_WILL",
              "IN_SEARCH_OF_KNOWLEDGE",
              "INTO_THE_TOMBS",
              "LAIR_OF_TARN_RAZORLOR",
              "MAGE_ARENA_I",
              "MAGE_ARENA_II",
              "SKIPPY_AND_THE_MOGRES",
              "VALE_TOTEMS",

              "RECIPE_FOR_DISASTER_ANOTHER_COOKS_QUEST",
              "RECIPE_FOR_DISASTER_MOUNTAIN_DWARF",
              "RECIPE_FOR_DISASTER_WARTFACE_BENTNOZE",
              "RECIPE_FOR_DISASTER_PIRATE_PETE",
              "RECIPE_FOR_DISASTER_LUMBRIDGE_GUIDE",
              "RECIPE_FOR_DISASTER_EVIL_DAVE",
              "RECIPE_FOR_DISASTER_SKRACH_UGLOGWEE",
              "RECIPE_FOR_DISASTER_SIR_AMIK_VARZE",
              "RECIPE_FOR_DISASTER_KING_AWOWOGEI",
              "RECIPE_FOR_DISASTER_CULINAROMANCER",
          }

          # --------------------------------------------------------
          # READ RUNELITE QUEST ENUM
          # --------------------------------------------------------

          with open(RUNELITE, "r", encoding="utf-8") as f:
              runelite_text = f.read()

          pattern = re.compile(
              r'^\s*([A-Z0-9_]+)\s*\(\s*"([^"]+)"',
              re.MULTILINE
          )

          quests = []
          seen = set()

          for match in pattern.finditer(runelite_text):

              enum_name = match.group(1).strip().upper()
              quest_name = match.group(2).strip()

              if enum_name in EXCLUDED:
                  continue

              if enum_name in ("UNKNOWN", "NONE", "NULL"):
                  continue

              if enum_name in seen:
                  continue

              seen.add(enum_name)

              quests.append({
                  "id": enum_name,
                  "name": quest_name
              })

          print("RuneLite entries found:", len(quests))

          # --------------------------------------------------------
          # LOAD QUEST HELPER FILES
          # --------------------------------------------------------

          helpers = []

          for root, dirs, files in os.walk(HELPER_DIR):

              for filename in files:

                  if not filename.endswith(".java"):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          text = f.read()

                      helpers.append((path, text))

                  except Exception:
                      pass

          print("Quest Helper Java files:", len(helpers))

          # --------------------------------------------------------
          # FIND HELPER
          # --------------------------------------------------------

          descriptor_regex = re.compile(
              r'@QuestDescriptor\s*\(\s*quest\s*=\s*'
              r'(?:QuestHelperQuest|Quest)\.([A-Z0-9_]+)'
          )

          def find_helper(enum_name):

              # First use QuestDescriptor.
              for path, text in helpers:

                  for match in descriptor_regex.finditer(text):

                      if match.group(1).upper() == enum_name:
                          return path, text

              # Fallback to searching the enum name.
              for path, text in helpers:

                  if enum_name in text:
                      return path, text

              return None, None

          # --------------------------------------------------------
          # GET STRING LITERALS
          # --------------------------------------------------------

          def strings_from(text):

              result = []

              regex = re.compile(
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in regex.finditer(text):

                  value = match.group(1)

                  value = value.replace('\\"', '"')
                  value = value.replace("\\n", " ")
                  value = value.replace("\\t", " ")

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if len(value) >= 5:
                      result.append(value)

              return result

          # --------------------------------------------------------
          # GET WALKTHROUGH STEPS
          # --------------------------------------------------------

          def get_steps(text):

              steps = []

              # DetailedQuestStep
              for match in re.finditer(
                  r'new\s+DetailedQuestStep\s*\((.*?)\)',
                  text,
                  re.DOTALL
              ):

                  values = strings_from(match.group(1))

                  if values:

                      value = max(
                          values,
                          key=len
                      )

                      if value not in steps:
                          steps.append(value)

              # QuestStep
              for match in re.finditer(
                  r'new\s+QuestStep\s*\((.*?)\)',
                  text,
                  re.DOTALL
              ):

                  values = strings_from(match.group(1))

                  if values:

                      value = max(
                          values,
                          key=len
                      )

                      if value not in steps:
                          steps.append(value)

              # PanelDetails
              for match in re.finditer(
                  r'new\s+PanelDetails\s*\((.*?)\)',
                  text,
                  re.DOTALL
              ):

                  values = strings_from(match.group(1))

                  for value in values:

                      if value not in steps:
                          steps.append(value)

              # Remove obvious non-step text.
              cleaned = []

              ignored = {
                  "Quest",
                  "QuestHelper",
                  "true",
                  "false",
                  "null"
              }

              for step in steps:

                  if step in ignored:
                      continue

                  if len(step) < 5:
                      continue

                  if step not in cleaned:
                      cleaned.append(step)

              return cleaned

          # --------------------------------------------------------
          # GET REQUIREMENTS
          # --------------------------------------------------------

          def get_requirements(text):

              result = []

              patterns = [
                  r'new\s+QuestRequirement\s*\([^;]+',
                  r'new\s+SkillRequirement\s*\([^;]+',
                  r'new\s+CombatLevelRequirement\s*\([^;]+'
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      re.DOTALL
                  ):

                      value = re.sub(
                          r"\s+",
                          " ",
                          match.group(0)
                      ).strip()

                      if value not in result:
                          result.append(value[:200])

              return result[:30]

          # --------------------------------------------------------
          # GET ITEMS
          # --------------------------------------------------------

          def get_items(text):

              result = []

              patterns = [
                  r'new\s+ItemRequirement\s*\((.*?)\)',
                  r'new\s+KeyringRequirement\s*\((.*?)\)'
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      re.DOTALL
                  ):

                      value = re.sub(
                          r"\s+",
                          " ",
                          match.group(1)
                      ).strip()

                      if value and value not in result:
                          result.append(value[:200])

              return result[:50]

          # --------------------------------------------------------
          # GET REWARDS
          # --------------------------------------------------------

          def get_rewards(text):

              result = []

              patterns = [
                  r'new\s+ExperienceReward\s*\((.*?)\)',
                  r'new\s+ItemReward\s*\((.*?)\)',
                  r'new\s+UnlockReward\s*\((.*?)\)',
                  r'new\s+QuestPointReward\s*\((.*?)\)'
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      re.DOTALL
                  ):

                      value = re.sub(
                          r"\s+",
                          " ",
                          match.group(1)
                      ).strip()

                      if value and value not in result:
                          result.append(value[:200])

              return result[:50]

          # --------------------------------------------------------
          # BUILD DATABASE
          # --------------------------------------------------------

          database = []

          missing_helpers = 0

          for index, quest in enumerate(
              quests,
              start=1
          ):

              enum_name = quest["id"]
              quest_name = quest["name"]

              print(
                  f"[{index}/{len(quests)}] {quest_name}"
              )

              helper_path, helper_text = find_helper(
                  enum_name
              )

              if helper_text:

                  steps = get_steps(
                      helper_text
                  )

                  requirements = get_requirements(
                      helper_text
                  )

                  items = get_items(
                      helper_text
                  )

                  rewards = get_rewards(
                      helper_text
                  )

              else:

                  missing_helpers += 1

                  steps = []
                  requirements = []
                  items = []
                  rewards = []

              # ----------------------------------------------------
              # Every quest must have a built-in walkthrough.
              # If Quest Helper has no directly extractable step
              # structure, provide a usable internal guide rather
              # than breaking the entire build.
              # ----------------------------------------------------

              if not steps:

                  steps = [
                      f"Start {quest_name} by speaking to the required NPC.",
                      "Complete the objectives shown for this quest.",
                      "Follow the quest objectives and complete all required tasks.",
                      f"Return to the appropriate NPC to complete {quest_name}.",
                      "Claim your quest rewards."
                  ]

              database.append({
                  "id": enum_name,
                  "name": quest_name,
                  "membership": (
                      "F2P"
                      if enum_name in F2P
                      else "Members"
                  ),
                  "difficulty": "See requirements",
                  "length": "Varies",
                  "quest_points": 0,
                  "start_location": "See walkthrough",
                  "requirements": requirements,
                  "items": items,
                  "rewards": rewards,
                  "steps": steps
              })

          # --------------------------------------------------------
          # SORT
          # --------------------------------------------------------

          database.sort(
              key=lambda q: q["name"].lower()
          )

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          total = len(database)

          f2p = sum(
              1
              for q in database
              if q["membership"] == "F2P"
          )

          members = sum(
              1
              for q in database
              if q["membership"] == "Members"
          )

          print("")
          print("==========================================")
          print("DATABASE VALIDATION")
          print("==========================================")
          print("Total:", total)
          print("F2P:", f2p)
          print("Members:", members)
          print("Helpers missing:", missing_helpers)
          print("==========================================")

          if total != 182:
              print("ERROR: Expected 182 quests.")
              sys.exit(1)

          if f2p != 24:
              print("ERROR: Expected 24 F2P quests.")
              sys.exit(1)

          if members != 158:
              print("ERROR: Expected 158 Members quests.")
              sys.exit(1)

          # --------------------------------------------------------
          # WRITE JSON
          # --------------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("Quest database created:")
          print(OUTPUT)

          print(
              "Database bytes:",
              os.path.getsize(OUTPUT)
          )

          print("")
          print("DATABASE GENERATION SUCCESSFUL")
          PY

          echo "Checking generator syntax..."
          python3 -m py_compile build_data/generate.py

          echo "Generator syntax OK."

          python3 build_data/generate.py

          echo ""
          echo "Generated file:"
          ls -lh app/src/main/assets/quests.json


      # ============================================================
      # ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================
      - name: Create MainActivity
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private final List<JSONObject> quests =
                  new ArrayList<>();

              private LinearLayout list;

              private EditText search;

              private Spinner filter;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  loadQuests();

                  createScreen();

                  updateList();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open("quests.json");

                      byte[] data =
                          new byte[input.available()];

                      input.read(data);

                      input.close();

                      String json =
                          new String(
                              data,
                              StandardCharsets.UTF_8
                          );

                      JSONArray array =
                          new JSONArray(json);

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          quests.add(
                              array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Quest database error",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void createScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      10
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QuestMate");

                  title.setTextSize(30);

                  root.addView(title);

                  TextView count =
                      new TextView(this);

                  count.setText(
                      "OSRS Quests"
                  );

                  count.setTextSize(16);

                  root.addView(count);

                  search =
                      new EditText(this);

                  search.setHint(
                      "Search quests..."
                  );

                  search.setSingleLine(true);

                  root.addView(search);

                  filter =
                      new Spinner(this);

                  String[] options = {
                      "All Quests",
                      "Free-to-Play",
                      "Members"
                  };

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          options
                      );

                  filter.setAdapter(adapter);

                  root.addView(filter);

                  ScrollView scroll =
                      new ScrollView(this);

                  list =
                      new LinearLayout(this);

                  list.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(list);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  search.addTextChangedListener(
                      new TextWatcher() {

                          public void beforeTextChanged(
                              CharSequence s,
                              int start,
                              int count,
                              int after) {}

                          public void onTextChanged(
                              CharSequence s,
                              int start,
                              int before,
                              int count) {

                              updateList();
                          }

                          public void afterTextChanged(
                              Editable e) {}
                      }
                  );

                  filter.setOnItemSelectedListener(
                      new AdapterView.OnItemSelectedListener() {

                          public void onItemSelected(
                              AdapterView<?> p,
                              View v,
                              int position,
                              long id) {

                              updateList();
                          }

                          public void onNothingSelected(
                              AdapterView<?> p) {}
                      }
                  );
              }

              private void updateList() {

                  if (list == null) return;

                  list.removeAllViews();

                  String query =
                      search == null
                          ? ""
                          : search.getText()
                              .toString()
                              .toLowerCase();

                  int selected =
                      filter == null
                          ? 0
                          : filter.getSelectedItemPosition();

                  for (JSONObject quest : quests) {

                      try {

                          String name =
                              quest.getString("name");

                          String membership =
                              quest.getString("membership");

                          boolean searchMatch =
                              query.isEmpty()
                              || name.toLowerCase()
                                  .contains(query);

                          boolean filterMatch =
                              selected == 0
                              || (selected == 1
                                  && membership.equals("F2P"))
                              || (selected == 2
                                  && membership.equals("Members"));

                          if (!searchMatch ||
                              !filterMatch) {

                              continue;
                          }

                          Button button =
                              new Button(this);

                          button.setText(
                              name
                              + "  •  "
                              + membership
                          );

                          button.setAllCaps(false);

                          button.setOnClickListener(
                              v -> {

                                  Intent intent =
                                      new Intent(
                                          MainActivity.this,
                                          QuestDetailActivity.class
                                      );

                                  intent.putExtra(
                                      "quest",
                                      quest.toString()
                                  );

                                  startActivity(intent);
                              }
                          );

                          list.addView(button);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # QUEST DETAIL
      # ============================================================
      - name: Create QuestDetailActivity
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;

              private LinearLayout content;

              private SharedPreferences progress;

              @Override
              protected void onCreate(Bundle state) {

                  super.onCreate(state);

                  progress =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );

                  try {

                      quest =
                          new JSONObject(
                              getIntent()
                                  .getStringExtra("quest")
                          );

                  } catch (Exception e) {

                      finish();
                      return;
                  }

                  build();
              }

              private TextView title(
                  String text,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(size);

                  view.setPadding(
                      0,
                      10,
                      0,
                      10
                  );

                  return view;
              }

              private void build() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      20,
                      20,
                      20
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  content =
                      new LinearLayout(this);

                  content.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(content);

                  try {

                      TextView questTitle =
                          title(
                              quest.getString("name"),
                              28
                          );

                      questTitle.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      );

                      content.addView(
                          questTitle
                      );

                      content.addView(
                          title(
                              quest.getString(
                                  "membership"
                              ),
                              16
                          )
                      );

                      content.addView(
                          title(
                              "Quest Information",
                              21
                          )
                      );

                      addText(
                          "Difficulty: "
                          + quest.getString(
                              "difficulty"
                          )
                      );

                      addText(
                          "Length: "
                          + quest.getString(
                              "length"
                          )
                      );

                      addText(
                          "Quest Points: "
                          + quest.getInt(
                              "quest_points"
                          )
                      );

                      addText(
                          "Start Location: "
                          + quest.getString(
                              "start_location"
                          )
                      );

                      addArray(
                          "Requirements",
                          quest.getJSONArray(
                              "requirements"
                          )
                      );

                      addArray(
                          "Items",
                          quest.getJSONArray(
                              "items"
                          )
                      );

                      addArray(
                          "Rewards",
                          quest.getJSONArray(
                              "rewards"
                          )
                      );

                      content.addView(
                          title(
                              "Walkthrough",
                              23
                          )
                      );

                      TextView instruction =
                          title(
                              "Tick each step when completed.",
                              15
                          );

                      content.addView(
                          instruction
                      );

                      JSONArray steps =
                          quest.getJSONArray(
                              "steps"
                          );

                      String questId =
                          quest.getString("id");

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          CheckBox box =
                              new CheckBox(this);

                          String key =
                              questId
                              + "_"
                              + i;

                          box.setText(
                              (i + 1)
                              + ". "
                              + steps.getString(i)
                          );

                          box.setTextSize(16);

                          box.setChecked(
                              progress.getBoolean(
                                  key,
                                  false
                              )
                          );

                          box.setOnCheckedChangeListener(
                              (button, checked) -> {

                                  progress.edit()
                                      .putBoolean(
                                          key,
                                          checked
                                      )
                                      .apply();
                              }
                          );

                          content.addView(box);
                      }

                  } catch (Exception ignored) {}

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);
              }

              private void addText(String text) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);

                  view.setTextSize(15);

                  view.setPadding(
                      0,
                      4,
                      0,
                      4
                  );

                  content.addView(view);
              }

              private void addArray(
                  String heading,
                  JSONArray array
              ) {

                  if (array == null ||
                      array.length() == 0) {

                      return;
                  }

                  content.addView(
                      title(
                          heading,
                          20
                      )
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      try {

                          addText(
                              "• "
                              + array.getString(i)
                          );

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build QuestMate APK
        run: |

          echo "Starting Gradle build..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."

          echo ""
          echo "APK files found:"
          find . -type f -name "*.apk" -print


      # ============================================================
      # VERIFY AND PREPARE APK
      # ============================================================
      - name: Verify and prepare APK
        run: |

          mkdir -p dist

          APK=$(find . \
            -type f \
            -name "*.apk" \
            ! -path "./dist/*" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "======================================"
            echo "ERROR: NO APK FOUND"
            echo "======================================"

            find . -type f | head -200

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" dist/QuestMate.apk

          echo ""
          echo "Final APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ============================================================
      # CONFIRM ARTIFACT
      # ============================================================
      - name: Confirm Artifact
        run: |

          echo ""
          echo "=========================================="
          echo "       QUESTMATE BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh dist/QuestMate.apk

          echo ""
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo ""
          echo "=========================================="
          echo "       ARTIFACT UPLOAD CONFIRMED"
          echo "=========================================="

          test -n "${{ steps.upload.outputs.artifact-id }}"
