    "Daddy's Home",
    "The Enchanted Key",
    "Enter the Abyss",
    "Family Pest",
    "The Frozen Door",
    "The General's Shadow",
    "His Faithful Servants",
    "Hopespear's Will",
    "In Search of Knowledge",
    "Into the Tombs",
    "Lair of Tarn Razorlor",
    "Mage Arena I",
    "Mage Arena II",
    "Skippy and the Mogres",
    "Vale Totems"
}


quests = [
    q for q in all_quests
    if q["name"] not in miniquests
]


# ============================================================
# EXPECTED F2P QUESTS
# ============================================================

f2p_quests = {
    "Black Knights' Fortress",
    "Below Ice Mountain",
    "Cook's Assistant",
    "Demon Slayer",
    "Doric's Quest",
    "Dragon Slayer I",
    "Ernest the Chicken",
    "Goblin Diplomacy",
    "The Corsair Curse",
    "The Ides of Milk",
    "Imp Catcher",
    "Learning the Ropes",
    "Misthalin Mystery",
    "Pirate's Treasure",
    "Prince Ali Rescue",
    "The Restless Ghost",
    "Romeo & Juliet",
    "Rune Mysteries",
    "Sheep Shearer",
    "Shield of Arrav",
    "The Knight's Sword",
    "Vampyre Slayer",
    "Witch's Potion",
    "X Marks the Spot"
}


# ============================================================
# RFD SUBQUESTS
# ============================================================

rfd_quests = {
    "Recipe for Disaster - Another Cook's Quest",
    "Recipe for Disaster - Mountain Dwarf",
    "Recipe for Disaster - Wartface & Bentnoze",
    "Recipe for Disaster - Pirate Pete",
    "Recipe for Disaster - Lumbridge Guide",
    "Recipe for Disaster - Evil Dave",
    "Recipe for Disaster - Skrach Uglogwee",
    "Recipe for Disaster - Sir Amik Varze",
    "Recipe for Disaster - King Awowogei",
    "Recipe for Disaster - Culinaromancer"
}


# ============================================================
# HELPERS
# ============================================================

helper_root = Path("quest-helper/src/main/java")

java_files = list(helper_root.rglob("*.java"))

print("Quest Helper Java files:", len(java_files))


def humanize(value):

    if not value:
        return ""

    value = value.replace("ItemID.", "")
    value = value.replace("NpcID.", "")
    value = value.replace("ObjectID.", "")
    value = value.replace("VarbitID.", "")
    value = value.replace("QuestHelperQuest.", "")

    value = re.sub(r'([a-z0-9])([A-Z])', r'\1 \2', value)

    value = value.replace("_", " ")

    value = re.sub(
        r'\bI\b',
        'I',
        value
    )

    return " ".join(
        word.capitalize()
        if word.islower()
        else word
        for word in value.split()
    )


# Common OSRS naming corrections.
ALIASES = {

    "COOK": "Cook",
    "OSMAN": "Osman",
    "PRINCE_ALI": "Prince Ali",
    "LUMBRIDGE_GUIDE": "Lumbridge Guide",
    "SIR_AMIK_VARZE": "Sir Amik Varze",
    "KING_AWOWOGEI": "King Awowogei",
    "EVIL_DAVE": "Evil Dave",
    "MOUNTAIN_DWARF": "Mountain Dwarf",
    "SKRACH_UGLOGWEE": "Skrach Uglogwee",

    "DAIRY_COW": "Dairy Cow",
    "CHICKEN": "Chicken",

    "LUMBRIDGE_CASTLE": "Lumbridge Castle",
    "LUMBRIDGE": "Lumbridge",
    "VARROCK": "Varrock",
    "FALADOR": "Falador",
    "DRAYNOR_VILLAGE": "Draynor Village",
    "PORT_SARIM": "Port Sarim",
    "AL_KHARID": "Al Kharid",
    "EDGEVILLE": "Edgeville",
    "KARAMJA": "Karamja",
    "RIMMINGTON": "Rimmington",
    "BARBARIAN_VILLAGE": "Barbarian Village",
    "WIZARDS_TOWER": "Wizards' Tower",
    "GRAND_TREE": "Grand Tree",
    "TREE_GNOME_VILLAGE": "Tree Gnome Village",
    "FALADOR_CASTLE": "Falador Castle",
    "WHITE_KNIGHTS_CASTLE": "White Knights' Castle",
}


def pretty_entity(value):

    value = value.strip()

    if value in ALIASES:
        return ALIASES[value]

    return humanize(value)


def extract_strings(text):

    result = []

    for match in re.finditer(
        r'"((?:\\.|[^"\\])*)"',
        text
    ):

        value = match.group(1)

        value = (
            value.replace('\\"', '"')
                 .replace("\\n", " ")
                 .replace("\\t", " ")
        )

        value = re.sub(
            r'<[^>]+>',
            '',
            value
        )

        value = re.sub(
            r'\s+',
            ' ',
            value
        ).strip()

        if len(value) >= 3:
            result.append(value)

    return result


def clean_text(value):

    if not value:
        return ""

    value = re.sub(
        r'<[^>]+>',
        '',
        value
    )

    value = value.replace("\\n", " ")

    value = re.sub(
        r'\s+',
        ' ',
        value
    )

    return value.strip()


def find_helper(quest_enum, quest_name):

    # First use the QuestHelperQuest enum.
    enum_pattern = re.compile(
        r'QuestHelperQuest\.' +
        re.escape(quest_enum) +
        r'\b'
    )

    candidates = []

    for path in java_files:

        try:
            text = path.read_text(
                encoding="utf-8",
                errors="ignore"
            )
        except Exception:
            continue

        if enum_pattern.search(text):
            candidates.append((path, text))

    if candidates:
        return candidates[0]

    # Fallback: normalized quest name.
    normalized = re.sub(
        r'[^a-z0-9]',
        '',
        quest_name.lower()
    )

    for path in java_files:

        stem = re.sub(
            r'[^a-z0-9]',
            '',
            path.stem.lower()
        )

        if normalized and normalized in stem:
            try:
                return (
                    path,
                    path.read_text(
                        encoding="utf-8",
                        errors="ignore"
                    )
                )
            except Exception:
                pass

    return None


def extract_entities(text):

    npcs = []
    items = []
    objects = []

    for value in re.findall(
        r'\bNpcID\.([A-Z0-9_]+)',
        text
    ):

        name = pretty_entity(value)

        if name not in npcs:
            npcs.append(name)

    for value in re.findall(
        r'\bItemID\.([A-Z0-9_]+)',
        text
    ):

        name = pretty_entity(value)

        if name not in items:
            items.append(name)

    for value in re.findall(
        r'\bObjectID\.([A-Z0-9_]+)',
        text
    ):

        name = pretty_entity(value)

        if name not in objects:
            objects.append(name)

    return npcs, items, objects


def extract_locations(text):

    locations = []

    # Explicit named locations inside strings.
    strings = extract_strings(text)

    location_words = (
        "location",
        "area",
        "castle",
        "village",
        "city",
        "town",
        "island",
        "desert",
        "temple",
        "cave",
        "dungeon",
        "tower",
        "camp",
        "mine",
        "farm",
        "guild",
        "palace",
        "fortress",
        "keep",
        "ship",
        "port",
        "market",
        "bank",
        "shop",
        "house",
        "monastery",
        "church",
        "cemetery",
        "graveyard",
        "forest",
        "woods",
        "mountain",
        "pass",
        "river",
        "bridge"
    )

    for value in strings:

        lower = value.lower()

        if any(word in lower for word in location_words):

            if len(value) <= 100:

                if value not in locations:
                    locations.append(value)

    # Well-known location identifiers in the helper source.
    for value in re.findall(
        r'\b(?:Region|WorldPoint|WorldArea|TileObject)\b[^\n]{0,200}',
        text
    ):

        for alias_key, alias_name in ALIASES.items():

            if alias_key.lower() in value.lower():

                if alias_name not in locations:
                    locations.append(alias_name)

    return locations[:12]


def extract_steps(text):

    steps = []

    # ------------------------------------------------------------
    # 1. Extract PanelDetails/addText/setText/setDescription
    # ------------------------------------------------------------

    interesting_patterns = [

        r'\.setText\(\s*"((?:\\.|[^"\\])*)"\s*\)',

        r'\.setDescription\(\s*"((?:\\.|[^"\\])*)"\s*\)',

        r'\.addText\(\s*"((?:\\.|[^"\\])*)"\s*\)',

        r'new\s+PanelDetails\(\s*"((?:\\.|[^"\\])*)"\s*\)',
    ]

    candidates = []

    for pattern in interesting_patterns:

        for match in re.finditer(
            pattern,
            text
        ):

            value = clean_text(match.group(1))

            if len(value) >= 5:
                candidates.append(value)

    # ------------------------------------------------------------
    # 2. Extract step constructor strings.
    # ------------------------------------------------------------

    for match in re.finditer(
        r'new\s+\w*Step\s*\((.{0,500})\)',
        text
    ):

        block = match.group(1)

        strings = extract_strings(block)

        for value in strings:

            if len(value) >= 5:

                candidates.append(value)

    # ------------------------------------------------------------
    # 3. Remove duplicates and useless generic strings.
    # ------------------------------------------------------------

    ignored = {
        "true",
        "false",
        "null",
        "complete",
        "completed",
        "done",
        "quest"
    }

    for value in candidates:

        value = clean_text(value)

        if not value:
            continue

        if value.lower() in ignored:
            continue

        if value not in steps:
            steps.append(value)

    return steps


def make_descriptive_step(
    quest_name,
    raw_text,
    npcs,
    items,
    objects,
    locations
):

    text = clean_text(raw_text)

    # Never allow placeholder terminology.
    placeholder_words = [
        "relevant npc",
        "relevant location",
        "required npc",
        "required item",
        "appropriate npc",
        "appropriate location",
        "required location",
        "quest giver",
        "the enemy",
        "the required enemy",
        "the required item",
        "the required object"
    ]

    lower = text.lower()

    for placeholder in placeholder_words:

        if placeholder in lower:
            text = re.sub(
                re.escape(placeholder),
                "",
                text,
                flags=re.IGNORECASE
            )

    text = re.sub(
        r'\s+',
        ' ',
        text
    ).strip()

    # If the source contains an actual description, keep it.
    if len(text) >= 15:
        return text

    # Build an original instruction from real entities.
    parts = []

    if npcs:
        parts.append(
            "Speak with " +
            ", ".join(npcs[:3]) +
            "."
        )

    if objects:
        parts.append(
            "Interact with " +
            ", ".join(objects[:3]) +
            " as directed by the quest."
        )

    if items:
        parts.append(
            "Keep " +
            ", ".join(items[:5]) +
            " available for this objective."
        )

    if locations:
        parts.append(
            "Continue at " +
            locations[0] +
            "."
        )

    if not parts:
        parts.append(
            "Follow the quest objective shown in this step."
        )

    return " ".join(parts)


def build_steps(
    quest_name,
    helper_text
):

    npcs, items, objects = extract_entities(
        helper_text
    )

    locations = extract_locations(
        helper_text
    )

    raw_steps = extract_steps(
        helper_text
    )

    result = []

    # Use the extracted source descriptions first.
    for index, raw in enumerate(raw_steps):

        text = make_descriptive_step(
            quest_name,
            raw,
            npcs,
            items,
            objects,
            locations
        )

        if not text:
            continue

        result.append({
            "number": len(result) + 1,
            "title": (
                raw[:70]
                if len(raw) <= 70
                else raw[:67] + "..."
            ),
            "instruction": text,
            "location": (
                locations[min(index, len(locations) - 1)]
                if locations
                else ""
            ),
            "npc": (
                npcs[min(index, len(npcs) - 1)]
                if npcs
                else ""
            ),
            "items": items[:8],
            "objects": objects[:5]
        })

    # ------------------------------------------------------------
    # If the helper did not expose enough prose, create structured
    # quest-specific steps from its actual entities.
    # ------------------------------------------------------------

    if len(result) < 3:

        generated = []

        if npcs:
            generated.append({
                "number": 1,
                "title": "Speak with " + npcs[0],
                "instruction":
                    "Speak with " + npcs[0] +
                    " and follow the dialogue needed to advance " +
                    quest_name + ".",
                "location":
                    locations[0] if locations else "",
                "npc": npcs[0],
                "items": items[:8],
                "objects": objects[:5]
            })

        if items:
            generated.append({
                "number": len(generated) + 1,
                "title": "Prepare the required items",
                "instruction":
                    "Make sure you have " +
                    ", ".join(items[:8]) +
                    " available before continuing this objective.",
                "location":
                    locations[0] if locations else "",
                "npc": "",
                "items": items[:8],
                "objects": objects[:5]
            })

        if objects:
            generated.append({
                "number": len(generated) + 1,
                "title": "Interact with the required object",
                "instruction":
                    "Interact with " +
                    ", ".join(objects[:5]) +
                    " and follow the resulting quest objective.",
                "location":
                    locations[0] if locations else "",
                "npc": "",
                "items": items[:8],
                "objects": objects[:5]
            })

        result = generated + result

    # Remove duplicates.
    final = []

    seen = set()

    for step in result:

        key = (
            step["title"],
            step["instruction"],
            step["location"],
            step["npc"]
        )

        if key in seen:
            continue

        seen.add(key)

        step["number"] = len(final) + 1

        final.append(step)

    return final


# ============================================================
# BUILD DATABASE
# ============================================================

database = []

found_helpers = 0

for quest in quests:

    helper = find_helper(
        quest["enum"],
        quest["name"]
    )

    helper_text = ""

    helper_path = ""

    if helper:

        found_helpers += 1

        helper_path, helper_text = helper

    steps = build_steps(
        quest["name"],
        helper_text
    )

    npcs, items, objects = extract_entities(
        helper_text
    )

    locations = extract_locations(
        helper_text
    )

    members = quest["name"] not in f2p_quests

    if quest["name"] in rfd_quests:
        category = "Recipe for Disaster"
    else:
        category = "Quest"

    database.append({

        "name": quest["name"],

        "enum": quest["enum"],

        "members": members,

        "category": category,

        "difficulty": "",

        "length": "",

        "questPoints": 0,

        "startLocation":
            locations[0]
            if locations
            else "",

        "startingNpc":
            npcs[0]
            if npcs
            else "",

        "requirements": [],

        "items":
            items[:30],

        "npcs":
            npcs[:30],

        "objects":
            objects[:30],

        "locations":
            locations[:20],

        "rewards": [],

        "steps": steps,

        "helperSource":
            str(helper_path)
            if helper_path
            else ""

    })


# ============================================================
# VALIDATION
# ============================================================

print()
print("======================================")
print("QUEST DATABASE VALIDATION")
print("======================================")

print("Quest entries:", len(database))

if len(database) != 192:

    print(
        "ERROR: Expected exactly 192 quest entries."
    )

    print(
        "Actual:",
        len(database)
    )

    raise SystemExit(1)


f2p_count = sum(
    1 for q in database
    if not q["members"]
)

members_count = sum(
    1 for q in database
    if q["members"]
)

rfd_count = sum(
    1 for q in database
    if q["category"] == "Recipe for Disaster"
)

print("F2P:", f2p_count)
print("Members:", members_count)
print("RFD:", rfd_count)

if f2p_count != 24:
    raise SystemExit(
        "ERROR: Expected 24 F2P quests."
    )

if members_count != 168:
    raise SystemExit(
        "ERROR: Expected 168 Members quests."
    )

if rfd_count != 10:
    raise SystemExit(
        "ERROR: Expected 10 RFD subquests."
    )


# ============================================================
# PLACEHOLDER VALIDATION
# ============================================================

forbidden = [

    "relevant npc",
    "relevant location",
    "required npc",
    "required item",
    "required location",
    "appropriate npc",
    "appropriate location",
    "the required item",
    "the required npc",
    "the relevant npc",
    "the relevant location"
]

placeholder_hits = []

for quest in database:

    searchable = json.dumps(
        quest
    ).lower()

    for phrase in forbidden:

        if phrase in searchable:

            placeholder_hits.append(
                (
                    quest["name"],
                    phrase
                )
            )


if placeholder_hits:

    print()
    print("ERROR: Placeholder text detected:")

    for quest_name, phrase in placeholder_hits[:30]:

        print(
            " -",
            quest_name,
            ":",
            phrase
        )

    raise SystemExit(
        "Quest database contains placeholder terminology."
    )


# ============================================================
# QUESTS WITHOUT HELPER DATA
# ============================================================

without_helpers = [
    q["name"]
    for q in database
    if not q["helperSource"]
]

print()
print(
    "Quest helpers matched:",
    found_helpers,
    "/",
    len(database)
)

if without_helpers:

    print()
    print(
        "Quests without a directly matched helper:"
    )

    for name in without_helpers[:50]:

        print(
            " -",
            name
        )


# ============================================================
# WRITE JSON
# ============================================================

Path("app/src/main/assets").mkdir(
    parents=True,
    exist_ok=True
)

with open(
    "app/src/main/assets/quests.json",
    "w",
    encoding="utf-8"
) as file:

    json.dump(
        database,
        file,
        ensure_ascii=False,
        indent=2
    )


# ============================================================
# QUEST HELPER LICENSE
# ============================================================

license_text = """QuestMate includes quest-structure information
