                      search
                  );


                  // ------------------------------------------------
                  // FILTER
                  // ------------------------------------------------

                  Spinner filter =
                      new Spinner(this);


                  String[] filters = {

                      "All quests",

                      "Free-to-play",

                      "Members"

                  };


                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout
                              .simple_spinner_dropdown_item,
                          filters
                      );


                  filter.setAdapter(
                      adapter
                  );


                  root.addView(
                      filter
                  );


                  // ------------------------------------------------
                  // LIST SCROLL
                  // ------------------------------------------------

                  ScrollView listScroll =
                      new ScrollView(this);


                  listScroll.setFillViewport(
