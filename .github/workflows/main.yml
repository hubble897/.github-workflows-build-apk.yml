name: QuestMate - Complete OSRS Quest App FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # =========================================================
      # GRADLE
      # =========================================================
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      # =========================================================
      # QUEST HELPER
      # =========================================================
      - name: Download Quest Helper
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git quest-helper

      # =========================================================
      # RUNELITE
      # =========================================================
      - name: Download RuneLite
        run: |
          git clone --depth 1 https://github.com/runelite/runelite.git runelite

      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          mkdir -p dist

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#0D47A1</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="QuestMate"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # =========================================================
      # GENERATE QUEST DATABASE
      # =========================================================
      - name: Generate Quest database
        shell: bash
        run: |
          cat > generate_quests.py <<'PY'
          import os
          import re
          import json
          import glob

          RUNELITE_QUEST = "runelite/runelite-api/src/main/java/net/runelite/api/Quest.java"
          QUEST_HELPER_REGISTRY = "quest-helper/src/main/java/com/questhelper/questinfo/QuestHelperQuest.java"
          QUEST_HELPER_ROOT = "quest-helper/src/main/java/com/questhelper/helpers/quests"

          OUT = "app/src/main/assets/quests.json"

          # =====================================================
          # EXCLUDED MINIQUESTS
          # =====================================================

          MINIQUESTS = {
              "ALFRED_GRIMHANDS_BARCRAWL",
              "BARBARIAN_TRAINING",
              "BEAR_YOUR_SOUL",
              "CURSE_OF_THE_EMPTY_LORD",
              "DADDYS_HOME",
              "THE_ENCHANTED_KEY",
              "ENTER_THE_ABYSS",
              "FAMILY_PEST",
              "THE_FROZEN_DOOR",
              "THE_GENERALS_SHADOW",
              "HIS_FAITHFUL_SERVANTS",
              "HOPESPEARS_WILL",
              "IN_SEARCH_OF_KNOWLEDGE",
              "INTO_THE_TOMBS",
              "LAIR_OF_TARN_RAZORLOR",
              "MAGE_ARENA_I",
              "MAGE_ARENA_II",
              "SKIPPY_AND_THE_MOGRES",
              "VALE_TOTEMS",
          }

          # =====================================================
          # F2P QUESTS
          #
          # IMPORTANT:
          # ROMEO__JULIET is the current RuneLite enum.
          # =====================================================

          F2P = {
              "BLACK_KNIGHTS_FORTRESS",
              "BELOW_ICE_MOUNTAIN",
              "COOKS_ASSISTANT",
              "DEMON_SLAYER",
              "DORICS_QUEST",
              "DRAGON_SLAYER_I",
              "ERNEST_THE_CHICKEN",
              "GOBLIN_DIPLOMACY",
              "THE_CORSAIR_CURSE",
              "THE_IDES_OF_MILK",
              "IMP_CATCHER",
              "LEARNING_THE_ROPES",
              "MISTHALIN_MYSTERY",
              "PIRATES_TREASURE",
              "PRINCE_ALI_RESCUE",
              "THE_RESTLESS_GHOST",

              # FIXED ENUM NAME
              "ROMEO__JULIET",

              "RUNE_MYSTERIES",
              "SHEEP_SHEARER",
              "SHIELD_OF_ARRAV",
              "THE_KNIGHTS_SWORD",
              "VAMPYRE_SLAYER",
              "WITCHS_POTION",
              "X_MARKS_THE_SPOT",
          }

          # =====================================================
          # RECIPE FOR DISASTER DISPLAY NAMES
          # =====================================================

          RFD_NAMES = {
              "RECIPE_FOR_DISASTER__ANOTHER_COOKS_QUEST":
                  "Recipe for Disaster - Another Cook's Quest",

              "RECIPE_FOR_DISASTER__MOUNTAIN_DWARF":
                  "Recipe for Disaster - Mountain Dwarf",

              # FIXED CURRENT RUNELITE ENUM
              "RECIPE_FOR_DISASTER__WARTFACE__BENTNOZE":
                  "Recipe for Disaster - Wartface & Bentnoze",

              "RECIPE_FOR_DISASTER__PIRATE_PETE":
                  "Recipe for Disaster - Pirate Pete",

              "RECIPE_FOR_DISASTER__LUMBRIDGE_GUIDE":
                  "Recipe for Disaster - Lumbridge Guide",

              "RECIPE_FOR_DISASTER__EVIL_DAVE":
                  "Recipe for Disaster - Evil Dave",

              "RECIPE_FOR_DISASTER__SKRACH_UGLOGWEE":
                  "Recipe for Disaster - Skrach Uglogwee",

              "RECIPE_FOR_DISASTER__SIR_AMIK_VARZE":
                  "Recipe for Disaster - Sir Amik Varze",

              "RECIPE_FOR_DISASTER__KING_AWOWOGEI":
                  "Recipe for Disaster - King Awowogei",

              "RECIPE_FOR_DISASTER__CULINAROMANCER":
                  "Recipe for Disaster - Culinaromancer",
          }

          # =====================================================
          # SPECIAL HELPER MAPPINGS
          # =====================================================

          SPECIAL_HELPERS = {
              "BLACK_KNIGHTS_FORTRESS": "BlackKnightFortress",
              "DESERT_TREASURE_I": "DesertTreasure",
              "DESERT_TREASURE_II__THE_FALLEN_EMPIRE": "DesertTreasureII",
              "DRAGON_SLAYER_I": "DragonSlayer",
              "FAIRYTALE_I__GROWING_PAINS": "FairytaleI",
              "FAIRYTALE_II__CURE_A_QUEEN": "FairytaleII",
              "MOUNTAIN_DAUGHTER": "MountainDaughter",
              "ROMEO__JULIET": "RomeoAndJuliet",

              "RECIPE_FOR_DISASTER__ANOTHER_COOKS_QUEST": "RFDStart",
              "RECIPE_FOR_DISASTER__MOUNTAIN_DWARF": "RFDDwarf",

              # FIXED CURRENT RUNELITE ENUM
              "RECIPE_FOR_DISASTER__WARTFACE__BENTNOZE": "RFDGoblins",

              "RECIPE_FOR_DISASTER__PIRATE_PETE": "RFDPiratePete",
              "RECIPE_FOR_DISASTER__LUMBRIDGE_GUIDE": "RFDLumbridgeGuide",
              "RECIPE_FOR_DISASTER__EVIL_DAVE": "RFDEvilDave",
              "RECIPE_FOR_DISASTER__SKRACH_UGLOGWEE": "RFDSkrachUglogwee",
              "RECIPE_FOR_DISASTER__SIR_AMIK_VARZE": "RFDSirAmikVarze",
              "RECIPE_FOR_DISASTER__KING_AWOWOGEI": "RFDAwowogei",
              "RECIPE_FOR_DISASTER__CULINAROMANCER": "RFDFinal",
          }

          # =====================================================
          # READ RUNELITE QUEST ENUM
          # =====================================================

          with open(RUNELITE_QUEST, "r", encoding="utf-8") as f:
              quest_source = f.read()

          quest_entries = []

          enum_pattern = re.compile(
              r"^\s*([A-Z0-9_]+)\s*\(\s*([0-9]+)\s*,\s*\"([^\"]+)\"",
              re.MULTILINE
          )

          for match in enum_pattern.finditer(quest_source):
              enum_name = match.group(1)
              quest_id = int(match.group(2))
              title = match.group(3)

              if enum_name in MINIQUESTS:
                  continue

              quest_entries.append({
                  "enum": enum_name,
                  "id": quest_id,
                  "title": title
              })

          # =====================================================
          # READ QUEST HELPER REGISTRY
          # =====================================================

          with open(QUEST_HELPER_REGISTRY, "r", encoding="utf-8") as f:
              registry = f.read()

          helper_map = {}

          pattern1 = re.compile(
              r"new\s+([A-Za-z0-9_]+)\s*\(\s*\)\s*,\s*"
              r"Quest\.([A-Z0-9_]+)"
          )

          for m in pattern1.finditer(registry):
              helper_map[m.group(2)] = m.group(1)

          pattern2 = re.compile(
              r"new\s+([A-Za-z0-9_]+)\s*\(\s*\)\s*,\s*"
              r"Quest\.([A-Z0-9_]+)\.getId"
          )

          for m in pattern2.finditer(registry):
              helper_map[m.group(2)] = m.group(1)

          # =====================================================
          # FIND HELPER JAVA FILES
          # =====================================================

          helper_files = {}

          for path in glob.glob(
              QUEST_HELPER_ROOT + "/**/*.java",
              recursive=True
          ):
              filename = os.path.basename(path)

              if filename.endswith(".java"):
                  classname = filename[:-5]
                  helper_files[classname] = path

          # =====================================================
          # JAVA STRING PARSER
          # =====================================================

          def java_strings(text):
              result = []

              for m in re.finditer(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              ):
                  value = m.group(1)

                  try:
                      value = bytes(
                          value,
                          "utf-8"
                      ).decode(
                          "unicode_escape"
                      )
                  except Exception:
                      pass

                  value = value.replace(
                      "\\\"",
                      "\""
                  )

                  value = value.replace(
                      "\\n",
                      " "
                  )

                  if value.strip():
                      result.append(
                          value.strip()
                      )

              return result

          # =====================================================
          # EXTRACT STEP VARIABLES
          # =====================================================

          def extract_steps(source):
              steps = {}

              assignment = re.compile(
                  r"\b([A-Za-z0-9_]+)\s*=\s*new\s+"
                  r"([A-Za-z0-9_]+)\s*\("
              )

              matches = list(
                  assignment.finditer(source)
              )

              for index, match in enumerate(matches):

                  variable = match.group(1)

                  start = match.end()

                  if index + 1 < len(matches):
                      end = matches[
                          index + 1
                      ].start()
                  else:
                      end = len(source)

                  chunk = source[start:end]

                  strings = java_strings(chunk)

                  description = ""

                  for value in strings:
                      if len(value) >= 4:
                          description = value
                          break

                  if description:
                      steps[variable] = {
                          "name": variable,
                          "description": description
                      }

              return steps

          # =====================================================
          # EXTRACT PANELS
          # =====================================================

          def extract_panels(source, steps):

              panels = []

              panel_positions = [
                  m.start()
                  for m in re.finditer(
                      r"new\s+PanelDetails\s*\(",
                      source
                  )
              ]

              for i, start in enumerate(panel_positions):

                  if i + 1 < len(panel_positions):
                      end = panel_positions[i + 1]
                  else:
                      end = len(source)

                  chunk = source[start:end]

                  strings = java_strings(chunk)

                  title = "Walkthrough"

                  if strings:
                      title = strings[0]

                  variables = []

                  for variable in steps:

                      if re.search(
                          r"\b" +
                          re.escape(variable) +
                          r"\b",
                          chunk
                      ):
                          variables.append(
                              variable
                          )

                  if variables:

                      panels.append({
                          "title": title,
                          "steps": [
                              steps[v]["description"]
                              for v in variables
                              if v in steps
                          ]
                      })

              return panels

          # =====================================================
          # FALLBACK WALKTHROUGH
          # =====================================================

          def fallback_panels(source, steps):

              if not steps:
                  return []

              ordered = []

              for variable, data in steps.items():

                  description = data[
                      "description"
                  ]

                  if description not in ordered:
                      ordered.append(
                          description
                      )

              if not ordered:
                  return []

              return [{
                  "title": "Walkthrough",
                  "steps": ordered
              }]

          # =====================================================
          # DIFFICULTY
          # =====================================================

          difficulty_names = [
              "GRANDMASTER",
              "MASTER",
              "HARD",
              "EXPERIENCED",
              "INTERMEDIATE",
              "NOVICE"
          ]

          def find_difficulty(enum_name):

              pos = registry.find(
                  "Quest." + enum_name
              )

              if pos >= 0:

                  start = max(
                      0,
                      pos - 1500
                  )

                  end = min(
                      len(registry),
                      pos + 1500
                  )

                  nearby = registry[
                      start:end
                  ]

                  for difficulty in difficulty_names:

                      if re.search(
                          r"\b" +
                          difficulty +
                          r"\b",
                          nearby
                      ):
                          return difficulty.title()

              return "Unknown"

          # =====================================================
          # LEARNING THE ROPES
          # =====================================================

          learning_the_ropes = {
              "title": "Learning the Ropes",
              "difficulty": "Novice",
              "length": "Very Short",
              "members": False,
              "qp": 1,
              "start": "Quest Guide on Tutorial Island",

              "requirements": [
                  "None"
              ],

              "items": [
                  "None"
              ],

              "combat": [
                  "2 Giant rats (level 3)"
              ],

              "rewards": [
                  "1 Quest Point",
                  "Access to mainland Gielinor",
                  "Lumbridge Home Teleport",
                  "Basic tutorial equipment and items",
                  "25 coins deposited into the bank"
              ],

              "walkthrough": [

                  {
                      "title": "Character customization",
                      "steps": [
                          "Complete the character customization section.",
                          "Choose your character appearance and continue."
                      ]
                  },

                  {
                      "title": "Adventure Paths",
                      "steps": [
                          "Choose an Adventure Path if desired.",
                          "Continue through the tutorial."
                      ]
                  },

                  {
                      "title": "Gielinor Guide",
                      "steps": [
                          "Speak with the Gielinor Guide.",
                          "Follow the instructions to learn about the game world."
                      ]
                  },

                  {
                      "title": "Survival Expert",
                      "steps": [
                          "Speak with the Survival Expert.",
                          "Follow the instructions for gathering and basic survival."
                      ]
                  },

                  {
                      "title": "Master Chef",
                      "steps": [
                          "Speak with the Master Chef.",
                          "Complete the cooking tutorial."
                      ]
                  },

                  {
                      "title": "Quest Guide",
                      "steps": [
                          "Speak with the Quest Guide.",
                          "Follow the instructions for starting and completing quests."
                      ]
                  },

                  {
                      "title": "Mining Instructor",
                      "steps": [
                          "Speak with the Mining Instructor.",
                          "Mine the required ore."
                      ]
                  },

                  {
                      "title": "Combat Instructor",
                      "steps": [
                          "Speak with the Combat Instructor.",
                          "Equip the supplied equipment.",
                          "Defeat the tutorial enemies."
                      ]
                  },

                  {
                      "title": "Account Guide",
                      "steps": [
                          "Speak with the Account Guide.",
                          "Complete the account tutorial instructions."
                      ]
                  },

                  {
                      "title": "Brother Brace",
                      "steps": [
                          "Speak with Brother Brace.",
                          "Complete the prayer tutorial."
                      ]
                  },

                  {
                      "title": "Magic Instructor",
                      "steps": [
                          "Speak with the Magic Instructor.",
                          "Complete the basic magic tutorial."
                      ]
                  },

                  {
                      "title": "Completion",
                      "steps": [
                          "Complete the final tutorial instructions.",
                          "Use the Lumbridge Home Teleport when instructed.",
                          "Choose the Ironman tutor option if desired.",
                          "Continue into mainland Gielinor."
                      ]
                  }
              ]
          }

          # =====================================================
          # BUILD DATABASE
          # =====================================================

          database = []

          for entry in quest_entries:

              enum_name = entry["enum"]
              title = entry["title"]

              if enum_name == "LEARNING_THE_ROPES":
                  database.append(
                      learning_the_ropes
                  )
                  continue

              helper_name = SPECIAL_HELPERS.get(
                  enum_name,
                  helper_map.get(enum_name)
              )

              source = ""

              if helper_name:

                  path = helper_files.get(
                      helper_name
                  )

                  if path:

                      try:

                          with open(
                              path,
                              "r",
                              encoding="utf-8"
                          ) as f:
                              source = f.read()

                      except Exception:
                          source = ""

              steps = (
                  extract_steps(source)
                  if source
                  else {}
              )

              panels = (
                  extract_panels(
                      source,
                      steps
                  )
                  if source
                  else []
              )

              if not panels:
                  panels = fallback_panels(
                      source,
                      steps
                  )

              # =================================================
              # SHIELD OF ARRAV
              # =================================================

              if enum_name == "SHIELD_OF_ARRAV":

                  combined_panels = []

                  for helper_name2 in [
                      "ShieldOfArravPhoenixGang",
                      "ShieldOfArravBlackArmGang"
                  ]:

                      path = helper_files.get(
                          helper_name2
                      )

                      if not path:
                          continue

                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          source2 = f.read()

                      steps2 = extract_steps(
                          source2
                      )

                      panels2 = extract_panels(
                          source2,
                          steps2
                      )

                      if not panels2:
                          panels2 = fallback_panels(
                              source2,
                              steps2
                          )

                      combined_panels.extend(
                          panels2
                      )

                  if combined_panels:
                      panels = combined_panels

              # =================================================
              # RECIPE FOR DISASTER PARENT
              # =================================================

              if enum_name == "RECIPE_FOR_DISASTER":

                  rfd_helpers = [
                      "RFDStart",
                      "RFDDwarf",
                      "RFDGoblins",
                      "RFDPiratePete",
                      "RFDLumbridgeGuide",
                      "RFDEvilDave",
                      "RFDSkrachUglogwee",
                      "RFDSirAmikVarze",
                      "RFDAwowogei",
                      "RFDFinal"
                  ]

                  combined_panels = []

                  for helper_name2 in rfd_helpers:

                      path = helper_files.get(
                          helper_name2
                      )

                      if not path:
                          continue

                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          source2 = f.read()

                      steps2 = extract_steps(
                          source2
                      )

                      panels2 = extract_panels(
                          source2,
                          steps2
                      )

                      if not panels2:
                          panels2 = fallback_panels(
                              source2,
                              steps2
                          )

                      combined_panels.extend(
                          panels2
                      )

                  if combined_panels:
                      panels = combined_panels

              # =================================================
              # LENGTH
              # =================================================

              step_count = sum(
                  len(
                      panel.get(
                          "steps",
                          []
                      )
                  )
                  for panel in panels
              )

              if step_count == 0:
                  length = "Unknown"
              elif step_count <= 12:
                  length = "Very Short"
              elif step_count <= 25:
                  length = "Short"
              elif step_count <= 50:
                  length = "Medium"
              elif step_count <= 90:
                  length = "Long"
              else:
                  length = "Very Long"

              # =================================================
              # F2P / MEMBERS
              # =================================================

              members = (
                  enum_name not in F2P
              )

              database.append({

                  "title":
                      RFD_NAMES.get(
                          enum_name,
                          title
                      ),

                  "difficulty":
                      find_difficulty(
                          enum_name
                      ),

                  "length":
                      length,

                  "members":
                      members,

                  "qp":
                      0,

                  "start":
                      "See walkthrough",

                  "requirements": [
                      "See walkthrough"
                  ],

                  "items": [
                      "See walkthrough"
                  ],

                  "combat": [],

                  "rewards": [
                      "See quest walkthrough"
                  ],

                  "walkthrough":
                      panels
              })

          # =====================================================
          # SORT
          # =====================================================

          database.sort(
              key=lambda q:
                  q["title"].lower()
          )

          # =====================================================
          # WRITE DATABASE
          # =====================================================

          os.makedirs(
              os.path.dirname(OUT),
              exist_ok=True
          )

          with open(
              OUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # =====================================================
          # REPORT
          # =====================================================

          total_steps = sum(
              len(
                  panel.get(
                      "steps",
                      []
                  )
              )
              for quest in database
              for panel in quest.get(
                  "walkthrough",
                  []
              )
          )

          f2p_count = sum(
              1
              for quest in database
              if not quest["members"]
          )

          members_count = (
              len(database) -
              f2p_count
          )

          print("")
          print("==========================================")
          print("QUESTMATE QUEST DATABASE REPORT")
          print("==========================================")
          print(
              "Quest entries:",
              len(database)
          )
          print(
              "F2P quests:",
              f2p_count
          )
          print(
              "Members quests:",
              members_count
          )
          print(
              "Walkthrough steps:",
              total_steps
          )
          print(
              "Quest Helper Java files:",
              len(helper_files)
          )
          print(
              "Registry mappings:",
              len(helper_map)
          )
          print("==========================================")

          # =====================================================
          # HARD VALIDATION
          # =====================================================

          if len(database) != 192:
              raise RuntimeError(
                  "Expected 192 QuestMate entries, found "
                  + str(len(database))
              )

          if f2p_count != 24:
              raise RuntimeError(
                  "Expected 24 F2P quests, found "
                  + str(f2p_count)
              )

          if members_count != 168:
              raise RuntimeError(
                  "Expected 168 Members quests, found "
                  + str(members_count)
              )

          if total_steps < 1000:
              raise RuntimeError(
                  "Quest walkthrough database appears incomplete. "
                  "Only "
                  + str(total_steps)
                  + " steps were generated."
              )

          print("")
          print("QUEST DATABASE VERIFICATION PASSED")
          print("")
          PY

          python generate_quests.py

      # =========================================================
      # VERIFY DATABASE
      # =========================================================
      - name: Verify generated database
        run: |
          test -f app/src/main/assets/quests.json

          python - <<'PY'
          import json

          with open(
              "app/src/main/assets/quests.json",
              "r",
              encoding="utf-8"
          ) as f:
              quests = json.load(f)

          print(
              "Quest entries:",
              len(quests)
          )

          f2p = sum(
              1
              for q in quests
              if not q["members"]
          )

          members = len(quests) - f2p

          steps = sum(
              len(
                  panel.get(
                      "steps",
                      []
                  )
              )
              for q in quests
              for panel in q.get(
                  "walkthrough",
                  []
              )
          )

          print(
              "F2P quests:",
              f2p
          )

          print(
              "Members quests:",
              members
          )

          print(
              "Walkthrough steps:",
              steps
          )

          if len(quests) != 192:
              raise SystemExit(
                  "ERROR: Expected 192 quests."
              )

          if f2p != 24:
              raise SystemExit(
                  "ERROR: Expected 24 F2P quests."
              )

          if members != 168:
              raise SystemExit(
                  "ERROR: Expected 168 Members quests."
              )

          if steps < 1000:
              raise SystemExit(
                  "ERROR: Walkthrough data is incomplete."
              )

          print("")
          print("DATABASE VERIFICATION PASSED")
          PY

      # =========================================================
      # CREATE MAIN ACTIVITY
      # =========================================================
      - name: Create QuestMate MainActivity
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'JAVA'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private final ArrayList<JSONObject> allQuests =
                      new ArrayList<>();

              private final ArrayList<JSONObject> visibleQuests =
                      new ArrayList<>();

              private LinearLayout listContainer;
              private EditText searchBox;
              private Spinner filterSpinner;

              private android.content.SharedPreferences progress;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  progress = getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                  );

                  loadQuests();
                  showQuestList();
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open("quests.json");

                      byte[] bytes =
                              new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      String json =
                              new String(
                                      bytes,
                                      StandardCharsets.UTF_8
                              );

                      JSONArray array =
                              new JSONArray(json);

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          allQuests.add(
                                  array.getJSONObject(i)
                          );
                      }

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Could not load quest database.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private TextView text(
                      String value,
                      float size,
                      boolean bold
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.BLACK);

                  if (bold) {
                      t.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                      );
                  }

                  t.setPadding(
                          12,
                          8,
                          12,
                          8
                  );

                  return t;
              }

              private void showQuestList() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView title =
                          text(
                                  "QuestMate",
                                  26,
                                  true
                          );

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  title.setBackgroundColor(
                          Color.rgb(13, 71, 161)
                  );

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(60)
                          )
                  );

                  LinearLayout controls =
                          new LinearLayout(this);

                  controls.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  searchBox =
                          new EditText(this);

                  searchBox.setHint(
                          "Search quests..."
                  );

                  controls.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(55)
                          )
                  );

                  filterSpinner =
                          new Spinner(this);

                  String[] filters = {
                          "All quests",
                          "Free-to-play",
                          "Members"
                  };

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout
                                          .simple_spinner_dropdown_item,
                                  filters
                          );

                  filterSpinner.setAdapter(
                          adapter
                  );

                  controls.addView(
                          filterSpinner,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)
                          )
                  );

                  root.addView(
                          controls
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(true);
                  scroll.setVerticalScrollBarEnabled(true);

                  listContainer =
                          new LinearLayout(this);

                  listContainer.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  listContainer.setPadding(
                          8,
                          8,
                          8,
                          20
                  );

                  scroll.addView(
                          listContainer
                  );

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  setContentView(root);

                  searchBox.addTextChangedListener(
                          new android.text.TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {
                                  refreshQuestList();
                              }

                              @Override
                              public void afterTextChanged(
                                      android.text.Editable s
                              ) {}
                          }
                  );

                  filterSpinner.setOnItemSelectedListener(
                          new AdapterView.OnItemSelectedListener() {

                              @Override
                              public void onItemSelected(
                                      AdapterView<?> parent,
                                      View view,
                                      int position,
                                      long id
                              ) {
                                  refreshQuestList();
                              }

                              @Override
                              public void onNothingSelected(
                                      AdapterView<?> parent
                              ) {}
                          }
                  );

                  refreshQuestList();
              }

              private void refreshQuestList() {

                  listContainer.removeAllViews();

                  String search =
                          searchBox
                                  .getText()
                                  .toString()
                                  .trim()
                                  .toLowerCase(
                                          Locale.ROOT
                                  );

                  int filter =
                          filterSpinner
                                  .getSelectedItemPosition();

                  visibleQuests.clear();

                  for (JSONObject quest :
                          allQuests) {

                      try {

                          String name =
                                  quest.getString(
                                          "title"
                                  );

                          boolean members =
                                  quest.getBoolean(
                                          "members"
                                  );

                          boolean searchMatch =
                                  search.length() == 0 ||
                                  name.toLowerCase(
                                          Locale.ROOT
                                  ).contains(search);

                          boolean filterMatch =
                                  filter == 0 ||
                                  (filter == 1 &&
                                          !members) ||
                                  (filter == 2 &&
                                          members);

                          if (searchMatch &&
                              filterMatch) {

                              visibleQuests.add(
                                      quest
                              );
                          }

                      } catch (Exception ignored) {}
                  }

                  for (JSONObject quest :
                          visibleQuests) {

                      TextView row =
                              text(
                                      quest.optString(
                                              "title",
                                              "Quest"
                                      ),
                                      18,
                                      true
                              );

                      row.setBackgroundColor(
                              Color.rgb(
                                      245,
                                      245,
                                      245
                              )
                      );

                      LinearLayout.LayoutParams params =
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(60)
                              );

                      params.setMargins(
                              4,
                              4,
                              4,
                              4
                      );

                      listContainer.addView(
                              row,
                              params
                      );

                      row.setOnClickListener(
                              v -> showQuest(quest)
                      );
                  }
              }

              private void showQuest(
                      JSONObject quest
              ) {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  top.setBackgroundColor(
                          Color.rgb(
                                  13,
                                  71,
                                  161
                          )
                  );

                  Button back =
                          new Button(this);

                  back.setText("BACK");
                  back.setTextColor(Color.WHITE);
                  back.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  top.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(85),
                                  dp(60)
                          )
                  );

                  TextView title =
                          text(
                                  quest.optString(
                                          "title",
                                          "Quest"
                                  ),
                                  20,
                                  true
                          );

                  title.setTextColor(
                          Color.WHITE
                  );

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(60),
                                  1
                          )
                  );

                  root.addView(top);

                  back.setOnClickListener(
                          v -> showQuestList()
                  );

                  // =================================================
                  // FULL SCROLLABLE QUEST DETAIL
                  // =================================================

                  ScrollView detailScroll =
                          new ScrollView(this);

                  detailScroll.setFillViewport(true);
                  detailScroll.setVerticalScrollBarEnabled(
                          true
                  );

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.setPadding(
                          12,
                          12,
                          12,
                          40
                  );

                  detailScroll.addView(
                          content
                  );

                  root.addView(
                          detailScroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  addInfo(
                          content,
                          quest
                  );

                  addSection(
                          content,
                          "Requirements",
                          quest.optJSONArray(
                                  "requirements"
                          )
                  );

                  addSection(
                          content,
                          "Items",
                          quest.optJSONArray(
                                  "items"
                          )
                  );

                  addSection(
                          content,
                          "Combat",
                          quest.optJSONArray(
                                  "combat"
                          )
                  );

                  addSection(
                          content,
                          "Rewards",
                          quest.optJSONArray(
                                  "rewards"
                          )
                  );

                  addWalkthrough(
                          content,
                          quest
                  );

                  setContentView(root);
              }

              private void addInfo(
                      LinearLayout content,
                      JSONObject quest
              ) {

                  StringBuilder info =
                          new StringBuilder();

                  info.append("Difficulty: ")
                          .append(
                                  quest.optString(
                                          "difficulty",
                                          "Unknown"
                                  )
                          )
                          .append("\n");

                  info.append("Length: ")
                          .append(
                                  quest.optString(
                                          "length",
                                          "Unknown"
                                  )
                          )
                          .append("\n");

                  info.append("Type: ")
                          .append(
                                  quest.optBoolean(
                                          "members",
                                          false
                                  )
                                          ? "Members"
                                          : "Free-to-play"
                          )
                          .append("\n");

                  info.append("Quest Points: ")
                          .append(
                                  quest.optInt(
                                          "qp",
                                          0
                                  )
                          )
                          .append("\n");

                  info.append("Start: ")
                          .append(
                                  quest.optString(
                                          "start",
                                          "See walkthrough"
                                  )
                          );

                  content.addView(
                          text(
                                  info.toString(),
                                  16,
                                  false
                          )
                  );
              }

              private void addSection(
                      LinearLayout content,
                      String title,
                      JSONArray values
              ) {

                  content.addView(
                          text(
                                  title,
                                  21,
                                  true
                          )
                  );

                  if (values == null ||
                      values.length() == 0) {

                      content.addView(
                              text(
                                      "None listed.",
                                      16,
                                      false
                              )
                      );

                      return;
                  }

                  for (int i = 0;
                       i < values.length();
                       i++) {

                      content.addView(
                              text(
                                      "• " +
                                      values.optString(i),
                                      16,
                                      false
                              )
                      );
                  }
              }

              private void addWalkthrough(
                      LinearLayout content,
                      JSONObject quest
              ) {

                  content.addView(
                          text(
                                  "Walkthrough",
                                  24,
                                  true
                          )
                  );

                  JSONArray panels =
                          quest.optJSONArray(
                                  "walkthrough"
                          );

                  if (panels == null ||
                      panels.length() == 0) {

                      content.addView(
                              text(
                                      "No walkthrough available.",
                                      16,
                                      false
                              )
                      );

                      return;
                  }

                  for (int p = 0;
                       p < panels.length();
                       p++) {

                      try {

                          JSONObject panel =
                                  panels.getJSONObject(
                                          p
                                  );

                          String panelTitle =
                                  panel.optString(
                                          "title",
                                          "Step"
                                  );

                          content.addView(
                                  text(
                                          panelTitle,
                                          20,
                                          true
                                  )
                          );

                          JSONArray steps =
                                  panel.optJSONArray(
                                          "steps"
                                  );

                          if (steps == null) {
                              continue;
                          }

                          for (int s = 0;
                               s < steps.length();
                               s++) {

                              String key =
                                      "q_" +
                                      quest.optString(
                                              "title"
                                      ) +
                                      "_" +
                                      p +
                                      "_" +
                                      s;

                              CheckBox box =
                                      new CheckBox(
                                              this
                                      );

                              box.setText(
                                      (s + 1) +
                                      ". " +
                                      steps.optString(
                                              s
                                      )
                              );

                              box.setTextSize(
                                      16
                              );

                              box.setPadding(
                                      4,
                                      10,
                                      4,
                                      10
                              );

                              box.setChecked(
                                      progress.getBoolean(
                                              key,
                                              false
                                      )
                              );

                              box.setOnCheckedChangeListener(
                                      (buttonView,
                                       checked) ->
                                              progress
                                                      .edit()
                                                      .putBoolean(
                                                              key,
                                                              checked
                                                      )
                                                      .apply()
                              );

                              content.addView(
                                      box
                              );
                          }

                      } catch (Exception ignored) {}
                  }
              }

              private int dp(int value) {

                  return (int)(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }
          }
          JAVA

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      # =========================================================
      # PREPARE APK
      # =========================================================
      - name: Prepare APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/QuestMate.apk

          ls -lh dist/QuestMate.apk

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      # =========================================================
      # CONFIRM ARTIFACT
      # =========================================================
      - name: Confirm QuestMate Artifact
        run: |
          echo "=========================================="
          echo "QUESTMATE APK ARTIFACT"
          echo "=========================================="

          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"

          echo ""
          echo "SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"

          echo "=========================================="

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo ""
          echo "ARTIFACT UPLOAD CONFIRMED"
