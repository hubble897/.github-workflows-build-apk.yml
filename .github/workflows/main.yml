      # 9. CREATE MAIN ACTIVITY
      # ============================================================

      - name: Create QuestMate main screen
        run: |

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
package com.questmate.app;

import android.app.Activity;
import android.content.Intent;
import android.os.Bundle;
import android.text.Editable;
import android.text.TextWatcher;
import android.graphics.Typeface;
import android.view.Gravity;
import android.view.View;
import android.widget.*;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.InputStream;
import java.nio.charset.StandardCharsets;
import java.util.ArrayList;
import java.util.List;

public class MainActivity extends Activity {

    private final List<JSONObject> allQuests = new ArrayList<>();
    private final List<JSONObject> filteredQuests = new ArrayList<>();

    private LinearLayout questList;

    private String filter = "ALL";

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        buildInterface();

        loadQuests();
    }

    private void buildInterface() {

        LinearLayout root = new LinearLayout(
                this
        );

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                24,
                24,
                24,
                24
        );

        TextView title = new TextView(this);

        title.setText("QuestMate");

        title.setTextSize(30);

        title.setTypeface(
                Typeface.DEFAULT_BOLD
        );

        root.addView(title);

        TextView subtitle = new TextView(this);

        subtitle.setText(
                "OSRS quest walkthroughs"
        );

        subtitle.setTextSize(16);

        root.addView(subtitle);

        EditText search = new EditText(this);

        search.setHint(
                "Search quests..."
        );

        root.addView(search);

        LinearLayout filters = new LinearLayout(
                this
        );

        filters.setOrientation(
                LinearLayout.HORIZONTAL
        );

        String[] names = {
                "ALL",
                "F2P",
                "MEMBERS"
        };

        for (String name : names) {

            Button button = new Button(this);

            button.setText(name);

            button.setOnClickListener(
                    v -> {

                        filter = name;

                        refresh(
                                search.getText().toString()
                        );
                    }
            );

            filters.addView(
                    button,
                    new LinearLayout.LayoutParams(
                            0,
                            LinearLayout.LayoutParams.WRAP_CONTENT,
                            1
                    )
            );
        }

        root.addView(filters);

        ScrollView scroll = new ScrollView(this);

        questList = new LinearLayout(this);

        questList.setOrientation(
                LinearLayout.VERTICAL
        );

        scroll.addView(
                questList
        );

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        0,
                        1
                )
        );

        search.addTextChangedListener(
                new TextWatcher() {

                    @Override
                    public void beforeTextChanged(
                            CharSequence s,
                            int start,
                            int count,
                            int after
                    ) {}

                    @Override
                    public void onTextChanged(
                            CharSequence s,
                            int start,
                            int before,
                            int count
                    ) {

                        refresh(
                                s.toString()
                        );
                    }

                    @Override
                    public void afterTextChanged(
                            Editable s
                    ) {}
                }
        );

        setContentView(root);
    }

    private void loadQuests() {

        try {

            InputStream input =
                    getAssets().open("quests.json");

            byte[] bytes =
                    new byte[input.available()];

            input.read(bytes);

            input.close();

            String json =
                    new String(
                            bytes,
                            StandardCharsets.UTF_8
                    );

            JSONArray array =
                    new JSONArray(json);

            for (int i = 0; i < array.length(); i++) {

                allQuests.add(
                        array.getJSONObject(i)
                );
            }

            refresh("");

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "Could not load quest database.",
                    Toast.LENGTH_LONG
            ).show();
        }
    }

    private void refresh(String query) {

        filteredQuests.clear();

        String q =
                query == null
                        ? ""
                        : query.toLowerCase();

        for (JSONObject quest : allQuests) {

            try {

                String name =
                        quest.getString("name");

                boolean matchesSearch =
                        q.isEmpty()
                                || name.toLowerCase()
                                .contains(q);

                boolean matchesFilter = true;

                if (filter.equals("F2P")) {

                    matchesFilter =
                            !quest.getBoolean("members");
                }

                if (filter.equals("MEMBERS")) {

                    matchesFilter =
                            quest.getBoolean("members");
                }

                if (matchesSearch && matchesFilter) {

                    filteredQuests.add(
                            quest
                    );
                }

            } catch (Exception ignored) {}
        }

        renderQuestList();
    }

    private void renderQuestList() {

        questList.removeAllViews();

        for (JSONObject quest : filteredQuests) {

            try {

                Button button =
                        new Button(this);

                String name =
                        quest.getString("name");

                boolean members =
                        quest.getBoolean("members");

                button.setText(
                        name +
                        (members
                                ? "\nMembers"
                                : "\nFree-to-play")
                );

                button.setGravity(
                        Gravity.START |
                        Gravity.CENTER_VERTICAL
                );

                button.setTextSize(16);

                button.setOnClickListener(
                        v -> {

                            Intent intent =
                                    new Intent(
                                            MainActivity.this,
                                            QuestDetailActivity.class
                                    );

                            intent.putExtra(
                                    "questName",
                                    name
                            );

                            startActivity(intent);
                        }
                );

                questList.addView(
                        button,
                        new LinearLayout.LayoutParams(
                                LinearLayout.LayoutParams.MATCH_PARENT,
                                LinearLayout.LayoutParams.WRAP_CONTENT
                        )
                );

            } catch (Exception ignored) {}
        }
    }
}
