name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  artifact-metadata: write

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p questmate/app/src/main/java/com/questmate/app
          mkdir -p questmate/app/src/main/res/values

          cat > questmate/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > questmate/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > questmate/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > questmate/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > questmate/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="QuestMate"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > questmate/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#4CAF50</item>
              </style>

          </resources>
          EOF

          cat > questmate/app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 40, 30, 30);

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextSize(30);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 30);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("OSRS Quest Guide");
                  subtitle.setTextSize(20);
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, 0, 0, 30);

                  Button quests = new Button(this);
                  quests.setText("Quests");

                  Button minimize = new Button(this);
                  minimize.setText("MINIMIZE");

                  minimize.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          moveTaskToBack(true);
                      }
                  });

                  layout.addView(title);
                  layout.addView(subtitle);
                  layout.addView(quests);
                  layout.addView(minimize);

                  setContentView(layout);
              }
          }
          EOF

      - name: Install Gradle
        run:
