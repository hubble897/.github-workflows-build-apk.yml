name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # GRADLE
      # =========================================================
      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # =========================================================
      # DOWNLOAD QUEST HELPER
      # =========================================================
      - name: Download Quest Helper
        run: |
          rm -rf quest-helper

          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          test -d quest-helper/src/main/java

          echo "Quest Helper downloaded."


      # =========================================================
      # DOWNLOAD RUNELITE QUEST LIST
      # =========================================================
      - name: Download RuneLite Quest definitions
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o Quest.java

          test -s Quest.java

          echo "RuneLite quest definitions downloaded."


      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        run: |
          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8BC34A</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".QuestDetailActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # GENERATE REAL QUEST WALKTHROUGHS
      # =========================================================
      - name: Generate QuestMate quest database
        run: |

          cat > generate_quests.py <<'PY'
          import json
          import re
          from pathlib import Path


          # =====================================================
          # QUESTS TO EXCLUDE
          # =====================================================

          MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }


          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }


          # =====================================================
          # BASIC HELPERS
          # =====================================================

          def normalize(value):
              value = value.lower()
              return re.sub(r"[^a-z0-9]", "", value)


          def humanize(value):
              value = value.replace("_", " ")
              value = re.sub(r"\s+", " ", value).strip()

              words = []

              for word in value.split():

                  if word.lower() in {
                      "the",
                      "of",
                      "and",
                      "for",
                      "in",
                      "to",
                      "a"
                  }:
                      words.append(word.lower())
                  else:
                      words.append(word.capitalize())

              return " ".join(words)


          def unescape_java(value):
              try:
                  return bytes(
                      value,
                      "utf-8"
                  ).decode(
                      "unicode_escape"
                  )
              except Exception:
                  return value


          def extract_balanced(text, opening):
              if opening >= len(text):
                  return "", opening

              if text[opening] != "(":
                  return "", opening

              depth = 0
              quote = None
              escaped = False

              for i in range(
                  opening,
                  len(text)
              ):

                  c = text[i]

                  if quote:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == quote:
                          quote = None

                      continue

                  if c == '"':
                      quote = '"'
                      continue

                  if c == "(":
                      depth += 1

                  elif c == ")":
                      depth -= 1

                      if depth == 0:
                          return (
                              text[
                                  opening + 1:i
                              ],
                              i
                          )

              return (
                  text[opening + 1:],
                  len(text)
              )


          def quoted_strings(text):
              result = []

              for match in re.finditer(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              ):

                  value = unescape_java(
                      match.group(1)
                  )

                  value = re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

                  if value:
                      result.append(value)

              return result


          # =====================================================
          # FIND ACTION DESCRIPTION
          # =====================================================

          def action_description(strings):

              if not strings:
                  return ""

              action_words = (
                  "talk",
                  "speak",
                  "use",
                  "search",
                  "open",
                  "close",
                  "go",
                  "walk",
                  "travel",
                  "climb",
                  "enter",
                  "leave",
                  "pick",
                  "take",
                  "get",
                  "kill",
                  "attack",
                  "give",
                  "bring",
                  "wear",
                  "equip",
                  "dig",
                  "mine",
                  "cut",
                  "cook",
                  "smith",
                  "light",
                  "read",
                  "pull",
                  "push",
                  "click",
                  "bank",
                  "buy",
                  "sell",
                  "trade",
                  "drop",
                  "bury",
                  "drink",
                  "eat",
                  "cast",
                  "teleport",
                  "return",
                  "find",
                  "collect",
                  "complete",
                  "finish",
                  "grab",
                  "repair",
                  "fill",
                  "operate"
              )

              candidates = []

              for value in strings:

                  lower = value.lower()

                  if len(value) < 5:
                      continue

                  if any(
                      word in lower
                      for word in action_words
                  ):
                      candidates.append(value)

              if candidates:
                  return max(
                      candidates,
                      key=len
                  )

              return max(
                  strings,
                  key=len
              )


          # =====================================================
          # IDS
          # =====================================================

          def extract_ids(text):

              result = {
                  "npcs": [],
                  "items": [],
                  "objects": []
              }

              patterns = {
                  "NpcID": "npcs",
                  "ItemID": "items",
                  "ObjectID": "objects",
              }

              for prefix, output in patterns.items():

                  for match in re.finditer(
                      rf"\b{prefix}\.([A-Z0-9_]+)",
                      text
                  ):

                      value = humanize(
                          match.group(1)
                      )

                      if value not in result[output]:
                          result[output].append(value)

              return result


          # =====================================================
          # WORLDPOINTS
          # =====================================================

          def extract_points(text):

              result = []

              pattern = re.compile(
                  r"WorldPoint\s*"
                  r"\(\s*"
                  r"(-?\d+)\s*,\s*"
                  r"(-?\d+)\s*,\s*"
                  r"(-?\d+)"
                  r"\s*\)"
              )

              for match in pattern.finditer(text):

                  point = {
                      "x": int(match.group(1)),
                      "y": int(match.group(2)),
                      "plane": int(match.group(3))
                  }

                  if point not in result:
                      result.append(point)

              return result


          # =====================================================
          # STEP DECLARATIONS
          # =====================================================

          STEP_TYPES = {
              "NpcStep",
              "ObjectStep",
              "DetailedQuestStep",
              "ItemStep",
              "DigStep",
              "EmoteStep",
              "TileStep",
              "WidgetStep",
              "NpcTalkStep",
              "ConditionalStep",
          }


          def parse_steps(source):

              steps = {}

              pattern = re.compile(
                  r"(?m)"
                  r"^\s*"
                  r"(?:final\s+)?"
                  r"(?:[A-Za-z_][A-Za-z0-9_<>, ?\[\]]*\s+)?"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*=\s*"
                  r"new\s+"
                  r"([A-Za-z_][A-Za-z0-9_]*)"
                  r"\s*\("
              )

              for match in pattern.finditer(source):

                  variable = match.group(1)
                  step_type = match.group(2)

                  if step_type not in STEP_TYPES:
                      continue

                  body, end = extract_balanced(
                      source,
                      match.end() - 1
                  )

                  strings = quoted_strings(body)

                  ids = extract_ids(body)

                  points = extract_points(body)

                  description = action_description(
                      strings
                  )

                  steps[variable] = {
                      "variable": variable,
                      "type": step_type,
                      "description": description,
                      "npcs": ids["npcs"],
                      "items": ids["items"],
                      "objects": ids["objects"],
                      "worldpoints": points
                  }

              return steps


          # =====================================================
          # GETPANEL BODY
          # =====================================================

          def get_panels_body(source):

              match = re.search(
                  r"\bgetPanels\s*\(\s*\)",
                  source
              )

              if not match:
                  return ""

              opening = source.find(
                  "{",
                  match.end()
              )

              if opening < 0:
                  return ""

              depth = 0
              quote = None
              escaped = False

              for i in range(
                  opening,
                  len(source)
              ):

                  c = source[i]

                  if quote:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == quote:
                          quote = None

                      continue

                  if c == '"':
                      quote = '"'
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":

                      depth -= 1

                      if depth == 0:
                          return source[
                              opening + 1:i
                          ]

              return source[
                  opening + 1:
              ]


          # =====================================================
          # PANELS
          # =====================================================

          def parse_panels(
              source,
              step_map
          ):

              body = get_panels_body(
                  source
              )

              if not body:
                  return []

              panels = []

              cursor = 0

              while True:

                  match = re.search(
                      r"new\s+PanelDetails\s*\(",
                      body[cursor:]
                  )

                  if not match:
                      break

                  absolute = (
                      cursor +
                      match.start()
                  )

                  opening = body.find(
                      "(",
                      absolute
                  )

                  args, end = extract_balanced(
                      body,
                      opening
                  )

                  strings = quoted_strings(
                      args
                  )

                  if strings:
                      section_name = strings[0]
                  else:
                      section_name = "Walkthrough"

                  identifiers = re.findall(
                      r"\b[A-Za-z_][A-Za-z0-9_]*\b",
                      args
                  )

                  ordered_steps = []

                  for identifier in identifiers:

                      if identifier in step_map:

                          if identifier not in ordered_steps:

                              ordered_steps.append(
                                  identifier
                              )

                  if ordered_steps:

                      panels.append({
                          "name": section_name,
                          "steps": ordered_steps
                      })

                  cursor = end + 1

              return panels


          # =====================================================
          # REQUIREMENTS
          # =====================================================

          def parse_requirements(source):

              result = []

              # Item requirements
              for match in re.finditer(
                  r'new\s+ItemRequirement\s*\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value and value not in result:
                      result.append(value)

              # Skill requirements
              for match in re.finditer(
                  r"new\s+SkillRequirement\s*\(\s*"
                  r"Skill\.([A-Z_]+)\s*,\s*"
                  r"(\d+)",
                  source
              ):

                  skill = humanize(
                      match.group(1)
                  )

                  level = match.group(2)

                  value = (
                      f"{skill} level {level}"
                  )

                  if value not in result:
                      result.append(value)

              # Combat level
              for match in re.finditer(
                  r"new\s+CombatLevelRequirement"
                  r"\s*\(\s*(\d+)",
                  source
              ):

                  value = (
                      "Combat level " +
                      match.group(1)
                  )

                  if value not in result:
                      result.append(value)

              # Quest requirements
              for match in re.finditer(
                  r"new\s+QuestRequirement"
                  r"\s*\([^,]+,\s*"
                  r'"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value not in result:
                      result.append(value)

              return result


          # =====================================================
          # REWARDS
          # =====================================================

          def parse_rewards(source):

              rewards = []

              # Unlock rewards
              for match in re.finditer(
                  r'new\s+UnlockReward\s*'
                  r'\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value not in rewards:
                      rewards.append(value)

              # Item rewards
              for match in re.finditer(
                  r'new\s+ItemReward\s*'
                  r'\(\s*"([^"]+)"',
                  source
              ):

                  value = match.group(1).strip()

                  if value not in rewards:
                      rewards.append(value)

              # XP rewards
              for match in re.finditer(
                  r"new\s+ExperienceReward\s*"
                  r"\(\s*Skill\.([A-Z_]+)\s*,\s*"
                  r"([0-9]+)",
                  source
              ):

                  skill = humanize(
                      match.group(1)
                  )

                  xp = match.group(2)

                  value = (
                      f"{skill}: {xp} XP"
                  )

                  if value not in rewards:
                      rewards.append(value)

              # Quest points
              for match in re.finditer(
                  r"new\s+QuestPointReward"
                  r"\s*\(\s*(\d+)",
                  source
              ):

                  value = (
                      "Quest points: " +
                      match.group(1)
                  )

                  if value not in rewards:
                      rewards.append(value)

              return rewards


          # =====================================================
          # LOCATION FROM ACTUAL STEP TEXT
          # =====================================================

          def find_location(
              walkthrough
          ):

              location_patterns = [
                  r"\b(?:in|at|near|from|to|inside|outside)\s+"
                  r"([A-Z][A-Za-z0-9'’\-]*(?:\s+[A-Z][A-Za-z0-9'’\-]*){0,5})",
              ]

              for section in walkthrough:

                  for step in section["steps"]:

                      text = step[
                          "description"
                      ]

                      for pattern in location_patterns:

                          match = re.search(
                              pattern,
                              text
                          )

                          if match:

                              value = (
                                  match.group(1)
                                  .strip(
                                      " .,;:()"
                                  )
                              )

                              if len(value) > 2:
                                  return value

              return ""


          # =====================================================
          # FIND HELPER FILES
          # =====================================================

          quest_root = Path(
              "quest-helper/src/main/java/"
              "com/questhelper/helpers/quests"
          )

          helper_files = list(
              quest_root.rglob("*.java")
          )

          print(
              "Quest Helper Java files:",
              len(helper_files)
          )


          # =====================================================
          # READ HELPERS
          # =====================================================

          helpers = {}

          for path in helper_files:

              try:
                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              match = re.search(
                  r"\bclass\s+([A-Za-z0-9_]+)",
                  source
              )

              if not match:
                  continue

              class_name = match.group(1)

              key = normalize(
                  class_name
              )

              helpers[key] = {
                  "class": class_name,
                  "file": str(path),
                  "source": source
              }


          print(
              "Quest Helper classes:",
              len(helpers)
          )


          # =====================================================
          # READ RUNELITE QUEST LIST
          # =====================================================

          quest_source = Path(
              "Quest.java"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          )

          quest_pattern = re.compile(
              r'^\s*'
              r'([A-Z0-9_]+)'
              r'\s*\(\s*'
              r'-?\d+'
              r'\s*,\s*'
              r'"([^"]+)"',
              re.MULTILINE
          )

          quests = []

          for match in quest_pattern.finditer(
              quest_source
          ):

              enum_name = match.group(1)
              name = match.group(2)

              if name in MINIQUESTS:
                  continue

              quests.append(
                  (
                      enum_name,
                      name
                  )
              )


          # Remove duplicate quest names.
          unique = []
          seen = set()

          for enum_name, name in quests:

              if name in seen:
                  continue

              seen.add(name)

              unique.append(
                  (
                      enum_name,
                      name
                  )
              )

          quests = unique


          print(
              "Quest entries found:",
              len(quests)
          )


          if len(quests) != 192:

              raise SystemExit(
                  "ERROR: Expected 192 quests."
              )


          # =====================================================
          # MATCH QUESTS TO HELPERS
          # =====================================================

          database = []

          missing_helpers = []

          missing_walkthroughs = []

          total_steps = 0


          for enum_name, quest_name in quests:

              normalized_quest = normalize(
                  quest_name
              )

              helper = helpers.get(
                  normalized_quest
              )

              # Extra attempt using RuneLite enum.
              if helper is None:

                  helper = helpers.get(
                      normalize(enum_name)
                  )

              if helper is None:

                  missing_helpers.append(
                      quest_name
                  )

                  continue


              source = helper["source"]

              step_map = parse_steps(
                  source
              )

              panels = parse_panels(
                  source,
                  step_map
              )


              sections = []


              for panel in panels:

                  section_steps = []

                  for variable in panel[
                      "steps"
                  ]:

                      step = step_map.get(
                          variable
                      )

                      if not step:
                          continue

                      # Do not show conditional
                      # controller steps as normal
                      # walkthrough steps.
                      if step["type"] == "ConditionalStep":
                          continue

                      if not step[
                          "description"
                      ]:
                          continue

                      clean_step = {
                          "type": step["type"],
                          "description":
                              step["description"],
                          "npcs":
                              step["npcs"],
                          "items":
                              step["items"],
                          "objects":
                              step["objects"],
                          "worldpoints":
                              step["worldpoints"]
                      }

                      section_steps.append(
                          clean_step
                      )

                  if section_steps:

                      sections.append({
                          "name":
                              panel["name"],
                          "steps":
                              section_steps
                      })


              step_count = sum(
                  len(section["steps"])
                  for section in sections
              )


              requirements = parse_requirements(
                  source
              )

              rewards = parse_rewards(
                  source
              )


              items = []

              for section in sections:

                  for step in section["steps"]:

                      for item in step[
                          "items"
                      ]:

                          if item not in items:
                              items.append(item)


              starting_npc = ""

              for section in sections:

                  for step in section["steps"]:

                      if step["npcs"]:

                          starting_npc = (
                              step["npcs"][0]
                          )

                          break

                  if starting_npc:
                      break


              start_location = find_location(
                  sections
              )


              quest = {
                  "id": enum_name,
                  "name": quest_name,
                  "members":
                      quest_name not in F2P,
                  "sections": sections,
                  "requirements":
                      requirements,
                  "rewards":
                      rewards
              }


              if items:
                  quest["items"] = items


              if starting_npc:
                  quest[
                      "startingNpc"
                  ] = starting_npc


              if start_location:
                  quest[
                      "startLocation"
                  ] = start_location


              database.append(
                  quest
              )


              if step_count == 0:

                  missing_walkthroughs.append(
                      quest_name
                  )

              total_steps += step_count


          # =====================================================
          # VALIDATION
          # =====================================================

          print(
              "Helpers matched:",
              len(database)
          )

          print(
              "Missing helpers:",
              len(missing_helpers)
          )

          print(
              "Quests with no walkthrough:",
              len(missing_walkthroughs)
          )

          print(
              "Total walkthrough steps:",
              total_steps
          )


          if missing_helpers:

              print(
                  "\nMISSING HELPERS:"
              )

              for name in missing_helpers:
                  print(
                      " -",
                      name
                  )

              raise SystemExit(
                  "ERROR: Quest Helper matching failed."
              )


          if len(database) != 192:

              raise SystemExit(
                  "ERROR: Database does not contain "
                  "192 quests."
              )


          if missing_walkthroughs:

              print(
                  "\nMISSING WALKTHROUGHS:"
              )

              for name in missing_walkthroughs:
                  print(
                      " -",
                      name
                  )

              raise SystemExit(
                  "ERROR: One or more quests have "
                  "no walkthrough."
              )


          # =====================================================
          # WRITE DATABASE
          # =====================================================

          output = Path(
              "app/src/main/assets/quests.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  database,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # =====================================================
          # QUEST HELPER LICENSE
          # =====================================================

          license_file = Path(
              "quest-helper/LICENSE"
          )

          if license_file.exists():

              Path(
                  "app/src/main/assets/"
                  "quest_helper_license.txt"
              ).write_text(
                  license_file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ),
                  encoding="utf-8"
              )


          print(
              "\n===================================="
          )

          print(
              "QUEST DATABASE GENERATED SUCCESSFULLY"
          )

          print(
              "Quests:",
              len(database)
          )

          print(
              "Walkthrough steps:",
              total_steps
          )

          print(
              "===================================="
          )

