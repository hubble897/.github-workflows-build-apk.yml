      # ------------------------------------------------------------
      # 10. QUEST DETAIL ACTIVITY
      # ------------------------------------------------------------
      - name: Create QuestDetailActivity
        run: |

          cat > app/src/main/java/com/questmate/app/QuestDetailActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class QuestDetailActivity extends Activity {

              private JSONObject quest;
              private LinearLayout content;

              private SharedPreferences progress;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  progress =
                      getSharedPreferences(
                          "quest_progress",
                          MODE_PRIVATE
                      );

                  try {

                      quest =
                          new JSONObject(
                              getIntent().getStringExtra(
                                  "quest"
                              )
                          );

                  } catch (Exception e) {

                      finish();
                      return;
                  }

                  buildScreen();
              }

              private TextView heading(
                  String text,
                  float size
              ) {

                  TextView view =
                      new TextView(this);

                  view.setText(text);
                  view.setTextSize(size);
                  view.setPadding(
                      0, 12, 0, 8
                  );

                  return view;
              }

              private void buildScreen() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      24, 20, 24, 20
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  content =
                      new LinearLayout(this);

                  content.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(content);

                  try {

                      TextView title =
                          heading(
                              quest.getString("name"),
                              28
                          );

                      title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      );

                      content.addView(title);

                      TextView membership =
                          heading(
                              quest.getString("membership"),
                              16
                          );

                      content.addView(membership);

                      content.addView(
                          heading(
                              "Quest information",
                              21
                          )
                      );

                      addInfo(
                          "Difficulty",
                          quest.getString("difficulty")
                      );

                      addInfo(
                          "Length",
                          quest.getString("length")
                      );

                      addInfo(
                          "Quest Points",
                          String.valueOf(
                              quest.getInt("quest_points")
                          )
                      );

                      addInfo(
                          "Start Location",
                          quest.getString("start_location")
                      );

                      addArraySection(
                          "Requirements",
                          quest.getJSONArray("requirements")
                      );

                      addArraySection(
                          "Items",
                          quest.getJSONArray("items")
                      );

                      addArraySection(
                          "Rewards",
                          quest.getJSONArray("rewards")
                      );

                      content.addView(
                          heading(
                              "Walkthrough",
                              23
                          )
                      );

                      content.addView(
                          heading(
                              "Tick each step as you complete it.",
                              15
                          )
                      );

                      JSONArray steps =
                          quest.getJSONArray("steps");

                      String questId =
                          quest.getString("id");

                      for (int i = 0;
                           i < steps.length();
                           i++) {

                          String step =
                              steps.getString(i);

                          CheckBox check =
                              new CheckBox(this);

                          check.setText(
                              (i + 1) + ". " + step
                          );

                          check.setTextSize(16);

                          String key =
                              questId + "_step_" + i;

                          check.setChecked(
                              progress.getBoolean(
                                  key,
                                  false
                              )
                          );

                          check.setOnCheckedChangeListener(
                              (button, checked) -> {

                                  progress.edit()
                                      .putBoolean(
                                          key,
                                          checked
                                      )
                                      .apply();
                              }
                          );

                          content.addView(check);
                      }

                  } catch (Exception ignored) {}

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);
              }

              private void addInfo(
                  String label,
                  String value
              ) {

                  TextView text =
                      new TextView(this);

                  text.setText(
                      label + ": " + value
                  );

                  text.setTextSize(15);

                  text.setPadding(
                      0, 4, 0, 4
                  );

                  content.addView(text);
              }

              private void addArraySection(
                  String title,
                  JSONArray array
              ) {

                  if (array == null ||
                      array.length() == 0) {
                      return;
                  }

                  content.addView(
                      heading(title, 20)
                  );

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      try {

                          TextView item =
                              new TextView(this);

                          item.setText(
                              "• " + array.getString(i)
                          );

                          item.setTextSize(15);

                          item.setPadding(
                              0, 3, 0, 3
                          );

                          content.addView(item);

                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF


      # ------------------------------------------------------------
      # 11. BUILD ANDROID APK
      # ------------------------------------------------------------
      - name: Build QuestMate APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace


      # ------------------------------------------------------------
      # 12. VERIFY APK EXISTS
      # ------------------------------------------------------------
      - name: Verify APK
        run: |

          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p dist

          cp "$APK" dist/QuestMate.apk

          echo
          echo "Final APK:"
          ls -lh dist/QuestMate.apk

          echo
          echo "SHA256:"
          sha256sum dist/QuestMate.apk


      # ------------------------------------------------------------
      # 13. UPLOAD APK ARTIFACT
      # ------------------------------------------------------------
      - name: Upload QuestMate APK
        id: upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true


      # ------------------------------------------------------------
      # 14. CONFIRM ARTIFACT
      # ------------------------------------------------------------
      - name: Confirm Artifact Upload
        run: |

          echo
          echo "=========================================="
          echo "       QUESTMATE APK BUILD COMPLETE"
          echo "=========================================="
          echo
          echo "APK:"
          ls -lh dist/QuestMate.apk
          echo
          echo "Artifact ID:"
          echo "${{ steps.upload.outputs.artifact-id }}"
          echo
          echo "Artifact URL:"
          echo "${{ steps.upload.outputs.artifact-url }}"
          echo
          echo "Artifact SHA256:"
          echo "${{ steps.upload.outputs.artifact-digest }}"
          echo
          echo "=========================================="

          test -n "${{ steps.upload.outputs.artifact-id }}"

          echo "Artifact upload confirmed successfully."
