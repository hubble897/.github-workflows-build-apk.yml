name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # DOWNLOAD CURRENT RUNELITE QUEST LIST
      # ============================================================
      - name: Download current quest list
        run: |
          mkdir -p source

          curl -fsSL \
            https://raw.githubusercontent.com/runelite/runelite/master/runelite-api/src/main/java/net/runelite/api/Quest.java \
            -o source/Quest.java

          test -s source/Quest.java

          echo "RuneLite Quest.java downloaded."

      # ============================================================
      # DOWNLOAD QUEST HELPER
      # ============================================================
      - name: Download Quest Helper
        run: |
          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper

          test -d \
            quest-helper/src/main/java/com/questhelper/helpers/quests

          echo "Quest Helper downloaded."

      # ============================================================
      # GENERATE QUEST DATABASE
      # ============================================================
      - name: Generate QuestMate quest database
        shell: bash
        run: |

          cat > generate_quests.py <<'PYTHON'
          import json
          import re
          from pathlib import Path

          QUEST_FILE = Path("source/Quest.java")
          HELPER_ROOT = Path(
              "quest-helper/src/main/java/com/questhelper/helpers/quests"
          )
          OUTPUT = Path("generated/quests.json")

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          # ========================================================
          # CURRENT OSRS F2P QUESTS
          # ========================================================

          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot"
          }

          # ========================================================
          # MINIQUESTS / NON-MAIN QUEST ENTRIES
          # ========================================================

          EXCLUDED = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",

              "Recipe for Disaster - Another Cook's Quest",
              "Recipe for Disaster - Mountain Dwarf",
              "Recipe for Disaster - Wartface & Bentnoze",
              "Recipe for Disaster - Pirate Pete",
              "Recipe for Disaster - Lumbridge Guide",
              "Recipe for Disaster - Evil Dave",
              "Recipe for Disaster - Skrach Uglogwee",
              "Recipe for Disaster - Sir Amik Varze",
              "Recipe for Disaster - King Awowogei",
              "Recipe for Disaster - Culinaromancer"
          }

          # ========================================================
          # JAVA STRING DECODER
          # ========================================================

          def decode_java(value):
              value = value.replace('\\"', '"')
              value = value.replace("\\'", "'")
              value = value.replace("\\n", " ")
              value = value.replace("\\r", " ")
              value = value.replace("\\t", " ")
              value = value.replace("\\\\", "\\")
              return re.sub(r"\s+", " ", value).strip()

          # ========================================================
          # MATCH BRACKET
          # ========================================================

          def matching_bracket(text, start, opening, closing):
              depth = 0
              in_string = False
              escaped = False

              for i in range(start, len(text)):
                  ch = text[i]

                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue

                  if ch == '"':
                      in_string = True
                      continue

                  if ch == opening:
                      depth += 1

                  elif ch == closing:
                      depth -= 1

                      if depth == 0:
                          return i

              return -1

          # ========================================================
          # METHOD BODY
          # ========================================================

          def method_body(text, name):
              pattern = re.compile(
                  r'\b' +
                  re.escape(name) +
                  r'\s*\([^)]*\)\s*\{'
              )

              match = pattern.search(text)

              if not match:
                  return ""

              opening = text.find(
                  "{",
                  match.start()
              )

              closing = matching_bracket(
                  text,
                  opening,
                  "{",
                  "}"
              )

              if closing == -1:
                  return ""

              return text[
                  opening + 1:
                  closing
              ]

          # ========================================================
          # STRING LITERALS
          # ========================================================

          def strings(text):
              result = []

              pattern = re.compile(
                  r'"((?:\\.|[^"\\])*)"'
              )

              for match in pattern.finditer(text):
                  value = decode_java(
                      match.group(1)
                  )

                  if value:
                      result.append(value)

              return result

          # ========================================================
          # LOAD RUNTELITE QUESTS
          # ========================================================

          quest_text = QUEST_FILE.read_text(
              encoding="utf-8"
          )

          enum_pattern = re.compile(
              r'^\s*'
              r'([A-Z0-9_]+)'
              r'\(\s*(\d+)\s*,\s*"'
              r'((?:\\.|[^"\\])*)'
              r'"\s*\)\s*,?',
              re.MULTILINE
          )

          quests = []

          for match in enum_pattern.finditer(
              quest_text
          ):
              enum_name = match.group(1)
              quest_id = int(match.group(2))
              name = decode_java(
                  match.group(3)
              )

              if name in EXCLUDED:
                  continue

              quests.append({
                  "id": enum_name,
                  "questId": quest_id,
                  "name": name
              })

          print(
              "RuneLite quest entries found:",
              len(list(
                  enum_pattern.finditer(
                      quest_text
                  )
              ))
          )

          print(
              "Main OSRS quests:",
              len(quests)
          )

          # ========================================================
          # LOAD QUEST HELPER FILES
          # ========================================================

          source_files = []

          for file in HELPER_ROOT.rglob(
              "*.java"
          ):
              try:
                  source_files.append(
                      (
                          file,
                          file.read_text(
                              encoding="utf-8"
                          )
                      )
                  )
              except Exception:
                  pass

          print(
              "Quest Helper Java files:",
              len(source_files)
          )

          # ========================================================
          # FIND HELPER
          # ========================================================

          def normalise(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  value.lower()
              )

          def find_helper(enum_name):
              token = "Quest." + enum_name

              candidates = []

              for file, text in source_files:

                  if token not in text:
                      continue

                  score = 0

                  if normalise(file.stem) == normalise(
                      enum_name
                  ):
                      score += 100

                  class_match = re.search(
                      r'\bclass\s+([A-Za-z0-9_]+)',
                      text
                  )

                  if class_match:
                      class_name = (
                          class_match.group(1)
                      )

                      if normalise(
                          class_name
                      ) == normalise(
                          enum_name
                      ):
                          score += 100

                  candidates.append(
                      (
                          score,
                          file,
                          text
                      )
                  )

              if not candidates:
                  return None, None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              return (
                  candidates[0][1],
                  candidates[0][2]
              )

          # ========================================================
          # FIND ALL STEP VARIABLE DEFINITIONS
          #
          # Example:
          #
          # searchBookcase = new ObjectStep(...)
          # readBook = new DetailedQuestStep(...)
          # ========================================================

          def find_step_variables(text):
              result = {}

              pattern = re.compile(
                  r'\b'
                  r'([A-Za-z_][A-Za-z0-9_]*)'
                  r'\s*=\s*new\s+'
                  r'([A-Za-z_][A-Za-z0-9_]*)'
                  r'\s*\('
              )

              for match in pattern.finditer(
                  text
              ):
                  variable = match.group(1)
                  step_type = match.group(2)

                  if not step_type.endswith(
                      "Step"
                  ):
                      continue

                  opening = text.find(
                      "(",
                      match.start()
                  )

                  closing = matching_bracket(
                      text,
                      opening,
                      "(",
                      ")"
                  )

                  if closing == -1:
                      continue

                  constructor = text[
                      opening + 1:
                      closing
                  ]

                  values = strings(
                      constructor
                  )

                  description = None

                  for value in values:

                      lower = value.lower()

                      if value.startswith(
                          "http://"
                      ):
                          continue

                      if value.startswith(
                          "https://"
                      ):
                          continue

                      if len(value) < 4:
                          continue

                      # Avoid IDs and technical constants.
                      if (
                          "itemid." in lower
                          or "npcid." in lower
                          or "objectid." in lower
                          or "varbitid." in lower
                          or "varplayerid." in lower
                      ):
                          continue

                      description = value

                      if len(value) >= 20:
                          break

                  if description:
                      result[variable] = {
                          "text": description,
                          "type": step_type
                      }

              return result

          # ========================================================
          # GET PANEL ORDER
          #
          # Quest Helper normally contains:
          #
          # new PanelDetails(... Arrays.asList(
          #     step1,
          #     step2,
          #     step3
          # ))
          # ========================================================

          def panel_order(
              text,
              step_variables
          ):
              panels = method_body(
                  text,
                  "getPanels"
              )

              if not panels:
                  return []

              ordered = []

              position = 0

              while True:

                  match = re.search(
                      r'new\s+PanelDetails\s*\(',
                      panels[position:]
                  )

                  if not match:
                      break

                  start = (
                      position +
                      match.start()
                  )

                  opening = panels.find(
                      "(",
                      start
                  )

                  closing = matching_bracket(
                      panels,
                      opening,
                      "(",
                      ")"
                  )

                  if closing == -1:
                      break

                  panel = panels[
                      opening + 1:
                      closing
                  ]

                  # Extract every variable reference in
                  # the exact order it appears.
                  for match_var in re.finditer(
                      r'\b[A-Za-z_][A-Za-z0-9_]*\b',
                      panel
                  ):
                      variable = match_var.group(0)

                      if variable in step_variables:
                          description = (
                              step_variables[
                                  variable
                              ]["text"]
                          )

                          if description not in ordered:
                              ordered.append(
                                  description
                              )

                  position = closing + 1

              return ordered

          # ========================================================
          # DIRECT STEP EXTRACTION FALLBACK
          #
          # Some helpers structure steps differently.
          # Extract descriptions directly from Step constructors.
          # ========================================================

          def direct_steps(text):
              result = []

              pattern = re.compile(
                  r'new\s+'
                  r'([A-Za-z_][A-Za-z0-9_]*Step)'
                  r'\s*\('
              )

              for match in pattern.finditer(
                  text
              ):
                  opening = text.find(
                      "(",
                      match.start()
                  )

                  closing = matching_bracket(
                      text,
                      opening,
                      "(",
                      ")"
                  )

                  if closing == -1:
                      continue

                  constructor = text[
                      opening + 1:
                      closing
                  ]

                  values = strings(
                      constructor
                  )

                  description = None

                  for value in values:

                      if value.startswith(
                          "http://"
                      ):
                          continue

                      if value.startswith(
                          "https://"
                      ):
                          continue

                      if len(value) < 8:
                          continue

                      lower = value.lower()

                      if (
                          "itemid." in lower
                          or "npcid." in lower
                          or "objectid." in lower
                          or "varbitid." in lower
                          or "varplayerid." in lower
                      ):
                          continue

                      description = value

                      if len(value) >= 20:
                          break

                  if description:
                      if description not in result:
                          result.append(
                              description
                          )

              return result

          # ========================================================
          # REQUIREMENTS
          # ========================================================

          def requirements(text):
              result = []

              skill_pattern = re.compile(
                  r'SkillRequirement\s*\(\s*'
                  r'Skill\.([A-Z0-9_]+)\s*,\s*(\d+)'
              )

              for match in skill_pattern.finditer(
                  text
              ):
                  skill = match.group(1).replace(
                      "_",
                  
