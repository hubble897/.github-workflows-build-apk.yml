name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ============================================================
      # 4. GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version


      # ============================================================
      # 5. GET QUEST HELPER
      # ============================================================

      - name: Download Quest Helper source
        run: |
          rm -rf quest-helper
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git quest-helper

          echo "Quest Helper downloaded."
          find quest-helper/src/main/java/com/questhelper/helpers/quests \
            -name "*.java" | wc -l


      # ============================================================
      # 6. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QuestMate</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 7. GENERATE QUEST DATABASE
      # ============================================================

      - name: Generate QuestMate quest database
        shell: bash
        run: |
          cat > generate_quests.py <<'PY'
          import os
          import re
          import json
          import difflib
          from pathlib import Path

          QUEST_HELPER_ROOT = Path("quest-helper/src/main/java/com/questhelper/helpers/quests")
          QUEST_JSON = Path("app/src/main/assets/quests.json")
          LICENSE_OUT = Path("app/src/main/assets/QUEST_HELPER_LICENSE.txt")

          # ------------------------------------------------------------
          # QUESTS THAT ARE MINIQUESTS IN THE CURRENT RUNTELITE ENUM.
          # QuestMate intentionally excludes these.
          # ------------------------------------------------------------

          EXCLUDED_MINIQUESTS = {
              "Alfred Grimhand's Barcrawl",
              "Barbarian Training",
              "Bear Your Soul",
              "Curse of the Empty Lord",
              "Daddy's Home",
              "The Enchanted Key",
              "Enter the Abyss",
              "Family Pest",
              "The Frozen Door",
              "The General's Shadow",
              "His Faithful Servants",
              "Hopespear's Will",
              "In Search of Knowledge",
              "Into the Tombs",
              "Lair of Tarn Razorlor",
              "Mage Arena I",
              "Mage Arena II",
              "Skippy and the Mogres",
              "Vale Totems",
          }

          # ------------------------------------------------------------
          # F2P QUESTS
          # ------------------------------------------------------------

          F2P = {
              "Black Knights' Fortress",
              "Below Ice Mountain",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "The Corsair Curse",
              "The Ides of Milk",
              "Imp Catcher",
              "Learning the Ropes",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "The Knight's Sword",
              "Vampyre Slayer",
              "Witch's Potion",
              "X Marks the Spot",
          }

          # ------------------------------------------------------------
          # RECIPE FOR DISASTER SUBQUESTS
          # ------------------------------------------------------------

          RFD_SUBQUESTS = [
              "Recipe for Disaster - Another Cook's Quest",
              "Recipe for Disaster - Mountain Dwarf",
              "Recipe for Disaster - Wartface & Bentnoze",
              "Recipe for Disaster - Pirate Pete",
              "Recipe for Disaster - Lumbridge Guide",
              "Recipe for Disaster - Evil Dave",
              "Recipe for Disaster - Skrach Uglogwee",
              "Recipe for Disaster - Sir Amik Varze",
              "Recipe for Disaster - King Awowogei",
              "Recipe for Disaster - Culinaromancer",
          ]

          RFD_CLASSES = {
              "Recipe for Disaster - Another Cook's Quest": "RFDStart",
              "Recipe for Disaster - Mountain Dwarf": "RFDDwarf",
              "Recipe for Disaster - Wartface & Bentnoze": "RFDGoblins",
              "Recipe for Disaster - Pirate Pete": "RFDPiratePete",
              "Recipe for Disaster - Lumbridge Guide": "RFDLumbridgeGuide",
              "Recipe for Disaster - Evil Dave": "RFDEvilDave",
              "Recipe for Disaster - Skrach Uglogwee": "RFDSkrachUglogwee",
              "Recipe for Disaster - Sir Amik Varze": "RFDSirAmikVarze",
              "Recipe for Disaster - King Awowogei": "RFDAwowogei",
              "Recipe for Disaster - Culinaromancer": "RFDFinal",
          }

          # ------------------------------------------------------------
          # EXACT HELPER MAPPINGS FOR QUESTS WHERE NAMES DON'T MATCH
          # ------------------------------------------------------------

          SPECIAL_HELPERS = {
              "Black Knights' Fortress": ("blackknightfortress", "BlackKnightsFortress"),
              "Desert Treasure I": ("deserttreasure", "DesertTreasure"),
              "Dragon Slayer I": ("dragonslayer", "DragonSlayer"),
              "Fairytale I - Growing Pains": ("fairytalei", "FairytaleI"),
              "Fairytale II - Cure a Queen": ("fairytaleii", "FairytaleII"),
              "Romeo & Juliet": ("romeoandjuliet", "RomeoAndJuliet"),
              "Shield of Arrav": ("shieldofarrav", "ShieldOfArrav"),

              "Mountain Daughter": ("mountaindaughter", "MountainDaughter"),
              "Desert Treasure II - The Fallen Empire":
                  ("deserttreasureii", "DesertTreasureII"),

              "Recipe for Disaster - Another Cook's Quest":
                  ("recipefordisaster", "RFDStart"),

              "Recipe for Disaster - Mountain Dwarf":
                  ("recipefordisaster", "RFDDwarf"),

              "Recipe for Disaster - Wartface & Bentnoze":
                  ("recipefordisaster", "RFDGoblins"),

              "Recipe for Disaster - Pirate Pete":
                  ("recipefordisaster", "RFDPiratePete"),

              "Recipe for Disaster - Lumbridge Guide":
                  ("recipefordisaster", "RFDLumbridgeGuide"),

              "Recipe for Disaster - Evil Dave":
                  ("recipefordisaster", "RFDEvilDave"),

              "Recipe for Disaster - Skrach Uglogwee":
                  ("recipefordisaster", "RFDSkrachUglogwee"),

              "Recipe for Disaster - Sir Amik Varze":
                  ("recipefordisaster", "RFDSirAmikVarze"),

              "Recipe for Disaster - King Awowogei":
                  ("recipefordisaster", "RFDAwowogei"),

              "Recipe for Disaster - Culinaromancer":
                  ("recipefordisaster", "RFDFinal"),
          }

          # ------------------------------------------------------------
          # LEARNING THE ROPES
          #
          # This quest is included manually because the Quest Helper
          # source does not currently provide a normal helper class for it.
          # ------------------------------------------------------------

          LEARNING_THE_ROPES = [
              {
                  "section": "Character setup",
                  "text": "Complete the initial character customisation and continue through the opening Tutorial Island instructions."
              },
              {
                  "section": "Adventure Paths",
                  "text": "Speak with the Gielinor Guide and follow the Tutorial Island Adventure Path instructions."
              },
              {
                  "section": "Survival",
                  "text": "Speak with the Survival Expert and complete the basic survival tutorial tasks."
              },
              {
                  "section": "Fishing and cooking",
                  "text": "Follow the Survival Expert's instructions to catch a shrimp and cook it on the fire."
              },
              {
                  "section": "Master Chef",
                  "text": "Follow the Master Chef's instructions and complete the basic cooking tutorial."
              },
              {
                  "section": "Quest Guide",
                  "text": "Speak with the Quest Guide and follow the instructions for accessing and using the Quest List."
              },
              {
                  "section": "Mining",
                  "text": "Speak with the Mining Instructor and mine the required ore during the Tutorial Island mining section."
              },
              {
                  "section": "Smithing",
                  "text": "Smelt the required bars and smith the instructed item using the Tutorial Island equipment."
              },
              {
                  "section": "Combat",
                  "text": "Speak with the Combat Instructor and complete the basic melee combat training."
              },
              {
                  "section": "Ranged",
                  "text": "Complete the ranged combat tutorial using the supplied equipment."
              },
              {
                  "section": "Prayer",
                  "text": "Follow the Prayer Instructor's instructions and activate the required protection prayer."
              },
              {
                  "section": "Account management",
                  "text": "Speak with the Account Guide and complete the account-management tutorial instructions."
              },
              {
                  "section": "Brother Brace",
                  "text": "Speak with Brother Brace and complete the prayer and recovery-related Tutorial Island instructions."
              },
              {
                  "section": "Magic",
                  "text": "Speak with the Magic Instructor and complete the basic spellcasting tutorial."
              },
              {
                  "section": "Leaving Tutorial Island",
                  "text": "Finish the remaining Tutorial Island instructions and use the final travel option to leave Tutorial Island."
              },
              {
                  "section": "Lumbridge",
                  "text": "Arrive in Lumbridge and complete the final Learning the Ropes objective."
              },
          ]

          # ------------------------------------------------------------
          # NORMALISATION
          # ------------------------------------------------------------

          def norm(value):
              value = value.lower()
              value = value.replace("&", "and")
              value = value.replace("'", "")
              value = re.sub(r"[^a-z0-9]+", "", value)
              return value

          def camel_norm(value):
              return norm(value)

          # ------------------------------------------------------------
          # PARSE RUNTELITE QUEST ENUM
          # ------------------------------------------------------------

          def download_runelite_quest():
              import urllib.request

              url = (
                  "https://raw.githubusercontent.com/runelite/runelite/"
                  "master/runelite-api/src/main/java/net/runelite/api/Quest.java"
              )

              path = Path("Quest.java")

              print("Downloading current RuneLite Quest.java...")
              urllib.request.urlretrieve(url, path)

              return path

          quest_java = download_runelite_quest()

          quest_source = quest_java.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          quest_pattern = re.compile(
              r'\b[A-Z0-9_]+\s*\(\s*-?\d+\s*,\s*"([^"]+)"'
          )

          all_quests = []

          for match in quest_pattern.finditer(quest_source):
              name = match.group(1).strip()

              if name not in all_quests:
                  all_quests.append(name)

          # Keep only actual quests wanted by QuestMate.
          quests = [
              q for q in all_quests
              if q not in EXCLUDED_MINIQUESTS
          ]

          # The current QuestMate target is 192:
          # 182 main quests + Recipe for Disaster's 10 subquests.
          #
          # If RuneLite adds unrelated entries, we retain the explicit
          # QuestMate set by using the RFD/main quest enum filtering below.
          #
          # We remove known miniquests and keep all remaining quest entries.

          print("Quest entries found after miniquest filtering:", len(quests))

          # ------------------------------------------------------------
          # STRING PARSING HELPERS
          # ------------------------------------------------------------

          def java_unescape(value):
              try:
                  return bytes(
                      value,
                      "utf-8"
                  ).decode(
                      "unicode_escape"
                  )
              except Exception:
                  return value

          def extract_string_literals(text):
              result = []

              pattern = re.compile(
                  r'"((?:\\.|[^"\\])*)"'
              )

              for m in pattern.finditer(text):
                  result.append(
                      java_unescape(m.group(1))
                  )

              return result

          # ------------------------------------------------------------
          # FIND JAVA FILES
          # ------------------------------------------------------------

          java_files = list(QUEST_HELPER_ROOT.rglob("*.java"))

          print("Quest Helper Java files:", len(java_files))

          helper_sources = {}

          for path in java_files:
              try:
                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              class_match = re.search(
                  r'\bclass\s+([A-Za-z0-9_]+)',
                  source
              )

              if not class_match:
                  continue

              class_name = class_match.group(1)

              helper_sources[class_name] = {
                  "path": str(path),
                  "source": source,
                  "folder": path.parent.name,
              }

          print(
              "Quest Helper walkthrough classes:",
              len(helper_sources)
          )

          # ------------------------------------------------------------
          # EXTRACT STEP CONSTRUCTORS
          #
          # Instead of relying on a short hard-coded list of step types,
          # detect ANY Java class whose name ends in "Step".
          # This catches more of the current Quest Helper implementation.
          # ------------------------------------------------------------

          STEP_CONSTRUCTOR_RE = re.compile(
              r'new\s+([A-Za-z_][A-Za-z0-9_]*Step)\s*\('
          )

          def find_matching_paren(text, opening):
              depth = 0
              in_string = False
              escaped = False

              for i in range(opening, len(text)):
                  c = text[i]

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      continue

                  if c == '"':
                      in_string = True
                      continue

                  if c == "(":
                      depth += 1

                  elif c == ")":
                      depth -= 1

                      if depth == 0:
                          return i

              return -1

          def first_useful_string(argument_text):
              strings = extract_string_literals(argument_text)

              # Ignore obvious labels/empty strings.
              for s in strings:
                  cleaned = " ".join(s.split()).strip()

                  if not cleaned:
                      continue

                  if len(cleaned) < 3:
                      continue

                  return cleaned

              return None

          def parse_step_constructors(source):
              steps = []

              for match in STEP_CONSTRUCTOR_RE.finditer(source):
                  class_name = match.group(1)

                  open_pos = source.find(
                      "(",
                      match.start()
                  )

                  if open_pos < 0:
                      continue

                  close_pos = find_matching_paren(
                      source,
                      open_pos
                  )

                  if close_pos < 0:
                      continue

                  args = source[
                      open_pos + 1:
                      close_pos
                  ]

                  description = first_useful_string(args)

                  if not description:
                      continue

                  # Try to recover the variable name assigned to the step.
                  before = source[
                      max(0, match.start() - 250):
                      match.start()
                  ]

                  variable_match = re.search(
                      r'([A-Za-z_][A-Za-z0-9_]*)\s*=\s*$',
                      before
                  )

                  variable = (
                      variable_match.group(1)
                      if variable_match
                      else None
                  )

                  steps.append({
                      "variable": variable,
                      "type": class_name,
                      "text": description,
                  })

              return steps

          # ------------------------------------------------------------
          # EXTRACT PANELS
          # ------------------------------------------------------------

          def parse_panels(source, parsed_steps):
              if not parsed_steps:
                  return []

              by_variable = {}

              for step in parsed_steps:
                  if step["variable"]:
                      by_variable[
                          step["variable"]
                      ] = step

              panels = []

              panel_re = re.compile(
                  r'new\s+QuestStepPanel\s*\('
              )

              for match in panel_re.finditer(source):
                  open_pos = source.find(
                      "(",
                      match.start()
                  )

                  if open_pos < 0:
                      continue

                  close_pos = find_matching_paren(
                      source,
                      open_pos
                  )

                  if close_pos < 0:
                      continue

                  body = source[
                      open_pos + 1:
                      close_pos
                  ]

                  strings = extract_string_literals(body)

                  if not strings:
                      continue

                  title = strings[0].strip()

                  if not title:
                      continue

                  panel_steps = []

                  # Find variable references in the panel body.
                  for variable in re.findall(
                      r'\b[A-Za-z_][A-Za-z0-9_]*\b',
                      body
                  ):
                      if variable in by_variable:
                          step = by_variable[variable]

                          if step not in panel_steps:
                              panel_steps.append(step)

                  if panel_steps:
                      panels.append({
                          "title": title,
                          "steps": [
                              {
                                  "text": x["text"],
                                  "type": x["type"]
                              }
                              for x in panel_steps
                          ]
                      })

              return panels

          # ------------------------------------------------------------
          # MATCH HELPERS
          # ------------------------------------------------------------

          def locate_class(class_name):
              return helper_sources.get(class_name)

          def fuzzy_helper(quest_name):
              target = camel_norm(quest_name)

              best = None
              best_score = 0.0

              for class_name, info in helper_sources.items():

                  # Don't treat generic utility classes as quest helpers.
                  if not class_name.lower().endswith(
                      (
                          "quest",
                          "helper",
                          "slayer",
                          "fortress",
                          "daughter",
                          "diplomacy",
                          "curse",
                          "treasure",
                          "workshop",
                          "assistant",
                          "rescue",
                          "mystery",
                          "vampyre",
                          "shearer",
                          "sword",
                          "arrav",
                          "prayer",
                          "rfdstart",
                          "rfd",
                      )
                  ):
                      continue

                  candidate = camel_norm(class_name)

                  score = difflib.SequenceMatcher(
                      None,
                      target,
                      candidate
                  ).ratio()

                  if score > best_score:
                      best_score = score
                      best = (class_name, info)

              if best and best_score >= 0.72:
                  return best[0], best[1], best_score

              return None, None, best_score

          def helper_for_quest(quest_name):

              # Learning the Ropes is manually embedded.
              if quest_name == "Learning the Ropes":
                  return "MANUAL_LEARNING_THE_ROPES", None, 1.0

              # RFD parent is an aggregate of its ten subquest helpers.
              if quest_name == "Recipe for Disaster":
                  return "RFD_AGGREGATE", None, 1.0

              # Exact special mappings first.
              if quest_name in SPECIAL_HELPERS:
                  folder, class_name = SPECIAL_HELPERS[
                      quest_name
                  ]

                  info = locate_class(class_name)

                  if info:
                      return class_name, info, 1.0

              # Normalised exact class match.
              target = camel_norm(quest_name)

              exact = []

              for class_name, info in helper_sources.items():
                  if camel_norm(class_name) == target:
                      exact.append(
                          (class_name, info)
                      )

              if exact:
                  return exact[0][0], exact[0][1], 1.0

              # Search using directory + class.
              for class_name, info in helper_sources.items():
                  combined = (
                      info["folder"] +
                      class_name
                  )

                  if target == camel_norm(combined):
                      return class_name, info, 0.99

              # Fuzzy fallback.
              return fuzzy_helper(quest_name)

          # ------------------------------------------------------------
          # QUEST METADATA
          # ------------------------------------------------------------

          def detect_membership(quest_name):
              return "F2P" if quest_name in F2P else "Members"

          def detect_difficulty(source):
              source_lower = source.lower()

              for value in [
                  "grandmaster",
                  "master",
                  "experienced",
                  "intermediate",
                  "novice",
              ]:
                  if value in source_lower:
                      return value.title()

              return "Unknown"

          def detect_length(source):
              source_lower = source.lower()

              for value in [
                  "very long",
                  "long",
                  "medium",
                  "short",
                  "very short",
              ]:
                  if value in source_lower:
                      return value.title()

              return "Unknown"

          def detect_quest_points(source):
              patterns = [
                  r'questPoints\s*=\s*(\d+)',
                  r'questPoint\s*=\s*(\d+)',
                  r'(\d+)\s*quest\s*points',
                  r'(\d+)\s*Quest Points',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      source,
                      re.IGNORECASE
                  )

                  if match:
                      return int(match.group(1))

              return 0

          def detect_start_location(source):
              patterns = [
                  r'\b(?:in|at|near|from)\s+([A-Z][A-Za-z\'\- ]{2,50})',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      source
                  )

                  if match:
                      value = match.group(1).strip()

                      value = re.split(
                          r'[.,;()"\n]',
                          value
                      )[0].strip()

                      if 2 <= len(value) <= 50:
                          return value

              return "See walkthrough"

          def detect_requirements(source):
              results = []

              keywords = [
                  "Requirement",
                  "requirement",
                  "level",
                  "QuestRequirement",
                  "SkillRequirement",
              ]

              for line in source.splitlines():
                  line = line.strip()

                  if any(
                      keyword in line
                      for keyword in keywords
                  ):
                      strings = extract_string_literals(line)

                      for value in strings:
                          if len(value) >= 3:
                              if value not in results:
                                  results.append(value)

              return results[:20]

          def detect_rewards(source):
              results = []

              in_rewards = False

              for line in source.splitlines():
                  stripped = line.strip()

                  if "reward" in stripped.lower():
                      in_rewards = True

                  if in_rewards:
                      strings = extract_string_literals(
                          stripped
                      )

                      for value in strings:
                          if (
                              len(value) >= 3
                              and value not in results
                          ):
                              results.append(value)

                      if len(results) >= 20:
                          break

              return results[:20]

          # ------------------------------------------------------------
          # BUILD WALKTHROUGH
          # ------------------------------------------------------------

          def walkthrough_from_source(source):

              parsed_steps = parse_step_constructors(
                  source
              )

              panels = parse_panels(
                  source,
                  parsed_steps
              )

              # If panels were successfully recovered, use them.
              if panels:
                  total = sum(
                      len(p["steps"])
                      for p in panels
                  )

                  if total > 0:
                      return panels

              # Otherwise fall back to all detected step constructors.
              if parsed_steps:
                  return [
                      {
                          "title": "Walkthrough",
                          "steps": [
                              {
                                  "text": x["text"],
                                  "type": x["type"]
                              }
                              for x in parsed_steps
                          ]
                      }
                  ]

              return []

          # ------------------------------------------------------------
          # RFD AGGREGATION
          # ------------------------------------------------------------

          def build_rfd_walkthrough():
              panels = []

              for quest_name in RFD_SUBQUESTS:
                  class_name = RFD_CLASSES[quest_name]

                  info = locate_class(class_name)

                  if not info:
                      continue

                  parsed = walkthrough_from_source(
                      info["source"]
                  )

                  for panel in parsed:
                      panels.append({
                          "title": (
                              quest_name +
                              " — " +
                              panel["title"]
                          ),
                          "steps": panel["steps"]
                      })

              return panels

          # ------------------------------------------------------------
          # BUILD DATABASE
          # ------------------------------------------------------------

          database = []

          missing_helpers = []
          no_walkthrough = []

          for quest_name in quests:

              class_name, info, score = helper_for_quest(
                  quest_name
              )

              entry = {
                  "name": quest_name,
                  "membership": detect_membership(
                      quest_name
                  ),
                  "difficulty": "Unknown",
                  "length": "Unknown",
                  "questPoints": 0,
                  "startLocation": "See walkthrough",
                  "startingNpc": "",
                  "requirements": [],
                  "items": [],
                  "rewards": [],
                  "combatRequirements": [],
                  "walkthrough": [],
              }

              # --------------------------------------------------------
              # MANUAL LEARNING THE ROPES
              # --------------------------------------------------------

              if quest_name == "Learning the Ropes":

                  entry["difficulty"] = "Novice"
                  entry["length"] = "Very Short"
                  entry["questPoints"] = 1
                  entry["startLocation"] = "Tutorial Island"
                  entry["startingNpc"] = "Quest Guide"
                  entry["requirements"] = [
                      "Must be completing Tutorial Island"
                  ]
                  entry["walkthrough"] = (
                      LEARNING_THE_ROPES
                  )

                  database.append(entry)
                  continue

              # --------------------------------------------------------
              # RFD PARENT
              # --------------------------------------------------------

              if quest_name == "Recipe for Disaster":

                  entry["membership"] = "Members"
                  entry["walkthrough"] = (
                      build_rfd_walkthrough()
                  )

                  entry["requirements"] = [
                      "Complete the required Recipe for Disaster subquests"
                  ]

                  database.append(entry)

                  if not entry["walkthrough"]:
                      no_walkthrough.append(
                          quest_name
                      )

                  continue

              # --------------------------------------------------------
              # NO HELPER
              # --------------------------------------------------------

              if info is None:

                  missing_helpers.append(
                      (
                          quest_name,
                          class_name,
                          score
                      )
                  )

                  # Don't immediately fail. We add a useful fallback
                  # section so one unusual helper cannot destroy the
                  # entire APK build.
                  entry["walkthrough"] = [
                      {
                          "title": "Quest walkthrough",
                          "steps": [
                              {
                                  "text": (
                                      "Quest Helper source did not expose "
                                      "a directly parsable walkthrough for "
                                      "this quest. Use the quest requirements "
                                      "and follow the in-app progress checklist."
                                  ),
                                  "type": "FallbackStep"
                              }
                          ]
                      }
                  ]

                  database.append(entry)
                  continue

              source = info["source"]

              entry["difficulty"] = detect_difficulty(
                  source
              )

              entry["length"] = detect_length(
                  source
              )

              entry["questPoints"] = (
                  detect_quest_points(source)
              )

              entry["startLocation"] = (
                  detect_start_location(source)
              )

              entry["requirements"] = (
                  detect_requirements(source)
              )

              entry["rewards"] = (
                  detect_rewards(source)
              )

              entry["walkthrough"] = (
                  walkthrough_from_source(source)
              )

              if not entry["walkthrough"]:

                  no_walkthrough.append(
                      quest_name
                  )

                  # Generic fallback rather than failing the whole build.
                  entry["walkthrough"] = [
                      {
                          "title": "Walkthrough",
                          "steps": [
                              {
                                  "text": (
                                      "Start the quest using the "
                                      "requirements and starting location "
                                      "shown above, then follow the "
                                      "remaining quest objectives."
                                  ),
                                  "type": "FallbackStep"
                              }
                          ]
                      }
                  ]

              database.append(entry)

          # ------------------------------------------------------------
          # REMOVE DUPLICATES
          # ------------------------------------------------------------

          unique = {}

          for entry in database:
              unique[entry["name"]] = entry

          database = list(unique.values())

          # Preserve RuneLite quest order.
          order = {
              name: index
              for index, name in enumerate(
                  quests
              )
          }

          database.sort(
              key=lambda x: order.get(
                  x["name"],
                  999999
              )
          )

          # ------------------------------------------------------------
          # VALIDATION
          # ------------------------------------------------------------

          print("")
          print("=" * 60)
          print("QUESTMATE QUEST DATABASE REPORT")
          print("=" * 60)
          print("Quest entries found:", len(database))
          print(
              "Quest Helper Java files:",
              len(java_files)
          )
          print(
              "Quest Helper walkthrough classes:",
              len(helper_sources)
          )
          print(
              "Helpers with direct/fuzzy match:",
              len(database) - len(missing_helpers)
          )
          print(
              "Missing helper classes:",
              len(missing_helpers)
          )
          print(
              "Quest walkthrough fallback count:",
              len(no_walkthrough)
          )

          total_steps = 0

          for entry in database:
              for panel in entry["walkthrough"]:
                  total_steps += len(
                      panel.get("steps", [])
                  )

          print(
              "Total walkthrough steps:",
              total_steps
          )

          if missing_helpers:
              print("")
              print("QUESTS WITHOUT QUEST HELPER CLASS:")
              for item in missing_helpers:
                  print(
                      " -",
                      item[0],
                      "| candidate:",
                      item[1],
                      "| score:",
                      round(item[2], 3)
                  )

          if no_walkthrough:
              print("")
              print(
                  "QUESTS THAT NEEDED WALKTHROUGH FALLBACK:"
              )

              for name in no_walkthrough:
                  print(" -", name)

          # The target database must contain 192 quests.
          if len(database) != 192:
              print("")
              print(
                  "ERROR: Expected exactly 192 QuestMate quests "
                  "but generated",
                  len(database)
              )
              raise SystemExit(1)

          # Make sure all 24 F2P quests exist.
          generated_names = {
              x["name"]
              for x in database
          }

          missing_f2p = sorted(
              F2P - generated_names
          )

          if missing_f2p:
              print("")
              print("ERROR: Missing F2P quests:")
              for name in missing_f2p:
                  print(" -", name)

              raise SystemExit(1)

          # Make sure RFD subquests exist.
          missing_rfd = sorted(
              set(RFD_SUBQUESTS) -
              generated_names
          )

          if missing_rfd:
              print("")
              print("ERROR: Missing RFD subquests:")
              for name in missing_rfd:
                  print(" -", name)

              raise SystemExit(1)

          # Ensure the three previously missing quests are present.
          for required in [
              "Mountain Daughter",
              "Desert Treasure II - The Fallen Empire",
              "Learning the Ropes",
          ]:

              if required not in generated_names:
                  print(
                      "ERROR: Required quest missing:",
                      required
                  )
                  raise SystemExit(1)

          # ------------------------------------------------------------
          # WRITE JSON
          # ------------------------------------------------------------

          QUEST_JSON.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          QUEST_JSON.write_text(
              json.dumps(
                  database,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "Quest database written to:",
              QUEST_JSON
          )

          # ------------------------------------------------------------
          # COPY LICENSE
          # ------------------------------------------------------------

          source_license = Path(
              "quest-helper/LICENSE"
          )

          if source_license.exists():
              LICENSE_OUT.write_text(
                  source_license.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ),
                  encoding="utf-8"
              )
          else:
              LICENSE_OUT.write_text(
                  "Quest Helper is licensed under the BSD-2-Clause license.\n",
                  encoding="utf-8"
              )

          print(
              "Quest Helper license written to:",
              LICENSE_OUT
          )

          print("")
          print("DATABASE GENERATION COMPLETE.")
          PY

          python3 generate_quests.py


      # ============================================================
      # 8. SHOW DATABASE SUMMARY
      # ============================================================

