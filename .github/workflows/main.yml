name: Build QuestMate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # JAVA
      # ========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true


      # ========================================================
      # GRADLE
      # ========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ========================================================
      # CREATE PROJECT DIRECTORIES
      # ========================================================

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # ========================================================
      # SETTINGS GRADLE
      # ========================================================

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF


      # ========================================================
      # ROOT BUILD GRADLE
      # ========================================================

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ========================================================
      # GRADLE PROPERTIES
      # ========================================================

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # ========================================================
      # APP BUILD GRADLE
      # ========================================================

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF


      # ========================================================
      # MANIFEST
      # ========================================================

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ========================================================
      # THEME
      # ========================================================

      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#66BB6A</item>
                  <item name="android:navigationBarColor">#10131A</item>
                  <item name="android:statusBarColor">#10131A</item>

              </style>

          </resources>
          EOF


      # ========================================================
      # DOWNLOAD QUEST HELPER
      # ========================================================

      - name: Download Quest Helper
        run: |
          git clone --depth 1 \
            https://github.com/Zoinkwiz/quest-helper.git \
            quest-helper-source

          cp quest-helper-source/LICENSE \
            app/src/main/assets/QUEST_HELPER_LICENSE.txt


      # ========================================================
      # CREATE QUEST DATABASE GENERATOR
      # ========================================================

      - name: Create quest database generator
        run: |
          cat > generate_quests.py <<'PY'
          import json
          import re
          from pathlib import Path

          SOURCE = Path("quest-helper-source/src/main/java")
          OUTPUT = Path("app/src/main/assets/quests.json")

          F2P_QUESTS = {
              "Below Ice Mountain",
              "Black Knights' Fortress",
              "Cook's Assistant",
              "Demon Slayer",
              "Doric's Quest",
              "Dragon Slayer I",
              "Ernest the Chicken",
              "Goblin Diplomacy",
              "Imp Catcher",
              "Misthalin Mystery",
              "Pirate's Treasure",
              "Prince Ali Rescue",
              "The Corsair Curse",
              "The Knight's Sword",
              "The Restless Ghost",
              "Romeo & Juliet",
              "Rune Mysteries",
              "Sheep Shearer",
              "Shield of Arrav",
              "Vampyre Slayer",
              "Waterfall Quest",
              "Witch's Potion",
              "X Marks the Spot",
          }

          def clean(value):
              value = value.replace("\\n", " ")
              value = value.replace('\\"', '"')
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def strings_from_java(text):
              pattern = r'"((?:\\.|[^"\\])*)"'
              return [clean(x) for x in re.findall(pattern, text)]

          def is_useful(value):
              if len(value) < 8:
                  return False

              if len(value) > 600:
                  return False

              low = value.lower()

              blocked = [
                  "com.questhelper",
                  "net.runelite",
                  "http://",
                  "https://",
                  ".png",
                  ".jpg",
                  ".gif",
                  "worldpoint",
                  "varbitid.",
                  "objectid.",
                  "npcid.",
                  "itemid.",
                  "widgetid.",
                  "animationid.",
                  "soundid.",
                  "regionid."
              ]

              for word in blocked:
                  if word in low:
                      return False

              code_count = (
                  value.count("{")
                  + value.count("}")
                  + value.count(";")
              )

              if code_count >= 3:
                  return False

              return True

          def readable_name(path):
              name = path.stem

              name = re.sub(
                  r"([a-z])([A-Z])",
                  r"\1 \2",
                  name
              )

              name = name.replace("_", " ")
              name = name.replace("Quest", "")
              name = re.sub(r"\s+", " ", name)

              return name.strip()

          def build_record(path):
              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  return None

              if "QuestHelper" not in text:
                  return None

              if "package com.questhelper" not in text:
                  return None

              name = readable_name(path)

              values = strings_from_java(text)

              steps = []
              seen = set()

              for value in values:
                  if not is_useful(value):
                      continue

                  if value in seen:
                      continue

                  seen.add(value)
                  steps.append(value)

              if len(steps) < 3:
                  return None

              steps = steps[:150]

              return {
                  "name": name,
                  "members": name not in F2P_QUESTS,
                  "difficulty": "See requirements",
                  "length": "See walkthrough",
                  "questPoints": 0,
                  "start": "",
                  "requirements": [],
                  "items": [],
                  "rewards": [],
                  "walkthrough": steps
              }

          def main():
              records = {}

              for path in SOURCE.rglob("*.java"):
                  record = build_record(path)

                  if record is None:
                      continue

                  key = record["name"].lower()

                  if key not in records:
                      records[key] = record

              quests = sorted(
                  records.values(),
                  key=lambda item: item["name"].lower()
              )

              OUTPUT.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with OUTPUT.open(
                  "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      quests,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )

              print("Quest records:", len(quests))

              if len(quests) < 100:
                  raise RuntimeError(
                      "Quest database contains too few quests."
                  )

          if __name__ == "__main__":
              main()
          PY

          python generate_quests.py

          echo "Quest database created:"
          ls -lh app/src/main/assets/quests.json


      # ========================================================
      # CREATE MAIN ACTIVITY
      # ========================================================

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {

              private LinearLayout content;
              private EditText searchBox;
              private JSONArray quests;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createHome();

                  loadQuests();
              }

              private void createHome() {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      20,
                      25,
                      20,
                      20
                  );

                  TextView title =
                      new TextView(this);

                  title.setText("QuestMate");

                  title.setTextSize(30);

                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  title.setTextColor(Color.BLACK);

                  root.addView(title);

                  TextView subtitle =
                      new TextView(this);

                  subtitle.setText(
                      "OSRS Quest Guide"
                  );

                  subtitle.setTextSize(18);

                  root.addView(subtitle);

                  searchBox =
                      new EditText(this);

                  searchBox.setHint(
                      "Search quests..."
                  );

                  root.addView(searchBox);

                  LinearLayout filters =
                      new LinearLayout(this);

                  filters.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  Button all =
                      new Button(this);

                  all.setText("ALL");

                  Button f2p =
                      new Button(this);

                  f2p.setText("F2P");

                  Button members =
                      new Button(this);

                  members.setText("MEMBERS");

                  filters.addView(all);
                  filters.addView(f2p);
                  filters.addView(members);

                  root.addView(filters);

                  ScrollView scroll =
                      new ScrollView(this);

                  content =
                      new LinearLayout(this);

                  content.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(content);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  all.setOnClickListener(
                      v -> showList("all")
                  );

                  f2p.setOnClickListener(
                      v -> showList("f2p")
                  );

                  members.setOnClickListener(
                      v -> showList("members")
                  );

                  searchBox.setOnEditorActionListener(
                      (v, actionId, event) -> {
                          showList("all");
                          return false;
                      }
                  );
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                          getAssets().open(
                              "quests.json"
                          );

                      byte[] bytes =
                          new byte[input.available()];

                      input.read(bytes);
                      input.close();

                      String json =
                          new String(
                              bytes,
                              StandardCharsets.UTF_8
                          );

                      quests =
                          new JSONArray(json);

                      showList("all");

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Quest database could not be loaded.",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void showList(String filter) {

                  if (quests == null) {
                      return;
                  }

                  content.removeAllViews();

                  String query =
                      searchBox
                          .getText()
                          .toString()
                          .trim()
                          .toLowerCase();

                  for (
                      int i = 0;
                      i < quests.length();
                      i++
                  ) {

                      try {

                          JSONObject quest =
                              quests.getJSONObject(i);

                          String name =
                              quest.optString("name");

                          boolean member =
                              quest.optBoolean(
                                  "members",
                                  false
                              );

                          if (
                              !query.isEmpty()
                              &&
                              !name
                                  .toLowerCase()
                                  .contains(query)
                          ) {
                              continue;
                          }

                          if (
                              filter.equals("f2p")
                              && member
                          ) {
                              continue;
                          }

                          if (
                              filter.equals("members")
                              && !member
                          ) {
                              continue;
                          }

                          Button button =
                              new Button(this);

                          button.setText(name);

                          button.setOnClickListener(
                              v -> showQuest(quest)
                          );

                          content.addView(button);

                      } catch (Exception ignored) {
                      }
                  }
              }

              private void showQuest(
                      JSONObject quest
              ) {

 
